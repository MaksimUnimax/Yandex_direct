name: KW001 Plain Language Summary Rule Sync

on:
  push:
    branches:
      - roadmap/kwork-productization-2026-08-28
    paths:
      - extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/PLAIN_LANGUAGE_RULE_SYNC_TRIGGER.txt

permissions:
  contents: write

jobs:
  sync-rule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: roadmap/kwork-productization-2026-08-28
          fetch-depth: 0
      - name: Apply rule patch
        run: python extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/apply_plain_language_rule.py
      - name: Verify plain-language rule
        run: |
          grep -q 'Mandatory plain-language summary before AND after every step' extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/STEP_GOAL_OUTPUT_AND_ACCOUNTABILITY_GATE.md
          grep -q 'KW001_PLAIN_LANGUAGE_SUMMARY_NO_UNEXPLAINED_JARGON = true' extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/STEP_GOAL_OUTPUT_AND_ACCOUNTABILITY_GATE.md
          grep -q '## ПРОСТЫМИ СЛОВАМИ' extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_PRE_STEP_METHOD_REVIEW_2026-08-31.md
      - name: Commit rule change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/STEP_GOAL_OUTPUT_AND_ACCOUNTABILITY_GATE.md extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_PRE_STEP_METHOD_REVIEW_2026-08-31.md
          git commit -m "rules: require plain-language summaries before and after every step [skip ci]"
          git push origin HEAD:roadmap/kwork-productization-2026-08-28
