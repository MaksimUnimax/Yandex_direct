name: Step10 Fresh R1 Pass3 Review Pack

on:
  push:
    branches:
      - roadmap/kwork-productization-2026-08-28
    paths:
      - '.github/workflows/step10-fresh-r1-pass3-pack.yml'
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_FRESH_R1_PASS3_PACK.py'
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_FRESH_R1_ASSIGNMENT.tsv'

permissions:
  contents: write

jobs:
  build-review-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: roadmap/kwork-productization-2026-08-28
          fetch-depth: 0

      - name: Build complete Pass3 review pack
        run: |
          python extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_FRESH_R1_PASS3_PACK.py

      - name: Verify review-pack accounting
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p = Path('extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_FRESH_R1_PASS3_REVIEW_PACK.tsv')
          with p.open(encoding='utf-8', newline='') as f:
              rows = list(csv.DictReader(f, delimiter='\t'))
          assert len(rows) == 2332, len(rows)
          assert [int(r['qa_row']) for r in rows] == list(range(1, 2333))
          print('PASS3_REVIEW_PACK_ACCOUNTING=PASS_2332_OF_2332')
          PY

      - name: Commit generated Pass3 review pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_FRESH_R1_PASS3_REVIEW_PACK.tsv
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "step10: generate fresh R1 Pass3 review pack"
            git push origin HEAD:roadmap/kwork-productization-2026-08-28
          fi
