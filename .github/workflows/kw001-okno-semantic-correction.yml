name: KW001 OKNO semantic correction

on:
  push:
    branches:
      - roadmap/kwork-productization-2026-08-28
    paths:
      - '.github/workflows/kw001-okno-semantic-correction.yml'
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_07C_SEMANTIC_CORRECTION_BUILD.py'

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[kw001-semantic-correction-output]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: roadmap/kwork-productization-2026-08-28
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and verify corrected semantic tables
        run: python extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_07C_SEMANTIC_CORRECTION_BUILD.py
      - name: Commit corrected semantic artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_07C_SEMANTIC_CORRECTION_WORKING.tsv
          git add extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_07C_SEMANTIC_CORRECTION_OCCURRENCES.tsv
          git add extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_07C_NONEXACT_DUPLICATE_CANDIDATES.tsv
          git add extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_07C_SEMANTIC_QA_CASES.tsv
          git add extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_07C_SEMANTIC_CORRECTION_SUMMARY.json
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "KW001 OKNO: generate semantic correction candidate [kw001-semantic-correction-output]"
          git push origin HEAD:roadmap/kwork-productization-2026-08-28
