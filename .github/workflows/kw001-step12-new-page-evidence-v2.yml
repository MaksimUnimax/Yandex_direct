name: KW001 Step12 New Page Evidence V2

on:
  push:
    branches:
      - roadmap/kwork-productization-2026-08-28
    paths:
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/step12_rebuild_new_page_evidence_v2.py'
      - '.github/workflows/kw001-step12-new-page-evidence-v2.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: roadmap/kwork-productization-2026-08-28
          fetch-depth: 0
      - name: Rebuild V2 evidence
        run: python extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/step12_rebuild_new_page_evidence_v2.py
      - name: Verify V2 candidate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK')
          q=json.loads((root/'STEP_12_NEW_PAGE_EVIDENCE_QA_V2.json').read_text(encoding='utf-8'))
          assert q['status']=='CANDIDATE_V2_READY_FOR_MANUAL_EVIDENCE_ACCEPTANCE'
          assert q['candidate_pages']==5
          assert q['removed_from_candidate_rows']==1
          assert q['hardware_guide_core_phrases']==30
          assert q['hardware_guide_direct_step09_core_queries']==0
          assert q['phrase_counts_not_summed_as_total_unique_demand'] is True
          assert q['defects_closed_by_script_alone']==[]
          print('STEP12_NEW_PAGE_EVIDENCE_V2_CANDIDATE_PASS')
          PY
      - name: Persist V2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_NEW_PAGE_EVIDENCE_V2.tsv \
                  extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_NEW_PAGE_DEMAND_PHRASE_EVIDENCE_V2.tsv \
                  extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_NEW_PAGE_EVIDENCE_QA_V2.json
          git commit -m "step12: persist V5-based new-page evidence V2 [skip ci]"
          git push origin HEAD:roadmap/kwork-productization-2026-08-28
      - name: Readback
        run: |
          git fetch origin roadmap/kwork-productization-2026-08-28
          remote=origin/roadmap/kwork-productization-2026-08-28
          git show $remote:extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_NEW_PAGE_EVIDENCE_QA_V2.json | grep -q 'CANDIDATE_V2_READY_FOR_MANUAL_EVIDENCE_ACCEPTANCE'
          git show $remote:extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_NEW_PAGE_DEMAND_PHRASE_EVIDENCE_V2.tsv | grep -q $'оконная фурнитура отзывы.*REMOVED_FROM_CANDIDATE_BY_V5_SEMANTIC_CORRECTION'
          echo STEP12_NEW_PAGE_EVIDENCE_V2_READBACK_PASS
