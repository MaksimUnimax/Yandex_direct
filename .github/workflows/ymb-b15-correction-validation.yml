name: YMB B15 bounded Send correction validation (not release)
on:
  push:
    branches: [wip/ymb-file-delivery-patch-a-2026-09-12]
    paths: [.github/workflows/ymb-b15-correction-validation.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: ymb-b15-correction-validation
  cancel-in-progress: false
jobs:
  correction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PUPPETEER_SKIP_CHROME_HEADLESS_SHELL_DOWNLOAD: 'true'
      PUPPETEER_SKIP_FIREFOX_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 223aa0ec762f5789062daefe865dec54d2a8e348
          persist-credentials: false
          sparse-checkout: |
            extension/tests/wip/YMB_ASYNC_PATCH_B_2026-09-12/qa
            extension/tests/wip/YMB_ASYNC_PATCH_B_2026-09-12/evidence/B15_SEND_GATE.diff
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ymb-b14-qualified-internal-only
          run-id: 34692833348
          github-token: ${{ github.token }}
          path: frozen-bundle
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Verify one-file exact correction and qualified QA targets
        shell: bash
        run: |
          set -euo pipefail
          Q=extension/tests/wip/YMB_ASYNC_PATCH_B_2026-09-12/qa
          mkdir -p "$RUNNER_TEMP/evidence"
          python3 "$Q/b15_prepare_fix.py" frozen-bundle "$RUNNER_TEMP/fixed" > "$RUNNER_TEMP/evidence/package.stdout"
          python3 "$Q/b15_prepare_fix.py" frozen-bundle "$RUNNER_TEMP/rebuilt" >> "$RUNNER_TEMP/evidence/package.stdout"
          cmp "$RUNNER_TEMP/fixed/candidate-b15-internal.zip" "$RUNNER_TEMP/rebuilt/candidate-b15-internal.zip"
          python3 "$Q/b15_prepare_faults.py" > "$RUNNER_TEMP/evidence/qa.stdout"
          python3 "$Q/b15_single_install.py" >> "$RUNNER_TEMP/evidence/qa.stdout"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,os,json
          q=Path('extension/tests/wip/YMB_ASYNC_PATCH_B_2026-09-12/qa')
          old='f591b39a381993c44284561236b9c5a278761db3d6b04059c59974e037c33f47';new='7b4db94a527778722ee9bbd7b0d131789128dcaee78451f5886a7bddf1ae183a'
          rows=[]
          for n in ['b15_browser_qualification.mjs','b15_browser_faults.mjs']:
            p=q/n;b=p.read_bytes();assert b.count(old.encode())==1
            post=b.replace(old.encode(),new.encode());p.write_bytes(post)
            rows.append({'test':n,'pre_sha256':hashlib.sha256(b).hexdigest(),'post_sha256':hashlib.sha256(post).hexdigest(),'change':'only expected full production-tree hash'})
          (Path(os.environ['RUNNER_TEMP'])/'evidence/QA_TARGETS.json').write_text(json.dumps(rows,indent=2)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as e:e.write('YMB_BROWSER_CANDIDATE='+os.environ['RUNNER_TEMP']+'/fixed/candidate\nYMB_PPTR_HOME='+os.environ['RUNNER_TEMP']+'/puppeteer\n')
          PY
      - name: Focused exact-function tests and all JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          Q=extension/tests/wip/YMB_ASYNC_PATCH_B_2026-09-12/qa
          YMB_FILE_CONTENT="$YMB_BROWSER_CANDIDATE/file_delivery_content.js" node --test "$Q/b15_send_race.test.mjs" > "$RUNNER_TEMP/evidence/send-green.tap"
          find "$YMB_BROWSER_CANDIDATE" -name '*.js' -type f -exec node --check {} \;
      - name: Pinned browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$YMB_PPTR_HOME"
          printf '%s\n' '{"name":"ymb-b15-correction","private":true}' > "$YMB_PPTR_HOME/package.json"
          npm install --prefix "$YMB_PPTR_HOME" --save-exact --no-audit --no-fund puppeteer@25.10.0 > "$RUNNER_TEMP/evidence/npm.stdout" 2> "$RUNNER_TEMP/evidence/npm.stderr"
          cp "$YMB_PPTR_HOME/package-lock.json" "$RUNNER_TEMP/evidence/"
      - name: Repeat all affected primary content/file/resource assertions
        shell: bash
        run: |
          set -euo pipefail
          Q=extension/tests/wip/YMB_ASYNC_PATCH_B_2026-09-12/qa
          mkdir -p "$RUNNER_TEMP/evidence/primary"
          YMB_BROWSER_EVIDENCE="$RUNNER_TEMP/evidence/primary" xvfb-run -a node "$Q/b15_browser_qualification.mjs" > "$RUNNER_TEMP/evidence/primary/run.stdout" 2> "$RUNNER_TEMP/evidence/primary/run.stderr"
      - name: Same supplemental RED assertions plus recovery and idle repeats
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          Q=extension/tests/wip/YMB_ASYNC_PATCH_B_2026-09-12/qa
          test -f "$RUNNER_TEMP/evidence/QA_TARGETS.json"
          mkdir -p "$RUNNER_TEMP/evidence/supplement"
          YMB_BROWSER_EVIDENCE="$RUNNER_TEMP/evidence/supplement" xvfb-run -a node "$Q/b15_browser_faults.mjs" > "$RUNNER_TEMP/evidence/supplement/run.stdout" 2> "$RUNNER_TEMP/evidence/supplement/run.stderr"
      - name: Save exact package and all partial logs even on FAIL
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,shutil,hashlib,json
          p=Path(os.environ['RUNNER_TEMP'])/'evidence';p.mkdir(exist_ok=True)
          q=Path('extension/tests/wip/YMB_ASYNC_PATCH_B_2026-09-12/qa')
          for n in ['b15_browser_qualification.mjs','b15_browser_faults.mjs','b15_fixture.html','b15_send_race.test.mjs','b15_prepare_fix.py']:
            if (q/n).exists():shutil.copyfile(q/n,p/n)
          for n in ['candidate-b15-internal.zip','IDENTITY.json']:
            f=Path(os.environ['RUNNER_TEMP'])/'fixed'/n
            if f.exists():shutil.copyfile(f,p/n)
          (p/'BOUNDARY.json').write_text(json.dumps({'source_ref':'223aa0ec762f5789062daefe865dec54d2a8e348','candidate_sha256':'d4bdf57268ac904421797d7aad428c47981cee4c870bc549909696479f91ace9','tree_sha256':'7b4db94a527778722ee9bbd7b0d131789128dcaee78451f5886a7bddf1ae183a','one_changed_file':'file_delivery_content.js','live_provider_calls':0,'live_chatgpt_upload':False,'independent_gate':False,'release_allowed':False},indent=2)+'\n')
          (p/'SHA256SUMS').write_text(''.join(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+f.relative_to(p).as_posix()+'\n' for f in sorted(p.rglob('*')) if f.is_file()))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ymb-b15-corrected-internal-evidence
          path: ${{ runner.temp }}/evidence/
          retention-days: 90
          if-no-files-found: error
