name: Persist MK01 client report PDF

on:
  push:
    branches:
      - roadmap/kwork-productization-2026-08-28
    paths:
      - .github/workflows/mk01-persist-exact-pdf.yml

permissions:
  contents: write

jobs:
  build-and-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: roadmap/kwork-productization-2026-08-28
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc libreoffice-writer fonts-dejavu-core fonts-liberation
          python -m pip install --disable-pip-version-check matplotlib
      - name: Build and commit PDF
        shell: bash
        run: |
          set -euo pipefail
          DIR='extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/MINI_KWORKS_PRODUCTIZATION/MK01_SEMANTIC_CORE_CLUSTERING/tests/OKNO_MSK'
          PDF="$DIR/MK01_OKNO_MSK_CLIENT_REPORT_2026-09-10.pdf"
          DOCX='/tmp/MK01_OKNO_MSK_CLIENT_REPORT_2026-09-10.docx'
          python "$DIR/build_mk01_client_report_v2.py" \
            --source "$DIR/CLIENT_REPORT_SOURCE_2026-09-10.md" \
            --manifest "$DIR/CLIENT_REPORT_ARTIFACT_MANIFEST_2026-09-10.json" \
            --out-docx "$DOCX" \
            --out-pdf "$PDF"
          test -s "$PDF"
          file "$PDF"
          sha256sum "$PDF"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$PDF"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs(mk01): persist client report PDF'
          for i in 1 2 3 4 5; do
            git fetch origin roadmap/kwork-productization-2026-08-28
            git rebase origin/roadmap/kwork-productization-2026-08-28
            if git push origin HEAD:roadmap/kwork-productization-2026-08-28; then exit 0; fi
            sleep 2
          done
          exit 1
