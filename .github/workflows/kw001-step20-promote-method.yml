name: KW001 Promote Step20 Final QA Method

on:
  push:
    branches:
      - roadmap/kwork-productization-2026-08-28
    paths:
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/STEP_20_METHOD_PROMOTION_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kw001-step20-promote-method
  cancel-in-progress: false

jobs:
  sync-level1-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: roadmap/kwork-productization-2026-08-28
          fetch-depth: 0

      - name: Sync index and permanent lessons
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE')
          idx = root / 'STEP_RULES_INDEX.md'
          led = root / 'STEP_METHOD_REVIEW_AND_LESSONS_LEDGER.md'
          method = root / 'STEP_20_FINAL_QA_AND_RELEASE_ASSURANCE_METHOD.md'

          s = idx.read_text(encoding='utf-8')
          s = s.replace('Updated: 2026-09-03', 'Updated: 2026-09-04', 1)
          old = '| Step 20 | Final QA | **UNVALIDATED AS PERMANENT METHOD** | Must reconcile deliverable claims, counts, evidence, URLs/actions, unresolved states and current implementation-critical truth. |'
          new = '| **Step 20** | **Final QA / release assurance** | **APPROVED / ACTIVE AFTER OWNER-DIRECTED EXTERNAL METHOD AUDIT + CORRECTION** | **`STEP_20_FINAL_QA_AND_RELEASE_ASSURANCE_METHOD.md`** — risk is registered before testing; verification != validation; consistency != accuracy; live HTTP availability != content/role evidence; current evidence requires expiry logic; accessibility and assurance-independence are explicit modes; material mutation invalidates the old QA verdict and requires a fresh release-candidate freeze/rerun. |'
          if old not in s and new not in s:
              raise RuntimeError('Step20 index authority line not found')
          s = s.replace(old, new)
          idx.write_text(s, encoding='utf-8')

          l = led.read_text(encoding='utf-8')
          if '## Step 20 — final QA / release assurance' not in l:
              addition = r'''

---

## Step 20 — final QA / release assurance

Detailed authority: `STEP_20_FINAL_QA_AND_RELEASE_ASSURANCE_METHOD.md`.

This method was promoted after an owner-directed external method audit of the first Step20 execution.

### Failure 1 — research was read but not fully operationalized

**What failed:** the preparation reviewed strong assurance sources, but several material dimensions remained narrative observations rather than hard execution gates.

**Root cause:**

```text
RESEARCH READ
WAS ALLOWED TO REMAIN
NARRATIVE METHOD CONTEXT
INSTEAD OF
EXECUTION REQUIREMENT + OUTPUT + PASS GATE
```

**Control:** pre-register the universal assurance dimensions before inspecting the current package: intended use/risk, exact revision, six data-quality dimensions, current-world evidence, freshness expiry, claim trace, distribution/privacy, accessibility, intended-use validation, independence and provenance.

```text
RESEARCH READ != REQUIREMENT OPERATIONALIZED
```

### Failure 2 — Step20 inherited too much of the previous deliverable QA shape

**Root cause:** adding more checks to the previous step's QA was mistaken for designing a separate release-assurance lifecycle.

```text
MORE QA OF THE SAME KIND != RELEASE ASSURANCE DESIGN
```

**Control:** begin with intended use and pre-test risk register, not with the existing deliverable tables.

### Failure 3 — analyst-side validation wording was too strong

**Root cause:** scenario/usability review by the analyst was allowed to stand too close to real user/commissioner validation.

```text
ANALYST SCENARIO VALIDATION != REAL USER / COMMISSIONER VALIDATION
```

**Control:** maintain separate validation states. Real-user validation is never implied when only analyst scenario testing occurred.

### Failure 4 — assurance independence was treated as a disclaimer

**Root cause:** the method disclosed that the same analyst was not formally independent, but did not make independence an execution mode tied to risk.

**Control:** declare assurance-independence tier before testing. Ordinary/high-impact external work requires materially independent review proportional to risk; low-risk rehearsal may use adversarial self-QA plus an independent mechanical route, explicitly without claiming formal independent assurance.

```text
INDEPENDENT COMPUTATIONAL CHECK != INDEPENDENT ANALYTICAL ASSURANCE
```

### Failure 5 — current URL evidence channels were conflated

**Root cause:** discovery/search fallback, live transport availability and current page role were treated too closely.

**Control:** separate live HTTP availability, redirect/final URL, current content evidence and analytical role.

```text
SEARCH RESULT != LIVE HTTP AVAILABILITY
HTTP 200 != CORRECT CURRENT ROLE
```

### Failure 6 — freshness had a timestamp but no expiry rule

**Root cause:** point-in-time freshness was treated as a permanent handoff state.

**Control:** every current-world evidence set receives a job-specific validity window and/or event-triggered expiry condition.

```text
TIMESTAMP != FRESHNESS GOVERNANCE
FRESH AT QA TIME != FRESH AT DELIVERY TIME
```

### Failure 7 — visual/privacy QA omitted accessibility as a separate release dimension

**Root cause:** visual readability and hidden-data inspection were mistaken for complete distribution QA because accessibility was absent from the execution schema.

**Control:** declare accessibility requirement state, run applicable Office/PDF accessibility checks, and record an accessible alternative/residual limitation when the current contract permits it.

```text
VISUALLY READABLE != ACCESSIBLE
```

### Failure 8 — hash/run identity was treated as the strongest useful provenance

**Root cause:** integrity accounting and signed provenance were not separated.

**Control:** keep exact hashes/run lineage mandatory; add signed artifact provenance/attestation when current release risk warrants it. Never use attestation as analytical correctness proof.

```text
HASH MATCH != SIGNED BUILD PROVENANCE
```

### Failure 9 — severity was assigned after defects were discovered

**Root cause:** even reasonable expert classification can be result-driven if failure modes/release consequences are not declared before testing.

**Control:** build a risk register and severity policy before testing; MATERIAL/BLOCKING findings have pre-declared transition consequences.

### Failure 10 — correcting known defects could be mistaken for earning a new PASS

**Root cause:** local correction success can create confirmation bias toward the old QA verdict.

**Control:** any material client-package/upstream mutation makes the old Step20 verdict historical. Freeze the new revision and rerun Step20.

```text
KNOWN DEFECTS RESOLVED != GLOBAL FINAL QA PASS
OLD QA VERDICT != VERDICT FOR A NEW REVISION
```

Status: **APPROVED / ACTIVE AFTER OWNER-DIRECTED EXTERNAL METHOD AUDIT + CORRECTION**.
'''
              l += addition
          led.write_text(l, encoding='utf-8')

          # Universality / authority-consistency checks for the newly promoted Step20 material.
          method_text = method.read_text(encoding='utf-8')
          assert 'APPROVED / ACTIVE AFTER OWNER-DIRECTED EXTERNAL METHOD AUDIT + CORRECTION' in method_text
          assert '`STEP_20_FINAL_QA_AND_RELEASE_ASSURANCE_METHOD.md`' in idx.read_text(encoding='utf-8')
          assert '## Step 20 — final QA / release assurance' in led.read_text(encoding='utf-8')

          forbidden = ['okno-msk', 'S18-A012', 'S18-A027', 'D20-001', '33765988306']
          combined = method_text + '\n' + addition if 'addition' in locals() else method_text
          for token in forbidden:
              if token.lower() in combined.lower():
                  raise RuntimeError(f'job-specific contamination in Level1 Step20 method: {token}')

          print('STEP20_LEVEL1_METHOD_PROMOTION_SYNC_PASS')
          PY

      - name: Persist Level1 authority sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/STEP_RULES_INDEX.md
          git add extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/STEP_METHOD_REVIEW_AND_LESSONS_LEDGER.md
          if git diff --cached --quiet; then
            echo 'No Level1 sync changes'
          else
            git commit -m 'method(step20): promote final QA release assurance rules [skip ci]'
            git push origin HEAD:roadmap/kwork-productization-2026-08-28
          fi
