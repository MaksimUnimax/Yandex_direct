name: phase5-direct-codex-harness-r1

on:
  push:
    branches:
      - qa/phase5-direct-codex-harness-2026-08-27
    paths:
      - .github/workflows/phase5-direct-codex-harness-r1.yml
      - extension/tests/qa_phase5_codex/**
      - extension/tests/qa_browser/direct_codex_*.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-addendum:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert candidate product tree untouched
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:extension/src)" = "a8ef5239a770f0321debd8322dcfadadff88e272"
          echo PHASE5_CODEX_HARNESS_PRODUCT_TREE_IDENTICAL_PASS
      - name: Run Direct addendum source coverage
        shell: bash
        run: |
          set -euo pipefail
          node --test extension/tests/qa_phase5_codex/direct_addendum_coverage.test.mjs
          echo PHASE5_CODEX_NODE_ADDENDUM_PASS
      - name: Run complete candidate Node regression
        shell: bash
        run: |
          set -euo pipefail
          node --test extension/tests/*.test.mjs
          echo PHASE5_CODEX_EXISTING_NODE_REGRESSION_PASS

  browser-addendum:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert candidate product tree and browser syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:extension/src)" = "a8ef5239a770f0321debd8322dcfadadff88e272"
          node --check extension/tests/qa_browser/direct_browser_runtime.mjs
          node --check extension/tests/qa_browser/direct_popup_d18.mjs
          node --check extension/tests/qa_browser/direct_manual_worker_lifecycle.mjs
          node --check extension/tests/qa_browser/direct_codex_gate_addendum.mjs
          find extension/src -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/d5-codex-product-before.sha256
          echo PHASE5_CODEX_BROWSER_PRE_PRODUCT_IDENTICAL_PASS
      - name: Install Puppeteer Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false puppeteer@24
          npx puppeteer browsers install chrome
          command -v xvfb-run
      - name: Run accepted Direct browser runtime
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a node extension/tests/qa_browser/direct_browser_runtime.mjs | tee /tmp/d5-runtime.log
          for marker in PHASE5_DIRECT_BROWSER_RUNTIME_PASS D20_CONTROLLED_REAL_YANDEX_REQUESTS=0; do grep -F "$marker" /tmp/d5-runtime.log; done
          if grep -E 'browser-(direct-secret|mutated-secret)' /tmp/d5-runtime.log; then exit 1; fi
      - name: Run accepted Direct popup D18
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a node extension/tests/qa_browser/direct_popup_d18.mjs | tee /tmp/d5-d18.log
          for marker in D18_POPUP_430X560_PASS D18_TOP_BOTTOM_COMMON_SAVE_EQUIVALENT_PASS PHASE5_DIRECT_POPUP_D18_PASS; do grep -F "$marker" /tmp/d5-d18.log; done
      - name: Run accepted Direct Manual lifecycle
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a node extension/tests/qa_browser/direct_manual_worker_lifecycle.mjs | tee /tmp/d5-manual.log
          for marker in D17_DIRECT_MANUAL_LIST_AUTOSEND_FALSE_PASS D17_DIRECT_MANUAL_REPORT_AUTOSEND_TRUE_PASS D17_DIRECT_NO_DUPLICATE_PROVIDER_PASS PHASE5_DIRECT_MANUAL_LIFECYCLE_PASS; do grep -F "$marker" /tmp/d5-manual.log; done
          if grep -F 'worker-lifecycle-secret' /tmp/d5-manual.log; then exit 1; fi
      - name: Run Direct Codex browser addendum
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a node extension/tests/qa_browser/direct_codex_gate_addendum.mjs | tee /tmp/d5-codex-addendum.log
          for marker in \
            D19_FIVE_SERVICE_BACKUP_UI_MAPPING_PASS \
            D17_MANUAL_BUSY_FENCE_SINGLE_PROVIDER_PASS \
            D16_NON_DIRECT_ACTIVE_DIRECT_PREFIX_ZERO_TRAFFIC_PASS \
            D20_DIRECT_AUTORUN_DEFAULT_DISABLED_LOCAL_PASS \
            D16_DIRECT_ACTIVE_OTHER_PREFIXES_ZERO_TRAFFIC_PASS \
            D20_DIRECT_AUTORUN_ONE_FINGERPRINT_ONE_PROVIDER_ONE_DELIVERY_PASS \
            D20_DIRECT_AUTORUN_PAUSE_RESUME_FINISH_PASS \
            DIRECT_REAL_YANDEX_REQUESTS=0 \
            PHASE5_DIRECT_CODEX_BROWSER_ADDENDUM_PASS; do
            grep -F "$marker" /tmp/d5-codex-addendum.log
          done
          if grep -E 'qa-(w|s|wm|m|d)-secret|mut-[a-z]' /tmp/d5-codex-addendum.log; then exit 1; fi
      - name: Post-browser product immutability
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find extension/src -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/d5-codex-product-after.sha256
          cmp /tmp/d5-codex-product-before.sha256 /tmp/d5-codex-product-after.sha256
          test "$(git rev-parse HEAD:extension/src)" = "a8ef5239a770f0321debd8322dcfadadff88e272"
          echo PHASE5_CODEX_BROWSER_POST_PRODUCT_IDENTICAL_PASS
