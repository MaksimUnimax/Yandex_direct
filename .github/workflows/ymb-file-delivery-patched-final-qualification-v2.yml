name: YMB patched file-delivery final package qualification v2
on:
  push:
    branches: [qa/ymb-file-delivery-patch-prequal-2026-09-13]
    paths: [.github/workflows/ymb-file-delivery-patched-final-qualification-v2.yml]
permissions:
  contents: read
  actions: read
env:
  PUPPETEER_SKIP_CHROME_HEADLESS_SHELL_DOWNLOAD: 'true'
  PUPPETEER_SKIP_FIREFOX_DOWNLOAD: 'true'
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 64c1016c179de52b6e950830877f0d42a446e5e8
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ymb-b17-pause-internal-evidence
          run-id: 34699125356
          github-token: ${{ github.token }}
          path: frozen-b17
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ymb-test15-targeted-v8
          run-id: 34752327259
          github-token: ${{ github.token }}
          path: targeted-test15
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Build exact package and current-confirmation browser fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path,PurePosixPath
          import hashlib,json,zipfile,os
          H=lambda b:hashlib.sha256(b).hexdigest();root=Path('extension/src')
          target='55bc2082a697598187ded73a5eaf3b18fa6a4e007eec25319690e4c9bb480f24';expected_zip='3e23a70d09fab91f84cf3c9998499ce078f1467b46540dbac7fa07ac60a6765e'
          files={p.relative_to(root).as_posix():p.read_bytes() for p in sorted(root.rglob('*')) if p.is_file()};assert len(files)==67 and not any(p.is_symlink() for p in root.rglob('*'))
          assert H(''.join(H(v)+'  '+k+'\n' for k,v in sorted(files.items())).encode())==target
          m=json.loads(files['manifest.json']);assert m['version']=='0.1.6';assert m['host_permissions'].count('https://operation.api.cloud.yandex.net/*')==1;assert 'alarms' not in (m.get('permissions') or [])
          out=Path(os.environ['RUNNER_TEMP'])/'package';out.mkdir();prefix='Yandex-Marketing-Bridge-0.1.6/'
          def build(path):
            with zipfile.ZipFile(path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9,strict_timestamps=True) as z:
              for name,b in sorted(files.items()):
                zi=zipfile.ZipInfo(prefix+name,date_time=(1980,1,1,0,0,0));zi.compress_type=zipfile.ZIP_DEFLATED;zi.create_system=3;zi.external_attr=(0o100644<<16);zi.flag_bits=0x800;z.writestr(zi,b,compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          a=out/'A.zip';b=out/'B.zip';build(a);build(b);assert a.read_bytes()==b.read_bytes();final=out/'Yandex-Marketing-Bridge-0.1.6.zip';final.write_bytes(a.read_bytes());a.unlink();b.unlink();assert H(final.read_bytes())==expected_zip and final.stat().st_size==225373
          with zipfile.ZipFile(final) as z:
            assert z.testzip() is None;extracted={}
            for e in z.infolist():
              if e.is_dir():continue
              p=PurePosixPath(e.filename);assert not p.is_absolute() and '..' not in p.parts and len(p.parts)>=2 and p.parts[0]=='Yandex-Marketing-Bridge-0.1.6';rel='/'.join(p.parts[1:]);assert rel not in extracted;extracted[rel]=z.read(e)
          assert set(extracted)==set(files) and all(extracted[k]==files[k] for k in files);assert H(''.join(H(v)+'  '+k+'\n' for k,v in sorted(extracted.items())).encode())==target
          ex=Path(os.environ['RUNNER_TEMP'])/'fresh-extracted';ex.mkdir()
          for n,d in extracted.items():q=ex/n;q.parent.mkdir(parents=True,exist_ok=True);q.write_bytes(d)
          result={'schema_version':5,'source_commit':'64c1016c179de52b6e950830877f0d42a446e5e8','version':'0.1.6','product_tree_sha256':target,'files':67,'zip_sha256':expected_zip,'zip_bytes':225373,'dual_build_byte_identity':True,'fresh_extraction_identity':True,'operation_host_enabled':True,'alarms_permission':False,'fixture_confirmation_model':'new_user_turn','release_allowed':False}
          (out/'PACKAGE_RESULT.json').write_text(json.dumps(result,indent=2)+'\n');(out/'SOURCE_SHA256SUMS').write_text(''.join(H(v)+'  '+k+'\n' for k,v in sorted(files.items())))
          deps=Path(os.environ['RUNNER_TEMP'])/'deps';deps.mkdir();lock=Path('frozen-b17/package-lock.json').read_bytes();(deps/'package-lock.json').write_bytes(lock);j=json.loads(lock);(deps/'package.json').write_text(json.dumps({'name':j['name'],'private':True,'dependencies':j['packages']['']['dependencies']}))
          tests=Path(os.environ['RUNNER_TEMP'])/'tests';tests.mkdir()
          resource=Path('frozen-b17/tests/b15_browser_qualification.mjs').read_text();old_resource='b20b74351d95becd67f32994e3e00899e9208b8c32c778a306f73f6703bfe508';assert resource.count(old_resource)==1;(tests/'resource.mjs').write_text(resource.replace(old_resource,target))
          network=Path('extension/tests/wip/YMB_ASYNC_PATCH_B_2026-09-12/qa/b19_network_browser.mjs').read_text();old_network='b87246c1377cda57cb9135f92814ec6885a1b607a9539be3a27bbc2fb1918b86';assert network.count(old_network)==1;(tests/'network.mjs').write_text(network.replace(old_network,target))
          fixture=Path('frozen-b17/tests/b15_fixture.html').read_text()
          old="send.addEventListener('click',()=>{Q.sends.push({text:composer.value,files:Q.files.map(f=>({...f}))});composer.value='';"
          new="send.addEventListener('click',()=>{const sentText=composer.value;const sentFiles=Q.files.map(f=>({...f}));Q.sends.push({text:sentText,files:sentFiles});const turn=document.createElement('div');turn.dataset.messageAuthorRole='user';turn.dataset.messageId='fixture-user-'+Q.sends.length;turn.textContent=[sentText,...sentFiles.map(f=>f.name)].join(' ');document.getElementById('conversation-root').append(turn);composer.value='';"
          assert fixture.count(old)==1;fixture=fixture.replace(old,new);(tests/'fixture.html').write_text(fixture);(tests/'b15_fixture.html').write_text(fixture)
          evidence=Path(os.environ['RUNNER_TEMP'])/'package-evidence';evidence.mkdir()
          with open(os.environ['GITHUB_ENV'],'a') as x:x.write(f'YMB_FINAL_PACKAGE={final}\nYMB_BROWSER_CANDIDATE={ex}\nYMB_PPTR_HOME={deps}\nYMB_PACKAGE_TESTS={tests}\nYMB_PACKAGE_EVIDENCE={evidence}\nYMB_CHATGPT_FIXTURE={(tests/"fixture.html").resolve()}\n')
          print(json.dumps(result,indent=2))
          PY
      - name: Require targeted TEST-15 evidence on identical ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          m=list(Path('targeted-test15').rglob('TARGETED_RESULT.json'));assert len(m)==1,m;r=json.loads(m[0].read_text())
          assert r['source_commit']=='64c1016c179de52b6e950830877f0d42a446e5e8' and r['product_tree_sha256']=='55bc2082a697598187ded73a5eaf3b18fa6a4e007eec25319690e4c9bb480f24' and r['zip_sha256']=='3e23a70d09fab91f84cf3c9998499ce078f1467b46540dbac7fa07ac60a6765e'
          assert r['provider_calls']==0 and r['failures']==0 and r['pass'] is True
          required={'test15_blank_composer_auto_send_exactly_once','occupied_user_draft_is_preserved','same_delivery_inline_report_auto_sends_exactly_once','different_bridge_inline_text_is_preserved'};rows={x.get('case'):x for x in r['rows']};assert all(rows.get(x,{}).get('status')=='PASS' for x in required)
          print('TARGETED_TEST15_EXACT_PACKAGE_PASS')
          PY
      - name: Fresh-extracted static identity and syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(find "$YMB_BROWSER_CANDIDATE" -type f | wc -l)" -eq 67
          find "$YMB_BROWSER_CANDIDATE" -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          node --check "$YMB_PACKAGE_TESTS/resource.mjs";node --check "$YMB_PACKAGE_TESTS/network.mjs"
      - name: Install locked Puppeteer
        shell: bash
        run: npm ci --prefix "$YMB_PPTR_HOME" --no-audit --no-fund > "$YMB_PACKAGE_EVIDENCE/npm.stdout" 2> "$YMB_PACKAGE_EVIDENCE/npm.stderr"
      - name: Fresh-extracted real Chrome resource qualification
        shell: bash
        env:
          YMB_BROWSER_EVIDENCE: ${{ runner.temp }}/package-evidence/resource
        run: |
          set -euo pipefail;mkdir -p "$YMB_BROWSER_EVIDENCE";xvfb-run -a node "$YMB_PACKAGE_TESTS/resource.mjs" > "$YMB_BROWSER_EVIDENCE/run.stdout" 2> "$YMB_BROWSER_EVIDENCE/run.stderr"
      - name: Fresh-extracted real Chrome deferred network qualification
        shell: bash
        env:
          YMB_BROWSER_EVIDENCE: ${{ runner.temp }}/package-evidence/network
        run: |
          set -euo pipefail;mkdir -p "$YMB_BROWSER_EVIDENCE";xvfb-run -a node "$YMB_PACKAGE_TESTS/network.mjs" > "$YMB_BROWSER_EVIDENCE/run.stdout" 2> "$YMB_BROWSER_EVIDENCE/run.stderr"
      - name: Finalize exact owner-candidate evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/package-publish";mkdir -p "$O";cp "$YMB_FINAL_PACKAGE" "$O/" 2>/dev/null || true;cp "$RUNNER_TEMP/package"/PACKAGE_RESULT.json "$RUNNER_TEMP/package"/SOURCE_SHA256SUMS "$O/" 2>/dev/null || true;cp -a "$YMB_PACKAGE_EVIDENCE" "$O/evidence" 2>/dev/null || true;cp -a targeted-test15 "$O/targeted-test15" 2>/dev/null || true
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          o=Path(os.environ['RUNNER_TEMP'])/'package-publish';pkg=json.loads((o/'PACKAGE_RESULT.json').read_text());groups={};fail=[];peak=0;remaining=[]
          expected_min={'resource':16,'network':9}
          for name in ['resource','network']:
            p=o/'evidence'/name/'browser.jsonl';rows=[json.loads(x) for x in p.read_text().splitlines()] if p.exists() else [];bad=[r.get('case') for r in rows if str(r.get('status','')).startswith('FAIL')];clean=next((r for r in rows if r.get('case')=='owned_browser_cleanup'),{});groups[name]={'cases':len(rows),'failures':bad,'remaining':clean.get('remaining') or [],'peak_owned_rss_kib':clean.get('peak_owned_rss_kib')};fail+=bad;remaining+=clean.get('remaining') or [];peak=max(peak,int(clean.get('peak_owned_rss_kib') or 0))
          t=list((o/'targeted-test15').rglob('TARGETED_RESULT.json'));targeted=json.loads(t[0].read_text()) if len(t)==1 else {'pass':False}
          required_cases=all(groups[n]['cases']>=expected_min[n] for n in expected_min)
          result={**pkg,'targeted_test15_pass':targeted.get('pass') is True,'fresh_extracted_browser':groups,'browser_failures':fail,'remaining_processes':remaining,'peak_owned_rss_kib':peak,'emergency_limit_kib':2097152,'real_provider_calls':0,'browser_cases_present':required_cases,'pass':pkg['dual_build_byte_identity'] and pkg['fresh_extraction_identity'] and targeted.get('pass') is True and required_cases and not fail and not remaining and peak<2097152,'release_allowed':False}
          (o/'FINAL_PACKAGE_GATE.json').write_text(json.dumps(result,indent=2)+'\n');(o/'SHA256SUMS').write_text(''.join(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+f.relative_to(o).as_posix()+'\n' for f in sorted(o.rglob('*')) if f.is_file() and f.name!='SHA256SUMS'));print(json.dumps(result,indent=2));raise SystemExit(0 if result['pass'] else 1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ymb-0.1.6-patched-final-owner-candidate-v2
          path: ${{ runner.temp }}/package-publish/
          retention-days: 90
          if-no-files-found: error
