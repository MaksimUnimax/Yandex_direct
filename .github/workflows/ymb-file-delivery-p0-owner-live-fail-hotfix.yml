name: YMB P0 Owner Live Resurrection Hotfix Executor

on:
  push:
    branches: [hotfix/ymb-file-delivery-p0-2026-09-14]
    paths:
      - .github/workflows/ymb-file-delivery-p0-owner-live-fail-hotfix.yml

permissions:
  contents: write

env:
  BRANCH: hotfix/ymb-file-delivery-p0-2026-09-14

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/ymb-file-delivery-p0-2026-09-14
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Apply exact owner-live resurrection fix and regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          prod = Path('extension/src/file_delivery_content.js')
          s = prod.read_text()
          old = '''    const free = composerFreeFor(entry);\n    if (free === false) { status("Яндекс ждёт: поле ввода занято вашим текстом.", "info", 0); return; }\n    if (!free) { status("Яндекс: поле ввода ChatGPT не найдено.", "error", 5000); return; }'''
          new = '''    const free = composerFreeFor(entry);\n    if (free === false) throw Object.assign(new Error("Поле ввода занято вашим текстом."), { code: "COMPOSER_CONTAINS_OTHER_TEXT" });\n    if (!free) { status("Яндекс: поле ввода ChatGPT не найдено.", "error", 5000); return; }'''
          assert s.count(old) == 1, s.count(old)
          prod.write_text(s.replace(old, new))

          test = Path('extension/tests/wip/YMB_ASYNC_PATCH_B_2026-09-12/P0_FILE_DELIVERY_REAL_CHROME_V2_2026-09-14.mjs')
          t = test.read_text()
          anchor = "  await runCase('user_draft_conflict_after_attachment_ready_durably_pauses_without_reinsert', async () => {"
          assert t.count(anchor) == 1, t.count(anchor)
          case = r'''  await runCase('preexisting_user_draft_before_claim_durably_pauses_without_resurrection', async () => {
    await resetPageAndOutbox();
    await page.reload({ waitUntil: 'domcontentloaded', timeout: 20000 });
    await waitContentReady('CONTENT_NOT_READY_PREEXISTING_DRAFT');
    await page.$eval('#prompt-textarea', (element) => { element.value = 'МОЙ ПРЕДСУЩЕСТВУЮЩИЙ ЧЕРНОВИК'; element.dispatchEvent(new Event('input', { bubbles: true })); });
    const staged = await stage('preexisting-draft');
    await until(async () => (await outbox())?.paused === true, 'PREEXISTING_DRAFT_DURABLE_PAUSE_NOT_PERSISTED');
    const paused = await outbox();
    const beforeClear = await page.$eval('#prompt-textarea', (element) => element.value);
    assert.equal(beforeClear, 'МОЙ ПРЕДСУЩЕСТВУЮЩИЙ ЧЕРНОВИК');
    assert.equal(paused?.id, staged.deliveryId); assert.equal(paused?.phase, 'claimed'); assert.equal(paused?.paused, true);
    assert.ok(!beforeClear.includes('SEARCH_ASYNC_BATCH_RESULT_V1'));
    await page.$eval('#prompt-textarea', (element) => { element.value = ''; element.dispatchEvent(new Event('input', { bubbles: true })); });
    await delay(1800);
    const afterClear = await page.$eval('#prompt-textarea', (element) => element.value); const durable = await outbox();
    assert.equal(afterClear, ''); assert.equal(durable?.id, staged.deliveryId); assert.equal(durable?.phase, 'claimed'); assert.equal(durable?.paused, true);
    assert.ok(!afterClear.includes('SEARCH_ASYNC_BATCH_RESULT_V1'));
    assert.equal(await worker.evaluate(() => __p0_provider_fetches), 0);
    return { preexisting_user_draft_preserved: true, durable_pause: true, resurrection_after_clear: 0, provider_calls: 0 };
  });

'''
          test.write_text(t.replace(anchor, case + anchor))
          PY

          node --check extension/src/file_delivery_content.js
          node --check extension/tests/wip/YMB_ASYNC_PATCH_B_2026-09-12/P0_FILE_DELIVERY_REAL_CHROME_V2_2026-09-14.mjs

          mapfile -t changed < <(git diff --name-only)
          printf 'Changed files:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "extension/src/file_delivery_content.js"
          test "${changed[1]}" = "extension/tests/wip/YMB_ASYNC_PATCH_B_2026-09-12/P0_FILE_DELIVERY_REAL_CHROME_V2_2026-09-14.mjs"
          git diff --check

      - name: Commit and push exact hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MaksimUnimax'
          git config user.email '36834459+MaksimUnimax@users.noreply.github.com'
          git add extension/src/file_delivery_content.js extension/tests/wip/YMB_ASYNC_PATCH_B_2026-09-12/P0_FILE_DELIVERY_REAL_CHROME_V2_2026-09-14.mjs
          git commit -m 'Fix P0 preexisting composer conflict resurrection'
          git push origin HEAD:"$BRANCH"
