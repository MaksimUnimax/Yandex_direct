name: phase9-apply-gsc-popup

on:
  push:
    branches:
      - phase9/google-organic-provider-research-2026-08-28
    paths:
      - .github/workflows/phase9-apply-gsc-popup.yml

permissions:
  contents: write
  statuses: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase9/google-organic-provider-research-2026-08-28
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded popup patch
        id: apply_patch
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/phase9_apply_gsc_popup.mjs')
          s = p.read_text()
          old = '    showStatus(`Google Search Console: доступ подтверждён; properties: ${Number(result.site_count || 0)}.`, "ok");'
          new = '    showStatus("Google Search Console: доступ подтверждён; properties: " + Number(result.site_count || 0) + ".", "ok");'
          if old not in s:
              raise SystemExit('PATCH_QUOTE_FIX_TARGET_MISSING')
          p.write_text(s.replace(old, new, 1))
          PY
          node .github/scripts/phase9_apply_gsc_popup.mjs
          node --check extension/src/popup.js
          node --check extension/src/google_search_console_worker_runtime.js
          node --test extension/tests/google_search_console_oauth_ui_routing.test.mjs
      - name: Remove one-shot machinery and commit product patch
        id: commit_patch
        if: steps.apply_patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/phase9_apply_gsc_popup.mjs .github/workflows/phase9-apply-gsc-popup.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add extension/src/popup.html extension/src/popup.js .github/scripts/phase9_apply_gsc_popup.mjs .github/workflows/phase9-apply-gsc-popup.yml
          git diff --cached --check
          git commit -m "feat(phase9): add GSC OAuth popup controls"
          git push origin HEAD:phase9/google-organic-provider-research-2026-08-28
      - name: Publish one-shot status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          APPLY_OUTCOME: ${{ steps.apply_patch.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit_patch.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          state=success
          if [[ "$APPLY_OUTCOME" != "success" || "$COMMIT_OUTCOME" != "success" ]]; then state=failure; fi
          description="apply=${APPLY_OUTCOME}; commit=${COMMIT_OUTCOME}"
          target_url="https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}"
          payload="$(jq -n --arg state "$state" --arg context 'phase9-gsc-popup/apply' --arg description "$description" --arg target_url "$target_url" '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/statuses/${SHA}" \
            -d "$payload"
          echo "PHASE9_GSC_POPUP_APPLY_STATUS=${state}"
          [[ "$state" == "success" ]]
