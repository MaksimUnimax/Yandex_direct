name: ai-native-gensearch-popup-policy-fix

on:
  push:
    branches:
      - candidate/ai-native-gensearch-production-gate-2026-08-28
    paths:
      - .github/workflows/ai-native-gensearch-popup-policy-fix.yml

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: candidate/ai-native-gensearch-production-gate-2026-08-28
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact popup policy fix and source regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:extension/src)" = '14379860d274f26dcd93f3fbaf6b1a12ce5c4512'
          python .github/scripts/apply_gensearch_popup_policy_fix.py
          node --check extension/src/popup.js
          node --check extension/tests/qa_browser/gensearch_browser_runtime.mjs
          node --test extension/tests/*.test.mjs
          git diff --check
          test "$(git diff --name-only | sort)" = $'extension/src/popup.js\nextension/tests/qa_browser/gensearch_browser_runtime.mjs'
          echo GENSEARCH_POPUP_POLICY_SOURCE_REGRESSION_PASS
      - name: Install qualified Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false puppeteer@24
          npx puppeteer browsers install chrome
          command -v xvfb-run
      - name: Prove popup Save preserves GenSearch policy state
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a node extension/tests/qa_browser/gensearch_browser_runtime.mjs | tee /tmp/gensearch-popup-policy.log
          grep -F 'GENSEARCH_BROWSER_ONE_REQUEST_PASS' /tmp/gensearch-popup-policy.log
          grep -F 'GENSEARCH_BROWSER_POPUP_SAVE_PRESERVES_ENABLED_PASS' /tmp/gensearch-popup-policy.log
          grep -F 'GENSEARCH_BROWSER_POPUP_SAVE_PRESERVES_EXPLICIT_DISABLE_PASS' /tmp/gensearch-popup-policy.log
          grep -F 'GENSEARCH_BROWSER_REAL_YANDEX_REQUESTS=0' /tmp/gensearch-popup-policy.log
          grep -F 'AI_NATIVE_GENSEARCH_BROWSER_RUNTIME_PASS' /tmp/gensearch-popup-policy.log
          echo GENSEARCH_POPUP_POLICY_BROWSER_PASS
      - name: Commit verified product fix
        shell: bash
        run: |
          set -euo pipefail
          git add extension/src/popup.js extension/tests/qa_browser/gensearch_browser_runtime.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(search): preserve GenSearch policy on popup save'
          git push origin HEAD:candidate/ai-native-gensearch-production-gate-2026-08-28
          echo "GENSEARCH_POPUP_POLICY_FIX_COMMIT=$(git rev-parse HEAD)"
