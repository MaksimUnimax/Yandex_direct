name: YMB async popup monitor Stage A
on:
  push:
    branches: [wip/ymb-async-popup-monitor-2026-09-13]
    paths:
      - .github/workflows/ymb-async-popup-monitor-stage-a.yml
      - extension/src/popup.html
      - extension/src/popup_search_async_monitor.js
permissions:
  contents: read
concurrency:
  group: ymb-async-popup-monitor-stage-a
  cancel-in-progress: false
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PUPPETEER_SKIP_CHROME_HEADLESS_SHELL_DOWNLOAD: 'true'
      PUPPETEER_SKIP_FIREFOX_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Static read-only safety gate
        shell: bash
        run: |
          set -euo pipefail
          node --check extension/src/popup_search_async_monitor.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('extension/src/popup_search_async_monitor.js').read_text()
          forbidden=['fetch(', 'XMLHttpRequest', 'chrome.runtime.sendMessage', 'readwrite', 'SEARCH_ASYNC_BATCH_API_V1']
          bad=[x for x in forbidden if x in p]
          assert not bad, bad
          html=Path('extension/src/popup.html').read_text()
          assert html.count('<script src="popup_search_async_monitor.js"></script>')==1
          print('STATIC_READ_ONLY_GATE_PASS')
          PY
      - name: Install pinned Puppeteer and Chrome for Testing
        shell: bash
        run: |
          set -euo pipefail
          Q="$RUNNER_TEMP/popup-monitor-qa"
          mkdir -p "$Q" "$RUNNER_TEMP/popup-monitor-evidence"
          printf '%s\n' '{"name":"ymb-popup-monitor-qa","private":true,"version":"1.0.0"}' > "$Q/package.json"
          npm install --prefix "$Q" --save-exact --no-audit --no-fund puppeteer@25.10.0 > "$RUNNER_TEMP/popup-monitor-evidence/npm.stdout" 2> "$RUNNER_TEMP/popup-monitor-evidence/npm.stderr"
          cp "$Q/package-lock.json" "$RUNNER_TEMP/popup-monitor-evidence/package-lock.json"
          echo "YMB_PPTR_HOME=$Q" >> "$GITHUB_ENV"
          echo "YMB_EVIDENCE=$RUNNER_TEMP/popup-monitor-evidence" >> "$GITHUB_ENV"
      - name: Real Chrome popup read-only qualification
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/popup-monitor-stage-a.mjs" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import {createRequire} from 'node:module';
          import {pathToFileURL} from 'node:url';
          const require=createRequire(pathToFileURL(path.resolve(process.env.YMB_PPTR_HOME,'package.json')));
          const puppeteer=require('puppeteer');
          const root=fs.realpathSync('extension/src');
          const out=path.resolve(process.env.YMB_EVIDENCE);fs.mkdirSync(out,{recursive:true});
          const DB='ymb_search_async_items_v2',OWNER='qa-popup-owner',JOB='popup-monitor-stage-a';
          const delay=ms=>new Promise(r=>setTimeout(r,ms));
          const emit=v=>{const row={...v,time:new Date().toISOString()};fs.appendFileSync(path.join(out,'browser.jsonl'),JSON.stringify(row)+'\n');process.stdout.write(JSON.stringify(row)+'\n');};
          const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          function inventory(){const rows=[];function walk(d){for(const x of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,x.name);if(x.isDirectory())walk(p);else if(x.isFile())rows.push([path.relative(root,p).split(path.sep).join('/'),sha(fs.readFileSync(p))]);}}walk(root);rows.sort((a,b)=>a[0].localeCompare(b[0]));return{files:rows.length,tree:sha(Buffer.from(rows.map(([p,h])=>h+'  '+p+'\n').join('')))};}
          async function until(fn,label,ms=15000,onFail=null){const end=Date.now()+ms;while(Date.now()<end){if(await fn())return;await delay(100);}if(onFail)emit({case:label,status:'DIAGNOSTIC',details:await onFail()});throw new Error(label);}
          async function waitRefresh(page){await until(()=>page.evaluate(()=>document.getElementById('searchAsyncRefresh')?.disabled===false),'REFRESH_BUTTON_STUCK');}
          async function forceOwnerAndRefresh(page,owner){await waitRefresh(page);await page.evaluate(owner=>{document.getElementById('conversationMeta').textContent=owner;document.getElementById('searchAsyncRefresh').click();},owner);}
          async function dumpDb(page){return page.evaluate(async db=>{const req=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}),d=await req(indexedDB.open(db));const out={};for(const n of ['jobs','items','results','attempts'])out[n]=await req(d.transaction(n,'readonly').objectStore(n).getAll());d.close();return JSON.stringify(out);},DB);}
          const inv=inventory();assert.equal(inv.files,68);emit({case:'exact_current_source',status:'PASS',...inv,commit:process.env.GITHUB_SHA});
          const browser=await puppeteer.launch({headless:false,pipe:true,enableExtensions:[root],protocolTimeout:90000,args:['--no-sandbox','--disable-gpu','--disable-dev-shm-usage','--disable-background-networking','--host-resolver-rules=MAP * ~NOTFOUND',`--disable-extensions-except=${root}`,`--load-extension=${root}`]});
          let worker,page;
          try{
            const target=await browser.waitForTarget(t=>t.type()==='service_worker'&&t.url().startsWith('chrome-extension://')&&t.url().endsWith('/phase3_service_worker_bootstrap.js'),{timeout:20000});
            worker=await target.worker();assert.ok(worker);const extensionId=target.url().split('/')[2];
            await worker.evaluate(()=>{globalThis.__YMB_POPUP_QA_FETCH_COUNT__=0;globalThis.__YMB_POPUP_QA_FETCH_ORIGINAL__=globalThis.fetch;globalThis.fetch=(...args)=>{globalThis.__YMB_POPUP_QA_FETCH_COUNT__++;return Promise.reject(new Error('QA_PROVIDER_NETWORK_BLOCKED'));};});
            page=await browser.newPage();const pageErrors=[];page.on('pageerror',e=>pageErrors.push(String(e)));
            await page.goto(`chrome-extension://${extensionId}/popup.html`,{waitUntil:'load',timeout:20000});
            await until(()=>page.evaluate(()=>Boolean(document.getElementById('searchAsyncMonitorSection')&&document.getElementById('searchAsyncRefresh'))),'MONITOR_SECTION_NOT_LOADED');
            await until(()=>page.evaluate(()=>Boolean(document.querySelector('script[data-ymb-popup-runtime="true"]'))),'POPUP_RUNTIME_NOT_LOADED');
            await delay(1800);await waitRefresh(page);
            const placement=await page.evaluate(()=>[...document.querySelectorAll('main > section h2')].map(x=>x.textContent.trim()));
            const runIndex=placement.indexOf('Текущий запуск'),monitorIndex=placement.indexOf('Deferred Search — прогресс');assert.equal(monitorIndex,runIndex+1);emit({case:'popup_section_placement',status:'PASS',runIndex,monitorIndex});
            await forceOwnerAndRefresh(page,'qa-missing-owner');
            await until(()=>page.evaluate(()=>document.getElementById('searchAsyncState').textContent==='Нет локального deferred Search job'),'MISSING_DB_STATE_NOT_RENDERED');
            const missing=await page.evaluate(async db=>({state:document.getElementById('searchAsyncState').textContent,exists:(await indexedDB.databases()).some(x=>x.name===db)}),DB);
            assert.equal(missing.exists,false);emit({case:'missing_db_does_not_materialize',status:'PASS',...missing});
            await waitRefresh(page);
            const seed=await page.evaluate(async({db,owner,jobId})=>{
              const req=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
              const opened=indexedDB.open(db,1);opened.onupgradeneeded=()=>{const d=opened.result;if(!d.objectStoreNames.contains('jobs'))d.createObjectStore('jobs',{keyPath:'job_id'});if(!d.objectStoreNames.contains('items')){const s=d.createObjectStore('items',{keyPath:['job_id','index']});s.createIndex('state',['job_id','state','index']);s.createIndex('due',['job_id','state','next_poll_at','index']);s.createIndex('operation','operation_id',{unique:true});}if(!d.objectStoreNames.contains('results'))d.createObjectStore('results',{keyPath:['job_id','index']});if(!d.objectStoreNames.contains('attempts'))d.createObjectStore('attempts',{keyPath:['job_id','attempt_id']});};
              const d=await req(opened),now=Date.now(),counts={PENDING:30,SUBMITTING:0,WAITING:20,COLLECTING:7,RESULT_SAVED:0,SUCCEEDED:37,PARSE_FAILED:1,FAILED:2,UNKNOWN:3,CANCELLED:0};
              await new Promise((ok,no)=>{const tx=d.transaction(['jobs','items','results'],'readwrite');tx.oncomplete=ok;tx.onabort=()=>no(tx.error);tx.onerror=()=>no(tx.error);tx.objectStore('jobs').put({job_id:jobId,owner,folder_id:'qa',parameters:{region:'225'},total:100,counts,requests_started:70,operations_accepted:37,polls_started:15,reserved_microrub:0,control:'RUNNING',lease:null,revision:12,created_at:now-61000,updated_at:now});for(let i=0;i<100;i++){let state='COLLECTING';if(i<37)state='SUCCEEDED';else if(i<39)state='FAILED';else if(i<40)state='PARSE_FAILED';else if(i<43)state='UNKNOWN';else if(i<63)state='WAITING';else if(i<93)state='PENDING';tx.objectStore('items').put({job_id:jobId,index:i,query:'q'+i,state,next_poll_at:state==='WAITING'?now+190000+i:0});}for(let i=0;i<37;i++){const n=i===36?23:9;tx.objectStore('results').put({job_id:jobId,index:i,raw_text:'RAW '+i,normalized:{results:Array.from({length:n},(_,j)=>({url:`https://example.test/${i}/${j}`}))}});}});d.close();return{now};
            },{db:DB,owner:OWNER,jobId:JOB});
            const before=await dumpDb(page);await forceOwnerAndRefresh(page,OWNER);
            await until(()=>page.evaluate(job=>document.getElementById('searchAsyncJob').textContent===job,JOB),'JOB_NOT_RENDERED',15000,()=>page.evaluate(async db=>{const req=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}),d=await req(indexedDB.open(db));const jobs=await req(d.transaction('jobs','readonly').objectStore('jobs').getAll());d.close();return{owner:document.getElementById('conversationMeta').textContent,disabled:document.getElementById('searchAsyncRefresh').disabled,state:document.getElementById('searchAsyncState').textContent,job:document.getElementById('searchAsyncJob').textContent,jobs};},DB));
            const ui=await page.evaluate(()=>Object.fromEntries(['searchAsyncJob','searchAsyncState','searchAsyncProcessed','searchAsyncSucceeded','searchAsyncRemaining','searchAsyncWaiting','searchAsyncPendingWorking','searchAsyncIssues','searchAsyncRows','searchAsyncNormalized','searchAsyncNextPoll','searchAsyncElapsed','searchAsyncRevision'].map(id=>[id,document.getElementById(id).textContent])));
            assert.equal(ui.searchAsyncState,'Требует проверки');assert.equal(ui.searchAsyncProcessed,'40 / 100 — 40%');assert.equal(ui.searchAsyncSucceeded,'37 / 100 — 37%');assert.equal(ui.searchAsyncRemaining,'60');assert.equal(ui.searchAsyncWaiting,'20');assert.equal(ui.searchAsyncPendingWorking,'30 / 7');assert.equal(ui.searchAsyncIssues,'3 / 3');assert.equal(ui.searchAsyncRows,'347');assert.equal(ui.searchAsyncNormalized,'37 / 100');assert.match(ui.searchAsyncNextPoll,/^через 3м /);assert.equal(ui.searchAsyncRevision,'12');
            await delay(5600);const afterAuto=await dumpDb(page);assert.equal(afterAuto,before);await forceOwnerAndRefresh(page,OWNER);await delay(400);const afterManual=await dumpDb(page);assert.equal(afterManual,before);emit({case:'read_only_live_progress_37_of_100',status:'PASS',ui,db_unchanged_after_auto:true,db_unchanged_after_manual:true,seed_time:seed.now});
            await page.evaluate(async({db,owner,jobId})=>{const req=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}),d=await req(indexedDB.open(db)),now=Date.now();await new Promise((ok,no)=>{const tx=d.transaction(['jobs','items','results','attempts'],'readwrite');tx.oncomplete=ok;tx.onabort=()=>no(tx.error);tx.onerror=()=>no(tx.error);for(const n of ['jobs','items','results','attempts'])tx.objectStore(n).clear();tx.objectStore('jobs').put({job_id:jobId,owner,total:1,counts:{PENDING:0,SUBMITTING:0,WAITING:0,COLLECTING:0,RESULT_SAVED:0,SUCCEEDED:1,PARSE_FAILED:0,FAILED:0,UNKNOWN:0,CANCELLED:0},requests_started:1,operations_accepted:1,polls_started:1,control:'RUNNING',revision:13,created_at:now-1000,updated_at:now});tx.objectStore('items').put({job_id:jobId,index:0,query:'done',state:'SUCCEEDED',next_poll_at:0});tx.objectStore('results').put({job_id:jobId,index:0,raw_text:'RAW',normalized:{results:[{url:'https://example.test/done'}]}});});d.close();},{db:DB,owner:OWNER,jobId:JOB});
            await forceOwnerAndRefresh(page,OWNER);await until(()=>page.evaluate(()=>document.getElementById('searchAsyncProcessed').textContent==='1 / 1 — 100%'),'ONE_OF_ONE_NOT_RENDERED');const done=await page.evaluate(()=>({state:document.getElementById('searchAsyncState').textContent,processed:document.getElementById('searchAsyncProcessed').textContent,success:document.getElementById('searchAsyncSucceeded').textContent,remaining:document.getElementById('searchAsyncRemaining').textContent,next:document.getElementById('searchAsyncNextPoll').textContent}));assert.deepEqual(done,{state:'Готово',processed:'1 / 1 — 100%',success:'1 / 1 — 100%',remaining:'0',next:'—'});emit({case:'completed_one_of_one_100_percent',status:'PASS',...done});
            const fetchCount=await worker.evaluate(()=>globalThis.__YMB_POPUP_QA_FETCH_COUNT__||0);assert.equal(fetchCount,0);assert.deepEqual(pageErrors,[]);emit({case:'no_provider_network_and_no_page_errors',status:'PASS',provider_fetch_calls:fetchCount,page_errors:pageErrors.length});
            await page.screenshot({path:path.join(out,'popup-monitor.png'),fullPage:true});
            fs.writeFileSync(path.join(out,'STAGE_A_RESULT.json'),JSON.stringify({schema_version:1,commit:process.env.GITHUB_SHA,source_tree_sha256:inv.tree,source_files:inv.files,provider_fetch_calls:fetchCount,cases:6,failures:0,pass:true},null,2)+'\n');
          }finally{await browser.close();}
          NODE
          xvfb-run -a node "$RUNNER_TEMP/popup-monitor-stage-a.mjs" > "$YMB_EVIDENCE/run.stdout" 2> "$YMB_EVIDENCE/run.stderr"
      - name: Preserve Stage A result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/popup-monitor-stage-a.mjs" "$YMB_EVIDENCE/harness.mjs" 2>/dev/null || true
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          p=Path(os.environ['YMB_EVIDENCE']);rows=[]
          f=p/'browser.jsonl'
          if f.exists(): rows=[json.loads(x) for x in f.read_text().splitlines() if x.strip()]
          failures=[r for r in rows if str(r.get('status','')).startswith('FAIL')]
          result=p/'STAGE_A_RESULT.json'
          if not result.exists(): result.write_text(json.dumps({'schema_version':1,'commit':os.environ.get('GITHUB_SHA'),'cases':len(rows),'failures':len(failures),'pass':False},indent=2)+'\n')
          sums=[]
          for x in sorted(p.iterdir()):
            if x.is_file() and x.name!='SHA256SUMS': sums.append(hashlib.sha256(x.read_bytes()).hexdigest()+'  '+x.name)
          (p/'SHA256SUMS').write_text('\n'.join(sums)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ymb-async-popup-monitor-stage-a
          path: ${{ runner.temp }}/popup-monitor-evidence/
          retention-days: 90
          if-no-files-found: error
