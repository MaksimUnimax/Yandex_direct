name: KW001 Step12 Evidence Schema Profile

on:
  push:
    branches:
      - roadmap/kwork-productization-2026-08-28
    paths:
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/step12_profile_existing_evidence_sources.py'
      - '.github/workflows/kw001-step12-evidence-schema-profile.yml'

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: roadmap/kwork-productization-2026-08-28
          fetch-depth: 0
      - name: Profile schemas
        run: python extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/step12_profile_existing_evidence_sources.py
      - name: Persist schema profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_EXISTING_EVIDENCE_SCHEMA_PROFILE.md
          git commit -m "step12: persist existing evidence schema profile [skip ci]"
          git push origin HEAD:roadmap/kwork-productization-2026-08-28
      - name: Readback
        run: |
          git fetch origin roadmap/kwork-productization-2026-08-28
          git show origin/roadmap/kwork-productization-2026-08-28:extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_EXISTING_EVIDENCE_SCHEMA_PROFILE.md | grep -q 'real header'
          echo STEP12_EVIDENCE_SCHEMA_PROFILE_READBACK_PASS
