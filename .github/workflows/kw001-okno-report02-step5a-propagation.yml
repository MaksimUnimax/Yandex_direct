name: KW001 OKNO Report02 Step5A Propagation

on:
  push:
    branches:
      - roadmap/kwork-productization-2026-08-28
    paths:
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/REPORT02_STEP05A_PROPAGATION_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: kw001-okno-report02-step5a-propagation
  cancel-in-progress: false

jobs:
  rebuild-qa-persist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout shared branch
        uses: actions/checkout@v4
        with:
          ref: roadmap/kwork-productization-2026-08-28
          fetch-depth: 0

      - name: Install document tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc libreoffice poppler-utils >/dev/null
          python -m pip install --disable-pip-version-check --quiet python-docx pypdf pillow

      - name: Rebuild propagated Report 02 source from preserved report and integrated authority
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          root=Path('extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK')
          rel=root/'OKNO_MSK_RESEARCH_RELEASE_STEP05A_PROPAGATED_2026-09-09'
          src=rel/'sources/02_OKNO_MSK_VNEDRENIE_REKOMENDATSII_RU_2026-09-09.md'
          summary=root/'STEP_05A_INTEGRATED_SEMANTIC_CORE_2026-09-09/FINAL_SEMANTIC_CORE_STEP05A_INTEGRATED_SUMMARY_2026-09-09.json'
          t=src.read_text(encoding='utf-8')
          s=json.loads(summary.read_text(encoding='utf-8'))
          assert s['canonical_rows']==2856 and s['active_rows']==2348
          assert s['exact_assignment_decision_rows']==2322 and s['active_unresolved_exact_owner_rows']==26
          assert s['demand_groups']==168

          def section(n, next_n):
              a=re.search(rf'(?m)^## {n}\. .*$',t)
              b=re.search(rf'(?m)^## {next_n}\. .*$',t)
              assert a and b and b.start()>a.end()
              return t[a.end():b.start()].strip()

          ready=section(2,3)
          clar=section(3,4)
          mapping=section(4,5)
          checks=section(5,6)
          links=section(6,7)
          acceptance=section(7,8)
          m8=re.search(r'(?m)^## 8\. .*$',t); assert m8
          bibliography=t[m8.end():].strip()

          h_ass='### Дополнительные фразы, назначенные существующим страницам'
          h_un='### Дополнительные фразы без подтверждённого точного владельца'
          assert h_ass in mapping and h_un in mapping
          base=mapping.split(h_ass,1)[0].strip()
          assigned=mapping.split(h_ass,1)[1].split(h_un,1)[0].strip()
          unresolved=mapping.split(h_un,1)[1].strip()

          intro='''# Внедрение рекомендации

## 1. Как пользоваться руководством

Этот документ переводит результаты исследования и обновлённого семантического ядра в конкретные действия и ограничения для сайта.

Три готовых изменения в разделе 4 — самостоятельные задачи. Нумерация нужна для навигации и приёмки и не задаёт обязательную календарную последовательность. Пять пунктов раздела 5 требуют уточнения конкретного факта или места размещения до окончательного внедрения.

Полный состав поисковых фраз, групп, страниц и статистики спроса находится в книге №04. После дополнительного анализа конкурентов ядро было пересобрано как единый массив, поэтому в этой версии руководства используются уже новые итоговые числа и новые назначения фраз.

Важно различать три типа результата:

- **готовое изменение сайта** — есть подтверждённая страница, понятное изменение и критерии приёмки;
- **семантическое назначение** — известно, какая существующая страница отвечает за тему; само это назначение не является разрешением автоматически менять текст, создавать страницу или перестраивать сайт;
- **неподтверждённый точный владелец** — тема сохранена в ядре, но до внедрения нужно подтвердить точную страницу и границы предложения компании.

## 2. Что изменилось после обновления семантического ядра

Первичная исследовательская база содержала 2 840 уникальных формулировок. Дополнительный анализ конкурентов выявил 16 новых подтверждённых формулировок в семи направлениях. После включения их в общий процесс очистки и назначения итоговое ядро содержит:

| Показатель | Итог |
|---|---:|
| Уникальные поисковые формулировки | 2 856 |
| Активные фразы | 2 348 |
| Активные фразы с завершённым решением по точному назначению | 2 322 |
| Активные фразы без подтверждённого точного владельца | 26 |
| Пользовательские группы спроса | 168 |
| Новые формулировки из дополнительного анализа конкурентов | 16 |

Из 16 новых формулировок девять получили точное семантическое назначение на существующие страницы. Ещё семь сохранены в активном ядре, но требуют подтверждения точной страницы или границ услуги.

Это изменение **не превращает автоматически новые фразы в задания на физическую правку сайта**. Физическое изменение включается в руководство только тогда, когда для него есть отдельное доказательное основание.

## 3. Краткая карта работ

| Категория | Количество | Следующее действие |
|---|---:|---|
| Изменения сайта, готовые к внедрению | 3 | Выполнить и принять по отдельности |
| Требуют уточнения перед внедрением | 5 | Получить указанный ответ и только затем финализировать изменение |
| Семантические назначения на страницы | 55 | Использовать в ядре и контент-планировании; 46 ранее подтверждённых тем + 9 новых фраз |
| Новые фразы без подтверждённого точного владельца | 7 | Не передавать во внедрение до подтверждения страницы и границ предложения |
| Дополнительные проверки | 4 | Провести указанную проверку и зафиксировать решение |
| Уникальные направления внутренних связей | 14 | Детализировать точное место и текст ссылки перед размещением |
'''

          out='\n\n'.join([
              intro.strip(),
              '## 4. Изменения сайта, готовые к внедрению\n\n'+ready,
              '## 5. Уточнить перед внедрением\n\n'+clar,
              '## 6. Семантические назначения на страницы\n\n### 6.1. Ранее подтверждённые тематические назначения\n\n'+base+'\n\n### 6.2. Девять новых фраз с подтверждённым точным назначением\n\n'+assigned,
              '## 7. Семь новых фраз, которые пока нельзя передавать во внедрение\n\n'+unresolved,
              '## 8. Дополнительные проверки перед следующими изменениями\n\n'+checks,
              '## 9. Потенциальные внутренние связи между страницами\n\n'+links,
              '## 10. Как принимать результат\n\n'+acceptance,
              '## 11. Материалы, использованные в исследовании\n\n'+bibliography,
          ])+'\n'
          src.write_text(out,encoding='utf-8')
          print('REPORT02_SOURCE_REBUILT',len(out.encode('utf-8')))
          PY

      - name: Build DOCX and PDF
        run: |
          ROOT=extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK
          REL="$ROOT/OKNO_MSK_RESEARCH_RELEASE_STEP05A_PROPAGATED_2026-09-09"
          SRC="$REL/sources/02_OKNO_MSK_VNEDRENIE_REKOMENDATSII_RU_2026-09-09.md"
          DOCX="$REL/editable/02_OKNO_MSK_VNEDRENIE_REKOMENDATSII_RU_2026-09-09.docx"
          PDF="$REL/02_OKNO_MSK_VNEDRENIE_REKOMENDATSII_RU_2026-09-09.pdf"
          mkdir -p "$REL/editable" /tmp/report02-step5a-pdf
          pandoc "$SRC" --from=gfm --to=docx --output "$DOCX"
          libreoffice --headless --convert-to pdf --outdir /tmp/report02-step5a-pdf "$DOCX" >/tmp/lo.txt 2>&1
          cp "/tmp/report02-step5a-pdf/$(basename "${DOCX%.docx}.pdf")" "$PDF"
          test -s "$DOCX" && test -s "$PDF"

      - name: Deterministic content and cross-format QA
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,re,subprocess,shutil
          from docx import Document
          from pypdf import PdfReader

          root=Path('extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK')
          rel=root/'OKNO_MSK_RESEARCH_RELEASE_STEP05A_PROPAGATED_2026-09-09'
          md=rel/'sources/02_OKNO_MSK_VNEDRENIE_REKOMENDATSII_RU_2026-09-09.md'
          docx=rel/'editable/02_OKNO_MSK_VNEDRENIE_REKOMENDATSII_RU_2026-09-09.docx'
          pdf=rel/'02_OKNO_MSK_VNEDRENIE_REKOMENDATSII_RU_2026-09-09.pdf'
          qa=root/'REPORT02_STEP05A_PROPAGATION_QA_2026-09-09.json'
          receipt=root/'REPORT02_STEP05A_PROPAGATION_RECEIPT_2026-09-09.md'
          state=root/'RESEARCH_REPORT_REBUILD_CURRENT_STATE_CLIENT_CLEANUP_2026-09-08.json'
          manifest=rel/'RELEASE_MANIFEST_2026-09-09.json'
          readme=rel/'README_RU.md'
          t=md.read_text(encoding='utf-8')
          phrases9=['солнцезащитный стеклопакет','солнцезащитное стекло в стеклопакете','солнцезащитный стеклопакет rehau','многофункциональный стеклопакет что это','ударопрочный стеклопакет','балконы под офис','шумоизоляция на крышу балкона','шумоизоляция крыши балкона от дождя','армирование оконного профиля']
          phrases7=['гидроизоляция для открытого балкона','гидроизоляция открытого балкона в частном доме','лучшая гидроизоляция для открытого балкона','как сделать гидроизоляцию на открытом балконе','гидроизоляция открытого деревянного балкона','гидроизоляция балконной плиты открытого балкона','шумоизоляция крыши балкона изнутри от дождя']
          D=Document(docx); dtx='\n'.join(p.text for p in D.paragraphs)
          for tb in D.tables:
              for row in tb.rows: dtx+='\n'+' | '.join(c.text for c in row.cells)
          R=PdfReader(pdf); ptx='\n'.join((p.extract_text() or '') for p in R.pages)
          stripws=lambda s:re.sub(r'\s+','',s.casefold())
          checks=[]
          def ck(n,v,d=None): checks.append({'name':n,'pass':bool(v),'detail':d})
          ck('title',t.startswith('# Внедрение рекомендации\n'))
          ck('no_role_branding','Документ №02 для' not in t and 'SEO-специалиста' not in t)
          for tok in [r'S18-A\d+',r'STEP_[A-Z0-9_]+',r'Stage\d+',r'CV\d+',r'OR-\d+',r'CONTENT_BLOCK',r'SEMANTIC_MAPPING_ONLY',r'RECHECK_ONLY']:
              ck('no_internal_'+tok,not re.search(tok,t,re.I))
          for s in ['2 856','2 348','2 322','26','168']:
              ck('has_'+s.replace(' ',''),s in t)
          ck('all_9_assigned_present',all(x in t.casefold() for x in phrases9))
          ck('all_7_unresolved_present',all(x in t.casefold() for x in phrases7))
          ck('no_unsupported_zero_new_pages','Новые страницы: 0' not in t and 'new_pages' not in t)
          ck('no_unsupported_zero_physical','физических изменений = 0' not in t and 'physical_site_changes' not in t)
          ck('semantic_not_auto_change','не является разрешением автоматически менять текст' in t)
          def between(a,b): return t.split(a,1)[1].split(b,1)[0]
          sec4=between('## 4. Изменения сайта, готовые к внедрению','## 5.')
          sec5=between('## 5. Уточнить перед внедрением','## 6.')
          sec6=between('## 6. Семантические назначения на страницы','## 7.')
          sec7=between('## 7. Семь новых фраз, которые пока нельзя передавать во внедрение','## 8.')
          sec8=between('## 8. Дополнительные проверки перед следующими изменениями','## 9.')
          sec9=between('## 9. Потенциальные внутренние связи между страницами','## 10.')
          sec11=t.split('## 11. Материалы, использованные в исследовании',1)[1]
          ck('ready_3',len(re.findall(r'^### \d+\.',sec4,re.M))==3)
          ck('clarification_5',len(re.findall(r'^### \d+\.',sec5,re.M))==5)
          ck('base_topic_rows_46',len(re.findall(r'^\| \d+ \|',sec6.split('### 6.2.',1)[0],re.M))==46)
          rows9=[x for x in sec6.split('### 6.2.',1)[1].splitlines() if x.startswith('| ') and not x.startswith('|---') and 'Поисковая фраза' not in x]
          rows7=[x for x in sec7.splitlines() if x.startswith('| ') and not x.startswith('|---') and 'Поисковая фраза' not in x]
          ck('new_assigned_rows_9',len(rows9)==9,len(rows9)); ck('new_unresolved_rows_7',len(rows7)==7,len(rows7))
          ck('checks_4',len(re.findall(r'^### \d+\.',sec8,re.M))==4)
          ck('links_14',len(re.findall(r'^\| \d+ \|',sec9,re.M))==14)
          ck('bibliography_10',len(re.findall(r'^\d+\. ',sec11,re.M))==10)
          for label,tx in [('docx',dtx),('pdf',ptx)]:
              ck(label+'_title','Внедрение рекомендации' in tx)
              ck(label+'_2856','2 856' in tx or '2856' in tx)
              ck(label+'_2348','2 348' in tx or '2348' in tx)
              ck(label+'_2322','2 322' in tx or '2322' in tx)
              ck(label+'_new9',all(stripws(x) in stripws(tx) for x in phrases9))
              ck(label+'_new7',all(stripws(x) in stripws(tx) for x in phrases7))
              ck(label+'_no_role','SEO-специалиста' not in tx and 'Документ №02 для' not in tx)
          ck('pdf_pages_18',len(R.pages)==18,len(R.pages))
          ck('provider_calls_zero',True)
          if not all(x['pass'] for x in checks):
              raise SystemExit('REPORT02_STEP05A_QA_FAIL '+str([x for x in checks if not x['pass']]))

          render=Path('/tmp/report02-step5a-render'); shutil.rmtree(render,ignore_errors=True); render.mkdir()
          subprocess.run(['pdftoppm','-png','-r','150',str(pdf),str(render/'page')],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          rendered=len(list(render.glob('page-*.png'))); assert rendered==18
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          q={'schema':'OKNO_MSK_REPORT02_STEP05A_PROPAGATION_QA_V4','date':'2026-09-09','status':'PASS','checks_passed':sum(x['pass'] for x in checks),'checks_total':len(checks),'checks':checks,'artifacts':{'markdown':{'bytes':md.stat().st_size,'sha256':sha(md)},'docx':{'bytes':docx.stat().st_size,'sha256':sha(docx)},'pdf':{'bytes':pdf.stat().st_size,'sha256':sha(pdf),'pages':18}},'provider_calls':0,'pdf_render':'PASS_18_OF_18','remote_visual_readback':'PENDING'}
          qa.write_text(json.dumps(q,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          readme.write_text(f'''# Обновлённый выпуск OKNO_MSK\n\nВыпуск использует единое семантическое ядро после включения подтверждённых результатов дополнительного анализа конкурентов в общий процесс очистки, группировки и назначения страниц.\n\n- Полное ядро: 2 856 уникальных поисковых формулировок.\n- В едином корпусе: 2 840 формулировок базового сбора и 16 принятых формулировок из семи направлений дополнительного анализа конкурентов.\n- Активное ядро: 2 348 фраз.\n- Завершённые решения по точному семантическому назначению: 2 322.\n- Активные фразы без подтверждённого точного владельца: 26.\n- Пользовательские группы спроса: 168.\n\nИз 16 новых формулировок девять получили точное назначение существующим страницам. Ещё семь сохранены в активном ядре, но не передаются во внедрение до подтверждения точной страницы и/или границ предложения компании.\n\nДокумент №02 пересобран по этому состоянию ядра. В нём сохранены только доказанные действия и ограничения: 3 готовых изменения сайта, 5 пунктов для уточнения, 55 семантических назначений (46 ранее подтверждённых тем + 9 новых фраз), 7 новых фраз без подтверждённого точного владельца, 4 дополнительные проверки и 14 уникальных направлений внутренних связей.\n\nСамо наличие фразы в ядре или её назначение существующей странице не считается автоматическим разрешением создавать страницу, менять текст или выполнять другое физическое изменение сайта. Итог о новых страницах или физических изменениях не выводится из семантического ядра без отдельного доказательства.\n\nДокумент №03 пока сохранён без содержательной переработки под новое ядро и должен пройти отдельную сверку.\n\nНовых обращений к Вордстату, обычному поиску Яндекса или Алисе при пересборке документа №02 не выполнялось.\n''',encoding='utf-8')

          m=json.loads(manifest.read_text(encoding='utf-8'))
          m['schema']='OKNO_MSK_CLIENT_RELEASE_STEP5A_PROPAGATED_V2'
          m['status']='DOCUMENT_02_STEP05A_RECONCILED__REMOTE_VISUAL_READBACK_PENDING'
          m['semantic_rows']=2856; m['active_rows']=2348; m['exact_assignment_decision_rows']=2322; m['active_unresolved_exact_owner_rows']=26; m['structural_units']=168
          m.pop('new_pages',None); m.pop('new_physical_site_changes',None)
          m['new_pages_from_step5a_claim_state']='NOT_ASSERTED_FROM_SEMANTIC_CORE_WITHOUT_SEPARATE_DOWNSTREAM_EVIDENCE'
          m['new_physical_site_changes_from_step5a_claim_state']='NOT_ASSERTED_FROM_SEMANTIC_CORE_WITHOUT_SEPARATE_DOWNSTREAM_EVIDENCE'
          m['report02_step5a_reconciled']=True
          m['report02_contract']={'ready_actions':3,'clarification_items':5,'semantic_assignment_rows':55,'base_topic_page_rows':46,'step5a_exact_assignment_rows':9,'step5a_unresolved_rows':7,'additional_checks':4,'unique_internal_link_directions':14,'bibliography_items':10}
          m['report02_deterministic_content_qa']=f"PASS__{q['checks_passed']}_OF_{q['checks_total']}"
          m['report02_pdf_rerender']='PASS__18_OF_18'; m['report02_remote_visual_readback']='PENDING'; m['report02_provider_calls']=0
          for a in m.get('artifacts',[]):
              if a.get('path')==pdf.name: a.update(bytes=pdf.stat().st_size,sha256=sha(pdf),pages=18)
              elif a.get('path')==str(docx.relative_to(rel)): a.update(bytes=docx.stat().st_size,sha256=sha(docx))
              elif a.get('path')==str(md.relative_to(rel)): a.update(bytes=md.stat().st_size,sha256=sha(md))
