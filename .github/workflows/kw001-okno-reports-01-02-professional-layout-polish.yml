name: KW001 OKNO Reports 01-02 Professional Layout Polish

on:
  push:
    branches:
      - roadmap/kwork-productization-2026-08-28
    paths:
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/REPORTS_01_02_PROFESSIONAL_LAYOUT_TRIGGER.txt'

permissions:
  contents: write
  actions: read

concurrency:
  group: kw001-okno-reports-01-02-professional-layout-polish
  cancel-in-progress: false

jobs:
  polish-qa-persist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout shared branch
        uses: actions/checkout@v4
        with:
          ref: roadmap/kwork-productization-2026-08-28
          fetch-depth: 0

      - name: Install document tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc libreoffice poppler-utils >/dev/null
          python -m pip install --disable-pip-version-check --quiet pypdf

      - name: Polish professional PDF composition
        run: |
          python extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/tools/post_release_correction/polish_professional_report_layout.py

      - name: Persist polished client package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ROOT=extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK
          REL="$ROOT/OKNO_MSK_RESEARCH_RELEASE_STEP05A_PROPAGATED_2026-09-09"
          git add "$ROOT/tools/post_release_correction/polish_professional_report_layout.py"
          git add "$REL/sources/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-09.md"
          git add "$REL/editable/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-09.docx"
          git add "$REL/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-09.pdf"
          git add "$REL/sources/02_OKNO_MSK_VNEDRENIE_REKOMENDATSII_RU_2026-09-09.md"
          git add "$REL/editable/02_OKNO_MSK_VNEDRENIE_REKOMENDATSII_RU_2026-09-09.docx"
          git add "$REL/02_OKNO_MSK_VNEDRENIE_REKOMENDATSII_RU_2026-09-09.pdf"
          git add "$REL/RELEASE_MANIFEST_2026-09-09.json"
          git add "$ROOT/RESEARCH_REPORT_REBUILD_CURRENT_STATE_CLIENT_CLEANUP_2026-09-08.json"
          git add "$ROOT/REPORTS_01_02_PROFESSIONAL_REPACKAGE_QA_2026-09-09.json"
          git add "$ROOT/REPORTS_01_02_PROFESSIONAL_LAYOUT_QA_2026-09-09.json"
          git add "$ROOT/REPORTS_01_02_PROFESSIONAL_REPACKAGE_RECEIPT_2026-09-09.md"
          git rm "$ROOT/REPORTS_01_02_PROFESSIONAL_LAYOUT_TRIGGER.txt"
          git rm .github/workflows/kw001-okno-reports-01-02-professional-layout-polish.yml
          git commit -m "docs(okno-msk): polish professional reports 01 and 02 layout [skip ci]"
          if ! git push origin HEAD:roadmap/kwork-productization-2026-08-28; then
            git fetch origin roadmap/kwork-productization-2026-08-28
            git merge --no-edit origin/roadmap/kwork-productization-2026-08-28
            git push origin HEAD:roadmap/kwork-productization-2026-08-28
          fi

      - name: Upload exact polished reports and renders
        uses: actions/upload-artifact@v4
        with:
          name: okno-msk-reports-01-02-professional-polished-readback
          path: |
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/OKNO_MSK_RESEARCH_RELEASE_STEP05A_PROPAGATED_2026-09-09/sources/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-09.md
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/OKNO_MSK_RESEARCH_RELEASE_STEP05A_PROPAGATED_2026-09-09/editable/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-09.docx
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/OKNO_MSK_RESEARCH_RELEASE_STEP05A_PROPAGATED_2026-09-09/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-09.pdf
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/OKNO_MSK_RESEARCH_RELEASE_STEP05A_PROPAGATED_2026-09-09/sources/02_OKNO_MSK_VNEDRENIE_REKOMENDATSII_RU_2026-09-09.md
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/OKNO_MSK_RESEARCH_RELEASE_STEP05A_PROPAGATED_2026-09-09/editable/02_OKNO_MSK_VNEDRENIE_REKOMENDATSII_RU_2026-09-09.docx
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/OKNO_MSK_RESEARCH_RELEASE_STEP05A_PROPAGATED_2026-09-09/02_OKNO_MSK_VNEDRENIE_REKOMENDATSII_RU_2026-09-09.pdf
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/OKNO_MSK_RESEARCH_RELEASE_STEP05A_PROPAGATED_2026-09-09/05_OKNO_MSK_IMPLEMENTATION_TRACKER_2026-09-09.xlsx
            /tmp/report01-prof-polished-render/*.png
            /tmp/report02-prof-polished-render/*.png
          if-no-files-found: error
          retention-days: 7
