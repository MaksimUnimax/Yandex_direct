name: phase2-stage4-transport-mirror-verify
on:
  pull_request:
    branches:
      - main
    paths:
      - extension/tests/qa_transport/phase2-stage4-frozen/**
      - .github/workflows/phase2-stage4-transport-mirror-verify.yml
permissions:
  contents: read
jobs:
  verify-exact-git-transport:
    if: github.event.pull_request.head.ref == 'qa/phase2-stage4-exact-transport-2026-08-24'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact QA transport commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Assert immutable transport authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "${{ github.event.pull_request.head.sha }}" = "564374ebbbe0fc2d4cdb0cdd02dee8128828bd32"
          git diff --exit-code
      - name: Consumer verify exact frozen ZIP from Git checkout
        shell: bash
        run: |
          set -euo pipefail
          python extension/tests/qa_transport/phase2-stage4-frozen/verify_exact_artifact.py
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          base = Path('extension/tests/qa_transport/phase2-stage4-frozen')
          transport = json.loads((base / 'TRANSPORT_MANIFEST_2026-08-24.json').read_text(encoding='utf-8'))
          payload_manifest = (base / 'EXACT_CANDIDATE_MANIFEST_2026-08-24.json').read_bytes()
          if hashlib.sha256(payload_manifest).hexdigest() != transport['payload_manifest_sha256']:
              raise SystemExit('TRANSPORT_PAYLOAD_MANIFEST_SHA_FAIL')
          if len(payload_manifest) != transport['payload_manifest_bytes']:
              raise SystemExit('TRANSPORT_PAYLOAD_MANIFEST_BYTES_FAIL')
          if transport['artifact_sha256'] != '0f0b035c6bc04da841d549182c3dcea6e7cf10074eddebafdf1c3a4c21c98411':
              raise SystemExit('TRANSPORT_EXPECTED_SHA_FAIL')
          if transport['artifact_bytes'] != 170726:
              raise SystemExit('TRANSPORT_EXPECTED_BYTES_FAIL')
          print('GIT_CHECKOUT_EXACT_TRANSPORT_PASS')
          print('REAL_YANDEX_REQUESTS=0')
          PY
