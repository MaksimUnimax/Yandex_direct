name: MK02 Phase 7 closure state propagation

on:
  push:
    paths:
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/MINI_KWORKS_PRODUCTIZATION/MK02_SEMANTIC_CORE_ARCHITECTURE_DEV_TZ/tests/OKNO_MSK/.phase7_close_state'

permissions:
  contents: write

jobs:
  close-phase-7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Propagate Phase 7 lessons and state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          series=Path('extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/MINI_KWORKS_PRODUCTIZATION')
          mk=series/'MK02_SEMANTIC_CORE_ARCHITECTURE_DEV_TZ'
          test=mk/'tests/OKNO_MSK'

          def read(p): return p.read_text('utf-8')
          def write(p,s): p.write_text(s,'utf-8')
          def replace_once(s,old,new,label):
              n=s.count(old)
              print('REPLACE',label,'COUNT',n)
              assert n==1,(label,n,old[:120])
              return s.replace(old,new,1)

          # 1. Failure ledger: promote the real Phase-7 artifact defect class.
          p=mk/'ERRORS_AND_LESSONS.md'; s=read(p)
          assert '## K. Phase-7 final-artifact leakage / page-flow failure' not in s
          s += '''\n\n---\n\n## K. Phase-7 final-artifact leakage / page-flow failure — PACKAGING-QA-01\n\n### What failed\n\nThe final physical delivery can still fail after semantic/recipient review even when the underlying decisions are correct. The Phase-7 rehearsal exposed two concrete manifestations:\n\n- client XLSX presentation/package metadata retained internal vocabulary equivalent to `HOLD`, `CTA` and product-internal identifiers;\n- the analytical PDF passed parse/text/hash checks but a final-byte render showed a section heading orphaned at the bottom of a page.\n\nConcrete client values remain Level 2; the reusable failure is final-artifact leakage/page-flow incompleteness.\n\n### Root cause / false assumptions\n\n```text\nRECIPIENT NARRATIVE LOOKS HUMAN != FINAL FILE TOKEN-CLEAN\nVISIBLE XLSX CELLS CLEAN != XLSX PACKAGE METADATA CLEAN\nPDF PARSES + HASH MATCHES != PAGE-FLOW PASS\nEARLIER RENDER PASS != POST-CORRECTION FINAL-BYTE RENDER PASS\n```\n\nOne generator path bypassed the client-text normalization layer; workbook QA did not inspect raw XML/table metadata; parser/hash PDF QA could not observe page composition.\n\n### Corrected rule\n\nFinal-artifact QA is layered:\n\n1. XLSX: inspect visible client cells **and** raw package XML/table metadata for internal vocabulary; client-facing generation paths use the same normalization authority.\n2. PDF: parse/extract text **and** render the exact final bytes; inspect clipping, overlap, broken glyphs, orphan headings and page flow.\n3. If a leak/layout defect is found, correct the source/generator first where applicable, rebuild the affected artifact and rerun the relevant client-language/physical/hash gates.\n4. A pre-correction render or an earlier green receipt cannot certify later bytes.\n\n### Regression / closure condition\n\n```text\nXLSX FORBIDDEN CLIENT-TOKEN HITS = 0\nXLSX INTERNAL TABLE-NAME LEAKAGE = 0\nXLSX FORMULA ERRORS = 0\nPDF FORBIDDEN CLIENT-TOKEN HITS = 0\nFINAL ANALYTICAL PDF RENDER = PASS / NO ORPHAN HEADING\nFINAL IMPLEMENTATION PDF RENDER = PASS\nFINAL REMOTE HASH/IDENTITY READBACK = PASS\nSOURCE/GENERATOR NON-REPEAT CONTROL = PRESENT\n```\n'''
          write(p,s)

          # 2. General rule for layered final-artifact QA.
          p=mk/'GENERAL_RULES.md'; s=read(p)
          assert '## 45. Final-artifact QA is layered' not in s
          s += '''\n\n## 45. Final-artifact QA is layered\n\nFinal client files require checks at the layer where a defect can exist.\n\nFor XLSX:\n\n```text\nVISIBLE CLIENT CELLS\n+ WORKBOOK/SHEET STATE\n+ RAW PACKAGE XML / TABLE METADATA\n+ FORMULA-ERROR SCAN\n```\n\nFor PDF:\n\n```text\nPARSE / TEXT EXTRACTION\n+ CLIENT-LANGUAGE SCAN\n+ FINAL-BYTE RENDER\n+ PAGE-FLOW / ORPHAN-HEADING REVIEW\n```\n\nA clean parser/hash result cannot substitute for rendered page-flow review. A clean visible worksheet view cannot substitute for checking package metadata when internal terminology is forbidden. After any correction, inspect/revalidate the **post-correction final bytes**, not an earlier render. Source/generator correction remains the preferred closure path before a final binary replacement.\n'''
          write(p,s)

          # 3. QA contract: make the newly proven checks explicit and advance boundary.
          p=mk/'QA_AND_RELEASE.md'; s=read(p)
          old='''- ordinary headings/statuses/reasons/instructions are Russian;\n- internal action IDs/filenames/QA IDs/Stage/Step/enums do not leak;'''
          new='''- ordinary headings/statuses/reasons/instructions are Russian;\n- internal action IDs/filenames/QA IDs/Stage/Step/enums do not leak;\n- final XLSX is scanned both through visible cells and raw package XML/table metadata;\n- client-text normalization is not bypassed by a secondary generator path;'''
          s=replace_once(s,old,new,'qa_g14_layered_xlsx')
          old='''- render and inspect **both** final PDFs independently;\n- verify no clipping/overlap/broken glyphs/unreadable tables/orphan headings;'''
          new='''- render and inspect **both** final PDFs independently from the exact post-correction delivery bytes;\n- parse/extract and client-language-scan both PDFs, but do not treat parse/hash success as a substitute for rendering;\n- verify no clipping/overlap/broken glyphs/unreadable tables/orphan headings or broken page flow;'''
          s=replace_once(s,old,new,'qa_g15_final_bytes')
          old='''## Current Phase-6/7 boundary\n\n```text\nPHASE 5 OKNO_MSK REHEARSAL = PASS\nPHASE 6 CLIENT PACKAGE OWNER REVIEW = PASS\nPHYSICAL PACKAGE = XLSX + ANALYTICAL_PDF + IMPLEMENTATION_TZ_PDF + HANDOFF_MESSAGE\nPHASE 6 PROVIDER CALLS = 0\nPHASE 5 DATA AUTHORITIES = DO NOT RERUN WITHOUT PROVEN DEFECT\nNEXT_ACTION = PHASE_7_MK02_PRODUCT_RECIPIENT_QA\n```'''
          new='''## Current Phase-7/8 boundary\n\n```text\nPHASE 5 OKNO_MSK REHEARSAL = PASS\nPHASE 6 CLIENT PACKAGE OWNER REVIEW = PASS\nPHASE 7 PRODUCT / RECIPIENT QA = PASS / 2026-09-10\nPHYSICAL PACKAGE = XLSX + ANALYTICAL_PDF + IMPLEMENTATION_TZ_PDF + HANDOFF_MESSAGE\nPHASE 7 PROVIDER CALLS = 0\nPHASE 5 DATA AUTHORITIES MODIFIED IN PHASE 7 = 0\nNEXT_ACTION = PHASE_8_MK02_PRICE_LIMITS_ECONOMICS\n```'''
          s=replace_once(s,old,new,'qa_state')
          write(p,s)

          # 4. Client handoff source: remove internal product/status vocabulary from the actual message.
          p=mk/'CLIENT_HANDOFF_TEMPLATE.md'; s=read(p)
          s=replace_once(s,'Status: **PHASE 6 PACKAGE AUTHORITY / TO BE PHYSICALLY VALIDATED IN PHASE 7**','Status: **PHASE 7 PHYSICALLY VALIDATED / BASE V1 HANDOFF TEMPLATE**','handoff_status')
          s=s.replace('«нужно уточнение / перепроверка / HOLD»','«нужно уточнение / перепроверка / отложено до доказательства»')
          s=s.replace('в базовый MK02 не входят','в этот заказ не входят')
          write(p,s)

          # 5. Packaging authority: record actual Phase-7 validation.
          p=mk/'PRODUCT_PACKAGING.md'; s=read(p)
          s=replace_once(s,'Status: **PHASE 6 OWNER-ACCEPTED PHYSICAL PACKAGE / PHASE 7 QA NEXT**','Status: **PHASE 7 PACKAGE VALIDATED / PHASE 8 ECONOMICS NEXT**','packaging_status')
          marker='## 12. Phase 7 — что ещё должно быть доказано'
          assert marker in s
          s=s[:s.index(marker)] + '''## 12. Phase 7 — validation result\n\nPhase 7 materialized the frozen three-file package on OKNO_MSK and validated it as the real recipient delivery.\n\nFinal client artifacts:\n\n```text\nSEMANTIC_CORE_AND_SEO_STRUCTURE_OKNO_MSK_2026-09-10.xlsx\nblob = b2ec26f1c932461e6a1a807e833d254225e62d65\nsha256 = be1996ad6b356187de55afeabc57ba33fd3aa77b0be0850ebe9938638944040a\n\nRESEARCH_AND_ARCHITECTURE_REPORT_OKNO_MSK_2026-09-10.pdf\nblob = 149dfe55010e099d03d048f6686775ea74dd3edd\nsha256 = 851463f469480a3a977eaa327fecc475644945df7cd1a8e6ba883ee33140b2b7\n\nSITE_IMPROVEMENT_TZ_OKNO_MSK_2026-09-10.pdf\nblob = 7aedd3d74cae8bed3ac2fe43aab5e716536d3d9d\nsha256 = d12b0b3bd8d70c9aff5aea793d3a94b147be1555e547c03729e4e2caa5b7dfc1\n```\n\nValidated gates:\n\n- semantic/ownership/action row accounting preserved;\n- 47 work packages reconcile to `3 / 1 / 10 / 4 / 19 / 9 / 1`;\n- final XLSX has 13 visible sheets, zero formula errors and zero forbidden client-token hits in visible/package XML layers;\n- analytical PDF: 2/2 final pages visually inspected after the orphan-heading correction;\n- implementation-TZ PDF: 2/2 final pages visually inspected;\n- both PDFs parse and pass client-language scans;\n- Yandex-only and uncertainty/readiness boundaries are preserved;\n- provider calls in Phase 7 = 0;\n- Phase-5 semantic/ownership/architecture/action authorities modified in Phase 7 = 0.\n\nThe client package design remains exactly the Phase-6 decision: one XLSX + two separate PDFs + a short handoff message.\n\n## 13. Phase-7 Definition of Done\n\n```text\nFROZEN PHYSICAL PACKAGE MATERIALIZED\n+ G13 CROSS-VIEW CONSISTENCY PASS\n+ G14 CLIENT LANGUAGE / REPORT QUALITY PASS\n+ G15 PHYSICAL / RECIPIENT / PERSISTENCE PASS\n+ FINAL XLSX PACKAGE-LAYER SCAN PASS\n+ BOTH FINAL PDF RENDERS REVIEWED\n+ FINAL HASH IDENTITIES RECORDED\n+ GENERATOR REGRESSION FIXED\n+ PROVIDER CALLS = 0\n= PHASE 7 PASS\n```\n\nNext gate:\n\n```text\nPHASE 8 = PRICE / LIMITS / ECONOMICS\n```\n'''
          write(p,s)

          # 6. Product roadmap state.
          p=mk/'PRODUCT_ROADMAP.md'; s=read(p)
          s=replace_once(s,'Status: **PHASES 0–6 PASS / PHASE 7 PRODUCT-RECIPIENT QA NEXT**','Status: **PHASES 0–7 PASS / PHASE 8 PRICE-LIMITS-ECONOMICS NEXT**','roadmap_status')
          s=replace_once(s,'PHASE 7  PRODUCT / RECIPIENT QA                = NEXT\nPHASE 8  PRICE / LIMITS / ECONOMICS            = PENDING','PHASE 7  PRODUCT / RECIPIENT QA                = PASS / 2026-09-10\nPHASE 8  PRICE / LIMITS / ECONOMICS            = NEXT','roadmap_phases')
          old='''METHOD_STATE = PHASE_6_CLIENT_PACKAGING_PASS\nPHYSICAL_PACKAGE = XLSX + ANALYTICAL_PDF + IMPLEMENTATION_TZ_PDF + HANDOFF_MESSAGE\nNEXT_ACTION = PHASE_7_MK02_PRODUCT_RECIPIENT_QA'''
          new='''METHOD_STATE = PHASE_7_PRODUCT_RECIPIENT_QA_PASS\nPHYSICAL_PACKAGE = XLSX + ANALYTICAL_PDF + IMPLEMENTATION_TZ_PDF + HANDOFF_MESSAGE\nNEXT_ACTION = PHASE_8_MK02_PRICE_LIMITS_ECONOMICS'''
          s=replace_once(s,old,new,'roadmap_cursor')
          old='Phase 7 must materialize/reconcile the accepted physical package on OKNO_MSK, inspect both PDF renders and the XLSX as client artifacts, verify client language/Yandex-only boundaries/readiness states and perform remote persistence/readback. It must not silently rerun Phase 5 or start Phase 8 economics, Phase 9 card or Phase 10 visuals.'
          new='Phase 7 materialized and validated the accepted OKNO_MSK physical package, including final XLSX package-layer language checks, both final PDF renders, corrected generator behavior, machine QA and recipient review. Phase 8 economics is now the next productization gate; Phase 9 card and Phase 10 visuals have not started.'
          s=replace_once(s,old,new,'roadmap_tail')
          write(p,s)

          # 7. Series cursor.
          p=series/'SERIES_ROADMAP.md'; s=read(p)
          s=replace_once(s,'Status: **ACTIVE PRODUCTIZATION / MK01 V1 FROZEN / MK02 PHASE 6 PACKAGE PASS / PHASE 7 QA NEXT**','Status: **ACTIVE PRODUCTIZATION / MK01 V1 FROZEN / MK02 PHASE 7 QA PASS / PHASE 8 ECONOMICS NEXT**','series_status')
          old='| MK02 | Семантическое ядро + SEO-структура + ТЗ на доработку | ядро → владельцы/структура → конкретное ТЗ | MK01 foundation + 11–14 + 18–20 | **PHASE 6 PACKAGE PASS / PHASE 7 QA NEXT** |'
          new='| MK02 | Семантическое ядро + SEO-структура + ТЗ на доработку | ядро → владельцы/структура → конкретное ТЗ | MK01 foundation + 11–14 + 18–20 | **PHASE 7 QA PASS / PHASE 8 ECONOMICS NEXT** |'
          s=replace_once(s,old,new,'series_row')
          old='MK02 Phases 0–6 are complete. Phase 5 completed the isolated OKNO_MSK rehearsal; Phase 6 owner review froze the base physical client package as one XLSX plus separate analytical and implementation-TZ PDFs. Pricing, card and visuals have not started.'
          new='MK02 Phases 0–7 are complete. Phase 5 completed the isolated OKNO_MSK rehearsal; Phase 6 froze the base physical package; Phase 7 materialized the one-XLSX/two-PDF delivery and passed client-language, machine, physical-render and recipient QA after correcting the discovered final-artifact defects. Pricing, card and visuals have not started.'
          s=replace_once(s,old,new,'series_paragraph')
          old='''MK02_METHOD_STATE = PHASE_6_CLIENT_PACKAGING_PASS\nMK02_PHYSICAL_PACKAGE = XLSX + ANALYTICAL_PDF + IMPLEMENTATION_TZ_PDF + HANDOFF_MESSAGE\nNEXT_ACTION = PHASE_7_MK02_PRODUCT_RECIPIENT_QA'''
          new='''MK02_METHOD_STATE = PHASE_7_PRODUCT_RECIPIENT_QA_PASS\nMK02_PHYSICAL_PACKAGE = XLSX + ANALYTICAL_PDF + IMPLEMENTATION_TZ_PDF + HANDOFF_MESSAGE\nNEXT_ACTION = PHASE_8_MK02_PRICE_LIMITS_ECONOMICS'''
          s=replace_once(s,old,new,'series_cursor')
          write(p,s)

          # 8. Human/owner Phase-7 receipt.
          receipt=test/'PHASE_7_PRODUCT_RECIPIENT_QA_2026-09-10.md'
          assert not receipt.exists()
          receipt.write_text('''# MK02 — PHASE 7 PRODUCT / RECIPIENT QA\n\nDate: **2026-09-10**  \nStatus: **PASS**\n\n## 1. Scope and start state\n\nPhase 7 started from the Phase-6 readback state:\n\n```text\nPHASE_7_START_HEAD = 7feeee27bf3e9702c7695c3ffca24bf8f01e0aad\nPHASE_5 = PASS\nPHASE_6 = PASS\n```\n\nPhase 7 did not rerun semantic research and made no Wordstat/Search/AI/provider calls. Phase-5 semantic, ownership, architecture and action authorities were not changed.\n\n## 2. Frozen physical package materialized\n\nThe Phase-6 package decision was materialized as exactly three client files:\n\n```text\nSEMANTIC_CORE_AND_SEO_STRUCTURE_OKNO_MSK_2026-09-10.xlsx\nRESEARCH_AND_ARCHITECTURE_REPORT_OKNO_MSK_2026-09-10.pdf\nSITE_IMPROVEMENT_TZ_OKNO_MSK_2026-09-10.pdf\n```\n\nFinal identities:\n\n| Artifact | Git blob | SHA-256 | Physical size |\n|---|---|---|---:|\n| XLSX | `b2ec26f1c932461e6a1a807e833d254225e62d65` | `be1996ad6b356187de55afeabc57ba33fd3aa77b0be0850ebe9938638944040a` | 585474 bytes |\n| Analytical PDF | `149dfe55010e099d03d048f6686775ea74dd3edd` | `851463f469480a3a977eaa327fecc475644945df7cd1a8e6ba883ee33140b2b7` | 20970 bytes |\n| Implementation-TZ PDF | `7aedd3d74cae8bed3ac2fe43aab5e716536d3d9d` | `d12b0b3bd8d70c9aff5aea793d3a94b147be1555e547c03729e4e2caa5b7dfc1` | 20316 bytes |\n\n## 3. G13 — cross-view consistency\n\nPASS. The client package preserves the accepted Phase-5 accounting:\n\n```text\nSEMANTIC UNIVERSE = 2840\nWORKING / REVIEW / EXCLUDED = 2185 / 187 / 468\nACTIVE PHRASE→PAGE MAP = 2185\nTARGET UNITS = 160\nIMPLEMENTATION PACKAGES = 47\nREADY / PENDING BUSINESS / PENDING PLACEMENT / RECHECK / MAPPING / NO CHANGE / HOLD\n= 3 / 1 / 10 / 4 / 19 / 9 / 1\n```\n\nThe final XLSX uses Russian client labels for those states; the canonical decision taxonomy remains unchanged internally.\n\n## 4. G14 — client language / report quality\n\nInitial final-file audit found a real presentation defect in the XLSX: client-visible/package-level vocabulary equivalent to `HOLD`, `CTA` and internal `MK02` table identifiers survived the earlier recipient review.\n\nThe final client copy was corrected without changing semantic/page/action truth:\n\n- `Проверить и HOLD` → `Проверить и отложено`;\n- internal `HOLD` display → `Отложено до доказательства`;\n- `CTA` → `призыв к действию`;\n- hidden `*MK02` Excel table identifiers → client-neutral `*Client`;\n- the workbook generator was corrected so the same leakage does not recur.\n\nPost-correction checks:\n\n```text\nVISIBLE / PACKAGE FORBIDDEN-TOKEN HITS = 0\nFORMULA ERROR HITS = 0\nVISIBLE SHEETS = 13 / 13\nTABLE NAMES = 13 UNIQUE / CLIENT-NEUTRAL\n```\n\nPASS.\n\n## 5. G15 — physical / recipient / persistence\n\nThe final PDFs were rendered from the exact delivery bytes and inspected page by page.\n\nAnalytical PDF:\n\n- 2/2 pages inspected;\n- an orphan section heading was found during final-byte review even though parse/hash QA had been green;\n- the source/materialization was corrected;\n- corrected 2/2 pages were rendered and re-inspected;\n- final result: no clipping, overlap, broken glyphs, unreadable tables or orphan headings.\n\nImplementation-TZ PDF:\n\n- 2/2 pages inspected;\n- no clipping, overlap, broken glyphs, unreadable tables or orphan headings.\n\nXLSX:\n\n- opens as a 13-sheet workbook;\n- sheet order/visibility and expected data ranges reconcile;\n- 47 package statuses reconcile exactly;\n- ZIP/XML package integrity passes;\n- no formula-error strings;\n- changed long-text cells retain wrapping;\n- internal table metadata is client-neutral.\n\nThe three final artifacts are persisted on the target GitHub branch with the identities above.\n\nPASS.\n\n## 6. QA-harness corrections during Phase 7\n\nTwo validation failures were caused by over-specific validator assumptions rather than client-data defects:\n\n1. the validator assumed normalized acceptance wording had to be in one hard-coded cell (`E6`);\n2. the validator assumed 12 Excel tables although the generator legitimately creates 13.\n\nBoth validator assumptions were corrected by checking semantic presence/structure rather than forcing the artifact to match an invented coordinate/count. No client data were changed to satisfy those false expectations.\n\n## 7. Failure class promoted to Level 1\n\nPhase 7 adds `PACKAGING-QA-01`: final-artifact client-language leakage / page-flow failure. The non-repeat controls require XLSX visible + raw-package inspection and PDF parse + final-byte render inspection.\n\n## 8. Provider/data boundary\n\n```text\nNEW WORDSTAT CALLS = 0\nNEW YANDEX SEARCH CALLS = 0\nNEW AI / ALICE / NEURO CALLS = 0\nGOOGLE CALLS = 0\nPHASE-5 DATA AUTHORITIES MODIFIED = 0\n```\n\n## 9. Verdict\n\n```text\nG13 = PASS\nG14 = PASS\nG15 = PASS\nPHASE 7 PRODUCT / RECIPIENT QA = PASS\nNEXT = PHASE 8 PRICE / LIMITS / ECONOMICS\n```\n''','utf-8')

          print('PHASE7_STATE_PROPAGATION_PREPARED')
          PY
      - name: Commit Phase 7 closure authorities
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/MINI_KWORKS_PRODUCTIZATION/MK02_SEMANTIC_CORE_ARCHITECTURE_DEV_TZ/ERRORS_AND_LESSONS.md \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/MINI_KWORKS_PRODUCTIZATION/MK02_SEMANTIC_CORE_ARCHITECTURE_DEV_TZ/GENERAL_RULES.md \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/MINI_KWORKS_PRODUCTIZATION/MK02_SEMANTIC_CORE_ARCHITECTURE_DEV_TZ/QA_AND_RELEASE.md \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/MINI_KWORKS_PRODUCTIZATION/MK02_SEMANTIC_CORE_ARCHITECTURE_DEV_TZ/CLIENT_HANDOFF_TEMPLATE.md \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/MINI_KWORKS_PRODUCTIZATION/MK02_SEMANTIC_CORE_ARCHITECTURE_DEV_TZ/PRODUCT_PACKAGING.md \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/MINI_KWORKS_PRODUCTIZATION/MK02_SEMANTIC_CORE_ARCHITECTURE_DEV_TZ/PRODUCT_ROADMAP.md \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/MINI_KWORKS_PRODUCTIZATION/SERIES_ROADMAP.md \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/MINI_KWORKS_PRODUCTIZATION/MK02_SEMANTIC_CORE_ARCHITECTURE_DEV_TZ/tests/OKNO_MSK/PHASE_7_PRODUCT_RECIPIENT_QA_2026-09-10.md
          git diff --cached --quiet && exit 1
          git commit -m 'docs(mk02): close phase 7 product recipient QA'
          git push
