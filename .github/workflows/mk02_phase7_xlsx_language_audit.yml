name: MK02 Phase 7 workbook generator regression fix

on:
  push:
    paths:
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/MINI_KWORKS_PRODUCTIZATION/MK02_SEMANTIC_CORE_ARCHITECTURE_DEV_TZ/tests/OKNO_MSK/.phase7_generator_fix'

permissions:
  contents: write

jobs:
  correct-generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch only client-language generation paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/MINI_KWORKS_PRODUCTIZATION/MK02_SEMANTIC_CORE_ARCHITECTURE_DEV_TZ/tests/OKNO_MSK/build_client_candidate_workbook.mjs')
          s=p.read_text('utf-8')
          def one(old,new):
              global s
              n=s.count(old)
              print('REPLACE',repr(old),'COUNT',n)
              assert n==1,(old,n)
              s=s.replace(old,new)
          one('text: "HOLD", format: { fill: "#FEE2E2", font: { color: "#991B1B", bold: true } },','text: "Отложено до доказательства", format: { fill: "#FEE2E2", font: { color: "#991B1B", bold: true } },')
          one('  HOLD: "HOLD",','  HOLD: "Отложено до доказательства",')
          n=s.count('"Проверить и HOLD"')
          print('SHEET_LABEL_REPLACEMENTS',n)
          assert n==3,n
          s=s.replace('"Проверить и HOLD"','"Проверить и отложено"')
          table_names=['AllQueries','WorkingCore','TaskGroups','PageOwnership','CurrentSite','TargetArchitecture','CurrentTargetDelta','ImplementationPackages','Clarifications','PageRelations','ReadyAcceptance','MeasurementInterface']
          for name in table_names:
              old=name+'MK02'; new=name+'Client'; n=s.count(old); print('TABLE_NAME',old,n); assert n==1,(old,n); s=s.replace(old,new)
          old='const acceptanceRows = acceptance.map((row) => [row.page_or_object, row.what_must_be_present, row.where_to_check, row.acceptance_check, row.preserve]);'
          new='const acceptanceRows = acceptance.map((row) => [row.page_or_object, clientText(row.what_must_be_present), clientText(row.where_to_check), clientText(row.acceptance_check), clientText(row.preserve)]);'
          one(old,new)
          p.write_text(s,'utf-8')
          assert 'HOLD: "HOLD"' not in s
          assert 'text: "HOLD"' not in s
          assert '"Проверить и HOLD"' not in s
          for name in table_names: assert name+'MK02' not in s
          print('GENERATOR_REGRESSION_FIX_PASS')
          PY
      - name: Commit generator correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/MINI_KWORKS_PRODUCTIZATION/MK02_SEMANTIC_CORE_ARCHITECTURE_DEV_TZ/tests/OKNO_MSK/build_client_candidate_workbook.mjs
          git diff --cached --quiet && exit 1
          git commit -m 'fix(mk02): prevent client workbook terminology regression'
          git push
