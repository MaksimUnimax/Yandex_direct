name: MK02 Phase 7 corrected analytical PDF materializer

on:
  push:
    paths:
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/MINI_KWORKS_PRODUCTIZATION/MK02_SEMANTIC_CORE_ARCHITECTURE_DEV_TZ/tests/OKNO_MSK/.phase7_correct_analytical_pdf_r3'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode bounded chunks and verify exact corrected PDF
        shell: bash
        run: |
          set -euo pipefail
          BASE='extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/MINI_KWORKS_PRODUCTIZATION/MK02_SEMANTIC_CORE_ARCHITECTURE_DEV_TZ/tests/OKNO_MSK'
          OUT="$BASE/CLIENT_DELIVERY_PHASE_7/RESEARCH_AND_ARCHITECTURE_REPORT_OKNO_MSK_2026-09-10.pdf"
          { cat "$BASE/_phase7_pdf_fix/analytic.part01"; head -c 10000 "$BASE/_phase7_pdf_fix/analytic.part02"; cat "$BASE/_phase7_pdf_fix/analytic.part03"; } | base64 -d > "$OUT"
          echo "SIZE=$(stat -c %s "$OUT")"
          echo "GIT_BLOB=$(git hash-object "$OUT")"
          echo "SHA256=$(sha256sum "$OUT" | cut -d' ' -f1)"
          test "$(stat -c %s "$OUT")" = '20970'
          test "$(git hash-object "$OUT")" = '149dfe55010e099d03d048f6686775ea74dd3edd'
          test "$(sha256sum "$OUT" | cut -d' ' -f1)" = '851463f469480a3a977eaa327fecc475644945df7cd1a8e6ba883ee33140b2b7'
      - name: Commit corrected analytical PDF
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/MINI_KWORKS_PRODUCTIZATION/MK02_SEMANTIC_CORE_ARCHITECTURE_DEV_TZ/tests/OKNO_MSK/CLIENT_DELIVERY_PHASE_7/RESEARCH_AND_ARCHITECTURE_REPORT_OKNO_MSK_2026-09-10.pdf
          git diff --cached --quiet && exit 1
          git commit -m 'fix(mk02): remove orphan heading from analytical PDF'
          git push
