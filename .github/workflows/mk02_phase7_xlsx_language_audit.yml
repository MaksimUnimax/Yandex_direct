name: MK02 Phase 7 corrected analytical PDF materializer

on:
  push:
    paths:
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/MINI_KWORKS_PRODUCTIZATION/MK02_SEMANTIC_CORE_ARCHITECTURE_DEV_TZ/tests/OKNO_MSK/.phase7_correct_analytical_pdf_r6'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode verified chunks and verify corrected PDF
        shell: bash
        run: |
          set -euo pipefail
          BASE='extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/MINI_KWORKS_PRODUCTIZATION/MK02_SEMANTIC_CORE_ARCHITECTURE_DEV_TZ/tests/OKNO_MSK'
          test "$(git hash-object "$BASE/_phase7_pdf_fix/analytic.part01")" = '35b5ed6059afc8bdd5cd6e0062d25fbd6a6e5e41'
          test "$(git hash-object "$BASE/_phase7_pdf_fix/analytic.part02a")" = '041c373312c08179a4f9f4101968b1103d4312b8'
          test "$(git hash-object "$BASE/_phase7_pdf_fix/analytic.part02b")" = '23c0e144cf9036790174ccaad4257e28b9b06996'
          test "$(git hash-object "$BASE/_phase7_pdf_fix/analytic.part03")" = '2a88df9bb3f2eb75279a1d9d6acd193f7a18b285'
          OUT="$BASE/CLIENT_DELIVERY_PHASE_7/RESEARCH_AND_ARCHITECTURE_REPORT_OKNO_MSK_2026-09-10.pdf"
          { cat "$BASE/_phase7_pdf_fix/analytic.part01"; cat "$BASE/_phase7_pdf_fix/analytic.part02a"; cat "$BASE/_phase7_pdf_fix/analytic.part02b"; cat "$BASE/_phase7_pdf_fix/analytic.part03"; } | base64 -d > "$OUT"
          test "$(stat -c %s "$OUT")" = '20970'
          test "$(git hash-object "$OUT")" = '149dfe55010e099d03d048f6686775ea74dd3edd'
          test "$(sha256sum "$OUT" | cut -d' ' -f1)" = '851463f469480a3a977eaa327fecc475644945df7cd1a8e6ba883ee33140b2b7'
          echo 'CORRECTED_ANALYTICAL_IDENTITY_PASS'
      - name: Commit corrected analytical PDF
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/MINI_KWORKS_PRODUCTIZATION/MK02_SEMANTIC_CORE_ARCHITECTURE_DEV_TZ/tests/OKNO_MSK/CLIENT_DELIVERY_PHASE_7/RESEARCH_AND_ARCHITECTURE_REPORT_OKNO_MSK_2026-09-10.pdf
          git diff --cached --quiet && exit 1
          git commit -m 'fix(mk02): remove orphan heading from analytical PDF'
          git push
