name: phase9-gsc-dev

on:
  push:
    branches:
      - phase9/google-organic-provider-research-2026-08-28
    paths:
      - .github/workflows/phase9-gsc-dev.yml
      - extension/src/manifest.json
      - extension/src/popup.html
      - extension/src/popup.js
      - extension/src/shared/google_search_console_protocol.js
      - extension/src/shared/google_search_console_runtime.js
      - extension/src/google_search_console_worker_runtime.js
      - extension/src/phase3_service_worker_bootstrap.js
      - extension/src/shared/service_registry.js
      - extension/src/shared/policy_model.js
      - extension/tests/google_search_console_contract.test.mjs
      - extension/tests/google_search_console_runtime.test.mjs
      - extension/tests/google_search_console_worker_routing.test.mjs
      - extension/tests/google_search_console_oauth_ui_routing.test.mjs
      - extension/tests/qa_browser/google_search_console_browser_runtime.mjs
      - extension/tests/direct_phase5_ui_runtime_contract.test.mjs
      - extension/tests/gensearch_search_protocol.test.mjs
      - extension/tests/search_batch_integration.test.mjs
      - extension/tests/wordstat_batch_transport.test.mjs

permissions:
  contents: read
  statuses: write

jobs:
  pure-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check extension/src/popup.js
          node --check extension/src/shared/google_search_console_protocol.js
          node --check extension/src/shared/google_search_console_runtime.js
          node --check extension/src/google_search_console_worker_runtime.js
          node --check extension/src/phase3_service_worker_bootstrap.js
          node --check extension/src/shared/service_registry.js
          node --check extension/src/shared/policy_model.js
          node --check extension/tests/google_search_console_contract.test.mjs
          node --check extension/tests/google_search_console_runtime.test.mjs
          node --check extension/tests/google_search_console_worker_routing.test.mjs
          node --check extension/tests/google_search_console_oauth_ui_routing.test.mjs
          node --check extension/tests/qa_browser/google_search_console_browser_runtime.mjs
          echo PHASE9_GSC_PURE_SYNTAX_PASS
      - name: Existing extension identity remains untouched before OAuth configuration
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('extension/src/manifest.json', 'utf8'));
          if (Object.hasOwn(m, 'key')) throw new Error('unexpected manifest.key');
          if ((m.permissions || []).includes('identity')) throw new Error('identity enabled before OAuth configuration');
          if ((m.host_permissions || []).some(x => String(x).includes('googleapis.com'))) throw new Error('Google host enabled before OAuth configuration');
          if (Object.hasOwn(m, 'oauth2')) throw new Error('oauth2 enabled before OAuth configuration');
          console.log('PHASE9_GSC_EXISTING_EXTENSION_IDENTITY_UNTOUCHED_PASS');
          NODE
      - name: GSC OAuth UI routing
        shell: bash
        run: |
          set -euo pipefail
          node --test extension/tests/google_search_console_oauth_ui_routing.test.mjs | tee /tmp/gsc-oauth-ui.log
          grep -F '# fail 0' /tmp/gsc-oauth-ui.log
          echo PHASE9_GSC_OAUTH_UI_ROUTING_PASS
      - name: GSC pure contract
        shell: bash
        run: |
          set -euo pipefail
          node --test extension/tests/google_search_console_contract.test.mjs | tee /tmp/gsc.log
          grep -F '# fail 0' /tmp/gsc.log
          echo PHASE9_GSC_PURE_CONTRACT_PASS
      - name: GSC injected runtime
        shell: bash
        run: |
          set -euo pipefail
          node --test extension/tests/google_search_console_runtime.test.mjs | tee /tmp/gsc-runtime.log
          grep -F '# fail 0' /tmp/gsc-runtime.log
          echo PHASE9_GSC_INJECTED_RUNTIME_PASS
      - name: GSC worker routing
        shell: bash
        run: |
          set -euo pipefail
          node --test extension/tests/google_search_console_worker_routing.test.mjs | tee /tmp/gsc-worker.log
          grep -F '# fail 0' /tmp/gsc-worker.log
          echo PHASE9_GSC_WORKER_ROUTING_PASS
      - name: Prior-service focused regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test extension/tests/direct_phase5_ui_runtime_contract.test.mjs extension/tests/gensearch_search_protocol.test.mjs extension/tests/phase5_prior_service_compatibility.test.mjs | tee /tmp/prior.log
          grep -F '# fail 0' /tmp/prior.log
          echo PHASE9_GSC_PRIOR_SERVICE_REGRESSION_PASS
      - name: Complete Node regression suite
        shell: bash
        run: |
          set -euo pipefail
          node --test extension/tests/*.test.mjs | tee /tmp/all-node.log
          grep -F '# fail 0' /tmp/all-node.log
          echo PHASE9_GSC_COMPLETE_NODE_REGRESSION_PASS
      - name: Provider traffic assertion
        run: |
          echo PHASE9_GSC_REAL_GOOGLE_REQUESTS=0
          echo PHASE9_GSC_REAL_YANDEX_REQUESTS=0

  controlled-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pre-browser syntax and OAuth preflight
        shell: bash
        run: |
          set -euo pipefail
          node --check extension/src/popup.js
          node --check extension/tests/qa_browser/google_search_console_browser_runtime.mjs
          node --test extension/tests/google_search_console_oauth_ui_routing.test.mjs
          find extension/src -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/p9-gsc-product-before.sha256
          echo PHASE9_GSC_PRE_BROWSER_PASS
      - name: Install Puppeteer Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false puppeteer@24
          npx puppeteer browsers install chrome
          command -v xvfb-run
      - name: Run controlled installed extension GSC runtime
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a node extension/tests/qa_browser/google_search_console_browser_runtime.mjs | tee /tmp/p9-gsc-browser.log
          for marker in \
            P9_GSC_BROWSER_EXISTING_IDENTITY_UNTOUCHED_PASS \
            P9_GSC_BROWSER_BOOTSTRAP_ROUTE_PASS \
            P9_GSC_BROWSER_LIST_SITES_ONE_REQUEST_PASS \
            P9_GSC_BROWSER_SEARCH_ANALYTICS_ONE_REQUEST_PASS \
            P9_GSC_BROWSER_AUTORUN_NO_REQUEST_PASS \
            P9_GSC_BROWSER_TOKEN_REDACTION_PASS \
            P9_GSC_BROWSER_REAL_GOOGLE_REQUESTS=0 \
            P9_GSC_BROWSER_REAL_YANDEX_REQUESTS=0 \
            PHASE9_GSC_CONTROLLED_BROWSER_PASS; do
            grep -F "$marker" /tmp/p9-gsc-browser.log
          done
          if grep -F 'browser-gsc-secret' /tmp/p9-gsc-browser.log; then
            echo PHASE9_GSC_BROWSER_TOKEN_LOG_LEAK_FAIL
            exit 1
          fi
          echo PHASE9_GSC_CONTROLLED_BROWSER_GATE_PASS
      - name: Post-browser product immutability
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find extension/src -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/p9-gsc-product-after.sha256
          cmp /tmp/p9-gsc-product-before.sha256 /tmp/p9-gsc-product-after.sha256
          echo PHASE9_GSC_POST_BROWSER_PRODUCT_IDENTICAL

  package-extension:
    needs:
      - pure-contract
      - controlled-browser
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify pre-OAuth production manifest
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('extension/src/manifest.json', 'utf8'));
          if (Object.hasOwn(m, 'key')) throw new Error('unexpected manifest.key');
          if ((m.permissions || []).includes('identity')) throw new Error('unexpected identity permission');
          if ((m.host_permissions || []).some(x => String(x).includes('googleapis.com'))) throw new Error('unexpected Google host permission');
          if (Object.hasOwn(m, 'oauth2')) throw new Error('unexpected oauth2 config');
          console.log('PHASE9_GSC_PRE_OAUTH_MANIFEST_PASS');
          NODE
      - name: Build pre-OAuth candidate ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:12}"
          ZIP_NAME="YMB_PHASE9_GSC_PRE_OAUTH_${SHORT_SHA}.zip"
          rm -f "/tmp/${ZIP_NAME}" /tmp/phase9-gsc-pre-oauth-metadata.txt
          (cd extension/src && zip -X -q -r "/tmp/${ZIP_NAME}" .)
          test -s "/tmp/${ZIP_NAME}"
          ZIP_SHA256="$(sha256sum "/tmp/${ZIP_NAME}" | awk '{print $1}')"
          PRODUCT_FILES="$(find extension/src -type f | wc -l | tr -d ' ')"
          cat > /tmp/phase9-gsc-pre-oauth-metadata.txt <<EOF
          PHASE9_GSC_PRE_OAUTH_HEAD=${GITHUB_SHA}
          PHASE9_GSC_PRE_OAUTH_ZIP=${ZIP_NAME}
          PHASE9_GSC_PRE_OAUTH_ZIP_SHA256=${ZIP_SHA256}
          PHASE9_GSC_PRE_OAUTH_PRODUCT_FILES=${PRODUCT_FILES}
          PHASE9_GSC_PRE_OAUTH_MANIFEST_AT_ROOT=true
          PHASE9_GSC_PRE_OAUTH_MANIFEST_KEY=false
          PHASE9_GSC_PRE_OAUTH_REAL_GOOGLE_REQUESTS=0
          PHASE9_GSC_PRE_OAUTH_REAL_YANDEX_REQUESTS=0
          EOF
          cat /tmp/phase9-gsc-pre-oauth-metadata.txt
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo PHASE9_GSC_PRE_OAUTH_PACKAGE_PASS
      - uses: actions/upload-artifact@v4
        with:
          name: phase9-gsc-pre-oauth-${{ github.sha }}
          path: |
            /tmp/YMB_PHASE9_GSC_PRE_OAUTH_*.zip
            /tmp/phase9-gsc-pre-oauth-metadata.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish-status:
    if: always()
    needs:
      - pure-contract
      - controlled-browser
      - package-extension
    runs-on: ubuntu-24.04
    steps:
      - name: Publish phase9 GSC gate status
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          PURE_RESULT: ${{ needs.pure-contract.result }}
          BROWSER_RESULT: ${{ needs.controlled-browser.result }}
          PACKAGE_RESULT: ${{ needs.package-extension.result }}
        shell: bash
        run: |
          set -euo pipefail
          state=success
          if [[ "$PURE_RESULT" != "success" || "$BROWSER_RESULT" != "success" || "$PACKAGE_RESULT" != "success" ]]; then
            state=failure
          fi
          description="pure=${PURE_RESULT}; browser=${BROWSER_RESULT}; package=${PACKAGE_RESULT}"
          target_url="https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}"
          payload="$(jq -n --arg state "$state" --arg context 'phase9-gsc-dev/gate' --arg description "$description" --arg target_url "$target_url" '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/statuses/${SHA}" \
            -d "$payload"
          echo "PHASE9_GSC_COMMIT_STATUS=${state}"
          [[ "$state" == "success" ]]
