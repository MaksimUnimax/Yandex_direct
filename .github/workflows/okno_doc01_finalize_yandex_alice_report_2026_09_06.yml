name: OKNO document 01 finalize Yandex Alice owner report

on:
  push:
    branches:
      - roadmap/kwork-productization-2026-08-28
    paths:
      - extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/.doc01_gensearch_owner_rebuild/FINALIZE

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: roadmap/kwork-productization-2026-08-28
          fetch-depth: 0

      - name: Synchronize state manifest cursor and readback
        shell: bash
        run: |
          set -euo pipefail
          JOB='extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK'
          RELEASE="$JOB/OKNO_MSK_RESEARCH_RELEASE_CORRECTED_2026-09-05"
          export JOB RELEASE
          python - <<'PY'
          from pathlib import Path
          import json, hashlib, subprocess, os
          job=Path(os.environ['JOB']); rel=Path(os.environ['RELEASE'])
          md=rel/'sources/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-05.md'
          docx=rel/'editable/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-05.docx'
          pdf=rel/'01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-05.pdf'
          qa_path=job/'RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_01_OWNER_REPORT_QA_2026-09-06.json'
          qa=json.loads(qa_path.read_text(encoding='utf-8'))
          assert qa['status']=='PASS' and all(qa['checks'].values())
          assert qa['counts']['pdf_pages']==12
          assert qa['counts']['generative_comparison_cases']==8
          assert qa['counts']['priority_recommendations']==7
          assert qa['counts']['demand_groups']==21
          assert qa['counts']['ordinary_yandex_observations']==75
          assert qa['counts']['research_result_rows']==34
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          def sz(p): return p.stat().st_size
          assert h(md)==qa['sha256']['md']; assert h(docx)==qa['sha256']['docx']; assert h(pdf)==qa['sha256']['pdf']
          material=subprocess.check_output(['git','log','-1','--format=%H','--',str(pdf)],text=True).strip()
          checks=len(qa['checks']); pages=qa['counts']['pdf_pages']

          state_path=job/'RESEARCH_REPORT_REBUILD_CURRENT_STATE_POST_RELEASE_2026-09-05.json'
          state=json.loads(state_path.read_text(encoding='utf-8'))
          state['status']='STAGE_0_TO_15_HISTORICALLY_COMPLETE__DOCUMENT_01_YANDEX_GENSEARCH_ALICE_AI_OWNER_REPORT_ANALYST_RECHECK_PASS__OWNER_REVIEW_PENDING'
          state['reviewed_release_files']['01_client_research_report']='ANALYST_RECHECK_PASS__YANDEX_GENSEARCH_ALICE_AI_OWNER_REPORT__OWNER_REVIEW_PENDING'
          state['next_action']='OWNER_REVIEW_CORRECTED_DOCUMENT_01'
          state['correction_materialization_status']='DOCUMENT_01_YANDEX_GENSEARCH_ALICE_AI_OWNER_REPORT_ANALYST_RECHECK_PASS__OWNER_REVIEW_PENDING__DOCUMENT_02_03_NOT_ADVANCED'
          c=state['corrected_recipient_release']
          c.update(analyst_recipient_qa='DOCUMENT_01_YANDEX_GENSEARCH_ALICE_AI_OWNER_REPORT_PASS',document_01_analyst_recheck='PASS',document_01_owner_review='PENDING__AWAITING_OWNER_RECHECK',document_01_pdf_pages=pages,document_01_pdf_size_bytes=sz(pdf),document_01_pdf_sha256=h(pdf),document_01_docx_size_bytes=sz(docx),document_01_docx_sha256=h(docx),document_01_source_size_bytes=sz(md),document_01_source_sha256=h(md),document_01_deterministic_qa_checks=checks,document_01_owner_value_qa_checks=checks,document_01_ready_recommendations_with_why=7,document_01_generative_search_comparison_cases=8,document_01_ordinary_yandex_observations=75,document_01_client_forbidden_internal_latin=0,document_01_source_native_brands_preserved=True,document_01_verbatim_brand_query_spelling_preserved=True,document_01_internal_process_narrative=0,current_document='01',document_02_owner_review='PENDING',document_03_owner_review='PENDING',final_owner_recipient_acceptance='OPEN',owner_recheck='ACTIVE__DOCUMENT_01_YANDEX_GENSEARCH_ALICE_AI_OWNER_REPORT__OWNER_REVIEW_PENDING',document_01_latest_material_correction_commit_sha=material,document_01_latest_github_content_readback='PASS__MATERIAL_COMMIT_AND_ARTIFACT_HASHES_VERIFIED')
          state_path.write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          man_path=rel/'RELEASE_MANIFEST_2026-09-05.json'; man=json.loads(man_path.read_text(encoding='utf-8'))
          man['status']='DOCUMENT_01_YANDEX_GENSEARCH_ALICE_AI_OWNER_REPORT_ANALYST_RECHECK_PASS__OWNER_REVIEW_PENDING__DOCUMENT_02_03_NOT_ADVANCED'
          for a in man['recipient_artifacts']:
            if a.get('variant')=='01': a.update(size_bytes=sz(pdf),sha256=h(pdf),pages=pages,recipient_contract='NORMAL_CLIENT_UNDERSTANDS_FULL_RESEARCH_AND_ORDINARY_VS_GENERATIVE_YANDEX_VALUE_FROM_DOCUMENT_01_ALONE')
          for a in man['editable_and_source_files']:
            if a['path'].startswith('editable/01_'): a.update(size_bytes=sz(docx),sha256=h(docx))
            if a['path'].startswith('sources/01_'): a.update(size_bytes=sz(md),sha256=h(md))
          q=man['qa']; q.update(authority='../RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_01_OWNER_REPORT_QA_2026-09-06.json',analyst_recipient_qa='DOCUMENT_01_YANDEX_GENSEARCH_ALICE_AI_OWNER_REPORT_PASS',document_01='ANALYST_RECHECK_PASS__OWNER_REVIEW_PENDING',document_01_checks=checks,document_01_search_observations='75_OF_75_PASS',document_01_ai_causal_cases='8_OF_8_PASS__CLIENT_VISIBLE_ORDINARY_VS_GENERATIVE_YANDEX_COMPARISON',document_01_physical_pdf=f'{pages}_OF_{pages}_PAGES_PASS',document_01_owner_review='PENDING__AWAITING_OWNER_RECHECK',owner_recheck='ACTIVE__DOCUMENT_01_YANDEX_GENSEARCH_ALICE_AI_OWNER_REPORT__OWNER_REVIEW_PENDING',next_action='OWNER_REVIEW_CORRECTED_DOCUMENT_01',document_01_ready_recommendations_with_why=7,document_01_generative_search_comparison_cases=8,document_01_forbidden_internal_latin=0,document_01_source_native_brands_preserved=True,document_01_verbatim_brand_query_spelling_preserved=True)
          man_path.write_text(json.dumps(man,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          cur_path=job/'EXECUTION_CURSOR.json'; cur=json.loads(cur_path.read_text(encoding='utf-8'))
          cur['execution_protocol_status']='RESEARCH_REBUILD_STAGE_0_TO_15_COMPLETE__DOCUMENT_01_YANDEX_GENSEARCH_ALICE_AI_OWNER_REPORT_ANALYST_RECHECK_PASS__OWNER_REVIEW_PENDING'
          cur['status']='RESEARCH_REBUILD_COMPLETE__DOCUMENT_01_YANDEX_GENSEARCH_ALICE_AI_OWNER_REPORT_ANALYST_RECHECK_PASS__OWNER_REVIEW_PENDING'; cur['next_action']='OWNER_REVIEW_CORRECTED_DOCUMENT_01'
          p=cur['post_release_correction_2026_09_05']; p['status']='COMPLETE__DOCUMENT_01_YANDEX_GENSEARCH_ALICE_AI_OWNER_REPORT_ANALYST_RECHECK_PASS__OWNER_REVIEW_PENDING__DOCUMENT_02_03_NOT_ADVANCED'; p['owner_recheck']='ACTIVE__DOCUMENT_01_YANDEX_GENSEARCH_ALICE_AI_OWNER_REPORT__OWNER_REVIEW_PENDING'
          r=cur['document_01_owner_recheck_2026_09_05']; r.update(status='ANALYST_RECHECK_PASS__YANDEX_GENSEARCH_ALICE_AI_OWNER_REPORT__OWNER_REVIEW_PENDING',document_01_analyst_recheck='PASS',document_01_owner_review='PENDING__AWAITING_OWNER_RECHECK',next_action='OWNER_REVIEW_CORRECTED_DOCUMENT_01',physical_pdf_qa=f'PASS__{pages}_OF_{pages}_PAGES',deterministic_qa_checks=checks,search_observations_checked=75,ai_causal_cases_checked=8,action_rows_checked=34,ready_recommendations_with_why=7,owner_value_framing_forbidden_hits=0,negative_pseudo_actions_in_priority=0,forbidden_internal_latin=0,source_native_brands_preserved=True,verbatim_brand_query_spelling_preserved=True,internal_process_narrative=0,latest_material_correction_commit_sha=material,latest_github_content_readback='PASS__MATERIAL_COMMIT_AND_ARTIFACT_HASHES_VERIFIED')
          cur_path.write_text(json.dumps(cur,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          rb=job/'RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_01_YANDEX_GENSEARCH_OWNER_REPORT_READBACK_2026-09-06.md'
          rb.write_text(f'''# OKNO_MSK — readback документа №01 после клиентской пересборки\n\nДата: 2026-09-06\n\nМатериальный commit: `{material}`\n\nСтатус: `ANALYST_RECHECK_PASS__OWNER_REVIEW_PENDING`\n\n- PDF: {pages} страниц\n- исходник SHA-256: `{h(md)}`\n- DOCX SHA-256: `{h(docx)}`\n- PDF SHA-256: `{h(pdf)}`\n- сравнения обычного и генеративного поиска Яндекса: 8/8\n- рекомендации с явным объяснением причины: 7/7\n- группы спроса: 21/21\n- наблюдения обычного Яндекса: 75/75\n- сводные результаты исследования: 34/34\n- исходные написания брендов и запросов сохранены: PASS\n- внутренняя производственная лексика в клиентском тексте: 0\n- новых вызовов поисковых провайдеров при пересборке: 0\n- документ №02: не начат\n- документ №03: не начат\n\nВ клиентском отчёте официальный генеративный поиск Яндекса на базе технологий Алисы показан как один из двух центральных поисковых источников исследования вместе с обычной выдачей Яндекса. Для восьми важных тем показана цепочка: обычная выдача → генеративный ответ → значение для сайта.\n''',encoding='utf-8')
          PY

      - name: Remove temporary materializers and commit final state
        shell: bash
        run: |
          set -euo pipefail
          JOB='extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK'
          RELEASE="$JOB/OKNO_MSK_RESEARCH_RELEASE_CORRECTED_2026-09-05"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$JOB/RESEARCH_REPORT_REBUILD_CURRENT_STATE_POST_RELEASE_2026-09-05.json" "$JOB/EXECUTION_CURSOR.json" "$JOB/RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_01_YANDEX_GENSEARCH_OWNER_REPORT_READBACK_2026-09-06.md" "$RELEASE/RELEASE_MANIFEST_2026-09-05.json"
          git rm -r "$JOB/.doc01_gensearch_owner_rebuild"
          git rm '.github/workflows/okno_doc01_gensearch_owner_rebuild_2026_09_06.yml' '.github/workflows/okno_doc01_gensearch_owner_rebuild_v2_2026_09_06.yml' '.github/workflows/okno_doc01_gensearch_owner_rebuild_v3_2026_09_06.yml' '.github/workflows/okno_doc01_finalize_yandex_alice_report_2026_09_06.yml'
          git commit -m 'docs(okno-msk): seal document 01 Yandex Alice owner recheck state'
          git push origin HEAD:roadmap/kwork-productization-2026-08-28
