name: phase2-diagnostics-recovery
on:
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/phase2-recovery-work-2026-08-20
      - name: Restore diagnostics worker and popup controls
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          worker = Path('extension/src/service_worker.js')
          s = worker.read_text(encoding='utf-8')
          anchor = 'function storageRemove(keys) { return chrome.storage.local.remove(keys); }\n'
          replacement = anchor + 'function redactSensitive(value) { return JSON.parse(JSON.stringify(value, (key, item) => /api.?key|authorization|token|secret/i.test(key) ? "[REDACTED]" : item)); }\n'
          assert anchor in s and 'function redactSensitive(value)' not in s
          s = s.replace(anchor, replacement, 1)
          old = '  const safe = JSON.parse(JSON.stringify(detail, (key, value) => /api.?key|authorization|token|secret/i.test(key) ? "[REDACTED]" : value));'
          assert old in s
          s = s.replace(old, '  const safe = redactSensitive(detail);', 1)
          anchor = '  await storageSet({ [KEYS.DIAGNOSTICS]: current.slice(-200) });\n}\n'
          insert = anchor + 'async function getDiagnostics() { const data = await storageGet(KEYS.DIAGNOSTICS); const records = Array.isArray(data[KEYS.DIAGNOSTICS]) ? data[KEYS.DIAGNOSTICS] : []; return redactSensitive(records); }\nasync function clearDiagnostics() { await storageSet({ [KEYS.DIAGNOSTICS]: [] }); return []; }\n'
          assert anchor in s and 'async function getDiagnostics()' not in s
          s = s.replace(anchor, insert, 1)
          old = '    case "WS_MANUAL_DELIVERY_COMPLETE": case "WS_AUTO_DELIVERY_COMPLETE": return completeDelivery(message);\n    case "WS_SAVE_SEND_BUTTON_PROFILE":'
          new = '    case "WS_MANUAL_DELIVERY_COMPLETE": case "WS_AUTO_DELIVERY_COMPLETE": return completeDelivery(message);\n    case "WS_GET_DIAGNOSTICS": return { ok: true, diagnostics: await getDiagnostics() };\n    case "WS_CLEAR_DIAGNOSTICS": return { ok: true, diagnostics: await clearDiagnostics() };\n    case "WS_SAVE_SEND_BUTTON_PROFILE":'
          assert old in s
          s = s.replace(old, new, 1)
          worker.write_text(s, encoding='utf-8')

          html = Path('extension/src/popup.html')
          h = html.read_text(encoding='utf-8')
          anchor = '''    <section>\n      <div class="actions">\n        <button id="saveSettings" class="primary" type="button">Сохранить</button>'''
          section = '''    <section>\n      <h2>Диагностика</h2>\n      <label>Показывать\n        <select id="diagnosticsFilter">\n          <option value="all">Все записи</option>\n          <option value="error">Только ошибки</option>\n          <option value="current">Текущий диалог</option>\n        </select>\n      </label>\n      <textarea id="diagnosticsText" rows="7" readonly spellcheck="false" placeholder="Диагностика пока пуста"></textarea>\n      <div class="actions">\n        <button id="copyDiagnostics" type="button">Копировать диагностику</button>\n        <button id="clearDiagnostics" type="button">Очистить диагностику</button>\n      </div>\n      <p class="warning">API key, Authorization, token и secret скрываются перед показом.</p>\n    </section>\n\n''' + anchor
          assert anchor in h and 'id="diagnosticsFilter"' not in h
          h = h.replace(anchor, section, 1)
          html.write_text(h, encoding='utf-8')

          popup = Path('extension/src/popup.js')
          p = popup.read_text(encoding='utf-8')
          anchor = '  let rendering = false;\n'
          assert anchor in p and 'let lastDiagnostics' not in p
          p = p.replace(anchor, anchor + '  let lastDiagnostics = [];\n', 1)
          anchor = '  async function refresh() {\n'
          helpers = '''  function visibleDiagnostics() {\n    const filter = $("diagnosticsFilter")?.value || "all";\n    if (filter === "error") return lastDiagnostics.filter((record) => String(record?.level || "").toLowerCase() === "error");\n    if (filter === "current") return lastDiagnostics.filter((record) => String(record?.conversation_key || record?.detail?.conversation_key || "") === context.conversation_key);\n    return lastDiagnostics;\n  }\n\n  function renderDiagnostics() {\n    const node = $("diagnosticsText");\n    if (!node) return;\n    const visible = visibleDiagnostics();\n    node.value = visible.length ? JSON.stringify(visible, null, 2) : "";\n  }\n\n  async function loadDiagnostics() {\n    const response = await runtimeSend({ type: "WS_GET_DIAGNOSTICS" });\n    if (response?.ok === false) throw new Error(response?.error || response?.code || "Не удалось прочитать диагностику.");\n    lastDiagnostics = Array.isArray(response?.diagnostics) ? response.diagnostics : [];\n    renderDiagnostics();\n    return lastDiagnostics;\n  }\n\n'''
          assert anchor in p and 'function visibleDiagnostics()' not in p
          p = p.replace(anchor, helpers + anchor, 1)
          old = '    renderState(response.state);\n    return response.state;'
          new = '    renderState(response.state);\n    await loadDiagnostics();\n    return response.state;'
          assert old in p
          p = p.replace(old, new, 1)
          anchor = '  $("exportSettings").addEventListener("click", () => withButton($("exportSettings"), async () => {\n'
          handlers = '''  $("diagnosticsFilter").addEventListener("change", () => renderDiagnostics());\n\n  $("copyDiagnostics").addEventListener("click", () => withButton($("copyDiagnostics"), async () => {\n    const text = $("diagnosticsText").value;\n    if (!text) throw new Error("Нет диагностики для копирования.");\n    if (!navigator?.clipboard?.writeText) throw new Error("Буфер обмена недоступен.");\n    await navigator.clipboard.writeText(text);\n    showStatus("Диагностика скопирована.", "ok");\n  }));\n\n  $("clearDiagnostics").addEventListener("click", () => withButton($("clearDiagnostics"), async () => {\n    const response = await runtimeSend({ type: "WS_CLEAR_DIAGNOSTICS" });\n    if (!response?.ok) throw new Error(response?.error || response?.code || "Не удалось очистить диагностику.");\n    lastDiagnostics = [];\n    renderDiagnostics();\n    showStatus("Диагностика очищена.", "ok");\n  }));\n\n'''
          assert anchor in p and '$("copyDiagnostics").addEventListener' not in p
          p = p.replace(anchor, handlers + anchor, 1)
          old = '      wordstatPolicyFromForm, searchPolicyFromForm, reportPrefixFromForm, isActiveRun\n'
          new = '      wordstatPolicyFromForm, searchPolicyFromForm, reportPrefixFromForm, isActiveRun,\n      loadDiagnostics, renderDiagnostics, visibleDiagnostics\n'
          assert old in p
          p = p.replace(old, new, 1)
          popup.write_text(p, encoding='utf-8')
          PY
          node --test extension/tests/diagnostics_popup_recovery.test.mjs
          node --check extension/src/service_worker.js
          node --check extension/src/popup.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/src/service_worker.js extension/src/popup.html extension/src/popup.js extension/tests/diagnostics_popup_recovery.test.mjs
          git commit -m 'fix: restore diagnostics controls and redaction'
          git push origin HEAD:dev/phase2-recovery-work-2026-08-20
