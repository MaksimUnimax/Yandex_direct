name: KW001 OKNO Report01 Step5A Competitor Amendment

on:
  push:
    branches:
      - roadmap/kwork-productization-2026-08-28
    paths:
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/REPORT01_STEP5A_COMPETITOR_AMENDMENT_TRIGGER.txt'

permissions:
  contents: write
  actions: read

concurrency:
  group: kw001-okno-report01-step5a-competitor-amendment
  cancel-in-progress: false

jobs:
  build-qa-persist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout live shared branch
        uses: actions/checkout@v4
        with:
          ref: roadmap/kwork-productization-2026-08-28
          fetch-depth: 0

      - name: Install document QA dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer fonts-liberation poppler-utils
          python -m pip install --disable-pip-version-check --quiet python-docx pypdf pillow

      - name: Record protected identities
        run: |
          git rev-parse HEAD > /tmp/start_head
          git rev-parse HEAD:extension/docs/kwork/KW002_SEMANTIC_CORE_FROM_SCRATCH > /tmp/kw002_before
          git rev-parse HEAD:extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/OKNO_MSK_RESEARCH_RELEASE_CORRECTED_2026-09-05 > /tmp/old_release_before
          git rev-parse HEAD:extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STAGE_05 > /tmp/stage5_before

      - name: Amend source and regenerate Document 01
        run: |
          python extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/document01_step5a_competitor_amendment.py

      - name: Render PDF for visual QA artifact
        run: |
          REL=extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/OKNO_MSK_RESEARCH_RELEASE_STEP05A_PROPAGATED_2026-09-09
          OUT=/tmp/report01_step5a_visual
          rm -rf "$OUT" && mkdir -p "$OUT"
          pdftoppm -png -r 150 "$REL/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-09.pdf" "$OUT/page"
          cp "$REL/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-09.pdf" "$OUT/"
          cp "$REL/editable/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-09.docx" "$OUT/"
          cp "$REL/sources/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-09.md" "$OUT/"
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageStat
          pages=sorted(Path('/tmp/report01_step5a_visual').glob('page-*.png'))
          assert pages
          for p in pages:
              im=Image.open(p).convert('L')
              st=ImageStat.Stat(im)
              assert st.extrema[0][0] < 245, (p,'apparently blank')
          print('RENDER_NONBLANK_PASS',len(pages))
          PY

      - name: Guard changed paths
        run: |
          ROOT=extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK
          BAD=$(git status --short | awk '{print $2}' | grep -vE "^${ROOT}/(OKNO_MSK_RESEARCH_RELEASE_STEP05A_PROPAGATED_2026-09-09/(sources/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-09.md|editable/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-09.docx|01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-09.pdf|RELEASE_MANIFEST_2026-09-09.json)|DOCUMENT_01_STEP05A_COMPETITOR_AMENDMENT_QA_2026-09-09.json|DOCUMENT_01_STEP05A_COMPETITOR_AMENDMENT_2026-09-09.md)$" || true)
          if [ -n "$BAD" ]; then echo "Unexpected changed paths:"; echo "$BAD"; exit 1; fi

      - name: Upload visual QA bundle
        uses: actions/upload-artifact@v4
        with:
          name: okno-msk-report01-step5a-competitor-amendment-visual
          path: /tmp/report01_step5a_visual
          if-no-files-found: error
          retention-days: 7

      - name: Commit and push amended Report 01
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          ROOT=extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK
          REL="$ROOT/OKNO_MSK_RESEARCH_RELEASE_STEP05A_PROPAGATED_2026-09-09"
          git add "$REL/sources/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-09.md"
          git add "$REL/editable/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-09.docx"
          git add "$REL/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-09.pdf"
          git add "$REL/RELEASE_MANIFEST_2026-09-09.json"
          git add "$ROOT/DOCUMENT_01_STEP05A_COMPETITOR_AMENDMENT_QA_2026-09-09.json"
          git add "$ROOT/DOCUMENT_01_STEP05A_COMPETITOR_AMENDMENT_2026-09-09.md"
          git commit -m "docs(okno-msk): expand report01 with competitor analysis [skip ci]"
          git push origin HEAD:roadmap/kwork-productization-2026-08-28
          git rev-parse HEAD > /tmp/material_head

      - name: Remote readback and protected-tree guard
        run: |
          git fetch origin roadmap/kwork-productization-2026-08-28
          test "$(git rev-parse origin/roadmap/kwork-productization-2026-08-28)" = "$(cat /tmp/material_head)"
          test "$(git rev-parse HEAD:extension/docs/kwork/KW002_SEMANTIC_CORE_FROM_SCRATCH)" = "$(cat /tmp/kw002_before)"
          test "$(git rev-parse HEAD:extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/OKNO_MSK_RESEARCH_RELEASE_CORRECTED_2026-09-05)" = "$(cat /tmp/old_release_before)"
          test "$(git rev-parse HEAD:extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STAGE_05)" = "$(cat /tmp/stage5_before)"
          echo "START_HEAD=$(cat /tmp/start_head)"
          echo "MATERIAL_HEAD=$(cat /tmp/material_head)"
          echo "REMOTE_READBACK_PASS"
