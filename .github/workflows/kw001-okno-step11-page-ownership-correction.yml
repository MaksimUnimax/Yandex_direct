name: KW001 OKNO Step11 Page Ownership Correction

on:
  push:
    branches:
      - roadmap/kwork-productization-2026-08-28
    paths:
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_11_CORRECTION_RUN_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kw001-okno-step11-page-ownership-correction
  cancel-in-progress: false

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: roadmap/kwork-productization-2026-08-28
          fetch-depth: 0

      - name: Patch finalizer manifest-authority scope
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/finalize_step11_canonical_docs.py')
          s = p.read_text(encoding='utf-8')
          old = '''# Add current Step10/11 authorities if not already present.\nauthority_anchor = "STEP_09_SEARCH_ACCEPTANCE_2026-08-29.md\\n"\nauthority_add = """STEP_10_FRESH_R1_ASSIGNMENTS_FINAL.tsv\nSTEP_10_FRESH_R1_CLUSTER_SUMMARY_FINAL.tsv\n../../STEP_11_PAGE_OWNERSHIP_METHOD.md\nSTEP_11_POST_AUDIT_CORRECTIONS.tsv\nSTEP_11_PHRASE_PAGE_MAP.tsv\nSTEP_11_EFFECTIVE_CLUSTER_SUMMARY.tsv\nSTEP_11_PAGE_OWNERSHIP_CORRECTED.tsv\nSTEP_11_WEAK_OWNERSHIP_REAUDIT.md\nSTEP_11_REPORT.md\nSTEP_11_QA.json\n"""\nif "STEP_11_PHRASE_PAGE_MAP.tsv" not in manifest:\n    manifest = replace_once(manifest, authority_anchor, authority_anchor + authority_add, "manifest authority insertion")\n'''
          new = '''# Add current Step10/11 authorities inside the explicit Current job authorities fence.\nauthority_add = """STEP_10_FRESH_R1_ASSIGNMENTS_FINAL.tsv\nSTEP_10_FRESH_R1_CLUSTER_SUMMARY_FINAL.tsv\n../../STEP_11_PAGE_OWNERSHIP_METHOD.md\nSTEP_11_POST_AUDIT_CORRECTIONS.tsv\nSTEP_11_PHRASE_PAGE_MAP.tsv\nSTEP_11_EFFECTIVE_CLUSTER_SUMMARY.tsv\nSTEP_11_PAGE_OWNERSHIP_CORRECTED.tsv\nSTEP_11_WEAK_OWNERSHIP_REAUDIT.md\nSTEP_11_REPORT.md\nSTEP_11_QA.json\n"""\nif "STEP_11_PHRASE_PAGE_MAP.tsv" not in manifest:\n    auth_heading = manifest.index("Current job authorities:")\n    auth_fence_start = manifest.index("```text", auth_heading)\n    auth_fence_end = manifest.index("```", auth_fence_start + len("```text"))\n    manifest = manifest[:auth_fence_end] + authority_add + manifest[auth_fence_end:]\n'''
          if new not in s:
              if old not in s:
                  raise RuntimeError('expected old finalizer authority block missing')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          print('STEP11_FINALIZER_AUTHORITY_SCOPE_PATCHED')
          PY

      - name: Finalize canonical Step 11 rules and state
        run: |
          python extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/finalize_step11_canonical_docs.py

      - name: Rebuild corrected Step 11 artifacts
        run: |
          python extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/step11_correct_page_ownership.py

      - name: Independent final QA
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path('extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK')
          qa = json.loads((root/'STEP_11_QA.json').read_text(encoding='utf-8'))
          with (root/'STEP_11_PHRASE_PAGE_MAP.tsv').open(encoding='utf-8', newline='') as f:
              rows = list(csv.DictReader(f, delimiter='\t'))
          report = (root/'STEP_11_REPORT.md').read_text(encoding='utf-8')
          rules = Path('extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/STEP_RULES_INDEX.md').read_text(encoding='utf-8')
          flow = (root/'JOB_FLOW.md').read_text(encoding='utf-8')
          manifest = (root/'JOB_MANIFEST.md').read_text(encoding='utf-8')
          assert qa['status'] == 'PASS_AFTER_EXTERNAL_METHOD_AUDIT_AND_PHRASE_LEVEL_CORRECTION'
          assert qa['step11_complete'] is True
          assert qa['step12_executed'] is False
          assert len(rows) == 2332 == qa['phrase_page_map_rows']
          assert len({r['phrase'] for r in rows}) == 2332
          assert sum(r['effective_assignment_status']=='ASSIGNED' for r in rows) == 2313
          assert sum(r['effective_assignment_status']=='SEARCH_REQUIRED' for r in rows) == 19
          assert sum(bool(r['target_url']) for r in rows if r['effective_assignment_status']=='SEARCH_REQUIRED') == 0
          assert '{len(search_required)}' not in report
          assert 'APPROVED / ACTIVE AFTER EXTERNAL METHOD AUDIT + PHRASE-LEVEL CORRECTION' in rules
          assert 'PHRASE_PAGE_MAP_ROWS = 2332' in flow
          assert 'current_major_step = STEP_11_COMPLETE_AFTER_EXTERNAL_METHOD_AUDIT_AND_PHRASE_LEVEL_CORRECTION' in manifest
          print('STEP11_FINAL_INDEPENDENT_QA_PASS')
          PY

      - name: Show corrected QA
        run: |
          cat extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_11_QA.json

      - name: Commit final corrected Step 11 state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE
          if git diff --cached --quiet; then
            echo "No generated/finalization changes"
          else
            git commit -m "step11: finalize corrected page ownership state [skip ci]"
            git push origin HEAD:roadmap/kwork-productization-2026-08-28
          fi
