name: KW001 OKNO Step11 Page Ownership Correction

on:
  push:
    branches:
      - roadmap/kwork-productization-2026-08-28
    paths:
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_11_CORRECTION_RUN_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kw001-okno-step11-page-ownership-correction
  cancel-in-progress: false

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: roadmap/kwork-productization-2026-08-28
          fetch-depth: 0

      - name: Build corrected Step 11 artifacts
        run: |
          python extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/step11_correct_page_ownership.py

      - name: Show corrected QA
        run: |
          cat extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_11_QA.json

      - name: Commit generated correction artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_11_POST_AUDIT_CORRECTIONS.tsv \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_11_PHRASE_PAGE_MAP.tsv \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_11_EFFECTIVE_CLUSTER_SUMMARY.tsv \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_11_PAGE_OWNERSHIP_CORRECTED.tsv \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_11_WEAK_OWNERSHIP_REAUDIT.md \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_11_QA.json \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_11_REPORT.md
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "step11: materialize corrected phrase-to-page mapping"
            git push origin HEAD:roadmap/kwork-productization-2026-08-28
          fi
