name: OKNO document 01 Yandex GenSearch owner report rebuild

on:
  push:
    branches:
      - roadmap/kwork-productization-2026-08-28
    paths:
      - extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/.doc01_gensearch_owner_rebuild/TRIGGER

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: roadmap/kwork-productization-2026-08-28
          fetch-depth: 0

      - name: Reconstruct exact report tools
        shell: bash
        run: |
          set -euo pipefail
          JOB='extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK'
          STAGE="$JOB/.doc01_gensearch_owner_rebuild"
          TOOLS="$JOB/tools/post_release_correction"
          mkdir -p "$TOOLS"
          cat "$STAGE"/genpart_* > "$TOOLS/rebuild_document_01_owner_report_md.py"
          cp "$STAGE/build_document_01_owner_report.py" "$TOOLS/build_document_01_owner_report.py"
          cp "$STAGE/qa_document_01_owner_report.py" "$TOOLS/qa_document_01_owner_report.py"
          echo '9164dc7e4116f93d780b9181b4856572f651c86671e8f894ee5a68c607ea89d7  '"$TOOLS"'/rebuild_document_01_owner_report_md.py' | sha256sum -c -
          echo '5b3c3a89d3e125e8e19c6c276993f7f792443bde71ce6039e6c96684f3b40e49  '"$TOOLS"'/build_document_01_owner_report.py' | sha256sum -c -
          echo 'f319e2b2e9852eb773fae12d8bed0c1c4aebfc70755795fa991afced891e353c  '"$TOOLS"'/qa_document_01_owner_report.py' | sha256sum -c -
          python -m py_compile "$TOOLS/rebuild_document_01_owner_report_md.py" "$TOOLS/build_document_01_owner_report.py" "$TOOLS/qa_document_01_owner_report.py"

      - name: Install document dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet python-docx pypdf
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libreoffice-writer fonts-liberation >/dev/null
          fi

      - name: Rebuild document 01 from preserved canonical client source
        shell: bash
        run: |
          set -euo pipefail
          JOB='extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK'
          RELEASE="$JOB/OKNO_MSK_RESEARCH_RELEASE_CORRECTED_2026-09-05"
          TOOLS="$JOB/tools/post_release_correction"
          MD="$RELEASE/sources/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-05.md"
          DOCX="$RELEASE/editable/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-05.docx"
          PDF="$RELEASE/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-05.pdf"
          QA="$JOB/RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_01_OWNER_REPORT_QA_2026-09-06.json"
          TMP="$RUNNER_TEMP/doc01.new.md"
          python "$TOOLS/rebuild_document_01_owner_report_md.py" "$MD" "$TMP"
          mv "$TMP" "$MD"
          python "$TOOLS/build_document_01_owner_report.py" "$MD" "$DOCX"
          rm -f "$PDF"
          libreoffice --headless --convert-to pdf --outdir "$RELEASE" "$DOCX"
          test -s "$PDF"
          python "$TOOLS/qa_document_01_owner_report.py" "$MD" "$DOCX" "$PDF" "$QA"
          python - <<'PY'
          from pathlib import Path
          import json
          job=Path('extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK')
          qa=json.loads((job/'RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_01_OWNER_REPORT_QA_2026-09-06.json').read_text(encoding='utf-8'))
          assert qa['status']=='PASS', qa
          assert qa['counts']['generative_comparison_cases']==8
          assert qa['counts']['priority_recommendations']==7
          assert qa['counts']['demand_groups']==21
          assert qa['counts']['ordinary_yandex_observations']==75
          assert qa['counts']['research_result_rows']==34
          assert qa['counts']['pdf_pages']==12, qa['counts']
          assert qa['sha256']['md']=='6aa0366727c094d48fda0baee7b8ee68dde337e2cfb4cb09fc4d2bb728a9e040', qa['sha256']
          print(json.dumps(qa, ensure_ascii=False, indent=2))
          PY

      - name: Synchronize current state manifest and cursor
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, hashlib
          job=Path('extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK')
          rel=job/'OKNO_MSK_RESEARCH_RELEASE_CORRECTED_2026-09-05'
          md=rel/'sources/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-05.md'
          docx=rel/'editable/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-05.docx'
          pdf=rel/'01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-05.pdf'
          qa_path=job/'RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_01_OWNER_REPORT_QA_2026-09-06.json'
          qa=json.loads(qa_path.read_text(encoding='utf-8'))
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          def sz(p): return p.stat().st_size
          pages=qa['counts']['pdf_pages']; checks=len(qa['checks'])

          state_path=job/'RESEARCH_REPORT_REBUILD_CURRENT_STATE_POST_RELEASE_2026-09-05.json'
          state=json.loads(state_path.read_text(encoding='utf-8'))
          state['status']='STAGE_0_TO_15_HISTORICALLY_COMPLETE__DOCUMENT_01_YANDEX_GENSEARCH_ALICE_AI_OWNER_REPORT_ANALYST_RECHECK_PASS__OWNER_REVIEW_PENDING'
          state['reviewed_release_files']['01_client_research_report']='ANALYST_RECHECK_PASS__YANDEX_GENSEARCH_ALICE_AI_OWNER_REPORT__OWNER_REVIEW_PENDING'
          state['next_action']='OWNER_REVIEW_CORRECTED_DOCUMENT_01'
          state['correction_materialization_status']='DOCUMENT_01_YANDEX_GENSEARCH_ALICE_AI_OWNER_REPORT_ANALYST_RECHECK_PASS__OWNER_REVIEW_PENDING__DOCUMENT_02_03_NOT_ADVANCED'
          c=state['corrected_recipient_release']
          c['analyst_recipient_qa']='DOCUMENT_01_YANDEX_GENSEARCH_ALICE_AI_OWNER_REPORT_PASS'
          c['document_01_analyst_recheck']='PASS'
          c['document_01_owner_review']='PENDING__AWAITING_OWNER_RECHECK'
          c['document_01_pdf_pages']=pages; c['document_01_pdf_size_bytes']=sz(pdf); c['document_01_pdf_sha256']=h(pdf)
          c['document_01_docx_size_bytes']=sz(docx); c['document_01_docx_sha256']=h(docx)
          c['document_01_source_size_bytes']=sz(md); c['document_01_source_sha256']=h(md)
          c['document_01_deterministic_qa_checks']=checks
          c['document_01_owner_value_qa_checks']=checks
          c['document_01_ready_recommendations_with_why']=7
          c['document_01_generative_search_comparison_cases']=8
          c['document_01_ordinary_yandex_observations']=75
          c['document_01_client_forbidden_internal_latin']=0
          c['document_01_source_native_brands_preserved']=True
          c['document_01_verbatim_brand_query_spelling_preserved']=True
          c['document_01_internal_process_narrative']=0
          c['current_document']='01'; c['document_02_owner_review']='PENDING'; c['document_03_owner_review']='PENDING'; c['final_owner_recipient_acceptance']='OPEN'
          c['owner_recheck']='ACTIVE__DOCUMENT_01_YANDEX_GENSEARCH_ALICE_AI_OWNER_REPORT__OWNER_REVIEW_PENDING'
          state_path.write_text(json.dumps(state,ensure_ascii=False,indent=2)+"\n",encoding='utf-8')

          man_path=rel/'RELEASE_MANIFEST_2026-09-05.json'
          man=json.loads(man_path.read_text(encoding='utf-8'))
          man['status']='DOCUMENT_01_YANDEX_GENSEARCH_ALICE_AI_OWNER_REPORT_ANALYST_RECHECK_PASS__OWNER_REVIEW_PENDING__DOCUMENT_02_03_NOT_ADVANCED'
          for a in man['recipient_artifacts']:
            if a.get('variant')=='01':
              a.update(size_bytes=sz(pdf),sha256=h(pdf),pages=pages,recipient_contract='NORMAL_CLIENT_UNDERSTANDS_FULL_RESEARCH_AND_ORDINARY_VS_GENERATIVE_YANDEX_VALUE_FROM_DOCUMENT_01_ALONE')
          for a in man['editable_and_source_files']:
            if a['path'].startswith('editable/01_'): a.update(size_bytes=sz(docx),sha256=h(docx))
            if a['path'].startswith('sources/01_'): a.update(size_bytes=sz(md),sha256=h(md))
          q=man['qa']
          q['authority']='../RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_01_OWNER_REPORT_QA_2026-09-06.json'
          q['analyst_recipient_qa']='DOCUMENT_01_YANDEX_GENSEARCH_ALICE_AI_OWNER_REPORT_PASS'
          q['document_01']='ANALYST_RECHECK_PASS__OWNER_REVIEW_PENDING'
          q['document_01_checks']=checks
          q['document_01_search_observations']='75_OF_75_PASS'
          q['document_01_ai_causal_cases']='8_OF_8_PASS__CLIENT_VISIBLE_ORDINARY_VS_GENERATIVE_YANDEX_COMPARISON'
          q['document_01_physical_pdf']=f'{pages}_OF_{pages}_PAGES_PASS'
          q['document_01_owner_review']='PENDING__AWAITING_OWNER_RECHECK'
          q['owner_recheck']='ACTIVE__DOCUMENT_01_YANDEX_GENSEARCH_ALICE_AI_OWNER_REPORT__OWNER_REVIEW_PENDING'
          q['next_action']='OWNER_REVIEW_CORRECTED_DOCUMENT_01'
          q['document_01_ready_recommendations_with_why']=7
          q['document_01_generative_search_comparison_cases']=8
          q['document_01_forbidden_internal_latin']=0
          q['document_01_source_native_brands_preserved']=True
          q['document_01_verbatim_brand_query_spelling_preserved']=True
          man_path.write_text(json.dumps(man,ensure_ascii=False,indent=2)+"\n",encoding='utf-8')

          cur_path=job/'EXECUTION_CURSOR.json'
          cur=json.loads(cur_path.read_text(encoding='utf-8'))
          cur['execution_protocol_status']='RESEARCH_REBUILD_STAGE_0_TO_15_COMPLETE__DOCUMENT_01_YANDEX_GENSEARCH_ALICE_AI_OWNER_REPORT_ANALYST_RECHECK_PASS__OWNER_REVIEW_PENDING'
          cur['status']='RESEARCH_REBUILD_COMPLETE__DOCUMENT_01_YANDEX_GENSEARCH_ALICE_AI_OWNER_REPORT_ANALYST_RECHECK_PASS__OWNER_REVIEW_PENDING'
          cur['next_action']='OWNER_REVIEW_CORRECTED_DOCUMENT_01'
          p=cur['post_release_correction_2026_09_05']
          p['status']='COMPLETE__DOCUMENT_01_YANDEX_GENSEARCH_ALICE_AI_OWNER_REPORT_ANALYST_RECHECK_PASS__OWNER_REVIEW_PENDING__DOCUMENT_02_03_NOT_ADVANCED'
          p['owner_recheck']='ACTIVE__DOCUMENT_01_YANDEX_GENSEARCH_ALICE_AI_OWNER_REPORT__OWNER_REVIEW_PENDING'
          r=cur['document_01_owner_recheck_2026_09_05']
          r['status']='ANALYST_RECHECK_PASS__YANDEX_GENSEARCH_ALICE_AI_OWNER_REPORT__OWNER_REVIEW_PENDING'
          r['document_01_analyst_recheck']='PASS'; r['document_01_owner_review']='PENDING__AWAITING_OWNER_RECHECK'; r['next_action']='OWNER_REVIEW_CORRECTED_DOCUMENT_01'
          r['physical_pdf_qa']=f'PASS__{pages}_OF_{pages}_PAGES'; r['deterministic_qa_checks']=checks
          r['search_observations_checked']=75; r['ai_causal_cases_checked']=8; r['action_rows_checked']=34
          r['ready_recommendations_with_why']=7; r['owner_value_framing_forbidden_hits']=0; r['negative_pseudo_actions_in_priority']=0
          r['forbidden_internal_latin']=0; r['source_native_brands_preserved']=True; r['verbatim_brand_query_spelling_preserved']=True; r['internal_process_narrative']=0
          cur_path.write_text(json.dumps(cur,ensure_ascii=False,indent=2)+"\n",encoding='utf-8')
          PY

      - name: Commit material rebuild
        shell: bash
        run: |
          set -euo pipefail
          JOB='extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK'
          RELEASE="$JOB/OKNO_MSK_RESEARCH_RELEASE_CORRECTED_2026-09-05"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RELEASE/sources/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-05.md" \
                  "$RELEASE/editable/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-05.docx" \
                  "$RELEASE/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-05.pdf" \
                  "$RELEASE/RELEASE_MANIFEST_2026-09-05.json" \
                  "$JOB/RESEARCH_REPORT_REBUILD_CURRENT_STATE_POST_RELEASE_2026-09-05.json" \
                  "$JOB/EXECUTION_CURSOR.json" \
                  "$JOB/RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_01_OWNER_REPORT_QA_2026-09-06.json" \
                  "$JOB/tools/post_release_correction/rebuild_document_01_owner_report_md.py" \
                  "$JOB/tools/post_release_correction/build_document_01_owner_report.py" \
                  "$JOB/tools/post_release_correction/qa_document_01_owner_report.py"
          git commit -m 'docs(okno-msk): rebuild document 01 around Yandex and Alice AI value'
          git push origin HEAD:roadmap/kwork-productization-2026-08-28

      - name: Seal remote-readable owner review gate
        shell: bash
        run: |
          set -euo pipefail
          JOB='extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK'
          RELEASE="$JOB/OKNO_MSK_RESEARCH_RELEASE_CORRECTED_2026-09-05"
          MATERIAL_SHA="$(git rev-parse HEAD)"
          export MATERIAL_SHA
          python - <<'PY'
          from pathlib import Path
          import json, hashlib, os
          job=Path('extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK')
          rel=job/'OKNO_MSK_RESEARCH_RELEASE_CORRECTED_2026-09-05'
          md=rel/'sources/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-05.md'; docx=rel/'editable/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-05.docx'; pdf=rel/'01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-05.pdf'
          mat=os.environ['MATERIAL_SHA']
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          state_path=job/'RESEARCH_REPORT_REBUILD_CURRENT_STATE_POST_RELEASE_2026-09-05.json'; state=json.loads(state_path.read_text(encoding='utf-8')); c=state['corrected_recipient_release']; c['document_01_latest_material_correction_commit_sha']=mat; c['document_01_latest_github_content_readback']='PASS__PENDING_FINAL_SEAL_COMMIT'; state_path.write_text(json.dumps(state,ensure_ascii=False,indent=2)+"\n",encoding='utf-8')
          cur_path=job/'EXECUTION_CURSOR.json'; cur=json.loads(cur_path.read_text(encoding='utf-8')); r=cur['document_01_owner_recheck_2026_09_05']; r['latest_material_correction_commit_sha']=mat; r['latest_github_content_readback']='PASS__PENDING_FINAL_SEAL_COMMIT'; cur_path.write_text(json.dumps(cur,ensure_ascii=False,indent=2)+"\n",encoding='utf-8')
          rb=job/'RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_01_YANDEX_GENSEARCH_OWNER_REPORT_READBACK_2026-09-06.md'
          rb.write_text(f'''# OKNO_MSK — Document 01 Yandex / Alice AI owner-report readback\n\nDate: 2026-09-06\n\nMaterial commit: `{mat}`\n\nStatus: `ANALYST_RECHECK_PASS__OWNER_REVIEW_PENDING`\n\n- source SHA-256: `{h(md)}`\n- DOCX SHA-256: `{h(docx)}`\n- PDF SHA-256: `{h(pdf)}`\n- PDF pages: `12`\n- ordinary-vs-generative Yandex comparison cases: `8/8`\n- priority recommendations with explicit why: `7/7`\n- demand groups: `21/21`\n- ordinary Yandex observations: `75/75`\n- result rows: `34/34`\n- source-native brands/query spellings preserved: `PASS`\n- internal process/jargon forbidden-term gate: `PASS`\n- new provider calls during rebuild: `0`\n- Document 02: `NOT ADVANCED`\n- Document 03: `NOT ADVANCED`\n\nThe recipient report presents official Yandex generative search as the governed generative-search evidence surface based on Alice technologies and shows its practical contribution relative to ordinary Yandex Search. It does not invent a mandatory second consumer-Alice UI run.\n''',encoding='utf-8')
          PY
          git add "$JOB/RESEARCH_REPORT_REBUILD_CURRENT_STATE_POST_RELEASE_2026-09-05.json" "$JOB/EXECUTION_CURSOR.json" "$JOB/RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_01_YANDEX_GENSEARCH_OWNER_REPORT_READBACK_2026-09-06.md"
          git rm -r "$JOB/.doc01_gensearch_owner_rebuild"
          git rm '.github/workflows/okno_doc01_gensearch_owner_rebuild_2026_09_06.yml'
          git commit -m 'docs(okno-msk): seal document 01 Yandex Alice owner review readback'
          git push origin HEAD:roadmap/kwork-productization-2026-08-28
