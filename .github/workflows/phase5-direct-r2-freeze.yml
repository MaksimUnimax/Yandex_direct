name: phase5-direct-r2-freeze

on:
  push:
    branches:
      - candidate/phase5-direct-first-slice-r2-2026-08-27
    paths:
      - .github/workflows/phase5-direct-r2-freeze.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze-exact-candidate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pinned corrected Phase 5 source
        uses: actions/checkout@v4
        with:
          ref: 841a1e2c1a503c4a05572a957ba97c55b9b60c52
          fetch-depth: 0

      - name: Assert pinned source and product tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "841a1e2c1a503c4a05572a957ba97c55b9b60c52"
          test "$(git rev-parse HEAD:extension/src)" = "edf1c2d3494ebbc53ae778d23be1457eb885b605"
          git diff --exit-code
          echo PHASE5_R2_FREEZE_PINNED_SOURCE_PASS

      - name: Complete corrected source suite
        shell: bash
        run: |
          set -euo pipefail
          cd extension/src
          npm test
          echo PHASE5_R2_FREEZE_SOURCE_SUITE_PASS

      - name: Build deterministic frozen candidate and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase5-r2-freeze
          python - <<'PY'
          import hashlib
          import json
          import shutil
          import zipfile
          from pathlib import Path

          SOURCE = Path('extension/src')
          OUT = Path('phase5-r2-freeze/yandex-marketing-bridge-0.1.1-phase5-direct-first-slice-r2-candidate.zip')
          MANIFEST = Path('phase5-r2-freeze/PHASE5_DIRECT_R2_EXACT_CANDIDATE_MANIFEST_2026-08-27.json')
          SOURCE_COMMIT = '841a1e2c1a503c4a05572a957ba97c55b9b60c52'
          PRODUCT_TREE = 'edf1c2d3494ebbc53ae778d23be1457eb885b605'
          PREFLIGHT_RUN = 33037727189

          files = sorted(p for p in SOURCE.rglob('*') if p.is_file())
          entries = []
          for p in files:
              rel = p.relative_to(SOURCE).as_posix()
              data = p.read_bytes()
              entries.append({
                  'path': rel,
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              })

          def build_zip(path: Path):
              if path.exists():
                  path.unlink()
              with zipfile.ZipFile(path, 'w', compression=zipfile.ZIP_STORED, strict_timestamps=True) as zf:
                  for p in files:
                      rel = p.relative_to(SOURCE).as_posix()
                      info = zipfile.ZipInfo(rel, date_time=(1980, 1, 1, 0, 0, 0))
                      info.compress_type = zipfile.ZIP_STORED
                      info.create_system = 3
                      info.external_attr = (0o100644 << 16)
                      zf.writestr(info, p.read_bytes())
              with zipfile.ZipFile(path, 'r') as zf:
                  bad = zf.testzip()
                  if bad is not None:
                      raise SystemExit(f'ZIP_TEST_FAIL {bad}')
                  names = zf.namelist()
                  expected = [row['path'] for row in entries]
                  if names != expected:
                      raise SystemExit('ZIP_ENTRY_ORDER_OR_SET_MISMATCH')

          build_zip(OUT)
          raw = OUT.read_bytes()
          manifest = {
              'format': 'YMB_PHASE5_DIRECT_EXACT_CANDIDATE',
              'version': 1,
              'source_ref': 'fix/phase5-credential-runtime-concurrency-2026-08-27',
              'source_commit': SOURCE_COMMIT,
              'product_tree': PRODUCT_TREE,
              'preflight_run_id': PREFLIGHT_RUN,
              'supersedes_candidate_branch': 'candidate/phase5-direct-first-slice-2026-08-27',
              'supersedes_zip_sha256_prefix': 'fcfb19c7',
              'archive': OUT.name,
              'sha256': hashlib.sha256(raw).hexdigest(),
              'bytes': len(raw),
              'files': len(entries),
              'entries': entries,
              'zip_test': 'PASS',
              'real_yandex_requests': 0,
          }
          MANIFEST.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('source_commit=' + SOURCE_COMMIT)
          print('product_tree=' + PRODUCT_TREE)
          print('sha256=' + manifest['sha256'])
          print('bytes=' + str(manifest['bytes']))
          print('files=' + str(manifest['files']))
          print('PHASE5_R2_DETERMINISTIC_ZIP_BUILD_PASS')
          PY

      - name: Independent deterministic rebuild and extraction identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import shutil
          import zipfile
          from pathlib import Path

          SOURCE = Path('extension/src')
          OUT = Path('phase5-r2-freeze/yandex-marketing-bridge-0.1.1-phase5-direct-first-slice-r2-candidate.zip')
          REBUILT = Path('phase5-r2-freeze/rebuilt.zip')
          MANIFEST = Path('phase5-r2-freeze/PHASE5_DIRECT_R2_EXACT_CANDIDATE_MANIFEST_2026-08-27.json')
          EXTRACT = Path('phase5-r2-freeze/extract-verify')
          m = json.loads(MANIFEST.read_text(encoding='utf-8'))
          files = sorted(p for p in SOURCE.rglob('*') if p.is_file())

          with zipfile.ZipFile(REBUILT, 'w', compression=zipfile.ZIP_STORED, strict_timestamps=True) as zf:
              for p in files:
                  rel = p.relative_to(SOURCE).as_posix()
                  info = zipfile.ZipInfo(rel, date_time=(1980, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_STORED
                  info.create_system = 3
                  info.external_attr = (0o100644 << 16)
                  zf.writestr(info, p.read_bytes())

          if OUT.read_bytes() != REBUILT.read_bytes():
              raise SystemExit('DETERMINISTIC_REBUILD_MISMATCH')
          if hashlib.sha256(OUT.read_bytes()).hexdigest() != m['sha256']:
              raise SystemExit('MANIFEST_ARCHIVE_SHA_MISMATCH')

          if EXTRACT.exists():
              shutil.rmtree(EXTRACT)
          EXTRACT.mkdir(parents=True)
          with zipfile.ZipFile(OUT, 'r') as zf:
              if zf.testzip() is not None:
                  raise SystemExit('ZIP_TEST_FAIL')
              zf.extractall(EXTRACT)

          extracted = sorted(p for p in EXTRACT.rglob('*') if p.is_file())
          expected_paths = [row['path'] for row in m['entries']]
          actual_paths = [p.relative_to(EXTRACT).as_posix() for p in extracted]
          if actual_paths != expected_paths:
              raise SystemExit('EXTRACTION_FILE_SET_MISMATCH')
          by_path = {row['path']: row for row in m['entries']}
          for p in extracted:
              rel = p.relative_to(EXTRACT).as_posix()
              data = p.read_bytes()
              if len(data) != by_path[rel]['bytes']:
                  raise SystemExit(f'EXTRACT_SIZE_MISMATCH {rel}')
              if hashlib.sha256(data).hexdigest() != by_path[rel]['sha256']:
                  raise SystemExit(f'EXTRACT_SHA_MISMATCH {rel}')
              source_data = (SOURCE / rel).read_bytes()
              if data != source_data:
                  raise SystemExit(f'EXTRACT_SOURCE_BYTE_MISMATCH {rel}')

          shutil.rmtree(EXTRACT)
          REBUILT.unlink()
          print('PHASE5_R2_DETERMINISTIC_REBUILD_PASS')
          print('PHASE5_R2_EXTRACTION_IDENTITY_PASS')
          print('PHASE5_R2_FREEZE_REAL_YANDEX_REQUESTS=0')
          PY

      - name: Consumer syntax check from exact frozen ZIP bytes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf phase5-r2-freeze/consumer
          mkdir -p phase5-r2-freeze/consumer
          unzip -q phase5-r2-freeze/yandex-marketing-bridge-0.1.1-phase5-direct-first-slice-r2-candidate.zip -d phase5-r2-freeze/consumer
          test -f phase5-r2-freeze/consumer/manifest.json
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find phase5-r2-freeze/consumer -type f -name '*.js' -print0 | sort -z)
          rm -rf phase5-r2-freeze/consumer
          echo PHASE5_R2_FROZEN_CONSUMER_SYNTAX_PASS

      - name: Print frozen identity
        shell: bash
        run: |
          set -euo pipefail
          sha256sum phase5-r2-freeze/yandex-marketing-bridge-0.1.1-phase5-direct-first-slice-r2-candidate.zip
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('phase5-r2-freeze/PHASE5_DIRECT_R2_EXACT_CANDIDATE_MANIFEST_2026-08-27.json').read_text(encoding='utf-8'))
          for key in ('source_commit','product_tree','preflight_run_id','sha256','bytes','files','zip_test','real_yandex_requests'):
              print(f'{key}={m[key]}')
          print('PHASE5_DIRECT_R2_FREEZE_PASS')
          PY

      - name: Upload exact frozen candidate
        uses: actions/upload-artifact@v4
        with:
          name: phase5-direct-r2-frozen-candidate-841a1e2
          path: |
            phase5-r2-freeze/yandex-marketing-bridge-0.1.1-phase5-direct-first-slice-r2-candidate.zip
            phase5-r2-freeze/PHASE5_DIRECT_R2_EXACT_CANDIDATE_MANIFEST_2026-08-27.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
