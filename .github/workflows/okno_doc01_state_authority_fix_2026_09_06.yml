name: OKNO document 01 state authority fix

on:
  push:
    branches:
      - roadmap/kwork-productization-2026-08-28
    paths:
      - extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/DOC01_STATE_FIX_TRIGGER

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: roadmap/kwork-productization-2026-08-28
          fetch-depth: 0
      - name: Reconcile final authority references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          job=Path('extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK')
          rel=job/'OKNO_MSK_RESEARCH_RELEASE_CORRECTED_2026-09-05'
          material='3c83e3f4f2e9b84267cc55216a455001671a3ae3'
          qa='RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_01_OWNER_REPORT_QA_2026-09-06.json'
          rb='RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_01_YANDEX_GENSEARCH_OWNER_REPORT_READBACK_2026-09-06.md'
          defect='OWNER_VALUE_AND_GENSEARCH_CLIENT_PRODUCT_REWORK__CORRECTED_PENDING_OWNER_RECHECK'

          p=job/'RESEARCH_REPORT_REBUILD_CURRENT_STATE_POST_RELEASE_2026-09-05.json'; d=json.loads(p.read_text(encoding='utf-8')); c=d['corrected_recipient_release']
          if material not in c['materialization_commit_shas']: c['materialization_commit_shas'].append(material)
          c['document_01_qa_json']=qa
          c['document_01_qa_markdown']='NOT_APPLICABLE__CURRENT_INDEPENDENT_QA_IS_JSON'
          c['document_01_github_readback_authority']=rb
          c['document_01_owner_review_residual_defect']=defect
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=job/'EXECUTION_CURSOR.json'; d=json.loads(p.read_text(encoding='utf-8')); pc=d['post_release_correction_2026_09_05']; r=d['document_01_owner_recheck_2026_09_05']
          if material not in pc['materialization_commit_shas']: pc['materialization_commit_shas'].append(material)
          r['qa_authority']=qa
          r['github_readback_authority']=rb
          r['owner_review_residual_defect']=defect
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=rel/'RELEASE_MANIFEST_2026-09-05.json'; d=json.loads(p.read_text(encoding='utf-8')); q=d['qa']
          q['document_01_github_readback_authority']='../'+rb
          q['document_01_analyst_recheck_authority']='../'+qa
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit and self-clean
        shell: bash
        run: |
          set -euo pipefail
          JOB='extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$JOB/RESEARCH_REPORT_REBUILD_CURRENT_STATE_POST_RELEASE_2026-09-05.json" "$JOB/EXECUTION_CURSOR.json" "$JOB/OKNO_MSK_RESEARCH_RELEASE_CORRECTED_2026-09-05/RELEASE_MANIFEST_2026-09-05.json"
          git rm "$JOB/DOC01_STATE_FIX_TRIGGER" '.github/workflows/okno_doc01_state_authority_fix_2026_09_06.yml'
          git commit -m 'docs(okno-msk): reconcile document 01 final authority references'
          git push origin HEAD:roadmap/kwork-productization-2026-08-28
