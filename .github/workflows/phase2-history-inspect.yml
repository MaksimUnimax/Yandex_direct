name: phase2-history-inspect
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/phase2-recovery-work-2026-08-20
      - name: Inspect preserved popup and profile behavior
        shell: bash
        run: |
          set -euo pipefail
          cat extension/tests/qa_transport/phase2-search-sync-v1/patch.gz.b64.part* > /tmp/patch.b64
          base64 -d /tmp/patch.b64 > /tmp/patch.gz
          gzip -dc /tmp/patch.gz > /tmp/patch.diff
          echo '--- popup html diff ---'
          awk '/^diff --git a\/popup\.html b\/popup\.html/{p=1;next} /^diff --git / && p{p=0} p{print}' /tmp/patch.diff
          echo '--- popup js diff ---'
          awk '/^diff --git a\/popup\.js b\/popup\.js/{p=1;next} /^diff --git / && p{p=0} p{print}' /tmp/patch.diff
          echo '--- worker profile contexts ---'
          grep -Ein -C 20 'SEND_BUTTON_PROFILE|COPY_BUTTON_PROFILES|getCopyButtonProfiles|copyProfileCollection|send_button_profile|copy_button_profiles' /tmp/patch.diff || true
