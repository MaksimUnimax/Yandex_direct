name: phase2-history-inspect
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/phase2-recovery-work-2026-08-20
      - name: Inspect preserved combined patch for legacy popup controls
        shell: bash
        run: |
          set -euo pipefail
          cat extension/tests/qa_transport/phase2-search-sync-v1/patch.gz.b64.part* > /tmp/patch.b64
          base64 -d /tmp/patch.b64 > /tmp/patch.gz
          gzip -t /tmp/patch.gz
          gzip -dc /tmp/patch.gz > /tmp/patch.diff
          echo '--- legacy popup/control matches ---'
          grep -Ein -C 3 'picker|profile|diagnostic|clipboard|clear.*send|clear.*copy|WS_[A-Z0-9_]*(DIAG|PROFILE|PICK)' /tmp/patch.diff || true
          echo '--- popup changed hunks ---'
          awk '/^diff --git a\/extension\/src\/popup\.(js|html)/{p=1} /^diff --git / && p && $0 !~ /popup\.(js|html)/{p=0} p{print}' /tmp/patch.diff | grep -Ein -C 3 'picker|profile|diagnostic|clipboard|clear|WS_' || true
