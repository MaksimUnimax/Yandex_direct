name: phase2-legacy-profile-recovery
on:
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/phase2-recovery-work-2026-08-20
      - name: Restore legacy Send Copy profile persistence and verify
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('extension/src/service_worker.js')
          s = p.read_text(encoding='utf-8')

          old = '  DIAGNOSTICS: "ymb_diagnostics"\n});'
          new = '  DIAGNOSTICS: "ymb_diagnostics", SEND_BUTTON_PROFILE: "wsmb_send_button_profile",\n  COPY_BUTTON_PROFILES: "wsmb_copy_button_profiles"\n});'
          assert old in s
          s = s.replace(old, new, 1)

          anchor = 'function storageRemove(keys) { return chrome.storage.local.remove(keys); }\n'
          insert = '''function storageRemove(keys) { return chrome.storage.local.remove(keys); }\nfunction safeButtonProfile(value) { return value && typeof value === "object" && !Array.isArray(value) ? clone(value) : null; }\nfunction copyProfileCollection(value) { return value && typeof value === "object" ? clone(value) : {}; }\nasync function getSendButtonProfile() { return safeButtonProfile((await storageGet(KEYS.SEND_BUTTON_PROFILE))[KEYS.SEND_BUTTON_PROFILE]); }\nasync function getCopyButtonProfiles() { return copyProfileCollection((await storageGet(KEYS.COPY_BUTTON_PROFILES))[KEYS.COPY_BUTTON_PROFILES]); }\nasync function saveSendButtonProfile(profile) { const next = safeButtonProfile(profile); if (!next) throw Object.assign(new Error("Некорректный Send profile."), { code: "INVALID_SEND_BUTTON_PROFILE" }); await storageSet({ [KEYS.SEND_BUTTON_PROFILE]: next }); return next; }\nasync function saveCopyButtonProfiles(profiles) { const next = copyProfileCollection(profiles); await storageSet({ [KEYS.COPY_BUTTON_PROFILES]: next }); return next; }\nasync function clearSendButtonProfile() { await storageRemove(KEYS.SEND_BUTTON_PROFILE); return null; }\nasync function clearCopyButtonProfiles() { await storageRemove(KEYS.COPY_BUTTON_PROFILES); return {}; }\n'''
          assert anchor in s
          s = s.replace(anchor, insert, 1)

          old = '''async function commonPublicSettingsFields() {\n  const settings = await getSettings(); const [wordstatPolicy, searchPolicy] = await Promise.all([getWordstatPolicy(), getSearchPolicy()]);\n  return { product_name: YMBProduct.NAME, product_version: VERSION, has_api_key: Boolean(settings.apiKey), folder_id: settings.folderId, credential_capability: publicCapability(settings), credential_capabilities: { wordstat: publicCapability(settings, "wordstat"), search: publicCapability(settings, "search") }, wordstat_policy: publicPolicy(wordstatPolicy, "wordstat"), search_policy: publicPolicy(searchPolicy, "search"), auto_send: settings.autoSend, debug_mode: settings.debugMode };\n}\n'''
          new = '''async function commonPublicSettingsFields() {\n  const settings = await getSettings();\n  const [wordstatPolicy, searchPolicy, sendButtonProfile, copyButtonProfiles] = await Promise.all([getWordstatPolicy(), getSearchPolicy(), getSendButtonProfile(), getCopyButtonProfiles()]);\n  return { product_name: YMBProduct.NAME, product_version: VERSION, has_api_key: Boolean(settings.apiKey), folder_id: settings.folderId, credential_capability: publicCapability(settings), credential_capabilities: { wordstat: publicCapability(settings, "wordstat"), search: publicCapability(settings, "search") }, wordstat_policy: publicPolicy(wordstatPolicy, "wordstat"), search_policy: publicPolicy(searchPolicy, "search"), auto_send: settings.autoSend, debug_mode: settings.debugMode, send_button_profile: sendButtonProfile, copy_button_profiles: copyButtonProfiles };\n}\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = 'function exportedSettingsKeys() { return [KEYS.API_KEY, KEYS.FOLDER_ID, KEYS.AUTO_SEND, KEYS.CONVERSATION_BINDINGS, KEYS.MANUAL_MODES, KEYS.REPORT_PREFIXES, KEYS.AUTO_START_PROMPTS, KEYS.SERVICE_CONTEXTS, KEYS.WORDSTAT_POLICY, KEYS.SEARCH_POLICY, KEYS.DEBUG_MODE]; }'
          new = 'function exportedSettingsKeys() { return [KEYS.API_KEY, KEYS.FOLDER_ID, KEYS.AUTO_SEND, KEYS.CONVERSATION_BINDINGS, KEYS.MANUAL_MODES, KEYS.REPORT_PREFIXES, KEYS.AUTO_START_PROMPTS, KEYS.SEND_BUTTON_PROFILE, KEYS.COPY_BUTTON_PROFILES, KEYS.SERVICE_CONTEXTS, KEYS.WORDSTAT_POLICY, KEYS.SEARCH_POLICY, KEYS.DEBUG_MODE]; }'
          assert old in s
          s = s.replace(old, new, 1)

          old = 'auto_send: data[KEYS.AUTO_SEND] !== false, conversation_bindings:'
          new = 'auto_send: data[KEYS.AUTO_SEND] !== false, send_button_profile: safeButtonProfile(data[KEYS.SEND_BUTTON_PROFILE]), copy_button_profiles: copyProfileCollection(data[KEYS.COPY_BUTTON_PROFILES]), conversation_bindings:'
          assert old in s
          s = s.replace(old, new, 1)

          old = '[KEYS.AUTO_SEND]: incoming.auto_send !== false, [KEYS.CONVERSATION_BINDINGS]:'
          new = '[KEYS.AUTO_SEND]: incoming.auto_send !== false, [KEYS.SEND_BUTTON_PROFILE]: safeButtonProfile(incoming.send_button_profile), [KEYS.COPY_BUTTON_PROFILES]: copyProfileCollection(incoming.copy_button_profiles), [KEYS.CONVERSATION_BINDINGS]:'
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    case "WS_MANUAL_DELIVERY_COMPLETE": case "WS_AUTO_DELIVERY_COMPLETE": return completeDelivery(message);\n    case "WS_EXPORT_BACKUP": return { ok: true, backup: await exportSettingsBackup() };\n    case "WS_IMPORT_BACKUP": return { ok: true, result: await importSettingsBackup(message.backup), state: await publicGlobalSettingsState() };\n'''
          new = '''    case "WS_MANUAL_DELIVERY_COMPLETE": case "WS_AUTO_DELIVERY_COMPLETE": return completeDelivery(message);\n    case "WS_SAVE_SEND_BUTTON_PROFILE": return { ok: true, send_button_profile: await saveSendButtonProfile(message.profile), state: await publicGlobalSettingsState() };\n    case "WS_SAVE_COPY_BUTTON_PROFILES": return { ok: true, copy_button_profiles: await saveCopyButtonProfiles(message.profiles), state: await publicGlobalSettingsState() };\n    case "WS_CLEAR_SEND_BUTTON_PROFILE": return { ok: true, send_button_profile: await clearSendButtonProfile(), state: await publicGlobalSettingsState() };\n    case "WS_CLEAR_COPY_BUTTON_PROFILES": return { ok: true, copy_button_profiles: await clearCopyButtonProfiles(), state: await publicGlobalSettingsState() };\n    case "WS_EXPORT_BACKUP": case "WS_EXPORT_SETTINGS": return { ok: true, backup: await exportSettingsBackup() };\n    case "WS_IMPORT_BACKUP": case "WS_IMPORT_SETTINGS": return { ok: true, result: await importSettingsBackup(message.backup || message.settings), state: await publicGlobalSettingsState() };\n'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --test extension/tests/legacy_profiles_recovery.test.mjs
          node --check extension/src/service_worker.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/src/service_worker.js extension/tests/legacy_profiles_recovery.test.mjs
          git commit -m 'fix: restore legacy Send and Copy profile persistence'
          git push origin HEAD:dev/phase2-recovery-work-2026-08-20
