name: phase2-history-inspect
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/phase2-recovery-work-2026-08-20
          fetch-depth: 0
      - name: Read exact Phase1 repair patch
        shell: bash
        run: |
          set -euo pipefail
          git show origin/qa/e13a-exact-reconstruction-v3:extension/tests/qa_transport/e13a/patch.gz.b64.part00 > /tmp/e13a.part00
          git show origin/qa/e13a-exact-reconstruction-v3:extension/tests/qa_transport/e13a/patch.gz.b64.part01 > /tmp/e13a.part01
          cat /tmp/e13a.part00 /tmp/e13a.part01 > /tmp/e13a.b64
          base64 -d /tmp/e13a.b64 > /tmp/e13a.gz
          gzip -dc /tmp/e13a.gz > /tmp/e13a.diff
          echo '--- first 220 lines ---'
          sed -n '1,220p' /tmp/e13a.diff
          echo '--- legacy control matches ---'
          grep -Ein -C 15 'SEND_BUTTON_PROFILE|COPY_BUTTON_PROFILES|picker|diagnostic|clipboard|clear.*profile|copy.*profile|send.*profile|WS_[A-Z0-9_]*(PROFILE|PICK|DIAG)' /tmp/e13a.diff || true
