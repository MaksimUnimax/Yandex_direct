name: phase2-history-inspect
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/phase2-recovery-work-2026-08-20
      - name: Inspect preserved combined patch for legacy popup controls
        shell: bash
        run: |
          set -euo pipefail
          cat extension/tests/qa_transport/phase2-search-sync-v1/patch.gz.b64.part* > /tmp/patch.b64
          base64 -d /tmp/patch.b64 > /tmp/patch.gz
          gzip -t /tmp/patch.gz
          gzip -dc /tmp/patch.gz > /tmp/patch.diff
          echo '--- profile storage/functions/messages ---'
          grep -Ein -C 8 'SEND_BUTTON_PROFILE|COPY_BUTTON_PROFILES|getCopyButtonProfiles|copyProfileCollection|send_button_profile|copy_button_profiles' /tmp/patch.diff || true
          echo '--- diagnostics messages/functions ---'
          grep -Ein -C 8 'GET_DIAGNOST|CLEAR_DIAGNOST|COPY_DIAGNOST|diagnostics' /tmp/patch.diff || true
          echo '--- picker messages and popup ids ---'
          grep -Ein -C 8 'PICK_SEND|PICK_COPY|SEND_PICK|COPY_PICK|sendPicker|copyPicker|clearSend|clearCopy|copyDiagnostics|clearDiagnostics' /tmp/patch.diff || true
          echo '--- changed file headers ---'
          grep '^diff --git ' /tmp/patch.diff
