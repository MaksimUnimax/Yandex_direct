name: phase2-history-inspect
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/phase2-recovery-work-2026-08-20
          fetch-depth: 0
      - name: Read exact legacy popup control patch
        shell: bash
        run: |
          set -euo pipefail
          git show origin/qa/e13a-exact-reconstruction-v3:extension/tests/patches/phase1-0.1.1-fse-manual-popup.patch.gz.b64 > /tmp/popup.b64
          base64 -d /tmp/popup.b64 > /tmp/popup.gz
          gzip -t /tmp/popup.gz
          gzip -dc /tmp/popup.gz > /tmp/popup.diff
          echo '--- control ids and message names ---'
          grep -Ein -C 25 'sendPicker|copyPicker|clearSend|clearCopy|diagnosticsFilter|copyDiagnostics|clearDiagnostics|WS_[A-Z0-9_]*(PICK|PROFILE|DIAG)|clipboard' /tmp/popup.diff || true
          echo '--- button-profile key definitions from final Search patch ---'
          cat extension/tests/qa_transport/phase2-search-sync-v1/patch.gz.b64.part* > /tmp/search.b64
          base64 -d /tmp/search.b64 > /tmp/search.gz
          gzip -dc /tmp/search.gz > /tmp/search.diff
          grep -Ein -C 80 'SEND_BUTTON_PROFILE|COPY_BUTTON_PROFILES' /tmp/search.diff | head -220 || true
