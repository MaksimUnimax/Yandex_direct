name: phase2-history-inspect
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/phase2-recovery-work-2026-08-20
      - name: Inspect preserved final Search patch for legacy contracts
        shell: bash
        run: |
          set -euo pipefail
          cat extension/tests/qa_transport/phase2-search-sync-v1/patch.gz.b64.part* > /tmp/search.b64
          base64 -d /tmp/search.b64 > /tmp/search.gz
          gzip -dc /tmp/search.gz > /tmp/search.diff
          echo '--- profile/storage contexts ---'
          grep -Ein -C 35 'SEND_BUTTON_PROFILE|COPY_BUTTON_PROFILES|getCopyButtonProfiles|copyProfileCollection|send_button_profile|copy_button_profiles' /tmp/search.diff || true
          echo '--- diagnostics/message contexts ---'
          grep -Ein -C 35 'WS_GET_DIAGNOSTICS|WS_CLEAR_DIAGNOSTICS|diagnosticsFilter|copyDiagnostics|clearDiagnostics|clipboard' /tmp/search.diff || true
          echo '--- picker/message contexts ---'
          grep -Ein -C 35 'WS_[A-Z0-9_]*(PICK|PROFILE)|sendPicker|copyPicker|clearSend|clearCopy' /tmp/search.diff || true
