name: phase2-history-inspect
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/phase2-recovery-work-2026-08-20
      - name: Inspect preserved popup runtime test and worker handlers
        shell: bash
        run: |
          set -euo pipefail
          cat extension/tests/qa_transport/phase2-search-sync-v1/patch.gz.b64.part* > /tmp/patch.b64
          base64 -d /tmp/patch.b64 > /tmp/patch.gz
          gzip -dc /tmp/patch.gz > /tmp/patch.diff
          echo '--- popup runtime exhaustive diff ---'
          awk '/^diff --git a\/tests\/popup_runtime_exhaustive\.test\.mjs b\/tests\/popup_runtime_exhaustive\.test\.mjs/{p=1;next} /^diff --git / && p{p=0} p{print}' /tmp/patch.diff
          echo '--- worker message handler contexts for picker/profile/diagnostics ---'
          grep -Ein -C 15 'WS_[A-Z0-9_]*(PROFILE|PICK|DIAG)|SEND_BUTTON_PROFILE|COPY_BUTTON_PROFILES' /tmp/patch.diff || true
