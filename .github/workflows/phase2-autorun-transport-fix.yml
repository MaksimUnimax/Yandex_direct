name: phase2-autorun-transport-fix
on:
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/phase2-recovery-work-2026-08-20
      - name: Release Autorun seen marker after worker transport failure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('extension/src/content_script.js')
          s=p.read_text(encoding='utf-8')
          old='''      }).catch((error) => setStatus(STATUS_KEYS.AUTORUN, `Яндекс: ${error.message || error}`, "error", 9000));'''
          new='''      }).catch((error) => {\n        autorunSeen.delete(turnId);\n        setStatus(STATUS_KEYS.AUTORUN, `Яндекс: ${error.message || error}`, "error", 9000);\n      });'''
          if new not in s:
              assert old in s, 'expected Autorun transport catch not found'
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
          node --test extension/tests/autorun_transport_retry_recovery.test.mjs
          node --check extension/src/content_script.js
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/src/content_script.js
          git commit -m 'fix: retry unaccepted Autorun command after transport failure'
          git push origin HEAD:dev/phase2-recovery-work-2026-08-20
