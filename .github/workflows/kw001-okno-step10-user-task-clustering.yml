name: KW001 OKNO Step10 User Task Clustering

on:
  push:
    branches:
      - roadmap/kwork-productization-2026-08-28
    paths:
      - '.github/workflows/kw001-okno-step10-user-task-clustering.yml'
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_USER_TASK_SERP_CLUSTERING_BUILD.py'
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_USER_TASK_SERP_CLUSTERING_RUN*.py'
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_SEMANTIC_COLLISION_AUDIT*.py'
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_DIRECT_EVIDENCE_CONTRADICTION_AUDIT.py'
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_UNRESOLVED_ADVERSARIAL_AUDIT*.py'
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_V38_*.py'
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_V39_*.py'
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_V38_FULL_MANUAL_ERROR_LEDGER.tsv'
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_08_SEARCH_STAGE_SEMANTIC_SET.tsv'
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_09_EVIDENCE_QUESTION_DECISIONS.tsv'
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_09_SERP_COMPARISONS.tsv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: roadmap/kwork-productization-2026-08-28
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build consolidated V39 Step10 user-task clusters
        shell: bash
        run: |
          set -euo pipefail
          python extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_USER_TASK_SERP_CLUSTERING_RUN_V39.py

      - name: Enforce Step10 machine accounting gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_QA.json')
          q = json.loads(p.read_text(encoding='utf-8'))
          assert q['status'] == 'MACHINE_QA_PASS__MANUAL_SEMANTIC_QA_REQUIRED', q
          assert q['total_phrase_keys'] == 2840, q
          assert q['active_search_stage_rows'] == 2332, q
          assert q['input_disposition_counts']['CORE_CANDIDATE'] == 1388, q
          assert q['input_disposition_counts']['REVIEW_SEARCH'] == 944, q
          assert q['review_deferred_preserved'] == 174, q
          assert q['excluded_preserved'] == 334, q
          assert q['direct_step09_probes_consumed'] == 75, q
          assert q['direct_step09_exact_phrase_decisions_consumed'] + q['direct_step09_control_anchors_consumed'] == 75, q
          assert q['duplicate_comparisons_consumed'] == 8, q
          assert q['dup0004_auto_merged'] is False, q
          assert q['unprobed_rows_claiming_direct_serp'] == 0, q
          assert q['silent_drops'] == 0, q
          assert q['manual_semantic_qa_required'] is True, q
          assert q['manual_semantic_qa_pass'] is False, q
          assert q['page_ownership_decisions'] == 0, q
          assert q['structural_action_decisions'] == 0, q
          assert q['cannibalization_decisions'] == 0, q
          assert q['provider_requests'] == 0, q
          print('KW001_OKNO_STEP10_MACHINE_ACCOUNTING_GATE_PASS')
          PY

      - name: Collect V39 full regression audit
        continue-on-error: true
        shell: bash
        run: |
          python extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_V39_FULL_REGRESSION_AUDIT.py

      - name: Collect direct Step09 contradiction audit
        continue-on-error: true
        shell: bash
        run: |
          python extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_DIRECT_EVIDENCE_CONTRADICTION_AUDIT.py

      - name: Collect inherited V38 semantic collision audit
        continue-on-error: true
        shell: bash
        run: |
          python extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_SEMANTIC_COLLISION_AUDIT_V38.py

      - name: Collect inherited V37 unresolved-state audit
        continue-on-error: true
        shell: bash
        run: |
          python extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_UNRESOLVED_ADVERSARIAL_AUDIT_V37.py

      - name: Collect V39 frozen full-manual ledger resolution
        continue-on-error: true
        shell: bash
        run: |
          python extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_V39_DISCOVERY_LEDGER_GATE.py

      - name: Enforce aggregate V39 semantic gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          base = Path('extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK')
          failures = []

          def load_json(name):
              p = base / name
              if not p.exists():
                  failures.append({'gate': name, 'status': 'MISSING_OUTPUT'})
                  return {}
              return json.loads(p.read_text(encoding='utf-8'))

          def load_tsv(name):
              p = base / name
              with p.open('r', encoding='utf-8', newline='') as f:
                  return list(csv.DictReader(f, delimiter='\t'))

          # Non-heuristic gates must be plain PASS.
          for gate, name in (
              ('full_regression', 'STEP_10_V39_FULL_REGRESSION_AUDIT.json'),
              ('direct_evidence', 'STEP_10_DIRECT_EVIDENCE_CONTRADICTION_AUDIT.json'),
              ('discovery_ledger', 'STEP_10_V39_DISCOVERY_LEDGER_GATE.json'),
          ):
              obj = load_json(name)
              if obj and obj.get('status') != 'PASS':
                  failures.append({'gate': gate, 'status': obj.get('status'), 'summary': obj})

          # Exact adjudication of two inherited lexical false positives already
          # reviewed in the frozen 22-row V39 manual ledger.
          collision_obj = load_json('STEP_10_SEMANTIC_COLLISION_AUDIT.json')
          collision_rows = load_tsv('STEP_10_SEMANTIC_COLLISION_AUDIT.tsv')
          exact_collision = {
              ('панорамные окна 2 2', 'WINDOW_DIMENSIONS_INFO', 'TASK_TOKEN_MISMATCH'),
              ('фурнитура оконных сеток', 'MOSQUITO_NETS', 'TASK_TOKEN_MISMATCH'),
          }
          observed_collision = {
              (r.get('phrase',''), r.get('cluster_id',''), r.get('collision_code',''))
              for r in collision_rows
          }
          if collision_obj.get('status') == 'PASS':
              observed_collision = set()
          elif observed_collision != exact_collision:
              failures.append({
                  'gate': 'semantic_collision',
                  'status': collision_obj.get('status'),
                  'expected_exact_residuals': sorted(exact_collision),
                  'observed_residuals': sorted(observed_collision),
              })

          # Exact adjudication of one intentionally unresolved production/provider
          # ambiguity from the frozen V39 manual ledger.
          unresolved_obj = load_json('STEP_10_UNRESOLVED_ADVERSARIAL_AUDIT.json')
          unresolved_rows = load_tsv('STEP_10_UNRESOLVED_ADVERSARIAL_AUDIT.tsv')
          exact_unresolved = {
              ('панорамные окна производство', 'UNRESOLVED_CLEAR_SPECIFIC_WINDOW_PRODUCT'),
          }
          observed_unresolved = {
              (r.get('phrase',''), r.get('audit_code',''))
              for r in unresolved_rows
          }
          if unresolved_obj.get('status') == 'PASS':
              observed_unresolved = set()
          elif observed_unresolved != exact_unresolved:
              failures.append({
                  'gate': 'unresolved',
                  'status': unresolved_obj.get('status'),
                  'expected_exact_residuals': sorted(exact_unresolved),
                  'observed_residuals': sorted(observed_unresolved),
              })

          # Verify current assignments behind every exact adjudication; otherwise
          # a changed state/reason cannot silently inherit the exception.
          amap = {r['phrase']: r for r in load_tsv('STEP_10_CLUSTER_ASSIGNMENTS.tsv')}
          for phrase, cid, _code in exact_collision:
              r = amap.get(phrase, {})
              if r.get('cluster_id') != cid or r.get('cluster_evidence_state') != 'SEMANTIC_SUPPORTED_NO_DIRECT_SERP':
                  failures.append({'gate': 'collision_exact_state', 'phrase': phrase, 'observed': r})
          prod = amap.get('панорамные окна производство', {})
          if not (
              prod.get('cluster_evidence_state') == 'SEARCH_REQUIRED'
              and prod.get('cluster_role') == 'UNRESOLVED'
              and prod.get('additional_search_required') == 'true'
              and prod.get('assignment_reason') == 'Bare production wording can mean manufacturing process or provider/manufacturer search'
          ):
              failures.append({'gate': 'unresolved_exact_state', 'phrase': 'панорамные окна производство', 'observed': prod})

          if failures:
              print(json.dumps({'status': 'FAIL__V39_AGGREGATE_GATES', 'failures': failures}, ensure_ascii=False, indent=2))
              raise SystemExit(f"V39 aggregate semantic gates failed: {len(failures)} gate(s)")

          # Persist adjudicated PASS summaries rather than misleading inherited FAIL.
          collision_obj.update({
              'status': 'PASS',
              'audit_version': 'V39',
              'flagged_rows': 0,
              'flagged_records': 0,
              'collision_counts': {},
              'suppressed_exact_v39_records': len(exact_collision),
              'suppressed_exact_v39_examples': [
                  {'phrase': p, 'cluster_id': c, 'collision_code': code}
                  for p, c, code in sorted(exact_collision)
              ],
              'adjudication_rule_v39': 'Exact phrase + exact frozen V39 target + exact inherited code + exact evidence state only; any drift is blocking.',
          })
          (base / 'STEP_10_SEMANTIC_COLLISION_AUDIT.json').write_text(json.dumps(collision_obj, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          with (base / 'STEP_10_SEMANTIC_COLLISION_AUDIT.tsv').open('w', encoding='utf-8', newline='') as f:
              w = csv.DictWriter(f, fieldnames=['collision_code','phrase','cluster_id','user_task','evidence_state','step09_probe_id','reason'], delimiter='\t', lineterminator='\n')
              w.writeheader()

          unresolved_obj.update({
              'status': 'PASS',
              'audit_version': 'V39',
              'flagged_rows': 0,
              'flagged_records': 0,
              'audit_counts': {},
              'suppressed_exact_v39_records': len(exact_unresolved),
              'suppressed_exact_v39_examples': [
                  {'phrase': p, 'audit_code': code}
                  for p, code in sorted(exact_unresolved)
              ],
              'adjudication_rule_v39': 'Exact reviewed phrase + exact unresolved code + exact current unresolved state/reason only; any drift is blocking.',
          })
          (base / 'STEP_10_UNRESOLVED_ADVERSARIAL_AUDIT.json').write_text(json.dumps(unresolved_obj, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          with (base / 'STEP_10_UNRESOLVED_ADVERSARIAL_AUDIT.tsv').open('w', encoding='utf-8', newline='') as f:
              w = csv.DictWriter(f, fieldnames=['audit_code','phrase','step09_probe_id','observed_serp_job','dominant_result_type','reason'], delimiter='\t', lineterminator='\n')
              w.writeheader()

          print(json.dumps({
              'status': 'PASS',
              'gates': ['full_regression','direct_evidence','semantic_collision_exact_adjudication','unresolved_exact_adjudication','discovery_ledger'],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Commit generated Step10 V39 candidate and audit artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_CLUSTER_ASSIGNMENTS.tsv \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_CLUSTER_SUMMARY.tsv \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_BOUNDARY_REVIEW.tsv \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_QA.json \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_SEMANTIC_QA_SAMPLE.tsv \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_SEMANTIC_COLLISION_AUDIT.tsv \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_SEMANTIC_COLLISION_AUDIT.json \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_DIRECT_EVIDENCE_CONTRADICTION_AUDIT.tsv \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_DIRECT_EVIDENCE_CONTRADICTION_AUDIT.json \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_UNRESOLVED_ADVERSARIAL_AUDIT.tsv \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_UNRESOLVED_ADVERSARIAL_AUDIT.json \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_V39_FULL_REGRESSION_AUDIT.tsv \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_V39_FULL_REGRESSION_AUDIT.json \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_V38_FULL_MANUAL_ERROR_LEDGER.tsv \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_V39_DISCOVERY_LEDGER_GATE.json
          if ! git diff --cached --quiet; then
            git commit -m "step10: rebuild clusters after consolidated V39 full-manual corrections"
            git push origin HEAD:roadmap/kwork-productization-2026-08-28
          fi
