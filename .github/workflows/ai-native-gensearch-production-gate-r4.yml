name: ai-native-gensearch-production-gate-r4

on:
  push:
    branches:
      - candidate/ai-native-gensearch-production-gate-2026-08-28
    paths:
      - .github/workflows/ai-native-gensearch-production-gate-r4.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-r3-complete-predelivery-r4:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Exact product and evidence identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:extension/src)" = '354230e8d68bf4759d98cdba55ec6ba0e0796c63'
          git diff --exit-code 0fdcd0704c0d86f6bc6b915a340494ae456cd3e8 HEAD -- extension/src
          grep -F 'AI_NATIVE_GENSEARCH_PROXY_VALIDATION_PASS' extension/tests/AI_NATIVE_GENSEARCH_PROXY_VALIDATION_FINAL_2026-08-28.md
          grep -F 'GENSEARCH_PRODUCTION_CONTRACT_FROZEN = true' extension/docs/AI_NATIVE_GENSEARCH_PRODUCTION_CONTRACT_2026-08-28.md
          echo 'GENSEARCH_R4_EXACT_PRODUCT_IDENTITY_PASS'

      - name: Download exact accepted R3 artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-native-gensearch-proxy-r3-candidate-0fdcd07
          path: ${{ runner.temp }}/gensearch-r3
          repository: MaksimUnimax/Yandex_direct
          run-id: 33135782475
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify artifact and build exact packaged QA workspace
        shell: bash
        env:
          R3_DIR: ${{ runner.temp }}/gensearch-r3
          EXTRACT_DIR: ${{ runner.temp }}/gensearch-r3-extract
          PACKAGED_ROOT: ${{ runner.temp }}/gensearch-r3-packaged
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,shutil,zipfile
          from pathlib import Path
          repo=Path.cwd(); r3=Path(os.environ['R3_DIR']); extract=Path(os.environ['EXTRACT_DIR']); packaged=Path(os.environ['PACKAGED_ROOT'])
          archive=r3/'yandex-marketing-bridge-0.1.1-gensearch-proxy-validation-r3-candidate.zip'
          manifest=r3/'EXACT_GENSEARCH_PROXY_R3_CANDIDATE_MANIFEST_2026-08-28.json'
          expected_sha='0a32966ae2b873b700e8f3c3ccfdeabd2939189dfed5017f96670d885312c59c'; expected_bytes=134562; expected_files=47
          data=archive.read_bytes(); assert len(data)==expected_bytes; assert hashlib.sha256(data).hexdigest()==expected_sha
          m=json.loads(manifest.read_text(encoding='utf-8')); assert m['source_commit']=='0fdcd0704c0d86f6bc6b915a340494ae456cd3e8'; assert m['sha256']==expected_sha; assert m['bytes']==expected_bytes; assert m['files']==expected_files; assert m['zip_test']=='PASS'; assert m['deterministic_rebuild']=='PASS'; assert m['source_extract_byte_identity']=='PASS'
          entries=m['entries']; assert len(entries)==expected_files
          for p in (extract,packaged):
              if p.exists(): shutil.rmtree(p)
          extract.mkdir(parents=True)
          with zipfile.ZipFile(archive) as zf:
              assert zf.testzip() is None; assert zf.namelist()==entries; zf.extractall(extract)
          source=repo/'extension'/'src'; src_paths=sorted(p.relative_to(source).as_posix() for p in source.rglob('*') if p.is_file()); out_paths=sorted(p.relative_to(extract).as_posix() for p in extract.rglob('*') if p.is_file()); assert src_paths==sorted(entries)==out_paths
          for rel in src_paths: assert (source/rel).read_bytes()==(extract/rel).read_bytes(),rel
          (packaged/'extension'/'src').mkdir(parents=True); (packaged/'extension'/'tests').mkdir(parents=True)
          shutil.copytree(extract,packaged/'extension'/'src',dirs_exist_ok=True); shutil.copytree(repo/'extension'/'tests',packaged/'extension'/'tests',dirs_exist_ok=True)
          print('GENSEARCH_R4_ARCHIVE_SHA='+expected_sha); print('GENSEARCH_R4_ARCHIVE_BYTES='+str(expected_bytes)); print('GENSEARCH_R4_ARCHIVE_FILES='+str(expected_files)); print('GENSEARCH_R4_SOURCE_EXTRACT_BYTE_IDENTITY_PASS')
          PY
          diff -r --no-dereference extension/src "${PACKAGED_ROOT}/extension/src"

      - name: Source and packaged complete regression
        shell: bash
        env:
          PACKAGED_ROOT: ${{ runner.temp }}/gensearch-r3-packaged
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find extension/src -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | sort -z)
          node -e "JSON.parse(require('fs').readFileSync('extension/src/manifest.json','utf8'));JSON.parse(require('fs').readFileSync('extension/src/package.json','utf8'));"
          node --test extension/tests/*.test.mjs
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find "${PACKAGED_ROOT}/extension/src" -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | sort -z)
          node -e "JSON.parse(require('fs').readFileSync('${PACKAGED_ROOT}/extension/src/manifest.json','utf8'));JSON.parse(require('fs').readFileSync('${PACKAGED_ROOT}/extension/src/package.json','utf8'));"
          node --test "${PACKAGED_ROOT}"/extension/tests/*.test.mjs
          echo 'GENSEARCH_R4_SOURCE_AND_PACKAGED_COMPLETE_REGRESSION_PASS'

      - name: Install qualified Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false puppeteer@24
          npx puppeteer browsers install chrome
          command -v xvfb-run
          echo 'GENSEARCH_R4_QUALIFIED_CHROME_READY'

      - name: Prepare timing-stable legacy QA copies
        shell: bash
        env:
          PACKAGED_ROOT: ${{ runner.temp }}/gensearch-r3-packaged
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ['PACKAGED_ROOT'])/'extension'/'tests'/'qa_browser'

          # Direct manual lifecycle: remove the ready-check/click TOCTOU window, preserving the same eventual click requirement.
          src_path=root/'direct_manual_worker_lifecycle.mjs'; dst=root/'.gensearch_direct_manual_worker_lifecycle_stable.mjs'; src=src_path.read_text(encoding='utf-8')
          old="async function clickLatestAction(page){return page.evaluate(()=>{const buttons=[...(document.querySelector('#ymb-external-action-surface')?.shadowRoot?.querySelectorAll('.ymb-action')||[])];const button=buttons.at(-1);if(!button)throw new Error('NO_MANUAL_ACTION');if(button.disabled)throw new Error('MANUAL_ACTION_NOT_READY');button.click();return buttons.length;});}"
          new="async function clickLatestAction(page){return waitUntil(async()=>page.evaluate(()=>{const buttons=[...(document.querySelector('#ymb-external-action-surface')?.shadowRoot?.querySelectorAll('.ymb-action')||[])];const button=buttons.at(-1);if(!button||button.disabled)return false;button.click();return buttons.length||false;}),'MANUAL_ACTION_CLICK_NOT_READY',60000);}"
          assert src.count(old)==1; dst.write_text(src.replace(old,new,1),encoding='utf-8',newline='\n')

          # Phase2 compat: wait for the second tab content script identity instead of reading before mount.
          p2=root/'phase2-stage4'; src_path=p2/'browser_phase2_stage4_compat_gate.mjs'; dst2=p2/'.gensearch_phase2_stage4_compat_stable.mjs'; src=src_path.read_text(encoding='utf-8')
          start_marker='const secondIdentity=await worker.evaluate('; end_marker=",SECOND_URL);assert.equal(secondIdentity?.response?.ok,true);"; start=src.find(start_marker); end=src.find(end_marker,start); assert start>=0 and end>=0 and src.find(start_marker,start+1)<0
          call_start=start+len('const secondIdentity=await '); call_end=end+len(',SECOND_URL)'); call=src[call_start:call_end]
          repl="const secondIdentity=await waitUntil(async()=>{const value=await "+call+";return value?.response?.ok===true?value:false;},'B03_SECOND_IDENTITY_NOT_READY',60000);assert.equal(secondIdentity?.response?.ok,true);"
          dst2.write_text(src[:start]+repl+src[end+len(end_marker):],encoding='utf-8',newline='\n')

          # Phase2 full: preserve popup assertions but allow Chrome enough time to create/refresh the extension popup.
          src_path=p2/'browser_phase2_stage4_gate.mjs'; dst3=p2/'.gensearch_phase2_stage4_full_stable.mjs'; src=src_path.read_text(encoding='utf-8'); start=src.find('async function openPopup(worker, browser, key) {'); end=src.find('\nasync function closePopup(',start); assert start>=0 and end>start
          block=src[start:end]; assert block.count('{ timeout:10000 }')==2; assert block.count("'POPUP_INITIAL_REFRESH_NOT_COMPLETE', 10000")==1
          stable=block.replace('{ timeout:10000 }','{ timeout:60000 }').replace("'POPUP_INITIAL_REFRESH_NOT_COMPLETE', 10000","'POPUP_INITIAL_REFRESH_NOT_COMPLETE', 60000")
          dst3.write_text(src[:start]+stable+src[end:],encoding='utf-8',newline='\n')
          print('GENSEARCH_R4_LEGACY_TIMING_STABLE_COPIES_READY')
          PY
          node --check "${PACKAGED_ROOT}/extension/tests/qa_browser/.gensearch_direct_manual_worker_lifecycle_stable.mjs"
          node --check "${PACKAGED_ROOT}/extension/tests/qa_browser/phase2-stage4/.gensearch_phase2_stage4_compat_stable.mjs"
          node --check "${PACKAGED_ROOT}/extension/tests/qa_browser/phase2-stage4/.gensearch_phase2_stage4_full_stable.mjs"

      - name: Complete exact-packaged browser campaign
        shell: bash
        env:
          PACKAGED_ROOT: ${{ runner.temp }}/gensearch-r3-packaged
        run: |
          set -euo pipefail
          ln -s "${GITHUB_WORKSPACE}/node_modules" "${PACKAGED_ROOT}/node_modules"
          Q="${PACKAGED_ROOT}/extension/tests/qa_browser"

          xvfb-run -a node "$Q/gensearch_browser_runtime.mjs" | tee /tmp/gensearch-browser.log
          for m in GENSEARCH_BROWSER_ONE_REQUEST_PASS GENSEARCH_BROWSER_PROVIDER_CONTRACT_PASS GENSEARCH_BROWSER_RESPONSE_PROVENANCE_PASS GENSEARCH_BROWSER_NO_RETRY_PASS GENSEARCH_BROWSER_REAL_YANDEX_REQUESTS=0 AI_NATIVE_GENSEARCH_BROWSER_RUNTIME_PASS; do grep -F "$m" /tmp/gensearch-browser.log; done

          xvfb-run -a node "$Q/direct_browser_runtime.mjs" | tee /tmp/direct-browser.log
          grep -F 'PHASE5_DIRECT_BROWSER_RUNTIME_PASS' /tmp/direct-browser.log; grep -F 'D20_CONTROLLED_REAL_YANDEX_REQUESTS=0' /tmp/direct-browser.log
          xvfb-run -a node "$Q/direct_popup_d18.mjs" | tee /tmp/direct-popup.log
          grep -F 'PHASE5_DIRECT_POPUP_D18_PASS' /tmp/direct-popup.log
          xvfb-run -a node "$Q/.gensearch_direct_manual_worker_lifecycle_stable.mjs" | tee /tmp/direct-lifecycle.log
          grep -F 'PHASE5_DIRECT_MANUAL_LIFECYCLE_PASS' /tmp/direct-lifecycle.log; grep -F 'D20_DIRECT_LIFECYCLE_REAL_YANDEX_REQUESTS=0' /tmp/direct-lifecycle.log
          xvfb-run -a node "$Q/direct_codex_gate_addendum_v2.mjs" | tee /tmp/direct-addendum.log
          grep -F 'PHASE5_DIRECT_CODEX_BROWSER_ADDENDUM_PASS' /tmp/direct-addendum.log; grep -F 'DIRECT_REAL_YANDEX_REQUESTS=0' /tmp/direct-addendum.log
          echo 'GENSEARCH_R4_PRIOR_DIRECT_BROWSER_PASS'

          P2="$Q/phase2-stage4"
          xvfb-run -a node "$P2/.gensearch_phase2_stage4_compat_stable.mjs" | tee /tmp/phase2-compat.log
          grep -F 'PHASE2_STAGE4_COMPAT_BROWSER_GATE_PASS' /tmp/phase2-compat.log; grep -F 'BROWSER_GATE_REAL_YANDEX_REQUESTS=0' /tmp/phase2-compat.log
          echo 'GENSEARCH_R4_PRIOR_PHASE2_COMPAT_PASS'

          CHROME_BIN="$(node --input-type=module -e "import puppeteer from 'puppeteer';console.log(puppeteer.executablePath())")"
          test -x "${CHROME_BIN}"
          xvfb-run -a node "$P2/.gensearch_phase2_stage4_full_stable.mjs" "${CHROME_BIN}" "${PACKAGED_ROOT}/extension/src" "$P2/qa-chatgpt-local.key.pem" "$P2/qa-chatgpt-local.cert.pem" | tee /tmp/phase2-full.log
          grep -F 'PHASE2_STAGE4_BROWSER_GATE_PASS' /tmp/phase2-full.log
          echo 'GENSEARCH_R4_PRIOR_PHASE2_FULL_BROWSER_PASS'
          echo 'GENSEARCH_R4_COMPLETE_EXACT_PACKAGED_BROWSER_CAMPAIGN_PASS'

      - name: Final immutability and zero-real-provider audit
        shell: bash
        env:
          EXTRACT_DIR: ${{ runner.temp }}/gensearch-r3-extract
          PACKAGED_ROOT: ${{ runner.temp }}/gensearch-r3-packaged
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:extension/src)" = '354230e8d68bf4759d98cdba55ec6ba0e0796c63'
          git diff --exit-code 0fdcd0704c0d86f6bc6b915a340494ae456cd3e8 HEAD -- extension/src
          diff -r --no-dereference extension/src "${EXTRACT_DIR}"
          diff -r --no-dereference extension/src "${PACKAGED_ROOT}/extension/src"
          grep -F 'GENSEARCH_BROWSER_REAL_YANDEX_REQUESTS=0' /tmp/gensearch-browser.log
          grep -F 'D20_CONTROLLED_REAL_YANDEX_REQUESTS=0' /tmp/direct-browser.log
          grep -F 'D20_DIRECT_LIFECYCLE_REAL_YANDEX_REQUESTS=0' /tmp/direct-lifecycle.log
          grep -F 'DIRECT_REAL_YANDEX_REQUESTS=0' /tmp/direct-addendum.log
          grep -F 'BROWSER_GATE_REAL_YANDEX_REQUESTS=0' /tmp/phase2-compat.log
          echo 'REAL_YANDEX_REQUESTS_DURING_GENSEARCH_PRODUCTION_GATE_R4=0'
          echo 'GENSEARCH_R4_PRODUCT_BYTES_POST_GATE=IDENTICAL'
          echo 'AI_NATIVE_GENSEARCH_PRODUCTION_GATE_R4_PASS'
