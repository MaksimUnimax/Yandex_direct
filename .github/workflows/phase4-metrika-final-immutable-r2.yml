name: Phase 4 Metrika final immutable r2

on:
  push:
    branches:
      - automation/phase4-metrika-final-immutable-r2-2026-08-26
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FREEZE_RUN_ID: '32953269753'
  PUBLISHED_ARTIFACT_NAME: phase4-metrika-first-slice-exact-64344575
  ARTIFACT_ID: '9600980289'
  ARTIFACT_OUTER_BYTES: '129246'
  ARTIFACT_OUTER_DIGEST: sha256:0f252b5a5a39b04b0d6d911f5423a8cf69991a5c50ec6f49f3fd6493250db75a
  CANDIDATE_ZIP: yandex-marketing-bridge-0.1.1-phase4-metrika-first-slice-candidate.zip
  CANDIDATE_SHA256: 99c3719b447185481125964f0ff543c4c706714f9fe23fe150b7a8fbc8700217
  CANDIDATE_BYTES: '117375'
  CANDIDATE_FILES: '42'
  CANDIDATE_ENTRIES: '46'
  CANDIDATE_TESTS: '38'
  CANDIDATE_TEST_FILES: '4'
  FREEZE_ROOT: yandex-marketing-bridge-0.1.1-phase4-metrika-first-slice-candidate
  PRODUCT_SOURCE_HEAD: 643445758e86d3b06ac42a6daea5c97b6e9223c7
  PRODUCT_SOURCE_REF: candidate/phase4-metrika-first-slice-64344575-2026-08-26
  MAIN_EXPECTED_HEAD: 628656a1fdd5a8f44144014f3500171b85b7fa16
  BROWSER_QA_COMMIT: f0a174f40dc9de66a8e57e6010b4ea8149e90c54
  BROWSER_HARNESS_BLOB: ae77710520c70f769a51b170ca2880e19f8f57d1
  BROWSER_PATCHER_BLOB: 0d495057753cd36961e015344360790a77599507
  PUPPETEER_VERSION: 24.43.1
  LIFECYCLE_ADAPTER_BLOB: a7a3f3884563ae8ba123f335bee8d5f61e1b783c
  LIFECYCLE_R4_PATCH_BLOB: 0c0ab000f2c371f9ecd1c65537e320a81746589c
  M14_STABILITY_RUN_ID: '32955166040'
  M14_STABILITY_HEAD: a7a25b6cee729f63c67c2177b7009765b1dbb637
  PROVEN_W14_COMMIT: 2b58a9ed8284bded97ed6e8bff772502ee133f76
  HISTORICAL_STAGE4_COMMIT: 667fda2f9a0e4197c4873ea96f27862c8453f2f0
  CHROME_VERSION: 151.0.7922.47

jobs:
  artifact-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lock QA-only head, candidate ref and main start
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only "$PRODUCT_SOURCE_HEAD" HEAD -- extension/src)"
          git fetch --no-tags origin "$PRODUCT_SOURCE_REF" main
          test "$(git rev-parse "origin/$PRODUCT_SOURCE_REF")" = "$PRODUCT_SOURCE_HEAD"
          test "$(git rev-parse origin/main)" = "$MAIN_EXPECTED_HEAD"
          test "$(git hash-object extension/tests/qa_browser/patch_m14_receiver_owner_quiescence_r4.mjs)" = "$LIFECYCLE_R4_PATCH_BLOB"
          echo "PHASE4_R2_FINAL_MAIN_START=$MAIN_EXPECTED_HEAD"
          echo PHASE4_R2_FINAL_QA_ONLY_PRODUCT_IMMUTABILITY_PASS

      - name: Verify published artifact and M14 stability metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/MaksimUnimax/Yandex_direct/actions/artifacts/$ARTIFACT_ID" > /tmp/p4-r2-artifact-meta.json
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/MaksimUnimax/Yandex_direct/actions/runs/$M14_STABILITY_RUN_ID" > /tmp/p4-r2-m14-stability.json
          python3 - <<'PY'
          import json, os
          a=json.load(open('/tmp/p4-r2-artifact-meta.json'))
          assert str(a['id']) == os.environ['ARTIFACT_ID']
          assert a['name'] == os.environ['PUBLISHED_ARTIFACT_NAME']
          assert str(a['size_in_bytes']) == os.environ['ARTIFACT_OUTER_BYTES']
          assert a.get('digest') == os.environ['ARTIFACT_OUTER_DIGEST']
          assert a['expired'] is False
          assert str(a['workflow_run']['id']) == os.environ['FREEZE_RUN_ID']
          s=json.load(open('/tmp/p4-r2-m14-stability.json'))
          assert str(s['id']) == os.environ['M14_STABILITY_RUN_ID']
          assert s['head_sha'] == os.environ['M14_STABILITY_HEAD']
          assert s['conclusion'] == 'success'
          print('PHASE4_R2_M00_PUBLISHED_ARTIFACT_METADATA_PASS')
          print('PHASE4_R2_M14_STABILITY_3X_METADATA_PASS')
          PY

      - name: Download exact published artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PUBLISHED_ARTIFACT_NAME }}
          path: /tmp/p4-r2-final-artifact
          github-token: ${{ github.token }}
          repository: MaksimUnimax/Yandex_direct
          run-id: ${{ env.FREEZE_RUN_ID }}

      - name: Verify exact artifact identity, manifest and M01-M18 coverage
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/p4-r2-final-artifact
          python3 - <<'PY'
          from pathlib import Path
          expected={'SHA256SUMS.txt','freeze-manifest.json','prefreeze_coverage_map.json','yandex-marketing-bridge-0.1.1-phase4-metrika-first-slice-candidate.zip'}
          actual={p.name for p in Path('.').iterdir() if p.is_file()}
          assert actual == expected, (actual, expected)
          print('PHASE4_R2_M00_PUBLISHED_FILESET_PASS')
          PY
          sha256sum -c SHA256SUMS.txt
          test "$(sha256sum "$CANDIDATE_ZIP" | awk '{print $1}')" = "$CANDIDATE_SHA256"
          test "$(stat -c '%s' "$CANDIDATE_ZIP")" = "$CANDIDATE_BYTES"
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path('/tmp/p4-r2-final-artifact')
          m=json.loads((root/'freeze-manifest.json').read_text(encoding='utf-8'))
          z=root/os.environ['CANDIDATE_ZIP']
          assert m['format']=='YMB_PHASE4_METRIKA_EXACT_CANDIDATE_V1'
          assert m['root_name']==os.environ['FREEZE_ROOT']
          assert m['source_ref']==os.environ['PRODUCT_SOURCE_REF']
          assert m['source_commit']==os.environ['PRODUCT_SOURCE_HEAD']
          assert hashlib.sha256(z.read_bytes()).hexdigest()==m['sha256']==os.environ['CANDIDATE_SHA256']
          assert z.stat().st_size==m['bytes']==int(os.environ['CANDIDATE_BYTES'])
          assert m['files']==int(os.environ['CANDIDATE_FILES'])
          assert m['entries']==int(os.environ['CANDIDATE_ENTRIES'])
          assert m['zip_test']=='PASS'
          paths=[r['path'] for r in m['payload']]
          test_files=[p for p in paths if p.startswith('tests/') and p.endswith('.test.mjs')]
          assert len(test_files)==int(os.environ['CANDIDATE_TEST_FILES'])
          assert all('qa_browser/' not in p and 'qa_transport/' not in p and not p.endswith('.pem') for p in paths)
          c=json.loads((root/'prefreeze_coverage_map.json').read_text(encoding='utf-8'))
          assert c['format']=='YMB_PHASE4_METRIKA_PREFREEZE_COVERAGE_V1'
          assert c['product_source']==os.environ['PRODUCT_SOURCE_HEAD']
          for i in range(1,19):
              key=f'M-{i:02d}'
              row=c['gates'][key]
              assert row['status']=='DEVELOPMENT_PASS', (key,row)
              assert row.get('evidence'), key
              assert 'NOT_RUN' not in json.dumps(row), key
          assert c['enabled_not_run_count_M01_M18']==0
          print('PHASE4_R2_M00_PUBLISHED_ARTIFACT_IDENTITY_PASS')
          print('PHASE4_R2_M01_M18_COVERAGE_NO_NOT_RUN_PASS')
          PY

      - name: Run full 38-test suite from fresh frozen ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 extension/tests/qa_transport/phase4-metrika-candidate/run_packaged_suite.py \
            --archive "/tmp/p4-r2-final-artifact/$CANDIDATE_ZIP" \
            --manifest /tmp/p4-r2-final-artifact/freeze-manifest.json \
            --work-dir /tmp/p4-r2-final-artifact/packaged-suite | tee /tmp/p4-r2-final-packaged.log
          grep -F "# tests $CANDIDATE_TESTS" /tmp/p4-r2-final-packaged.log
          grep -F "# pass $CANDIDATE_TESTS" /tmp/p4-r2-final-packaged.log
          grep -F '# fail 0' /tmp/p4-r2-final-packaged.log
          grep -F '# skipped 0' /tmp/p4-r2-final-packaged.log
          grep -F 'PHASE4_PACKAGE_EXACT_IDENTITY_PASS' /tmp/p4-r2-final-packaged.log
          grep -F 'PHASE4_PACKAGED_LAYOUT_IDENTITY_PASS' /tmp/p4-r2-final-packaged.log
          grep -F "PHASE4_PACKAGED_SUITE_PASS files=$CANDIDATE_TEST_FILES" /tmp/p4-r2-final-packaged.log
          grep -F 'PHASE4_PACKAGED_PREDELIVERY_PREFLIGHT_PASS' /tmp/p4-r2-final-packaged.log
          echo PHASE4_R2_M19_PACKAGED_38_OF_38_PASS

  browser-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert QA-only head
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only "$PRODUCT_SOURCE_HEAD" HEAD -- extension/src)"
          echo PHASE4_R2_FINAL_BROWSER_QA_ONLY_PASS

      - name: Download exact published artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PUBLISHED_ARTIFACT_NAME }}
          path: /tmp/p4-r2-final-runtime/published
          github-token: ${{ github.token }}
          repository: MaksimUnimax/Yandex_direct
          run-id: ${{ env.FREEZE_RUN_ID }}

      - name: Build browser product only from verified frozen bytes and pin harness
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/p4-r2-final-runtime/published && sha256sum -c SHA256SUMS.txt)
          python3 - <<'PY'
          import hashlib, json, os, shutil, zipfile
          from pathlib import Path
          base=Path('/tmp/p4-r2-final-runtime'); pub=base/'published'; archive=pub/os.environ['CANDIDATE_ZIP']
          m=json.loads((pub/'freeze-manifest.json').read_text(encoding='utf-8'))
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==m['sha256']==os.environ['CANDIDATE_SHA256']
          assert archive.stat().st_size==m['bytes']==int(os.environ['CANDIDATE_BYTES'])
          assert m['source_commit']==os.environ['PRODUCT_SOURCE_HEAD']
          frozen=base/'frozen'
          if frozen.exists(): shutil.rmtree(frozen)
          with zipfile.ZipFile(archive) as z: z.extractall(frozen)
          root=frozen/m['root_name']; ext=base/'extension'
          if ext.exists(): shutil.rmtree(ext)
          (ext/'src').mkdir(parents=True); (ext/'tests'/'qa_browser').mkdir(parents=True)
          expected={}
          for row in m['payload']:
              rel=row['path']
              if rel.startswith('tests/'): continue
              data=(root/rel).read_bytes(); assert len(data)==row['bytes']; assert hashlib.sha256(data).hexdigest()==row['sha256']
              dst=ext/'src'/rel; dst.parent.mkdir(parents=True, exist_ok=True); dst.write_bytes(data); expected[rel]=row['sha256']
          actual={p.relative_to(ext/'src').as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in (ext/'src').rglob('*') if p.is_file()}
          assert actual==expected
          print(f'PHASE4_R2_FINAL_BROWSER_FROZEN_PRODUCT_IDENTITY_PASS files={len(actual)}')
          PY
          git fetch --no-tags --depth=1 origin "$BROWSER_QA_COMMIT"
          git show "$BROWSER_QA_COMMIT:extension/tests/qa_browser/metrika_browser_runtime.mjs" > /tmp/p4-r2-final-runtime/extension/tests/qa_browser/metrika_browser_runtime.mjs
          git show "$BROWSER_QA_COMMIT:extension/tests/qa_browser/patch_metrika_browser_runtime_r2.mjs" > /tmp/p4-r2-final-runtime/extension/tests/qa_browser/patch_metrika_browser_runtime_r2.mjs
          test "$(git hash-object /tmp/p4-r2-final-runtime/extension/tests/qa_browser/metrika_browser_runtime.mjs)" = "$BROWSER_HARNESS_BLOB"
          test "$(git hash-object /tmp/p4-r2-final-runtime/extension/tests/qa_browser/patch_metrika_browser_runtime_r2.mjs)" = "$BROWSER_PATCHER_BLOB"
          node /tmp/p4-r2-final-runtime/extension/tests/qa_browser/patch_metrika_browser_runtime_r2.mjs /tmp/p4-r2-final-runtime/extension/tests/qa_browser/metrika_browser_runtime.mjs | tee /tmp/p4-r2-final-runtime-patch.log
          grep -F 'PHASE4_METRIKA_BROWSER_HARNESS_R2_SOURCE_IDENTITY_PASS' /tmp/p4-r2-final-runtime-patch.log
          grep -F 'PHASE4_METRIKA_BROWSER_HARNESS_R2_INITIAL_QUIESCENCE_PASS' /tmp/p4-r2-final-runtime-patch.log
          grep -F 'PHASE4_METRIKA_BROWSER_HARNESS_LITERAL_CLOSURE_PATCH_PASS' /tmp/p4-r2-final-runtime-patch.log
          node --check /tmp/p4-r2-final-runtime/extension/tests/qa_browser/metrika_browser_runtime.mjs
          echo PHASE4_R2_FINAL_BROWSER_PINNED_HARNESS_PASS

      - name: Install pinned proven browser route
        working-directory: /tmp/p4-r2-final-runtime/extension
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save --package-lock=false "puppeteer@$PUPPETEER_VERSION"
          npx puppeteer browsers install chrome
          test "$(node -p "require('puppeteer/package.json').version")" = "$PUPPETEER_VERSION"
          command -v xvfb-run
          echo "PHASE4_R2_FINAL_PUPPETEER_VERSION=$PUPPETEER_VERSION"

      - name: Run literal controlled popup runtime from frozen product
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a node /tmp/p4-r2-final-runtime/extension/tests/qa_browser/metrika_browser_runtime.mjs | tee /tmp/p4-r2-final-runtime.log
          for marker in \
            M15_POPUP_GEOMETRY_AND_FOUR_SERVICE_UI_PASS \
            M15_METRIKA_POLICY_INTERNAL_SCROLL_PASS \
            M15_CREDENTIAL_SAVE_RERENDER_SECRET_REDACTION_PASS \
            M04_M15_BLANK_METRIKA_SAVE_PRESERVES_CREDENTIAL_PASS \
            M04_M15_COMMON_SAVE_PRESERVES_CREDENTIALS_PASS \
            M15_FOUR_SERVICE_SWITCH_CREDENTIAL_ISOLATION_PASS \
            M05_M15_METRIKA_CHECK_ONE_GET_PASS \
            M07_M09_CONTROLLED_WORKER_PROVIDER_BOUNDARY_PASS \
            M04_M16_BACKUP_CHECKSUM_TAMPER_REJECTS_BEFORE_MUTATION_PASS \
            M16_BACKUP_V3_FOUR_SERVICE_EXPORT_IMPORT_PASS \
            M15_REOPEN_RERENDER_SECRET_BLANK_PASS \
            M19_CONTROLLED_REAL_YANDEX_REQUESTS=0 \
            PHASE4_METRIKA_BROWSER_RUNTIME_PASS; do
            grep -F "$marker" /tmp/p4-r2-final-runtime.log
          done
          if grep -E 'm4-(wordstat-secret|search-secret|webmaster-oauth|metrika-oauth|mutated-token|tampered-token)' /tmp/p4-r2-final-runtime.log; then
            echo PHASE4_R2_FINAL_BROWSER_SECRET_LEAK_FAIL
            exit 1
          fi
          echo PHASE4_R2_FINAL_CONTROLLED_POPUP_RUNTIME_PASS

      - name: Reverify frozen product after popup browser
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          base=Path('/tmp/p4-r2-final-runtime'); m=json.loads((base/'published/freeze-manifest.json').read_text(encoding='utf-8')); src=base/'extension/src'
          expected={r['path']:r['sha256'] for r in m['payload'] if not r['path'].startswith('tests/')}
          actual={p.relative_to(src).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in src.rglob('*') if p.is_file()}
          assert actual==expected
          print('PHASE4_R2_FINAL_BROWSER_PRODUCT_BYTES_IDENTICAL')
          PY

  lifecycle-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert QA-only head and pin r4 lifecycle patch
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only "$PRODUCT_SOURCE_HEAD" HEAD -- extension/src)"
          test "$(git hash-object extension/tests/qa_browser/patch_m14_receiver_owner_quiescence_r4.mjs)" = "$LIFECYCLE_R4_PATCH_BLOB"
          node --check extension/tests/qa_browser/patch_m14_receiver_owner_quiescence_r4.mjs
          echo PHASE4_R2_FINAL_LIFECYCLE_QA_ONLY_PASS

      - name: Download exact published artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PUBLISHED_ARTIFACT_NAME }}
          path: /tmp/p4-r2-final-lifecycle/published
          github-token: ${{ github.token }}
          repository: MaksimUnimax/Yandex_direct
          run-id: ${{ env.FREEZE_RUN_ID }}

      - name: Build lifecycle product only from verified frozen bytes
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/p4-r2-final-lifecycle/published && sha256sum -c SHA256SUMS.txt)
          python3 - <<'PY'
          import hashlib, json, os, shutil, zipfile
          from pathlib import Path
          base=Path('/tmp/p4-r2-final-lifecycle'); pub=base/'published'; archive=pub/os.environ['CANDIDATE_ZIP']
          m=json.loads((pub/'freeze-manifest.json').read_text(encoding='utf-8'))
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==m['sha256']==os.environ['CANDIDATE_SHA256']
          assert m['source_commit']==os.environ['PRODUCT_SOURCE_HEAD']
          frozen=base/'frozen'
          if frozen.exists(): shutil.rmtree(frozen)
          with zipfile.ZipFile(archive) as z: z.extractall(frozen)
          root=frozen/m['root_name']; ext=base/'extension'
          if ext.exists(): shutil.rmtree(ext)
          (ext/'src').mkdir(parents=True)
          expected={}
          for row in m['payload']:
              rel=row['path']
              if rel.startswith('tests/'): continue
              data=(root/rel).read_bytes(); assert len(data)==row['bytes']; assert hashlib.sha256(data).hexdigest()==row['sha256']
              dst=ext/'src'/rel; dst.parent.mkdir(parents=True, exist_ok=True); dst.write_bytes(data); expected[rel]=row['sha256']
          actual={p.relative_to(ext/'src').as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in (ext/'src').rglob('*') if p.is_file()}
          assert actual==expected
          print(f'PHASE4_R2_FINAL_LIFECYCLE_FROZEN_PRODUCT_IDENTITY_PASS files={len(actual)}')
          PY

      - name: Prepare pinned qualified two-route lifecycle harness with r4 quiescence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p4-r2-final-lifecycle/harness
          git fetch --no-tags --depth=1 origin "$PROVEN_W14_COMMIT"
          git fetch --no-tags --depth=1 origin "$HISTORICAL_STAGE4_COMMIT"
          git fetch --no-tags --depth=1 origin "$BROWSER_QA_COMMIT"
          git show "$PROVEN_W14_COMMIT:extension/tests/qa_browser/webmaster_lifecycle_button_gate.mjs" > /tmp/p4-r2-final-lifecycle/harness/metrika_list_lifecycle.mjs
          cp /tmp/p4-r2-final-lifecycle/harness/metrika_list_lifecycle.mjs /tmp/p4-r2-final-lifecycle/harness/metrika_summary_lifecycle.mjs
          git show "$PROVEN_W14_COMMIT:extension/tests/qa_browser/patch_w14_bootstrap.mjs" > /tmp/p4-r2-final-lifecycle/harness/patch_w14_bootstrap.mjs
          git show "$BROWSER_QA_COMMIT:extension/tests/qa_browser/patch_m14_metrika_from_w14.mjs" > /tmp/p4-r2-final-lifecycle/harness/patch_m14_metrika_from_w14.mjs
          cp extension/tests/qa_browser/patch_m14_receiver_owner_quiescence_r4.mjs /tmp/p4-r2-final-lifecycle/harness/patch_m14_receiver_owner_quiescence_r4.mjs
          git show "$HISTORICAL_STAGE4_COMMIT:extension/tests/qa_browser/phase2-stage4/qa-chatgpt-local.key.pem" > /tmp/p4-r2-final-lifecycle/harness/qa-chatgpt-local.key.pem
          git show "$HISTORICAL_STAGE4_COMMIT:extension/tests/qa_browser/phase2-stage4/qa-chatgpt-local.cert.pem" > /tmp/p4-r2-final-lifecycle/harness/qa-chatgpt-local.cert.pem
          test "$(git hash-object /tmp/p4-r2-final-lifecycle/harness/metrika_list_lifecycle.mjs)" = "ea8f3ab6bae9a0e14423133b4654c31f86a3d51a"
          test "$(git hash-object /tmp/p4-r2-final-lifecycle/harness/metrika_summary_lifecycle.mjs)" = "ea8f3ab6bae9a0e14423133b4654c31f86a3d51a"
          test "$(git hash-object /tmp/p4-r2-final-lifecycle/harness/patch_w14_bootstrap.mjs)" = "ae9296721d7dcb56d1a5f33172b1e404962be900"
          test "$(git hash-object /tmp/p4-r2-final-lifecycle/harness/patch_m14_metrika_from_w14.mjs)" = "$LIFECYCLE_ADAPTER_BLOB"
          test "$(git hash-object /tmp/p4-r2-final-lifecycle/harness/patch_m14_receiver_owner_quiescence_r4.mjs)" = "$LIFECYCLE_R4_PATCH_BLOB"
          node /tmp/p4-r2-final-lifecycle/harness/patch_m14_metrika_from_w14.mjs /tmp/p4-r2-final-lifecycle/harness/metrika_list_lifecycle.mjs list
          node /tmp/p4-r2-final-lifecycle/harness/patch_w14_bootstrap.mjs /tmp/p4-r2-final-lifecycle/harness/metrika_list_lifecycle.mjs
          node /tmp/p4-r2-final-lifecycle/harness/patch_m14_receiver_owner_quiescence_r4.mjs /tmp/p4-r2-final-lifecycle/harness/metrika_list_lifecycle.mjs
          node /tmp/p4-r2-final-lifecycle/harness/patch_m14_metrika_from_w14.mjs /tmp/p4-r2-final-lifecycle/harness/metrika_summary_lifecycle.mjs summary
          node /tmp/p4-r2-final-lifecycle/harness/patch_w14_bootstrap.mjs /tmp/p4-r2-final-lifecycle/harness/metrika_summary_lifecycle.mjs
          node /tmp/p4-r2-final-lifecycle/harness/patch_m14_receiver_owner_quiescence_r4.mjs /tmp/p4-r2-final-lifecycle/harness/metrika_summary_lifecycle.mjs
          node --check /tmp/p4-r2-final-lifecycle/harness/metrika_list_lifecycle.mjs
          node --check /tmp/p4-r2-final-lifecycle/harness/metrika_summary_lifecycle.mjs
          cd /tmp/p4-r2-final-lifecycle/harness
          npm init -y >/dev/null 2>&1
          npm install --no-save --ignore-scripts puppeteer-core@25.4.0 >/dev/null
          curl -fsSL "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64/chrome-linux64.zip" -o /tmp/p4-r2-chrome.zip
          unzip -q /tmp/p4-r2-chrome.zip -d /tmp/p4-r2-chrome
          chmod +x /tmp/p4-r2-chrome/chrome-linux64/chrome
          /tmp/p4-r2-chrome/chrome-linux64/chrome --version | grep -F "$CHROME_VERSION"
          command -v xvfb-run
          echo PHASE4_R2_FINAL_M14_PINNED_CFT_ROUTE_PASS

      - name: Run frozen listCounters lifecycle
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/p4-r2-final-lifecycle/harness
          xvfb-run -a node metrika_list_lifecycle.mjs /tmp/p4-r2-chrome/chrome-linux64/chrome /tmp/p4-r2-final-lifecycle/extension/src qa-chatgpt-local.key.pem qa-chatgpt-local.cert.pem | tee /tmp/p4-r2-final-m14-list.log
          for marker in \
            M14_OWNER_RECEIVER_READY_PASS \
            M14_OWNER_RECEIVER_RELOAD_QUIESCENCE_PASS \
            M14_METRIKA_ACTIVE_SERVICE_PASS \
            M14_METRIKA_INITIAL_ACTION_ENABLED_PASS \
            M14_METRIKA_ONE_MANUAL_ADMISSION_PASS \
            M14_METRIKA_ONE_CONTROLLED_PROVIDER_REQUEST_PASS \
            M14_METRIKA_REAL_COMPLETION_REENABLE_PASS \
            M14_METRIKA_OPERATION_BLOCKED_NO_DISPATCH_PASS \
            M14_METRIKA_OPERATION_REENABLE_PASS \
            M14_METRIKA_DELIVERY_BLOCKED_NO_DISPATCH_PASS \
            M14_METRIKA_DELIVERY_REENABLE_PASS \
            M14_METRIKA_PROVIDER_HITS=1 \
            M14_METRIKA_REAL_YANDEX_REQUESTS=0 \
            M14_METRIKA_LIFECYCLE_BROWSER_PASS; do
            grep -F "$marker" /tmp/p4-r2-final-m14-list.log
          done
          echo PHASE4_R2_FINAL_M14_LISTCOUNTERS_PASS

      - name: Run frozen getTrafficSummary lifecycle
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/p4-r2-final-lifecycle/harness
          xvfb-run -a node metrika_summary_lifecycle.mjs /tmp/p4-r2-chrome/chrome-linux64/chrome /tmp/p4-r2-final-lifecycle/extension/src qa-chatgpt-local.key.pem qa-chatgpt-local.cert.pem | tee /tmp/p4-r2-final-m14-summary.log
          for marker in \
            M14_OWNER_RECEIVER_READY_PASS \
            M14_OWNER_RECEIVER_RELOAD_QUIESCENCE_PASS \
            M14_METRIKA_SUMMARY_ACTIVE_SERVICE_PASS \
            M14_METRIKA_SUMMARY_INITIAL_ACTION_ENABLED_PASS \
            M14_METRIKA_SUMMARY_ONE_MANUAL_ADMISSION_PASS \
            M14_METRIKA_SUMMARY_ONE_CONTROLLED_PROVIDER_REQUEST_PASS \
            M14_METRIKA_SUMMARY_REAL_COMPLETION_REENABLE_PASS \
            M14_METRIKA_SUMMARY_OPERATION_BLOCKED_NO_DISPATCH_PASS \
            M14_METRIKA_SUMMARY_OPERATION_REENABLE_PASS \
            M14_METRIKA_SUMMARY_DELIVERY_BLOCKED_NO_DISPATCH_PASS \
            M14_METRIKA_SUMMARY_DELIVERY_REENABLE_PASS \
            M14_METRIKA_SUMMARY_PROVIDER_HITS=1 \
            M14_METRIKA_SUMMARY_REAL_YANDEX_REQUESTS=0 \
            M14_METRIKA_SUMMARY_LIFECYCLE_BROWSER_PASS; do
            grep -F "$marker" /tmp/p4-r2-final-m14-summary.log
          done
          echo PHASE4_R2_FINAL_M14_TRAFFIC_SUMMARY_PASS
          echo PHASE4_R2_FINAL_M14_TWO_ROUTE_LIFECYCLE_PASS

      - name: Reverify frozen product after lifecycle browser
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          base=Path('/tmp/p4-r2-final-lifecycle'); m=json.loads((base/'published/freeze-manifest.json').read_text(encoding='utf-8')); src=base/'extension/src'
          expected={r['path']:r['sha256'] for r in m['payload'] if not r['path'].startswith('tests/')}
          actual={p.relative_to(src).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in src.rglob('*') if p.is_file()}
          assert actual==expected
          print('PHASE4_R2_FINAL_LIFECYCLE_PRODUCT_BYTES_IDENTICAL')
          PY

  final:
    needs: [artifact-identity, browser-runtime, lifecycle-browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recheck candidate, QA-only source and main end
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only "$PRODUCT_SOURCE_HEAD" HEAD -- extension/src)"
          test "$(git hash-object extension/tests/qa_browser/patch_m14_receiver_owner_quiescence_r4.mjs)" = "$LIFECYCLE_R4_PATCH_BLOB"
          git fetch --no-tags origin "$PRODUCT_SOURCE_REF" main
          test "$(git rev-parse "origin/$PRODUCT_SOURCE_REF")" = "$PRODUCT_SOURCE_HEAD"
          main_end="$(git rev-parse origin/main)"
          test "$main_end" = "$MAIN_EXPECTED_HEAD"
          echo "PHASE4_R2_FINAL_MAIN_END=$main_end"
          echo PHASE4_R2_FINAL_CANDIDATE_REF_IDENTITY_PASS
          echo PHASE4_R2_FINAL_MAIN_UNCHANGED_PASS

      - name: Redownload and final-lock exact published artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PUBLISHED_ARTIFACT_NAME }}
          path: /tmp/p4-r2-final-lock
          github-token: ${{ github.token }}
          repository: MaksimUnimax/Yandex_direct
          run-id: ${{ env.FREEZE_RUN_ID }}

      - name: Emit M00-M19 final acceptance markers
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/p4-r2-final-lock
          sha256sum -c SHA256SUMS.txt
          test "$(sha256sum "$CANDIDATE_ZIP" | awk '{print $1}')" = "$CANDIDATE_SHA256"
          test "$(stat -c '%s' "$CANDIDATE_ZIP")" = "$CANDIDATE_BYTES"
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('/tmp/p4-r2-final-lock')
          m=json.loads((root/'freeze-manifest.json').read_text(encoding='utf-8'))
          c=json.loads((root/'prefreeze_coverage_map.json').read_text(encoding='utf-8'))
          assert m['source_commit']==os.environ['PRODUCT_SOURCE_HEAD']
          assert m['sha256']==os.environ['CANDIDATE_SHA256']
          assert m['bytes']==int(os.environ['CANDIDATE_BYTES'])
          assert m['files']==int(os.environ['CANDIDATE_FILES'])
          assert m['entries']==int(os.environ['CANDIDATE_ENTRIES'])
          for i in range(1,19):
              key=f'M-{i:02d}'
              assert c['gates'][key]['status']=='DEVELOPMENT_PASS'
              assert 'NOT_RUN' not in json.dumps(c['gates'][key])
          assert c['enabled_not_run_count_M01_M18']==0
          print('PHASE4_R2_M00_FINAL_IMMUTABLE_ARTIFACT_PASS')
          print('PHASE4_R2_M01_M18_FINAL_NO_NOT_RUN_PASS')
          print('PHASE4_R2_M19_FINAL_IMMUTABLE_CAMPAIGN_PASS')
          PY
          echo "PHASE4_R2_FINAL_PRODUCT_SOURCE=$PRODUCT_SOURCE_HEAD"
          echo "PHASE4_R2_FINAL_CANDIDATE_SHA256=$CANDIDATE_SHA256"
          echo "PHASE4_R2_FINAL_CANDIDATE_BYTES=$CANDIDATE_BYTES"
          echo "PHASE4_R2_FINAL_ARTIFACT_ID=$ARTIFACT_ID"
          echo "PHASE4_R2_FINAL_FREEZE_RUN=$FREEZE_RUN_ID"
          echo "PHASE4_R2_FINAL_QA_HEAD=$GITHUB_SHA"
          echo "PHASE4_R2_FINAL_MAIN_START=$MAIN_EXPECTED_HEAD"
          echo "PHASE4_R2_FINAL_MAIN_END=$MAIN_EXPECTED_HEAD"
          echo PHASE4_R2_FINAL_ACCEPTANCE_READY_PASS
