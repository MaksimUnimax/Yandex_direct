name: YMB WIP source snapshot (not a release)
on:
  push:
    branches: [wip/ymb-file-delivery-patch-a-2026-09-12]
    paths: [.github/workflows/ymb-wip-source-snapshot-2026-09-12.yml]
permissions:
  contents: read
concurrency:
  group: ymb-wip-source-snapshot-2026-09-12
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 1aafee85d8534ab08848c217efa517a8a2cbec23
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            extension/tests
            extension/src
            extension/reference
            extension/docs
      - name: Archive saved bytes only (no product execution or provider calls)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 1aafee85d8534ab08848c217efa517a8a2cbec23
          mkdir -p snapshot
          git archive --format=tar HEAD extension/tests extension/src extension/reference extension/docs extension/README.md > snapshot/wip-source.tar
          git ls-tree -r HEAD -- extension/tests extension/src extension/reference extension/docs extension/README.md > snapshot/GIT_TREE.txt
          printf '%s\n' 'SOURCE_REF=1aafee85d8534ab08848c217efa517a8a2cbec23' 'INTERNAL_QA_SOURCE_ONLY' 'NOT_AN_INSTALLABLE_BUILD' 'NO_PROVIDER_CALLS' 'COMPLETE_ORIGINAL_TEST_INVENTORY_INCLUDED' > snapshot/README.txt
          (cd snapshot && sha256sum wip-source.tar GIT_TREE.txt README.txt > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ymb-b12-full-test-inventory-internal-only
          path: snapshot/
          retention-days: 7
          if-no-files-found: error
