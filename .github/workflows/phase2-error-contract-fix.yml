name: phase2-error-contract-fix
on:
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/phase2-recovery-work-2026-08-20
      - name: Restore complete YMB_ERROR_V1 metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          worker = Path('extension/src/service_worker.js')
          s = worker.read_text(encoding='utf-8')
          old = '''function formatBridgeError({ code, message, stage = "BRIDGE", requestExecuted = false, service = null, runId = null, operationId = null }) {\n  return ["YMB_ERROR_V1", JSON.stringify({ bridge: YMBProduct.BRIDGE_ID, version: VERSION, status: "ERROR", code, message, stage, service, run_id: runId, operation_id: operationId, request_executed: requestExecuted, automatic_retry: false }, null, 2)].join("\\n");\n}'''
          new = '''function formatBridgeError({ code, message, stage = "BRIDGE", requestExecuted = false, service = null, runId = null, operationId = null, channel = "bridge", operation = null, recoverable = null, autorunContinues = false, timestamp = null }) {\n  const canRecover = recoverable == null ? requestExecuted !== "UNKNOWN" : recoverable === true;\n  return ["YMB_ERROR_V1", JSON.stringify({\n    bridge: YMBProduct.BRIDGE_ID,\n    version: VERSION,\n    status: "ERROR",\n    service,\n    channel,\n    stage,\n    code,\n    message,\n    recoverable: canRecover,\n    request_executed: requestExecuted,\n    automatic_retry: false,\n    run_id: runId,\n    operation,\n    autorun_continues: autorunContinues === true,\n    timestamp: timestamp || nowIso(),\n    operation_id: operationId\n  }, null, 2)].join("\\n");\n}'''
          assert old in s, 'formatBridgeError anchor not found'
          s = s.replace(old, new, 1)

          old = '''if (!preflight.items.length) reportText = formatBridgeError({ code: "NO_SUPPORTED_COMMAND", message: "В выбранном блоке нет поддерживаемой команды Yandex Marketing Bridge.", stage: "COMMAND_DISCOVERY", requestExecuted: false, service: serviceContext.active_service, operationId: operation.operation_id });'''
          new = '''if (!preflight.items.length) reportText = formatBridgeError({ code: "NO_SUPPORTED_COMMAND", message: "В выбранном блоке нет поддерживаемой команды Yandex Marketing Bridge.", stage: "COMMAND_DISCOVERY", requestExecuted: false, service: serviceContext.active_service, channel: "manual", recoverable: true, operation: null, operationId: operation.operation_id, autorunContinues: false });'''
          assert old in s, 'manual no-command error anchor not found'
          s = s.replace(old, new, 1)

          old = '''if (item.status === "error") { reports.push(formatBridgeError({ code: item.code, message: item.message, stage: item.stage, requestExecuted: false, service: item.service, operationId: operation.operation_id })); continue; }'''
          new = '''if (item.status === "error") { reports.push(formatBridgeError({ code: item.code, message: item.message, stage: item.stage, requestExecuted: false, service: item.service, channel: "manual", recoverable: true, operation: item.operation || null, operationId: operation.operation_id, autorunContinues: false })); continue; }'''
          assert old in s, 'manual validation error anchor not found'
          s = s.replace(old, new, 1)

          old = '''reports.push(formatBridgeError({ code: error.code || "PROVIDER_ERROR", message: error.message || String(error), stage: "PROVIDER", requestExecuted, service: item.service, runId: operation.run_id, operationId: operation.operation_id }));'''
          new = '''reports.push(formatBridgeError({ code: error.code || "PROVIDER_ERROR", message: error.message || String(error), stage: "PROVIDER", requestExecuted, service: item.service, channel: "manual", recoverable: requestExecuted !== "UNKNOWN", runId: operation.run_id, operation: item.command?.method || null, operationId: operation.operation_id, autorunContinues: false }));'''
          assert old in s, 'manual provider error anchor not found'
          s = s.replace(old, new, 1)

          old = '''  requestExecuted = false,\n  assistantTurnId = "",\n  fingerprint = null\n} = {}) {'''
          new = '''  requestExecuted = false,\n  assistantTurnId = "",\n  fingerprint = null,\n  operation = null,\n  recoverable = null,\n  autorunContinues = true\n} = {}) {'''
          assert old in s, 'stageAutorunError options anchor not found'
          s = s.replace(old, new, 1)

          old = '''    requestExecuted,\n    service: run?.active_service || null,\n    runId: run?.run_id || null\n  });'''
          new = '''    requestExecuted,\n    service: run?.active_service || null,\n    channel: "autorun",\n    recoverable: recoverable == null ? requestExecuted !== "UNKNOWN" : recoverable,\n    runId: run?.run_id || null,\n    operation: operation || run?.last_method || null,\n    autorunContinues\n  });'''
          assert old in s, 'stageAutorunError format call anchor not found'
          s = s.replace(old, new, 1)

          old = '''      requestExecuted: error.request_executed ?? "UNKNOWN",\n      assistantTurnId,\n      fingerprint\n    });'''
          new = '''      requestExecuted: error.request_executed ?? "UNKNOWN",\n      assistantTurnId,\n      fingerprint,\n      operation: parsed.method,\n      recoverable: (error.request_executed ?? "UNKNOWN") !== "UNKNOWN",\n      autorunContinues: true\n    });'''
          assert old in s, 'autorun provider error anchor not found'
          s = s.replace(old, new, 1)
          worker.write_text(s, encoding='utf-8')

          manual = Path('extension/tests/search_manual_worker.test.mjs')
          t = manual.read_text(encoding='utf-8')
          old = '''  assert.match(r.report_text,/^YMB_ERROR_V1\\n/);\n  assert.match(r.report_text,/NO_SUPPORTED_COMMAND/);\n});'''
          new = '''  assert.match(r.report_text,/^YMB_ERROR_V1\\n/);\n  assert.match(r.report_text,/NO_SUPPORTED_COMMAND/);\n  const errorPayload=JSON.parse(r.report_text.split('\\n').slice(1).join('\\n'));\n  assert.equal(errorPayload.service,'search');\n  assert.equal(errorPayload.channel,'manual');\n  assert.equal(errorPayload.stage,'COMMAND_DISCOVERY');\n  assert.equal(errorPayload.recoverable,true);\n  assert.equal(errorPayload.request_executed,false);\n  assert.equal(errorPayload.automatic_retry,false);\n  assert.equal(errorPayload.operation,null);\n  assert.equal(errorPayload.autorun_continues,false);\n  assert.match(errorPayload.timestamp,/^\\d{4}-\\d{2}-\\d{2}T/);\n});'''
          assert old in t, 'manual no-command test anchor not found'
          t = t.replace(old, new, 1)
          old = '''  assert.match(r.report_text,/REQUEST_OUTCOME_UNKNOWN_NO_RETRY/);\n  assert.match(r.report_text,/"request_executed": "UNKNOWN"/);\n  assert.match(r.report_text,/"automatic_retry": false/);\n});'''
          new = '''  assert.match(r.report_text,/REQUEST_OUTCOME_UNKNOWN_NO_RETRY/);\n  assert.match(r.report_text,/"request_executed": "UNKNOWN"/);\n  assert.match(r.report_text,/"automatic_retry": false/);\n  const errorPayload=JSON.parse(r.report_text.split('\\n').slice(1).join('\\n'));\n  assert.equal(errorPayload.channel,'manual');\n  assert.equal(errorPayload.operation,'search');\n  assert.equal(errorPayload.recoverable,false);\n  assert.equal(errorPayload.autorun_continues,false);\n});'''
          assert old in t, 'manual unknown test anchor not found'
          t = t.replace(old, new, 1)
          manual.write_text(t, encoding='utf-8')

          autorun = Path('extension/tests/autorun_recovery.test.mjs')
          t = autorun.read_text(encoding='utf-8')
          old = '''  assert.match(outbox.report_text,/"request_executed":\\s*false/);\n  await h.api.completeDelivery({conversation_key:CKEY,delivery_id:outbox.delivery_id,confirmation_basis:'microphone'});'''
          new = '''  assert.match(outbox.report_text,/"request_executed":\\s*false/);\n  const errorPayload=JSON.parse(outbox.report_text.split('\\n').slice(1).join('\\n'));\n  assert.equal(errorPayload.service,'search');\n  assert.equal(errorPayload.channel,'autorun');\n  assert.equal(errorPayload.stage,'COMMAND_VALIDATION');\n  assert.equal(errorPayload.recoverable,true);\n  assert.equal(errorPayload.request_executed,false);\n  assert.equal(errorPayload.automatic_retry,false);\n  assert.equal(errorPayload.run_id,'search-run');\n  assert.equal(errorPayload.autorun_continues,true);\n  assert.match(errorPayload.timestamp,/^\\d{4}-\\d{2}-\\d{2}T/);\n  await h.api.completeDelivery({conversation_key:CKEY,delivery_id:outbox.delivery_id,confirmation_basis:'microphone'});'''
          assert old in t, 'autorun validation test anchor not found'
          t = t.replace(old, new, 1)
          old = '''  assert.match(first.report_text,/^YMB_ERROR_V1\\n/);\n  assert.match(first.report_text,/"request_executed":\\s*"UNKNOWN"/);\n  const delivery=h.store.wsmb_outbox[CKEY];'''
          new = '''  assert.match(first.report_text,/^YMB_ERROR_V1\\n/);\n  assert.match(first.report_text,/"request_executed":\\s*"UNKNOWN"/);\n  const errorPayload=JSON.parse(first.report_text.split('\\n').slice(1).join('\\n'));\n  assert.equal(errorPayload.channel,'autorun');\n  assert.equal(errorPayload.operation,'search');\n  assert.equal(errorPayload.recoverable,false);\n  assert.equal(errorPayload.autorun_continues,true);\n  const delivery=h.store.wsmb_outbox[CKEY];'''
          assert old in t, 'autorun unknown test anchor not found'
          t = t.replace(old, new, 1)
          autorun.write_text(t, encoding='utf-8')
          PY

          node --test extension/tests/search_manual_worker.test.mjs extension/tests/autorun_recovery.test.mjs
          node --test \
            extension/tests/search_protocol.test.mjs \
            extension/tests/search_registry.test.mjs \
            extension/tests/search_xml.test.mjs \
            extension/tests/search_worker_stage2.test.mjs \
            extension/tests/search_manual_worker.test.mjs \
            extension/tests/manual_block_sequence_recovery.test.mjs \
            extension/tests/manual_delivery_lifecycle_recovery.test.mjs \
            extension/tests/content_phase2_runtime.test.mjs \
            extension/tests/popup_phase2_runtime.test.mjs \
            extension/tests/autorun_recovery.test.mjs \
            extension/tests/autorun_transport_retry_recovery.test.mjs \
            extension/tests/conversation_fences_recovery.test.mjs \
            extension/tests/start_prompt_and_prefix_recovery.test.mjs \
            extension/tests/wordstat_core_recovery.test.mjs \
            extension/tests/settings_security_recovery.test.mjs \
            extension/tests/settings_backup_integrity_recovery.test.mjs \
            extension/tests/popup_error_boundary_recovery.test.mjs \
            extension/tests/permission_scope_recovery.test.mjs \
            extension/tests/legacy_profiles_recovery.test.mjs \
            extension/tests/diagnostics_popup_recovery.test.mjs \
            extension/tests/button_picker_recovery.test.mjs \
            extension/tests/binding_recovery.test.mjs \
            extension/tests/manual_off_safety_recovery.test.mjs
          node --check extension/src/service_worker.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/src/service_worker.js extension/tests/search_manual_worker.test.mjs extension/tests/autorun_recovery.test.mjs
          git commit -m 'fix: restore complete ChatGPT error metadata'
          git push origin HEAD:dev/phase2-recovery-work-2026-08-20
