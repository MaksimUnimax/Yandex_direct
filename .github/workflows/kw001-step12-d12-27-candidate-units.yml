name: KW001 Step12 D12-27 Candidate Units
on:
  push:
    paths:
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_D12_27_CANDIDATE_UNITS_TRIGGER.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: roadmap/kwork-productization-2026-08-28
          fetch-depth: 0
      - run: python extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/step12_extract_d12_27_candidate_units.py
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          f=extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_D12_27_CANDIDATE_UNITS.tsv
          git add $f
          git commit -m "step12: persist D12-27 candidate units [skip ci]"
          git push origin HEAD:roadmap/kwork-productization-2026-08-28
      - name: Readback
        run: |
          git fetch origin roadmap/kwork-productization-2026-08-28
          git show origin/roadmap/kwork-productization-2026-08-28:extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_D12_27_CANDIDATE_UNITS.tsv > /tmp/u.tsv
          python - <<'PY'
          import csv
          rows=list(csv.DictReader(open('/tmp/u.tsv',encoding='utf-8',newline=''),delimiter='\t'));assert rows
          print('STEP12_D12_27_CANDIDATE_UNITS_READBACK_PASS',len(rows))
          PY
