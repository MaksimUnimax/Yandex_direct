name: KW001 Step13 Survivor Phrase Evidence
on:
  push:
    paths:
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_13_SURVIVOR_PHRASE_TRIGGER.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: roadmap/kwork-productization-2026-08-28
          fetch-depth: 0
      - name: Extract phrase evidence
        run: python extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/step13_extract_survivor_phrase_evidence.py
      - name: Persist and read back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          b=extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK
          git add $b/STEP_13_SURVIVOR_PHRASE_EVIDENCE.tsv $b/STEP_13_SURVIVOR_PHRASE_EVIDENCE_QA.json
          git commit -m "step13: persist survivor phrase evidence [skip ci]"
          git push origin HEAD:roadmap/kwork-productization-2026-08-28
          git fetch origin roadmap/kwork-productization-2026-08-28
          git show origin/roadmap/kwork-productization-2026-08-28:$b/STEP_13_SURVIVOR_PHRASE_EVIDENCE_QA.json > /tmp/q.json
          python - <<'PY'
          import json
          q=json.load(open('/tmp/q.json'))
          assert q['surviving_pairs']==27 and q['pairs_with_evidence']==27
          assert q['provider_calls']==0 and not q['step13_search_executed']
          print('STEP13_SURVIVOR_PHRASE_READBACK_PASS',q['evidence_rows'])
          PY
