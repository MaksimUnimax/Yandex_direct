name: phase5-credential-concurrency-fix-r1

on:
  push:
    branches:
      - fix/phase5-credential-runtime-concurrency-2026-08-27
    paths:
      - .github/workflows/phase5-credential-concurrency-fix-r1.yml
      - extension/src/shared/credential_runtime.js
      - extension/src/shared/settings_backup_v3_runtime.js
      - extension/tests/credential_runtime_concurrency.test.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert exact fixed product tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:extension/src)" = "edf1c2d3494ebbc53ae778d23be1457eb885b605"
          echo PHASE5_CREDENTIAL_FIX_PRODUCT_TREE_PASS
      - name: Run credential concurrency regression
        shell: bash
        run: |
          set -euo pipefail
          node --test extension/tests/credential_runtime_concurrency.test.mjs
          echo PHASE5_CREDENTIAL_CONCURRENCY_REGRESSION_PASS
      - name: Run full candidate Node suite
        shell: bash
        run: |
          set -euo pipefail
          node --test extension/tests/*.test.mjs
          echo PHASE5_CREDENTIAL_FIX_FULL_NODE_PASS

  browser-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert product tree and syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:extension/src)" = "edf1c2d3494ebbc53ae778d23be1457eb885b605"
          node --check extension/tests/qa_browser/direct_browser_runtime.mjs
          node --check extension/tests/qa_browser/direct_popup_d18.mjs
          node --check extension/tests/qa_browser/direct_manual_worker_lifecycle.mjs
          find extension/src -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/product-before.sha256
      - name: Install Puppeteer Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false puppeteer@24
          npx puppeteer browsers install chrome
          command -v xvfb-run
      - name: Run Direct browser runtime
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a node extension/tests/qa_browser/direct_browser_runtime.mjs | tee /tmp/runtime.log
          grep -F PHASE5_DIRECT_BROWSER_RUNTIME_PASS /tmp/runtime.log
          grep -F D20_CONTROLLED_REAL_YANDEX_REQUESTS=0 /tmp/runtime.log
      - name: Run Direct popup D18
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a node extension/tests/qa_browser/direct_popup_d18.mjs | tee /tmp/d18.log
          grep -F D18_POPUP_430X560_PASS /tmp/d18.log
          grep -F D18_TOP_BOTTOM_COMMON_SAVE_EQUIVALENT_PASS /tmp/d18.log
          grep -F PHASE5_DIRECT_POPUP_D18_PASS /tmp/d18.log
      - name: Run Direct Manual lifecycle three clean times
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            echo "MANUAL_LIFECYCLE_ITERATION=$i"
            xvfb-run -a node extension/tests/qa_browser/direct_manual_worker_lifecycle.mjs | tee "/tmp/manual-$i.log"
            grep -F D17_DIRECT_MANUAL_LIST_AUTOSEND_FALSE_PASS "/tmp/manual-$i.log"
            grep -F D17_DIRECT_MANUAL_REPORT_AUTOSEND_TRUE_PASS "/tmp/manual-$i.log"
            grep -F D17_DIRECT_NO_DUPLICATE_PROVIDER_PASS "/tmp/manual-$i.log"
            grep -F PHASE5_DIRECT_MANUAL_LIFECYCLE_PASS "/tmp/manual-$i.log"
          done
          echo PHASE5_CREDENTIAL_FIX_MANUAL_X3_PASS
      - name: Post-browser product identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find extension/src -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/product-after.sha256
          cmp /tmp/product-before.sha256 /tmp/product-after.sha256
          test "$(git rev-parse HEAD:extension/src)" = "edf1c2d3494ebbc53ae778d23be1457eb885b605"
          echo PHASE5_CREDENTIAL_FIX_POST_PRODUCT_IDENTICAL_PASS
