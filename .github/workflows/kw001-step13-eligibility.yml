name: KW001 Step13 Eligibility
on:
  push:
    paths:
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_13_ELIGIBILITY_TRIGGER.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: roadmap/kwork-productization-2026-08-28
          fetch-depth: 0
      - name: Verify manual eligibility and materialize ledger
        run: python extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/step13_verify_and_materialize_eligibility.py
      - name: Persist eligibility
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          b=extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK
          git add $b/STEP_13_PAIR_ELIGIBILITY.tsv $b/STEP_13_PAIR_ELIGIBILITY_QA.json
          git commit -m "step13: persist 195-pair eligibility [skip ci]"
          git push origin HEAD:roadmap/kwork-productization-2026-08-28
      - name: Durable readback
        run: |
          git fetch origin roadmap/kwork-productization-2026-08-28
          remote=origin/roadmap/kwork-productization-2026-08-28
          b=extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK
          git show $remote:$b/STEP_13_PAIR_ELIGIBILITY_QA.json > /tmp/q.json
          python - <<'PY'
          import json
          q=json.load(open('/tmp/q.json',encoding='utf-8'))
          assert q['input_pairs']==195 and q['manual_decisions']==195 and q['materialized_rows']==195
          assert q['silent_pair_drops']==0 and q['extra_pair_ids']==0
          assert q['surviving_pairs']>0
          assert q['provider_calls']==0 and not q['step13_search_executed']
          print('STEP13_ELIGIBILITY_READBACK_PASS',q['surviving_pairs'],q['class_counts'])
          PY
