            rows=[json.loads(x) for x in (ev/name/'browser.jsonl').read_text().splitlines()];bad=[r.get('case') for r in rows if str(r.get('status','')).startswith('FAIL')];clean=next((r for r in rows if r.get('case')=='owned_browser_cleanup'),{});groups[name]={'cases':len(rows),'expected':expected,'failures':bad,'remaining':clean.get('remaining') or [],'peak_owned_rss_kib':clean.get('peak_owned_rss_kib')};fails+=bad;remaining+=clean.get('remaining') or [];peak=max(peak,int(clean.get('peak_owned_rss_kib') or 0))
          t=json.loads((ev/'test15'/'TARGETED_RESULT.json').read_text());required={'test15_blank_composer_auto_send_exactly_once','occupied_user_draft_is_preserved','same_delivery_inline_report_auto_sends_exactly_once','different_bridge_inline_text_is_preserved'};tr={r.get('case'):r for r in t['rows']};test15=t.get('pass') is True and t.get('provider_calls')==0 and all(tr.get(c,{}).get('status')=='PASS' for c in required)
          p=json.loads((ev/'popup'/'STAGE_A_RESULT.json').read_text());popup=p.get('pass') is True and p.get('provider_fetch_calls')==0 and p.get('source_files')==68
          mems=list((o/'memory-green').rglob('RESULT.json'));assert len(mems)==1,mems;mem=json.loads(mems[0].read_text());memory=mem.get('pass') is True and mem.get('product_sha')==os.environ['PRODUCT_SHA'] and mem.get('provider_calls')==0
          counts=groups['resource']['cases']==16 and groups['network']['cases']==9
          result={**pkg,'test15_pass':test15,'popup_pass':popup,'memory_pass':memory,'memory_result':mem,'groups':groups,'browser_failures':fails,'remaining_processes':remaining,'peak_owned_rss_kib':peak,'emergency_limit_kib':2097152,'real_provider_calls':0,'exact_case_counts':counts,'pass':pkg['pass'] and test15 and popup and memory and counts and not fails and not remaining and peak<2097152}
          (o/'FINAL_GATE.json').write_text(json.dumps(result,indent=2)+'\n');(o/'SHA256SUMS').write_text(''.join(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+f.relative_to(o).as_posix()+'\n' for f in sorted(o.rglob('*')) if f.is_file() and f.name!='SHA256SUMS'));print(json.dumps(result,indent=2));raise SystemExit(0 if result['pass'] else 1)
          PY
