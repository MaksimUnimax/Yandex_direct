          path: memory-green
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.16.0'}
      - name: Build deterministic exact package and current fixtures
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet "$PRODUCT_SHA" -- extension/src
          mapfile -t changed < <(git diff --name-only "$BASELINE_SHA" "$PRODUCT_SHA" -- extension/src)
          test "${#changed[@]}" -eq 1 && test "${changed[0]}" = extension/src/popup_search_async_monitor.js
          python3 - <<'PY'
          from pathlib import Path,PurePosixPath
          import hashlib,json,os,subprocess,zipfile
          H=lambda b:hashlib.sha256(b).hexdigest();root=Path('extension/src');files={p.relative_to(root).as_posix():p.read_bytes() for p in sorted(root.rglob('*')) if p.is_file()};assert len(files)==68
          tree=H(''.join(H(v)+'  '+k+'\n' for k,v in sorted(files.items())).encode());out=Path(os.environ['RUNNER_TEMP'])/'package';out.mkdir();prefix='Yandex-Marketing-Bridge-0.1.6/'
          def build(p):
            with zipfile.ZipFile(p,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9,strict_timestamps=True) as z:
              for n,b in sorted(files.items()):
                zi=zipfile.ZipInfo(prefix+n,date_time=(1980,1,1,0,0,0));zi.compress_type=zipfile.ZIP_DEFLATED;zi.create_system=3;zi.external_attr=(0o100644<<16);zi.flag_bits=0x800;z.writestr(zi,b,compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          a=out/'A.zip';b=out/'B.zip';build(a);build(b);assert a.read_bytes()==b.read_bytes();final=out/'Yandex-Marketing-Bridge-0.1.6-stage-b-memory-hotfix.zip';final.write_bytes(a.read_bytes());a.unlink();b.unlink();zsha=H(final.read_bytes());zbytes=final.stat().st_size
          ex=Path(os.environ['RUNNER_TEMP'])/'fresh';ex.mkdir();ext={}
          with zipfile.ZipFile(final) as z:
            assert z.testzip() is None
            for e in z.infolist():
              if e.is_dir():continue
              p=PurePosixPath(e.filename);assert not p.is_absolute() and '..' not in p.parts and p.parts[0]=='Yandex-Marketing-Bridge-0.1.6';rel='/'.join(p.parts[1:]);d=z.read(e);assert rel not in ext;ext[rel]=d;q=ex/rel;q.parent.mkdir(parents=True,exist_ok=True);q.write_bytes(d)
          assert set(ext)==set(files) and all(ext[k]==files[k] for k in files);assert H(''.join(H(v)+'  '+k+'\n' for k,v in sorted(ext.items())).encode())==tree
          m=json.loads(files['manifest.json']);assert m['version']=='0.1.6';assert 'alarms' not in (m.get('permissions') or [])
          monitor=files['popup_search_async_monitor.js'].decode();assert 'results.openCursor' not in monitor and 'REFRESH_MS' not in monitor and monitor.count('setInterval(')==1 and 'results.count(itemRange)' in monitor
          deps=Path(os.environ['RUNNER_TEMP'])/'deps';deps.mkdir();lock=Path('frozen-b17/package-lock.json');(deps/'package-lock.json').write_bytes(lock.read_bytes());j=json.loads(lock.read_text());(deps/'package.json').write_text(json.dumps({'name':j['name'],'private':True,'dependencies':j['packages']['']['dependencies']}))
          tests=Path(os.environ['RUNNER_TEMP'])/'tests';tests.mkdir();oldr='b20b74351d95becd67f32994e3e00899e9208b8c32c778a306f73f6703bfe508';r=Path('frozen-b17/tests/b15_browser_qualification.mjs').read_text();assert r.count(oldr)==1 and r.count('assert.equal(rows.length,67)')==1;r=r.replace(oldr,tree).replace('assert.equal(rows.length,67)','assert.equal(rows.length,68)');(tests/'resource.mjs').write_text(r)
          oldn='b87246c1377cda57cb9135f92814ec6885a1b607a9539be3a27bbc2fb1918b86';n=Path('extension/tests/wip/YMB_ASYNC_PATCH_B_2026-09-12/qa/b19_network_browser.mjs').read_text();assert n.count(oldn)==1 and n.count('assert.equal(rows.length,67)')==1;n=n.replace(oldn,tree).replace('assert.equal(rows.length,67)','assert.equal(rows.length,68)');(tests/'network.mjs').write_text(n)
          fixture=Path('extension/tests/wip/YMB_ASYNC_PATCH_B_2026-09-12/qa/b15_fixture.html').read_text();old="send.addEventListener('click',()=>{Q.sends.push({text:composer.value,files:Q.files.map(f=>({...f}))});composer.value='';";new="send.addEventListener('click',()=>{const sentText=composer.value;const sentFiles=Q.files.map(f=>({...f}));Q.sends.push({text:sentText,files:sentFiles});const turn=document.createElement('div');turn.dataset.messageAuthorRole='user';turn.dataset.messageId='fixture-user-'+Q.sends.length;turn.textContent=[sentText,...sentFiles.map(f=>f.name)].join(' ');document.getElementById('conversation-root').append(turn);composer.value='';";assert fixture.count(old)==1;fixture=fixture.replace(old,new);(tests/'fixture.html').write_text(fixture);(tests/'b15_fixture.html').write_text(fixture)
          t=subprocess.check_output(['git','show','e77f327d8c4e0da695dc6bc20ba9056c663d133c:extension/tests/wip/YMB_ASYNC_PATCH_B_2026-09-12/qa/test15_targeted_real_chrome_v7.mjs'],text=True);t=t.replace("source_commit:'64c1016c179de52b6e950830877f0d42a446e5e8'",f"source_commit:'{os.environ['PRODUCT_SHA']}'").replace("zip_sha256:'3e23a70d09fab91f84cf3c9998499ce078f1467b46540dbac7fa07ac60a6765e'",f"zip_sha256:'{zsha}'");(tests/'test15.mjs').write_text(t)
          wf=Path('.github/workflows/ymb-async-popup-monitor-stage-a.yml').read_text();needle='          cat > "$RUNNER_TEMP/popup-monitor-stage-a.mjs" <<\'NODE\'\n';s=wf.index(needle)+len(needle);e=wf.index('\n          NODE',s);popup='\n'.join(line[10:] if line.startswith('          ') else line for line in wf[s:e].splitlines())+'\n';popup=popup.replace("fs.realpathSync('extension/src')","fs.realpathSync(process.env.YMB_BROWSER_CANDIDATE)");assert "assert.equal(ui.searchAsyncRows,'347');" in popup;popup=popup.replace("assert.equal(ui.searchAsyncRows,'347');","assert.equal(ui.searchAsyncRows,'— (без чтения payload)');");(tests/'popup.mjs').write_text(popup)
          ev=Path(os.environ['RUNNER_TEMP'])/'evidence';ev.mkdir();meta={'schema_version':3,'product_sha':os.environ['PRODUCT_SHA'],'tree_sha256':tree,'files':68,'zip_sha256':zsha,'zip_bytes':zbytes,'dual_build_identity':True,'fresh_extraction_identity':True,'memory_safe_source_contract':True,'pass':True};(out/'PACKAGE_RESULT.json').write_text(json.dumps(meta,indent=2)+'\n');(out/'SOURCE_SHA256SUMS').write_text(''.join(H(v)+'  '+k+'\n' for k,v in sorted(files.items())))
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write(f'YMB_FINAL_PACKAGE={final}\nYMB_BROWSER_CANDIDATE={ex}\nYMB_PRODUCT_TREE={tree}\nYMB_PRODUCT_ZIP_SHA={zsha}\nYMB_PPTR_HOME={deps}\nYMB_TESTS={tests}\nYMB_EVIDENCE_ROOT={ev}\nYMB_CHATGPT_FIXTURE={(tests/"fixture.html").resolve()}\n')
          print(json.dumps(meta,indent=2))
          PY
      - name: Fresh extraction syntax and locked Puppeteer
        shell: bash
        run: |
          set -euo pipefail
          find "$YMB_BROWSER_CANDIDATE" -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          for f in "$YMB_TESTS"/*.mjs; do node --check "$f"; done
          npm ci --prefix "$YMB_PPTR_HOME" --no-audit --no-fund > "$YMB_EVIDENCE_ROOT/npm.stdout" 2> "$YMB_EVIDENCE_ROOT/npm.stderr"
      - name: Targeted TEST-15 exactly-once
        shell: bash
        env:
          YMB_BROWSER_EVIDENCE: ${{ runner.temp }}/evidence/test15
        run: |
          set -euo pipefail;mkdir -p "$YMB_BROWSER_EVIDENCE";xvfb-run -a node "$YMB_TESTS/test15.mjs" > "$YMB_BROWSER_EVIDENCE/run.stdout" 2> "$YMB_BROWSER_EVIDENCE/run.stderr"
      - name: Popup real Chrome
        shell: bash
        env:
          YMB_EVIDENCE: ${{ runner.temp }}/evidence/popup
        run: |
          set -euo pipefail;mkdir -p "$YMB_EVIDENCE";xvfb-run -a node "$YMB_TESTS/popup.mjs" > "$YMB_EVIDENCE/run.stdout" 2> "$YMB_EVIDENCE/run.stderr"
      - name: B19 resource 16/16
        shell: bash
        env:
          YMB_BROWSER_EVIDENCE: ${{ runner.temp }}/evidence/resource
        run: |
          set -euo pipefail;mkdir -p "$YMB_BROWSER_EVIDENCE";xvfb-run -a node "$YMB_TESTS/resource.mjs" > "$YMB_BROWSER_EVIDENCE/run.stdout" 2> "$YMB_BROWSER_EVIDENCE/run.stderr"
      - name: B19 network 9/9
