          O="$RUNNER_TEMP/final";mkdir -p "$O";cp "$YMB_FINAL_PACKAGE" "$O/" 2>/dev/null||true;cp "$RUNNER_TEMP/package/PACKAGE_RESULT.json" "$RUNNER_TEMP/package/SOURCE_SHA256SUMS" "$O/" 2>/dev/null||true;cp -a "$YMB_EVIDENCE_ROOT" "$O/evidence" 2>/dev/null||true;cp -a memory-green "$O/memory-green" 2>/dev/null||true
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          o=Path(os.environ['RUNNER_TEMP'])/'final';pkg=json.loads((o/'PACKAGE_RESULT.json').read_text());ev=o/'evidence';groups={};fails=[];remaining=[];peak=0
