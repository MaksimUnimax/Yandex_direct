name: KW001 Step12 Close D12-02 03 10

on:
  push:
    branches:
      - roadmap/kwork-productization-2026-08-28
    paths:
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/step12_close_d12_02_03_10.py'
      - '.github/workflows/kw001-step12-close-d12-02-03-10.yml'

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: roadmap/kwork-productization-2026-08-28
          fetch-depth: 0
      - name: Apply verified closure
        run: python extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/step12_close_d12_02_03_10.py
      - name: Verify
        run: |
          python - <<'PY'
          import json,csv
          from pathlib import Path
          r=Path('extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK')
          s=json.loads((r/'STEP_12_CORRECTION_CURRENT_STATE.json').read_text(encoding='utf-8'))
          assert s['current_correction_item']=='D12-04'
          for d in ['D12-02','D12-03','D12-10']:
              assert d in s['verified_fixed_defects'] and d not in s['open_defects']
          for d in ['D12-04','D12-05','D12-06','D12-07','D12-11']: assert d in s['open_defects']
          print('STEP12_D12_02_03_10_CLOSE_VERIFY_PASS')
          PY
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_CORRECTION_DEFECT_LEDGER.tsv \
                  extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_CORRECTION_CURRENT_STATE.json \
                  extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/JOB_FLOW.md \
                  extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/JOB_MANIFEST.md
          git commit -m "step12: close evidence and demand-proxy defects [skip ci]"
          git push origin HEAD:roadmap/kwork-productization-2026-08-28
      - name: Readback
        run: |
          git fetch origin roadmap/kwork-productization-2026-08-28
          remote=origin/roadmap/kwork-productization-2026-08-28
          git show $remote:extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_CORRECTION_CURRENT_STATE.json | grep -q 'D12-04'
          git show $remote:extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_CORRECTION_DEFECT_LEDGER.tsv | grep -q $'D12-03\tNEW_PAGE_EVIDENCE_NOT_MATERIALIZED.*VERIFIED_FIXED'
          echo STEP12_D12_02_03_10_READBACK_PASS
