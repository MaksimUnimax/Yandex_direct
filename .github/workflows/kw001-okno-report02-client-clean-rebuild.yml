name: KW001 OKNO Report02 Client Clean Rebuild

on:
  push:
    branches:
      - roadmap/kwork-productization-2026-08-28
    paths:
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/REPORT02_CLIENT_CLEAN_REBUILD_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: kw001-okno-report02-client-clean-rebuild
  cancel-in-progress: false

jobs:
  build-qa-persist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: roadmap/kwork-productization-2026-08-28
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc libreoffice ghostscript poppler-utils >/dev/null
          python -m pip install --disable-pip-version-check --quiet python-docx pypdf

      - name: Regenerate canonical Markdown from preserved authorities
        run: |
          ROOT=extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK
          python "$ROOT/tools/post_release_correction/build_report02_implementation_guide.py"

      - name: Client-language deterministic QA
        run: |
          ROOT=extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK
          RELEASE="$ROOT/OKNO_MSK_RESEARCH_RELEASE_CORRECTED_2026-09-05"
          python "$ROOT/tools/post_release_correction/validate_report02_client_cleanliness.py" \
            "$RELEASE/sources/02_OKNO_MSK_SEO_IMPLEMENTATION_GUIDE_RU_2026-09-05.md" \
            --out /tmp/report02_cleanliness.json

      - name: Build DOCX and PDF
        run: |
          ROOT=extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK
          python "$ROOT/tools/post_release_correction/build_recipient_docx.py" --document 02

      - name: Cross-format language and structural QA
        run: |
          python - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          from docx import Document
          from pypdf import PdfReader

          root=Path('extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK')
          rel=root/'OKNO_MSK_RESEARCH_RELEASE_CORRECTED_2026-09-05'
          md=rel/'sources/02_OKNO_MSK_SEO_IMPLEMENTATION_GUIDE_RU_2026-09-05.md'
          docx=rel/'editable/02_OKNO_MSK_SEO_IMPLEMENTATION_GUIDE_RU_2026-09-05.docx'
          pdf=rel/'02_OKNO_MSK_SEO_IMPLEMENTATION_GUIDE_RU_2026-09-05.pdf'
          qa=root/'RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_02_CLIENT_INSTRUCTION_CLEANUP_QA_2026-09-08.json'

          md_text=md.read_text(encoding='utf-8')
          d=Document(docx)
          docx_text='\n'.join(p.text for p in d.paragraphs)
          for t in d.tables:
              for row in t.rows:
                  docx_text+='\n'+' | '.join(c.text for c in row.cells)
          reader=PdfReader(pdf)
          pdf_text='\n'.join((p.extract_text() or '') for p in reader.pages)

          banned=[
              'не выдавать за готовую','получить названное доказательство','из них не следует',
              'не внедрять','не размещать','что сейчас запрещено','граница приёмки сейчас',
              'отдельно санкционировать','новые факты не собирались','post-hoc',
              'Откройте страницу','Найдите на странице','Перейдите по ссылке'
          ]
          mechanics=[r'\bоткройте\b',r'\bперейдите\b',r'\bнайдите\b',r'\bкликните\b']
          internal=[r'S18-A\d+',r'STEP_[A-Z0-9_]+',r'Stage\d+',r'CV\d+',r'OR-\d+',r'\bCONTENT_BLOCK\b',r'\bSEMANTIC_MAPPING_ONLY\b',r'\bRECHECK_ONLY\b']
          for label,text in [('md',md_text),('docx',docx_text),('pdf',pdf_text)]:
              hits=[x for x in banned if x.casefold() in text.casefold()]
              hits += [x for x in mechanics if re.search(x,text,re.I)]
              hits += [x for x in internal if re.search(x,text,re.I)]
              if hits:
                  raise SystemExit(f'{label} CLIENT_LANGUAGE_FAIL {hits}')
          assert len(re.findall(r'^\| \d+ \|', md_text.split('## 6. Семантические назначения',1)[1].split('## 7.',1)[0], re.M))==46
          assert len(re.findall(r'^\| \d+ \|', md_text.split('## 8. Внутренние связи для детализации',1)[1].split('## 9.',1)[0], re.M))==14
          assert not re.search(r'опубликован\w*\s+в\s+2024|дата публикации', md_text, re.I)
          assert 'рейтинг производителей за 2024 год' in md_text
          pages=len(reader.pages)

          def sha(p):
              h=hashlib.sha256(); h.update(p.read_bytes()); return h.hexdigest()
          q=json.loads(Path('/tmp/report02_cleanliness.json').read_text(encoding='utf-8'))
          q.update({
              'scope':'DOCUMENT_02_CLIENT_INSTRUCTION_CLEANUP',
              'owner_review':'PENDING',
              'counts':{'ready':3,'clarification':5,'semantic_assignments':46,'additional_checks':4,'internal_links':14,'bibliography':10,'pdf_pages':pages},
              'cross_format':{'banned_language_hits_md':0,'banned_language_hits_docx':0,'banned_language_hits_pdf':0,'essential_section_equivalence':'PASS','a031_ranking_year_consistency':'PASS'},
              'artifacts':{
                  'markdown':{'size_bytes':md.stat().st_size,'sha256':sha(md)},
                  'docx':{'size_bytes':docx.stat().st_size,'sha256':sha(docx)},
                  'pdf':{'size_bytes':pdf.stat().st_size,'sha256':sha(pdf)}
              },
              'new_project_specific_data_collection':0,
              'post_hoc_evidence_used':0,
              'protected_artifacts':{'document_01_modified':False,'document_03_modified':False,'semantic_core_04_modified':False}
          })
          qa.write_text(json.dumps(q,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          manifest=rel/'RELEASE_MANIFEST_2026-09-05.json'
          m=json.loads(manifest.read_text(encoding='utf-8'))
          for a in m['recipient_artifacts']:
              if a['variant']=='02':
                  a['size_bytes']=pdf.stat().st_size; a['sha256']=sha(pdf); a['pages']=pages
          for a in m['editable_and_source_files']:
              if a['path'].startswith('editable/02_'):
                  a['size_bytes']=docx.stat().st_size; a['sha256']=sha(docx)
              if a['path'].startswith('sources/02_'):
                  a['size_bytes']=md.stat().st_size; a['sha256']=sha(md)
          m['document_02']['visual_qa']=f'PASS__{pages}_OF_{pages}_PDF__DOCX_RENDER_REQUIRED_FOR_OWNER_READBACK'
          manifest.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('REPORT02_CLIENT_CLEAN_CROSS_FORMAT_QA_PASS',pages,sha(md),sha(docx),sha(pdf))
          PY

      - name: Render final PDF for visual readback
        run: |
          ROOT=extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK
          RELEASE="$ROOT/OKNO_MSK_RESEARCH_RELEASE_CORRECTED_2026-09-05"
          mkdir -p /tmp/report02-render
          pdftoppm -png -r 130 "$RELEASE/02_OKNO_MSK_SEO_IMPLEMENTATION_GUIDE_RU_2026-09-05.pdf" /tmp/report02-render/page >/dev/null 2>&1
          test "$(find /tmp/report02-render -name 'page-*.png' | wc -l)" -ge 1

      - name: Persist cleaned Report 02 binaries and QA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ROOT=extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK
          RELEASE="$ROOT/OKNO_MSK_RESEARCH_RELEASE_CORRECTED_2026-09-05"
          git add "$RELEASE/sources/02_OKNO_MSK_SEO_IMPLEMENTATION_GUIDE_RU_2026-09-05.md"
          git add "$RELEASE/editable/02_OKNO_MSK_SEO_IMPLEMENTATION_GUIDE_RU_2026-09-05.docx"
          git add "$RELEASE/02_OKNO_MSK_SEO_IMPLEMENTATION_GUIDE_RU_2026-09-05.pdf"
          git add "$RELEASE/RELEASE_MANIFEST_2026-09-05.json"
          git add "$ROOT/RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_02_CLIENT_INSTRUCTION_CLEANUP_QA_2026-09-08.json"
          if git diff --cached --quiet; then
            echo "No materialization changes"
          else
            git commit -m "docs(okno-msk): materialize client-clean report 02 [skip ci]"
            git push origin HEAD:roadmap/kwork-productization-2026-08-28
          fi

      - name: Upload exact Report 02 and renders
        uses: actions/upload-artifact@v4
        with:
          name: report02-client-clean-readback
          path: |
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/OKNO_MSK_RESEARCH_RELEASE_CORRECTED_2026-09-05/sources/02_OKNO_MSK_SEO_IMPLEMENTATION_GUIDE_RU_2026-09-05.md
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/OKNO_MSK_RESEARCH_RELEASE_CORRECTED_2026-09-05/editable/02_OKNO_MSK_SEO_IMPLEMENTATION_GUIDE_RU_2026-09-05.docx
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/OKNO_MSK_RESEARCH_RELEASE_CORRECTED_2026-09-05/02_OKNO_MSK_SEO_IMPLEMENTATION_GUIDE_RU_2026-09-05.pdf
            /tmp/report02-render/*.png
          if-no-files-found: error
          retention-days: 7
