name: KW001 OKNO Report01 Step5A Linear Roadmap

on:
  push:
    branches:
      - roadmap/kwork-productization-2026-08-28
    paths:
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/REPORT01_STEP5A_LINEAR_ROADMAP_TRIGGER.txt'

permissions:
  contents: write
  actions: read

concurrency:
  group: kw001-okno-report01-step5a-linear-roadmap
  cancel-in-progress: false

jobs:
  rebuild-qa-persist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout live shared branch
        uses: actions/checkout@v4
        with:
          ref: roadmap/kwork-productization-2026-08-28
          fetch-depth: 0

      - name: Install document QA dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer fonts-liberation poppler-utils
          python -m pip install --disable-pip-version-check --quiet python-docx pypdf pillow

      - name: Record protected identities
        run: |
          git rev-parse HEAD > /tmp/start_head
          git rev-parse HEAD:extension/docs/kwork/KW002_SEMANTIC_CORE_FROM_SCRATCH > /tmp/kw002_before
          git rev-parse HEAD:extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/OKNO_MSK_RESEARCH_RELEASE_CORRECTED_2026-09-05 > /tmp/old_release_before

      - name: Rebuild Report 01 in canonical Step5A order everywhere
        run: |
          python extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/document01_step5a_linear_roadmap_rebuild_v3.py

      - name: Render and inspect every PDF page
        run: |
          ROOT=extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK
          REL="$ROOT/OKNO_MSK_RESEARCH_RELEASE_STEP05A_PROPAGATED_2026-09-09"
          OUT=/tmp/report01_step5a_linear_visual
          rm -rf "$OUT" && mkdir -p "$OUT"
          pdftoppm -png -r 150 "$REL/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-09.pdf" "$OUT/page"
          cp "$REL/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-09.pdf" "$OUT/"
          cp "$REL/editable/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-09.docx" "$OUT/"
          cp "$REL/sources/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-09.md" "$OUT/"
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat
          from pypdf import PdfReader
          root=Path('/tmp/report01_step5a_linear_visual')
          pages=sorted(root.glob('page-*.png'))
          assert pages, 'no rendered pages'
          for p in pages:
              im=Image.open(p).convert('L')
              assert ImageStat.Stat(im).extrema[0][0] < 245, (p,'apparently blank')
          pdf=next(root.glob('*.pdf'))
          texts=[(p.extract_text() or '').strip() for p in PdfReader(str(pdf)).pages]
          assert len(texts)==len(pages)
          assert all(len(t)>150 for t in texts), [len(t) for t in texts]
          assert len(texts[-1])>300, ('orphan final page',len(texts[-1]))
          print('VISUAL_PAGE_DENSITY_PASS',len(pages),[len(t) for t in texts])
          PY

      - name: Guard intended changes only
        run: |
          ROOT=extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK
          find "$ROOT" -type d -name '__pycache__' -prune -exec rm -rf {} +
          BAD=$(git status --short | awk '{print $2}' | grep -vE "^${ROOT}/(OKNO_MSK_RESEARCH_RELEASE_STEP05A_PROPAGATED_2026-09-09/(sources/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-09.md|editable/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-09.docx|01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-09.pdf|RELEASE_MANIFEST_2026-09-09.json)|DOCUMENT_01_STEP05A_COMPETITOR_AMENDMENT_QA_2026-09-09.json|DOCUMENT_01_STEP05A_LINEAR_ROADMAP_QA_2026-09-09.json|DOCUMENT_01_STEP05A_LINEAR_ROADMAP_REBUILD_2026-09-09.md|DOCUMENT_01_STEP05A_LINEAR_ORDER_QA_2026-09-09.json|DOCUMENT_01_STEP05A_LINEAR_ORDER_REBUILD_2026-09-09.md)$" || true)
          if [ -n "$BAD" ]; then echo "Unexpected changed paths:"; echo "$BAD"; exit 1; fi

      - name: Upload final visual QA bundle
        uses: actions/upload-artifact@v4
        with:
          name: okno-msk-report01-step5a-linear-roadmap-visual
          path: /tmp/report01_step5a_linear_visual
          if-no-files-found: error
          retention-days: 7

      - name: Commit and push fully linearized Report 01
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ROOT=extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK
          REL="$ROOT/OKNO_MSK_RESEARCH_RELEASE_STEP05A_PROPAGATED_2026-09-09"
          git add "$REL/sources/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-09.md"
          git add "$REL/editable/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-09.docx"
          git add "$REL/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-09.pdf"
          git add "$REL/RELEASE_MANIFEST_2026-09-09.json"
          git add "$ROOT/DOCUMENT_01_STEP05A_COMPETITOR_AMENDMENT_QA_2026-09-09.json"
          git add "$ROOT/DOCUMENT_01_STEP05A_LINEAR_ROADMAP_QA_2026-09-09.json"
          git add "$ROOT/DOCUMENT_01_STEP05A_LINEAR_ROADMAP_REBUILD_2026-09-09.md"
          git add "$ROOT/DOCUMENT_01_STEP05A_LINEAR_ORDER_QA_2026-09-09.json"
          git add "$ROOT/DOCUMENT_01_STEP05A_LINEAR_ORDER_REBUILD_2026-09-09.md"
          git commit -m "docs(okno-msk): place Step5A linearly across report01 [skip ci]"
          git push origin HEAD:roadmap/kwork-productization-2026-08-28
          git rev-parse HEAD > /tmp/material_head

      - name: Remote readback and protected-tree guard
        run: |
          git fetch origin roadmap/kwork-productization-2026-08-28
          test "$(git rev-parse origin/roadmap/kwork-productization-2026-08-28)" = "$(cat /tmp/material_head)"
          test "$(git rev-parse HEAD:extension/docs/kwork/KW002_SEMANTIC_CORE_FROM_SCRATCH)" = "$(cat /tmp/kw002_before)"
          test "$(git rev-parse HEAD:extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/OKNO_MSK_RESEARCH_RELEASE_CORRECTED_2026-09-05)" = "$(cat /tmp/old_release_before)"
          SRC=extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/OKNO_MSK_RESEARCH_RELEASE_STEP05A_PROPAGATED_2026-09-09/sources/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-09.md
          git show "$(cat /tmp/material_head):$SRC" | grep -F '### Анализ конкурентов и расширение семантики'
          if git show "$(cat /tmp/material_head):$SRC" | grep -Ei 'после основного исследования|дополнительный анализ конкурентов|после анализа конкурентов|по первоначальному ядру|проверок исходного ядра'; then
            echo 'late-addition wording survived remote readback'; exit 1
          fi
          python - <<'PY'
          import subprocess
          head=open('/tmp/material_head').read().strip()
          path='extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/OKNO_MSK_RESEARCH_RELEASE_STEP05A_PROPAGATED_2026-09-09/sources/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-09.md'
          text=subprocess.check_output(['git','show',f'{head}:{path}'],text=True)
          r=text[text.index('## Результат исследования'):text.index('\n## Как проводилась работа')]
          assert r.index('### Анализ конкурентов и расширение семантики') < r.index('Обычная выдача Яндекса использовалась для тех формулировок') < r.index('Проверка ядра по выдаче Алисы была одной из основных частей работы.')
          print('REMOTE_LINEAR_ORDER_PASS')
          PY
          echo "START_HEAD=$(cat /tmp/start_head)"
          echo "MATERIAL_HEAD=$(cat /tmp/material_head)"
          echo "REMOTE_READBACK_PASS"
