name: YMB B18 missing browser coverage (not independent acceptance)
on:
  push:
    branches: [wip/ymb-file-delivery-patch-a-2026-09-12]
    paths: [.github/workflows/ymb-b18-missing-qualification.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: ymb-b18-missing
  cancel-in-progress: false
jobs:
  missing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PUPPETEER_SKIP_CHROME_HEADLESS_SHELL_DOWNLOAD: 'true'
      PUPPETEER_SKIP_FIREFOX_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4f973a981a2d11b40c1f94e4154f2d5bfe0bc54d
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            extension/tests/wip/YMB_ASYNC_PATCH_B_2026-09-12/qa
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ymb-b17-pause-internal-evidence
          run-id: 34699125356
          github-token: ${{ github.token }}
          path: frozen-b17
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ymb-b17-cleanup-recheck-evidence
          run-id: 34699614409
          github-token: ${{ github.token }}
          path: frozen-cleanup
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Verify ready package and compile only QA
        shell: bash
        run: |
          set -euo pipefail
          Q=extension/tests/wip/YMB_ASYNC_PATCH_B_2026-09-12/qa
          python3 "$Q/b18_prepare.py" frozen-b17 frozen-cleanup "$RUNNER_TEMP/b18-qa"
          python3 "$Q/b18_fixture_recheck.py" "$RUNNER_TEMP/b18-qa/tests/b18.generated.mjs"
          node --check "$RUNNER_TEMP/b18-qa/tests/b18.generated.mjs"
          python3 - <<'PY'
          from pathlib import Path
          import json,os,hashlib
          r=Path(os.environ['RUNNER_TEMP']);d=r/'b18-deps';d.mkdir();b=r/'b18-qa'
          lock=(b/'package-lock.json').read_bytes();(d/'package-lock.json').write_bytes(lock)
          obj=json.loads(lock);(d/'package.json').write_text(json.dumps({'name':obj['name'],'private':True,'dependencies':obj['packages']['']['dependencies']}))
          (r/'b18-evidence').mkdir()
          identity=json.loads((b/'IDENTITY.json').read_text());identity['generated_after_QA_only_fix']=hashlib.sha256((b/'tests/b18.generated.mjs').read_bytes()).hexdigest();(b/'IDENTITY.json').write_text(json.dumps(identity,indent=2)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write(f'YMB_PPTR_HOME={d}\nYMB_BROWSER_CANDIDATE={b}/candidate\nYMB_BROWSER_EVIDENCE={r}/b18-evidence\n')
          PY
      - name: Same pinned qualified browser dependencies
        shell: bash
        run: npm ci --prefix "$YMB_PPTR_HOME" --no-audit --no-fund > "$YMB_BROWSER_EVIDENCE/npm.stdout" 2> "$YMB_BROWSER_EVIDENCE/npm.stderr"
      - name: Real popup discovery Autorun and new-install restore
        shell: bash
        run: xvfb-run -a node "$RUNNER_TEMP/b18-qa/tests/b18.generated.mjs" > "$YMB_BROWSER_EVIDENCE/run.stdout" 2> "$YMB_BROWSER_EVIDENCE/run.stderr"
      - name: Preserve every result without any browser profile
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,shutil,json,os
          t=Path(os.environ['RUNNER_TEMP']);p=t/'b18-publish';p.mkdir(exist_ok=True)
          for f in (t/'b18-evidence').glob('*'):
            if f.is_file() and f.suffix in ('.jsonl','.stdout','.stderr'):shutil.copyfile(f,p/f.name)
          if (t/'b18-qa/IDENTITY.json').is_file():shutil.copyfile(t/'b18-qa/IDENTITY.json',p/'IDENTITY.json')
          if (t/'b18-qa/tests').is_dir():shutil.copytree(t/'b18-qa/tests',p/'tests')
          (p/'BOUNDARY.json').write_text(json.dumps({'source_ref':'4f973a981a2d11b40c1f94e4154f2d5bfe0bc54d','product_zip':'1560599adfcfdb2c3180ec9103005b1584bcd39709b8fc45e233f6c1bdd11ee1','product_changes':0,'live_provider_calls':0,'controlled_page':True,'owner_profile_used':False,'first_run_preserved':34731010004,'independent_gate':False,'release_allowed':False},indent=2)+'\n')
          (p/'SHA256SUMS').write_text(''.join(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+f.relative_to(p).as_posix()+'\n' for f in sorted(p.rglob('*')) if f.is_file()))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ymb-b18-missing-browser-evidence
          path: ${{ runner.temp }}/b18-publish/
          retention-days: 90
          if-no-files-found: error
