name: KW001 Step12 Structural Units V4

on:
  push:
    branches:
      - roadmap/kwork-productization-2026-08-28
    paths:
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/step12_canonicalize_structural_units_v4.py'
      - '.github/workflows/kw001-step12-structural-units-v4.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: roadmap/kwork-productization-2026-08-28
          fetch-depth: 0
      - name: Canonicalize V4 structural units
        run: python extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/step12_canonicalize_structural_units_v4.py
      - name: Verify V4 candidate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK')
          q=json.loads((root/'STEP_12_STRUCTURAL_UNIT_CORRECTION_QA_V4.json').read_text(encoding='utf-8'))
          assert q['status']=='CANDIDATE_V4_READY_FOR_MANUAL_SEMANTIC_ACCEPTANCE'
          assert q['source_rows']==2332
          assert q['search_required_rows']==19
          assert q['historical_override_rows']==191
          assert q['historical_override_rows_with_explicit_final_unit']==191
          assert q['hidden_runtime_override_rules_in_v4_output']==0
          assert q['unit_metadata_inconsistency_rows']==0
          assert q['mandatory_mixed_original_units_still_final']==[]
          assert q['defects_closed_by_script_alone']==[]
          print('STEP12_STRUCTURAL_UNITS_V4_CANDIDATE_PASS')
          PY
      - name: Persist V4 immediately
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_STRUCTURAL_UNIT_ASSIGNMENTS_V4.tsv \
                  extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_STRUCTURAL_UNITS_V4.tsv \
                  extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_STRUCTURAL_UNIT_CORRECTIONS_V4.tsv \
                  extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_NO_PAGE_OUTSIDE_SALVAGE_REVIEW_V4.tsv \
                  extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_STRUCTURAL_UNIT_CORRECTION_QA_V4.json
          git commit -m "step12: persist V4 canonical structural units [skip ci]"
          git push origin HEAD:roadmap/kwork-productization-2026-08-28
      - name: Remote readback
        run: |
          git fetch origin roadmap/kwork-productization-2026-08-28
          remote=origin/roadmap/kwork-productization-2026-08-28
          git show $remote:extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_STRUCTURAL_UNIT_CORRECTION_QA_V4.json | grep -q 'CANDIDATE_V4_READY_FOR_MANUAL_SEMANTIC_ACCEPTANCE'
          git show $remote:extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_STRUCTURAL_UNITS_V4.tsv | grep -q 'PANORAMIC_WINDOWS_COMMERCIAL_CORE'
          echo STEP12_STRUCTURAL_UNITS_V4_READBACK_PASS
