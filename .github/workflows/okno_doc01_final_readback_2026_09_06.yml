name: OKNO document 01 final readback reconciliation

on:
  push:
    branches:
      - roadmap/kwork-productization-2026-08-28
    paths:
      - extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/.doc01_final_readback_trigger

permissions:
  contents: write

jobs:
  readback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: roadmap/kwork-productization-2026-08-28
          fetch-depth: 0
      - name: Verify and seal remote readback state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          job=Path('extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK')
          release=job/'OKNO_MSK_RESEARCH_RELEASE_CORRECTED_2026-09-05'
          qa_name='RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_01_RUSSIAN_CLIENT_QA_2026-09-06.json'
          pass_name='RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_01_RUSSIAN_CLIENT_QA_PASS_2026-09-06.md'
          readback_name='RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_01_RUSSIAN_CLIENT_GITHUB_READBACK_2026-09-06.md'
          q=json.loads((job/qa_name).read_text(encoding='utf-8'))
          assert q['status']=='PASS'
          assert q['checks']['forbidden_internal_latin_zero']
          assert q['checks']['source_native_latin_preserved']
          assert q['checks']['verbatim_brand_query_spelling_preserved']
          assert q['checks']['process_narrative_zero']
          assert q['checks']['internal_ascii_markers_zero']
          assert q['checks']['key_sections_equivalent']
          assert q['counts']=={'families':21,'assistant_cases':8,'observations':75,'actions':34}
          assert q['pdf_pages']==14
          paths={
              'markdown':release/'sources/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-05.md',
              'docx':release/'editable/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-05.docx',
              'pdf':release/'01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-05.pdf',
          }
          for k,p in paths.items():
              assert hashlib.sha256(p.read_bytes()).hexdigest()==q['sha256'][k]
              assert p.stat().st_size==q['size_bytes'][k]

          sp=job/'RESEARCH_REPORT_REBUILD_CURRENT_STATE_POST_RELEASE_2026-09-05.json'
          state=json.loads(sp.read_text(encoding='utf-8'))
          r=state['corrected_recipient_release']
          state['status']='STAGE_0_TO_15_HISTORICALLY_COMPLETE__DOCUMENT_01_RUSSIAN_CLIENT_CONTRACT_ANALYST_RECHECK_PASS__OWNER_REVIEW_PENDING'
          state['next_action']='OWNER_REVIEW_CORRECTED_DOCUMENT_01'
          state['correction_materialization_status']='DOCUMENT_01_RUSSIAN_CLIENT_CONTRACT_ANALYST_RECHECK_PASS__OWNER_REVIEW_PENDING__DOCUMENT_02_03_NOT_ADVANCED'
          r['document_01_owner_review']='PENDING__AWAITING_OWNER_RECHECK'
          r['document_01_owner_review_authority']=pass_name
          r['document_01_owner_review_commit_sha']='NOT_APPLICABLE__OWNER_REVIEW_PENDING'
          r['document_01_latest_material_correction_commit_sha']='6e7a92143b0419a5ba07b6495fba84aab3222f70'
          r['document_01_latest_github_content_readback']='PASS'
          r['document_01_github_readback_authority']=readback_name
          r['current_document']='01'
          r['owner_recheck']='ACTIVE__DOCUMENT_01_REWORKED__OWNER_REVIEW_PENDING'
          if '6e7a92143b0419a5ba07b6495fba84aab3222f70' not in r['materialization_commit_shas']:
              r['materialization_commit_shas'].append('6e7a92143b0419a5ba07b6495fba84aab3222f70')
          sp.write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          cp=job/'EXECUTION_CURSOR.json'
          cur=json.loads(cp.read_text(encoding='utf-8'))
          cur['execution_protocol_status']='RESEARCH_REBUILD_STAGE_0_TO_15_COMPLETE__DOCUMENT_01_RUSSIAN_CLIENT_ANALYST_RECHECK_PASS__OWNER_REVIEW_PENDING'
          cur['status']='RESEARCH_REBUILD_COMPLETE__DOCUMENT_01_RUSSIAN_CLIENT_ANALYST_RECHECK_PASS__OWNER_REVIEW_PENDING'
          cur['execution_unit']='POST_RELEASE_OWNER_REVIEW_CORRECTED_DOCUMENT_01'
          cur['next_action']='OWNER_REVIEW_CORRECTED_DOCUMENT_01'
          pr=cur['post_release_correction_2026_09_05']
          pr['status']='COMPLETE__DOCUMENT_01_RUSSIAN_CLIENT_ANALYST_RECHECK_PASS__GITHUB_READBACK_PASS__OWNER_REVIEW_PENDING__DOCUMENT_02_03_NOT_ADVANCED'
          pr['owner_recheck']='ACTIVE__DOCUMENT_01_REWORKED__OWNER_REVIEW_PENDING'
          if '6e7a92143b0419a5ba07b6495fba84aab3222f70' not in pr['materialization_commit_shas']:
              pr['materialization_commit_shas'].append('6e7a92143b0419a5ba07b6495fba84aab3222f70')
          d=cur['document_01_owner_recheck_2026_09_05']
          d['status']='ANALYST_RECHECK_PASS__OWNER_REVIEW_PENDING__SOURCE_NATIVE_BRANDS_PRESERVED__GITHUB_READBACK_PASS'
          d['current_document']='01'
          d['document_01_analyst_recheck']='PASS'
          d['document_01_owner_review']='PENDING__AWAITING_OWNER_RECHECK'
          d['next_action']='OWNER_REVIEW_CORRECTED_DOCUMENT_01'
          d['latest_material_correction_commit_sha']='6e7a92143b0419a5ba07b6495fba84aab3222f70'
          d['latest_github_content_readback']='PASS'
          d['github_readback_authority']=readback_name
          d['owner_review_pass_authority']='WITHDRAWN__OWNER_REVIEW_PENDING'
          d['owner_review_pass_commit_sha']='NOT_APPLICABLE__OWNER_REVIEW_PENDING'
          d['deterministic_qa_checks']=len(q['checks'])
          d['physical_pdf_qa']='PASS__14_OF_14_PAGES'
          d['forbidden_internal_latin']=0
          d['source_native_brands_preserved']=True
          d['verbatim_brand_query_spelling_preserved']=True
          d['internal_process_narrative']=0
          cp.write_text(json.dumps(cur,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          mp=release/'RELEASE_MANIFEST_2026-09-05.json'
          man=json.loads(mp.read_text(encoding='utf-8'))
          man['status']='DOCUMENT_01_RUSSIAN_CLIENT_ANALYST_RECHECK_PASS__GITHUB_READBACK_PASS__OWNER_REVIEW_PENDING__DOCUMENT_02_03_NOT_ADVANCED'
          z=man['qa']
          z['analyst_recipient_qa']='DOCUMENT_01_RUSSIAN_CLIENT_CONTRACT_PASS'
          z['document_01']='ANALYST_RECHECK_PASS__OWNER_REVIEW_PENDING'
          z['document_01_checks']=len(q['checks'])
          z['document_01_owner_review']='PENDING__AWAITING_OWNER_RECHECK'
          z['owner_recheck']='ACTIVE__DOCUMENT_01_REWORKED__OWNER_REVIEW_PENDING'
          z['document_01_github_readback']='PASS'
          z['document_01_github_readback_authority']='../'+readback_name
          z['current_document']='01'
          z['next_action']='OWNER_REVIEW_CORRECTED_DOCUMENT_01'
          mp.write_text(json.dumps(man,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          old_pass=job/'RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_01_OWNER_REVIEW_PASS_2026-09-06.md'
          old_rb=job/'RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_01_OWNER_PASS_GITHUB_READBACK_2026-09-06.md'
          for p in [old_pass,old_rb]:
              if p.exists():
                  text=p.read_text(encoding='utf-8')
                  if not text.startswith('> **ОТОЗВАНО'):
                      raise SystemExit(f'OLD_PASS_NOT_REVOKED: {p.name}')

          readback=f'''# ОКНО МОСКВА — удалённое чтение исправленного документа №01\n\nДата: 2026-09-06  \nМатериальный commit: `6e7a92143b0419a5ba07b6495fba84aab3222f70`  \nСтатус: `PASS__ANALYST_RECHECK_COMPLETE__OWNER_REVIEW_PENDING`\n\nПроверено на текущей ветке после материализации:\n- клиентский Markdown: SHA-256 `{q['sha256']['markdown']}`, {q['size_bytes']['markdown']} байт;\n- DOCX: SHA-256 `{q['sha256']['docx']}`, {q['size_bytes']['docx']} байт;\n- PDF: SHA-256 `{q['sha256']['pdf']}`, {q['size_bytes']['pdf']} байт, {q['pdf_pages']} страниц;\n- запрещённые внутренние латинские термины: 0;\n- исходные названия брендов сохранены: да;\n- дословные брендовые написания проверенных запросов сохранены: да;\n- внутреннее повествование о производстве отчёта: 0;\n- спорные семейства: 21/21;\n- проверки поискового помощника: 8/8;\n- наблюдения обычного Яндекса: 75/75;\n- практические решения: 34/34;\n- ключевые разделы эквивалентны в Markdown, DOCX и PDF: да.\n\nСтарый owner PASS отозван. Документ №01 не принят за владельца автоматически.\n\n`CURRENT_DOCUMENT = 01`  \n`DOCUMENT_01_ANALYST_RECHECK = PASS`  \n`DOCUMENT_01_OWNER_REVIEW = PENDING__AWAITING_OWNER_RECHECK`  \n`DOCUMENT_02_OWNER_REVIEW = PENDING`  \n`DOCUMENT_03_OWNER_REVIEW = PENDING`  \n`NEXT_ACTION = OWNER_REVIEW_CORRECTED_DOCUMENT_01`\n'''
          (job/readback_name).write_text(readback,encoding='utf-8')
          PY

          JOB='extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK'
          test ! -e "$JOB/.doc01_src"
          test ! -e "$JOB/.doc01_payload"
          test ! -e '.github/workflows/okno_doc01_materialize_2026_09_06.yml'
          test ! -e '.github/workflows/okno_doc01_diag_2026_09_06.yml'
          test ! -e '.github/workflows/okno_doc01_finalize2_2026_09_06.yml'
          test ! -e '.github/workflows/okno_doc01_reconcile_2026_09_06.yml'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$JOB/RESEARCH_REPORT_REBUILD_CURRENT_STATE_POST_RELEASE_2026-09-05.json" \
                  "$JOB/EXECUTION_CURSOR.json" \
                  "$JOB/OKNO_MSK_RESEARCH_RELEASE_CORRECTED_2026-09-05/RELEASE_MANIFEST_2026-09-05.json" \
                  "$JOB/RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_01_RUSSIAN_CLIENT_GITHUB_READBACK_2026-09-06.md"
          git rm "$JOB/.doc01_final_readback_trigger"
          git rm '.github/workflows/okno_doc01_final_readback_2026_09_06.yml'
          git commit -m 'docs(okno-msk): seal corrected document 01 remote readback'
          git push origin HEAD:roadmap/kwork-productization-2026-08-28
