name: KW001 Step12 Analysis Input Builder

on:
  push:
    branches:
      - roadmap/kwork-productization-2026-08-28
    paths:
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/step12_prepare_analysis_input.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: roadmap/kwork-productization-2026-08-28
          fetch-depth: 0
      - name: Build Step12 grouped phrase audit inputs
        run: python extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/step12_prepare_analysis_input.py
      - name: Verify generated inputs
        run: |
          test -f extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_CLUSTER_PHRASE_AUDIT_INDEX.md
          test -f extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_SEARCH_REQUIRED_INPUT.md
          grep -q 'TOTAL_EFFECTIVE_CLUSTERS = 75' extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_CLUSTER_PHRASE_AUDIT_INDEX.md
          grep -q 'TOTAL_ASSIGNED_PHRASES = 2313' extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_CLUSTER_PHRASE_AUDIT_INDEX.md
      - name: Commit grouped inputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_CLUSTER_PHRASE_AUDIT_*.md \
                  extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_SEARCH_REQUIRED_INPUT.md
          git commit -m "step12: materialize grouped phrase audit inputs [skip ci]"
          git push origin HEAD:roadmap/kwork-productization-2026-08-28
