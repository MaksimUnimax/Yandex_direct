name: KW001 Step12 D12-27 V5
on:
  push:
    paths:
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_D12_27_V5_TRIGGER.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: roadmap/kwork-productization-2026-08-28
          fetch-depth: 0
      - name: Build V5 and V6
        run: python extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/step12_build_d12_27_v5.py
      - name: Independent verify
        run: python extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/step12_verify_d12_27_v5.py
      - name: Persist diagnostics before final gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          base=extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK
          git add \
            $base/STEP_12_STRUCTURAL_UNIT_ASSIGNMENTS_V6.tsv \
            $base/STEP_12_D12_27_BASE_ACTIONS.tsv \
            $base/STEP_12_STRUCTURAL_ACTIONS_CORRECTED_V5.tsv \
            $base/STEP_12_PHRASE_ACTION_MAP_FINAL_V5.tsv \
            $base/STEP_12_INTERNAL_LINK_ACTIONS_V5.tsv \
            $base/STEP_12_STEP13_CANDIDATE_PAIRS_V5.tsv \
            $base/STEP_12_D12_27_GENERATOR_QA.json \
            $base/STEP_12_D12_27_BASE_INDEPENDENT_QA.json \
            $base/STEP_12_D12_27_BASE_QA_FINDINGS.tsv \
            $base/STEP_12_D12_27_INDEPENDENT_QA.json \
            $base/STEP_12_D12_27_QA_FINDINGS.tsv
          git commit -m "step12: persist D12-27 V5 diagnostics [skip ci]"
          git push origin HEAD:roadmap/kwork-productization-2026-08-28
      - name: Structured GitHub readback
        run: |
          git fetch origin roadmap/kwork-productization-2026-08-28
          remote=origin/roadmap/kwork-productization-2026-08-28
          base=extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK
          git show $remote:$base/STEP_12_D12_27_INDEPENDENT_QA.json > /tmp/q.json
          git show $remote:$base/STEP_12_D12_27_QA_FINDINGS.tsv > /tmp/f.tsv
          git show $remote:$base/STEP_12_STRUCTURAL_UNIT_ASSIGNMENTS_V6.tsv > /tmp/a.tsv
          git show $remote:$base/STEP_12_STRUCTURAL_ACTIONS_CORRECTED_V5.tsv > /tmp/v.tsv
          git show $remote:$base/STEP_12_PHRASE_ACTION_MAP_FINAL_V5.tsv > /tmp/p.tsv
          python - <<'PY'
          import csv,json
          q=json.load(open('/tmp/q.json',encoding='utf-8'))
          f=list(csv.DictReader(open('/tmp/f.tsv',encoding='utf-8',newline=''),delimiter='\t'))
          a=list(csv.DictReader(open('/tmp/a.tsv',encoding='utf-8',newline=''),delimiter='\t'))
          v=list(csv.DictReader(open('/tmp/v.tsv',encoding='utf-8',newline=''),delimiter='\t'))
          p=list(csv.DictReader(open('/tmp/p.tsv',encoding='utf-8',newline=''),delimiter='\t'))
          assert len(a)==2332 and len(p)==2332 and len(v)==160
          assert q['d12_27_reviewed_phrases']==65
          assert q['strong_fit_recheck_rows']==6
          print('STEP12_D12_27_V5_GITHUB_READBACK_READY',q['status'],q['findings'])
          PY
      - name: Final fail-closed gate
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          r=Path('extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK')
          q=json.loads((r/'STEP_12_D12_27_INDEPENDENT_QA.json').read_text(encoding='utf-8'))
          f=list(csv.DictReader((r/'STEP_12_D12_27_QA_FINDINGS.tsv').open(encoding='utf-8',newline=''),delimiter='\t'))
          assert q['status']=='STEP12_D12_27_V5_INDEPENDENT_PASS'
          assert q['findings']==0 and not f
          assert q['d12_27_reviewed_phrases']==65
          assert q['zero_member_structural_units']==[]
          assert q['strong_fit_keep_verified']==6
          assert q['new_page_actions']==0 and q['proposed_new_refs']==0
          assert not q['step13_executed']
          print('STEP12_D12_27_V5_FINAL_GATE_PASS')
          PY
