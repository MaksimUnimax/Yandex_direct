name: ai-native-gensearch-postmerge-main

on:
  push:
    branches:
      - candidate/ai-native-gensearch-production-gate-2026-08-28
    paths:
      - .github/workflows/ai-native-gensearch-postmerge-main.yml

permissions:
  contents: read

jobs:
  verify-exact-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assert main identity and accepted extension bytes
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_MAIN='67aeee71a42bdc0edb516341297987c1d1d26972'
          BASE='ca422ac5b1635bb42984d6076f3143780e1d72f6'
          SOURCE='aca7bd54c034e9ff856b081a2b22cc3746ccf28e'
          SOURCE_TREE='04dc6d015977270fb064b669ee03d04f6e130612'
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git rev-parse HEAD:extension/src)" = "$SOURCE_TREE"
          git diff --exit-code "$SOURCE" HEAD -- extension
          test -z "$(git diff --name-only "$BASE" HEAD -- .github)"
          test "$(git diff --name-only "$BASE" HEAD -- extension | wc -l | tr -d ' ')" = '16'
          echo GENSEARCH_POSTMERGE_MAIN_IDENTITY_PASS
          echo GENSEARCH_POSTMERGE_EXTENSION_BYTE_IDENTITY_PASS
          echo GENSEARCH_POSTMERGE_NO_CI_NOISE_PASS

      - name: Complete production Node regression
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find extension/src -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | sort -z)
          node --test extension/tests/*.test.mjs | tee /tmp/postmerge-node.log
          grep -F '# pass 99' /tmp/postmerge-node.log
          grep -F '# fail 0' /tmp/postmerge-node.log
          echo GENSEARCH_POSTMERGE_NODE_99_PASS

      - name: Install qualified Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false puppeteer@24
          npx puppeteer browsers install chrome
          command -v xvfb-run
          echo GENSEARCH_POSTMERGE_CHROME_READY

      - name: Controlled GenSearch browser production proof
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a node extension/tests/qa_browser/gensearch_browser_runtime.mjs | tee /tmp/postmerge-gensearch-browser.log
          grep -F 'GENSEARCH_BROWSER_ONE_REQUEST_PASS' /tmp/postmerge-gensearch-browser.log
          grep -F 'GENSEARCH_BROWSER_PROVIDER_CONTRACT_PASS' /tmp/postmerge-gensearch-browser.log
          grep -F 'GENSEARCH_BROWSER_RESPONSE_PROVENANCE_PASS' /tmp/postmerge-gensearch-browser.log
          grep -F 'GENSEARCH_BROWSER_NO_RETRY_PASS' /tmp/postmerge-gensearch-browser.log
          grep -F 'GENSEARCH_BROWSER_POPUP_SAVE_PRESERVES_ENABLED_PASS' /tmp/postmerge-gensearch-browser.log
          grep -F 'GENSEARCH_BROWSER_POPUP_SAVE_PRESERVES_EXPLICIT_DISABLE_PASS' /tmp/postmerge-gensearch-browser.log
          grep -F 'GENSEARCH_BROWSER_REAL_YANDEX_REQUESTS=0' /tmp/postmerge-gensearch-browser.log
          grep -F 'AI_NATIVE_GENSEARCH_BROWSER_RUNTIME_PASS' /tmp/postmerge-gensearch-browser.log
          echo AI_NATIVE_GENSEARCH_POSTMERGE_MAIN_PASS
