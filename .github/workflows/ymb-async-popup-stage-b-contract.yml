name: YMB async popup Stage B contract
on:
  push:
    branches: [qa/ymb-async-popup-stage-b-qualification-2026-09-13]
    paths:
      - .github/workflows/ymb-async-popup-stage-b-contract.yml
      - extension/tests/wip/YMB_ASYNC_PATCH_B_2026-09-12/qa/stage_b_popup_contract.test.mjs
permissions:
  contents: read
  actions: read
env:
  PRODUCT_SHA: 404dd03874e5df80a95bc6cec1e6967bb71de405
  STAGE_A_SHA: 341c847089e1207dd23bf876f5ba3ac537b65a10
jobs:
  contract-package:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Verify exact product bytes, allowlist and syntax
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet "$PRODUCT_SHA" -- extension/src
          mapfile -t changed < <(git diff --name-only "$STAGE_A_SHA" "$PRODUCT_SHA" -- extension/src | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = extension/src/content_script.js
          test "${changed[1]}" = extension/src/popup_search_async_monitor.js
          find extension/src -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
      - name: Stage B popup and Manual-ingress contract
        shell: bash
        env:
          STAGE_B_CONTRACT_EVIDENCE: ${{ runner.temp }}/stage-b-contract
        run: |
          set -euo pipefail
          mkdir -p "$STAGE_B_CONTRACT_EVIDENCE"
          node extension/tests/wip/YMB_ASYNC_PATCH_B_2026-09-12/qa/stage_b_popup_contract.test.mjs | tee "$STAGE_B_CONTRACT_EVIDENCE/run.stdout"
      - name: Deterministic dual ZIP and fresh extraction identity
        shell: bash
        env:
          PACKAGE_OUT: ${{ runner.temp }}/stage-b-package
        run: |
          set -euo pipefail
          mkdir -p "$PACKAGE_OUT"
          python3 - <<'PY'
          from pathlib import Path,PurePosixPath
          import hashlib,json,os,zipfile
          H=lambda b:hashlib.sha256(b).hexdigest();root=Path('extension/src');out=Path(os.environ['PACKAGE_OUT'])
          files={p.relative_to(root).as_posix():p.read_bytes() for p in sorted(root.rglob('*')) if p.is_file()}
          assert len(files)==68
          tree=H(''.join(H(v)+'  '+k+'\n' for k,v in sorted(files.items())).encode())
          prefix='Yandex-Marketing-Bridge-0.1.6/'
          def build(p):
            with zipfile.ZipFile(p,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9,strict_timestamps=True) as z:
              for name,b in sorted(files.items()):
                zi=zipfile.ZipInfo(prefix+name,date_time=(1980,1,1,0,0,0));zi.compress_type=zipfile.ZIP_DEFLATED;zi.create_system=3;zi.external_attr=(0o100644<<16);zi.flag_bits=0x800;z.writestr(zi,b,compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          a=out/'A.zip';b=out/'B.zip';build(a);build(b);assert a.read_bytes()==b.read_bytes()
          final=out/'Yandex-Marketing-Bridge-0.1.6-stage-b.zip';final.write_bytes(a.read_bytes())
          with zipfile.ZipFile(final) as z:
            assert z.testzip() is None; extracted={}
            for e in z.infolist():
              if e.is_dir(): continue
              p=PurePosixPath(e.filename);assert not p.is_absolute() and '..' not in p.parts and p.parts[0]=='Yandex-Marketing-Bridge-0.1.6'
              rel='/'.join(p.parts[1:]);assert rel not in extracted;extracted[rel]=z.read(e)
          assert set(extracted)==set(files) and all(extracted[k]==files[k] for k in files)
          extree=H(''.join(H(v)+'  '+k+'\n' for k,v in sorted(extracted.items())).encode());assert extree==tree
          result={'schema_version':1,'product_sha':os.environ['PRODUCT_SHA'],'tree_sha256':tree,'files':len(files),'zip_sha256':H(final.read_bytes()),'zip_bytes':final.stat().st_size,'dual_build_byte_identity':True,'fresh_extraction_identity':True,'pass':True}
          (out/'RESULT.json').write_text(json.dumps(result,indent=2)+'\n');(out/'SOURCE_SHA256SUMS').write_text(''.join(H(v)+'  '+k+'\n' for k,v in sorted(files.items())))
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ymb-stage-b-contract-package
          path: |
            ${{ runner.temp }}/stage-b-contract/
            ${{ runner.temp }}/stage-b-package/
          retention-days: 90
          if-no-files-found: error
