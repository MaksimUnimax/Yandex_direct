name: phase2-focused-search-manual-policy
on:
  pull_request:
    branches:
      - main
    paths:
      - extension/src/popup.html
      - extension/src/popup.js
      - extension/tests/popup_phase2_runtime.test.mjs
permissions:
  contents: read
jobs:
  focused-search-manual-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Search Manual policy popup regression
        shell: bash
        run: |
          set -euo pipefail
          node --test extension/tests/popup_phase2_runtime.test.mjs
      - name: Popup syntax
        shell: bash
        run: node --check extension/src/popup.js
