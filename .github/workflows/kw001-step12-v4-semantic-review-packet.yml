name: KW001 Step12 V4 Semantic Review Packet

on:
  push:
    branches:
      - roadmap/kwork-productization-2026-08-28
    paths:
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/step12_extract_v4_semantic_review_packet.py'
      - '.github/workflows/kw001-step12-v4-semantic-review-packet.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: roadmap/kwork-productization-2026-08-28
          fetch-depth: 0
      - name: Extract actual V4 review packet
        run: python extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/step12_extract_v4_semantic_review_packet.py
      - name: Structural sanity only
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          root=Path('extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK')
          rows=list(csv.DictReader((root/'STEP_12_SEMANTIC_CORRECTION_REGRESSION_ACTUAL.tsv').open(encoding='utf-8'),delimiter='\t'))
          assert len(rows)==24
          assert all(r['found']=='true' for r in rows)
          # This verifies only that the review packet is complete. It does NOT decide semantic correctness.
          print('STEP12_V4_REVIEW_PACKET_COMPLETE')
          PY
      - name: Persist packet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_SEMANTIC_CORRECTION_REVIEW_PACKET.md \
                  extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_SEMANTIC_CORRECTION_REGRESSION_ACTUAL.tsv
          git commit -m "step12: persist V4 semantic review packet [skip ci]"
          git push origin HEAD:roadmap/kwork-productization-2026-08-28
      - name: Remote readback
        run: |
          git fetch origin roadmap/kwork-productization-2026-08-28
          remote=origin/roadmap/kwork-productization-2026-08-28
          git show $remote:extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_SEMANTIC_CORRECTION_REVIEW_PACKET.md | grep -q 'actual persisted V4 output only'
          git show $remote:extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_SEMANTIC_CORRECTION_REGRESSION_ACTUAL.tsv | grep -q 'пластиковые окна в деревянном доме'
          echo STEP12_V4_REVIEW_PACKET_READBACK_PASS
