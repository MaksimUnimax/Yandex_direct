name: KW001 Step12 Strong Fit Gap Review
on:
  push:
    paths:
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_STRONG_FIT_GAP_REVIEW_TRIGGER.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: roadmap/kwork-productization-2026-08-28
          fetch-depth: 0
      - name: Extract
        run: python extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/step12_extract_strong_fit_gap_review.py
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          f=extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_THIRD_AUDIT_STRONG_FIT_GAP_REVIEW.tsv
          git add $f
          git commit -m "step12: persist strong-fit gap review subset [skip ci]"
          git push origin HEAD:roadmap/kwork-productization-2026-08-28
      - name: Readback
        run: |
          git fetch origin roadmap/kwork-productization-2026-08-28
          remote=origin/roadmap/kwork-productization-2026-08-28
          f=extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_THIRD_AUDIT_STRONG_FIT_GAP_REVIEW.tsv
          git show $remote:$f > /tmp/x.tsv
          python - <<'PY'
          import csv
          rows=list(csv.DictReader(open('/tmp/x.tsv',encoding='utf-8',newline=''),delimiter='\t'))
          assert rows
          print('STEP12_STRONG_FIT_GAP_REVIEW_READBACK_PASS',len(rows),[r['structural_unit_id'] for r in rows])
          PY
