name: ai-native-autorun-baseline-race-fix-r2

on:
  push:
    branches:
      - candidate/ai-native-gensearch-production-gate-2026-08-28
    paths:
      - .github/workflows/ai-native-autorun-baseline-race-fix-r2.yml

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: candidate/ai-native-gensearch-production-gate-2026-08-28

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply exact product fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:extension/src)" = '354230e8d68bf4759d98cdba55ec6ba0e0796c63'
          python .github/scripts/apply_autorun_baseline_race_fix.py
          node --check extension/src/content_script.js
          node --check extension/tests/autorun_baseline_sync.test.mjs
          node --check extension/tests/qa_browser/direct_codex_gate_addendum_v2.mjs
          node --test extension/tests/autorun_baseline_sync.test.mjs
          node --test extension/tests/*.test.mjs
          git diff --check
          echo 'TRACKED_DIFF:'
          git diff --name-only | sort
          echo 'UNTRACKED_DIFF:'
          git ls-files --others --exclude-standard | sort
          test "$(git diff --name-only | sort)" = $'extension/src/content_script.js\nextension/tests/qa_browser/direct_codex_gate_addendum_v2.mjs'
          test "$(git ls-files --others --exclude-standard | sort)" = 'extension/tests/autorun_baseline_sync.test.mjs'
          echo AUTORUN_BASELINE_RACE_SOURCE_REGRESSION_PASS

      - name: Install qualified Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false puppeteer@24
          npx puppeteer browsers install chrome
          command -v xvfb-run

      - name: Prove stale Manual turn cannot replay
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a node extension/tests/qa_browser/direct_codex_gate_addendum_v2.mjs | tee /tmp/autorun-baseline-race.log
          grep -F 'D16_STALE_MANUAL_TURN_BASELINE_FENCE_PASS' /tmp/autorun-baseline-race.log
          grep -F 'D16_DIRECT_ACTIVE_OTHER_PREFIXES_ZERO_TRAFFIC_PASS' /tmp/autorun-baseline-race.log
          grep -F 'D20_DIRECT_AUTORUN_ONE_FINGERPRINT_ONE_PROVIDER_ONE_DELIVERY_PASS' /tmp/autorun-baseline-race.log
          grep -F 'DIRECT_REAL_YANDEX_REQUESTS=0' /tmp/autorun-baseline-race.log
          grep -F 'PHASE5_DIRECT_CODEX_BROWSER_ADDENDUM_PASS' /tmp/autorun-baseline-race.log
          echo AUTORUN_BASELINE_RACE_BROWSER_PASS

      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git add extension/src/content_script.js extension/tests/autorun_baseline_sync.test.mjs extension/tests/qa_browser/direct_codex_gate_addendum_v2.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(autorun): refresh confirmed assistant baseline before scanning'
          git push origin HEAD:candidate/ai-native-gensearch-production-gate-2026-08-28
          echo "AUTORUN_BASELINE_FIX_COMMIT=$(git rev-parse HEAD)"
