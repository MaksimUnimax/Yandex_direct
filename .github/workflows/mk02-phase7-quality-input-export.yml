name: MK02 Phase7 Quality Input Export

on:
  push:
    branches:
      - roadmap/kwork-productization-2026-08-28
    paths:
      - '.github/workflows/mk02-phase7-quality-input-export.yml'
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/MINI_KWORKS_PRODUCTIZATION/MK02_SEMANTIC_CORE_ARCHITECTURE_DEV_TZ/tests/OKNO_MSK/.phase7_quality_export_trigger'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: roadmap/kwork-productization-2026-08-28
          fetch-depth: 1

      - name: Verify expected inputs
        run: |
          ROOT=extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/MINI_KWORKS_PRODUCTIZATION/MK02_SEMANTIC_CORE_ARCHITECTURE_DEV_TZ/tests/OKNO_MSK
          test -f "$ROOT/CLIENT_DELIVERY_PHASE_7_TARGET_FIRST_CORRECTED_2026-09-10/SEMANTIC_CORE_AND_TARGET_SEO_STRUCTURE_OKNO_MSK_2026-09-10.xlsx"
          test -f "$ROOT/CLIENT_DELIVERY_PHASE_7_TARGET_FIRST_CORRECTED_2026-09-10/TARGET_SEO_ARCHITECTURE_REPORT_OKNO_MSK_2026-09-10.pdf"
          test -f "$ROOT/CLIENT_DELIVERY_PHASE_7_TARGET_FIRST_CORRECTED_2026-09-10/TARGET_PAGE_SPECIFICATION_TZ_OKNO_MSK_2026-09-10.pdf"
          test -f "$ROOT/MK02_SEMANTIC_FOUNDATION_2026-09-10.tsv.gz"
          test -f "$ROOT/TARGET_FIRST_PHRASE_LANDING_MAP_2026-09-10.tsv.gz"
          test -f "$ROOT/TARGET_FIRST_CLUSTER_LANDING_MAP_2026-09-10.tsv"
          test -f "$ROOT/TARGET_PAGE_REGISTRY_2026-09-10.tsv"
          test -f "$ROOT/TARGET_ARCHITECTURE_HIERARCHY_2026-09-10.tsv"
          test -f "$ROOT/CURRENT_TARGET_RECONCILIATION_2026-09-10.tsv"
          test -f "$ROOT/TARGET_PAGE_SPEC_REGISTER_2026-09-10.tsv"
          test -f "$ROOT/CURRENT_TARGET_CHANGE_DELTA_2026-09-10.tsv"
          test -f "$ROOT/MK02_PAGE_RELATIONSHIPS_2026-09-10.tsv"
          test -f "$ROOT/build_target_first_client_pdfs.py"
          test -f "$ROOT/build_target_first_client_workbook.mjs"

      - name: Upload exact published inputs
        uses: actions/upload-artifact@v4
        with:
          name: mk02-phase7-quality-input
          path: |
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/MINI_KWORKS_PRODUCTIZATION/MK02_SEMANTIC_CORE_ARCHITECTURE_DEV_TZ/tests/OKNO_MSK/CLIENT_DELIVERY_PHASE_7_TARGET_FIRST_CORRECTED_2026-09-10/*
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/MINI_KWORKS_PRODUCTIZATION/MK02_SEMANTIC_CORE_ARCHITECTURE_DEV_TZ/tests/OKNO_MSK/MK02_SEMANTIC_FOUNDATION_2026-09-10.tsv.gz
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/MINI_KWORKS_PRODUCTIZATION/MK02_SEMANTIC_CORE_ARCHITECTURE_DEV_TZ/tests/OKNO_MSK/TARGET_FIRST_PHRASE_LANDING_MAP_2026-09-10.tsv.gz
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/MINI_KWORKS_PRODUCTIZATION/MK02_SEMANTIC_CORE_ARCHITECTURE_DEV_TZ/tests/OKNO_MSK/TARGET_FIRST_CLUSTER_LANDING_MAP_2026-09-10.tsv
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/MINI_KWORKS_PRODUCTIZATION/MK02_SEMANTIC_CORE_ARCHITECTURE_DEV_TZ/tests/OKNO_MSK/TARGET_PAGE_REGISTRY_2026-09-10.tsv
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/MINI_KWORKS_PRODUCTIZATION/MK02_SEMANTIC_CORE_ARCHITECTURE_DEV_TZ/tests/OKNO_MSK/TARGET_ARCHITECTURE_HIERARCHY_2026-09-10.tsv
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/MINI_KWORKS_PRODUCTIZATION/MK02_SEMANTIC_CORE_ARCHITECTURE_DEV_TZ/tests/OKNO_MSK/CURRENT_TARGET_RECONCILIATION_2026-09-10.tsv
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/MINI_KWORKS_PRODUCTIZATION/MK02_SEMANTIC_CORE_ARCHITECTURE_DEV_TZ/tests/OKNO_MSK/TARGET_PAGE_SPEC_REGISTER_2026-09-10.tsv
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/MINI_KWORKS_PRODUCTIZATION/MK02_SEMANTIC_CORE_ARCHITECTURE_DEV_TZ/tests/OKNO_MSK/CURRENT_TARGET_CHANGE_DELTA_2026-09-10.tsv
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/MINI_KWORKS_PRODUCTIZATION/MK02_SEMANTIC_CORE_ARCHITECTURE_DEV_TZ/tests/OKNO_MSK/MK02_PAGE_RELATIONSHIPS_2026-09-10.tsv
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/MINI_KWORKS_PRODUCTIZATION/MK02_SEMANTIC_CORE_ARCHITECTURE_DEV_TZ/tests/OKNO_MSK/build_target_first_client_pdfs.py
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/MINI_KWORKS_PRODUCTIZATION/MK02_SEMANTIC_CORE_ARCHITECTURE_DEV_TZ/tests/OKNO_MSK/build_target_first_client_workbook.mjs
          if-no-files-found: error
          retention-days: 2
