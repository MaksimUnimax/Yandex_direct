name: phase9-gsc-identity-seed

on:
  push:
    branches:
      - phase9/google-organic-provider-research-2026-08-28
    paths:
      - .github/workflows/phase9-gsc-identity-seed.yml

permissions:
  contents: read

jobs:
  freeze-identity-seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SHA: b13886df49c4591320f780769e78016eff23301e
      EXPECTED_SRC_TREE: bdad1e87a2537d8646e480ca23f8068c3dced17e
      ZIP_NAME: phase9-gsc-identity-seed-main-b13886df.zip
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify accepted production source
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$SOURCE_SHA^{commit}"
          test "$(git rev-parse "$SOURCE_SHA:extension/src")" = "$EXPECTED_SRC_TREE"
          echo PHASE9_GSC_IDENTITY_SEED_SOURCE_PIN_PASS
      - name: Build exact extension-root seed ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/p9-gsc-identity-seed
          mkdir -p /tmp/p9-gsc-identity-seed/extension
          git archive "$SOURCE_SHA:extension/src" | tar -x -C /tmp/p9-gsc-identity-seed/extension
          node - <<'NODE'
          const fs = require('fs');
          const path = '/tmp/p9-gsc-identity-seed/extension/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (manifest.permissions?.includes('identity')) throw new Error('identity permission must not be present in identity seed');
          if (manifest.host_permissions?.some((item) => String(item).includes('googleapis.com'))) throw new Error('Google host permission must not be present in identity seed');
          if (Object.hasOwn(manifest, 'oauth2')) throw new Error('oauth2 must not be present in identity seed');
          if (Object.hasOwn(manifest, 'key')) throw new Error('manifest key must not be present before permanent identity assignment');
          NODE
          test -f /tmp/p9-gsc-identity-seed/extension/manifest.json
          (cd /tmp/p9-gsc-identity-seed/extension && zip -X -q -r "../$ZIP_NAME" .)
          test -s "/tmp/p9-gsc-identity-seed/$ZIP_NAME"
          echo PHASE9_GSC_IDENTITY_SEED_ZIP_ROOT_PASS
      - name: Record deterministic metadata
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/p9-gsc-identity-seed
          SHA256="$(sha256sum "$ZIP_NAME" | awk '{print $1}')"
          BYTES="$(stat -c '%s' "$ZIP_NAME")"
          FILES="$(find extension -type f | wc -l | tr -d ' ')"
          cat > identity-seed-metadata.txt <<EOF
          PHASE9_GSC_IDENTITY_SEED_SOURCE_SHA=$SOURCE_SHA
          PHASE9_GSC_IDENTITY_SEED_SRC_TREE=$EXPECTED_SRC_TREE
          PHASE9_GSC_IDENTITY_SEED_ZIP=$ZIP_NAME
          PHASE9_GSC_IDENTITY_SEED_SHA256=$SHA256
          PHASE9_GSC_IDENTITY_SEED_BYTES=$BYTES
          PHASE9_GSC_IDENTITY_SEED_PRODUCT_FILES=$FILES
          PHASE9_GSC_IDENTITY_SEED_MANIFEST_AT_ROOT=true
          PHASE9_GSC_IDENTITY_SEED_REAL_GOOGLE_REQUESTS=0
          PHASE9_GSC_IDENTITY_SEED_REAL_YANDEX_REQUESTS=0
          EOF
          cat identity-seed-metadata.txt
          echo PHASE9_GSC_IDENTITY_SEED_METADATA_PASS
      - uses: actions/upload-artifact@v4
        with:
          name: phase9-gsc-identity-seed-main-b13886df
          path: |
            /tmp/p9-gsc-identity-seed/phase9-gsc-identity-seed-main-b13886df.zip
            /tmp/p9-gsc-identity-seed/identity-seed-metadata.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
