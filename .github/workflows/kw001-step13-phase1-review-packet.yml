name: KW001 Step13 Phase1 Review Packet
on:
  push:
    paths:
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_13_PHASE1_REVIEW_PACKET_TRIGGER.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: roadmap/kwork-productization-2026-08-28
          fetch-depth: 0
      - name: Extract exact pair/url review packet
        run: python extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/step13_extract_phase1_review_packet.py
      - name: Persist packet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          b=extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK
          git add $b/STEP_13_PAIR_INPUT_NORMALIZED.tsv $b/STEP_13_UNIQUE_URLS.tsv $b/STEP_13_PAIR_REVIEW_CHUNK_*.tsv $b/STEP_13_PHASE1_REVIEW_PACKET_QA.json
          git commit -m "step13: persist phase1 review packet [skip ci]"
          git push origin HEAD:roadmap/kwork-productization-2026-08-28
      - name: Durable readback and gate
        run: |
          git fetch origin roadmap/kwork-productization-2026-08-28
          remote=origin/roadmap/kwork-productization-2026-08-28
          b=extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK
          git show $remote:$b/STEP_13_PHASE1_REVIEW_PACKET_QA.json > /tmp/q.json
          python - <<'PY'
          import json
          q=json.load(open('/tmp/q.json',encoding='utf-8'))
          assert q['input_pairs']==195
          assert q['normalized_pairs']==195
          assert q['unique_pair_ids']==195
          assert q['silent_pair_drops']==0
          assert q['provider_calls']==0
          assert not q['step13_search_executed']
          print('STEP13_PHASE1_REVIEW_PACKET_READBACK_PASS',q['unique_urls'],q['chunks'])
          PY
