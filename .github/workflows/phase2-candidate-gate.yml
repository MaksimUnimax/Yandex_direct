name: phase2-focused-development
on:
  push:
    branches:
      - candidate/phase2-search-reconstruction-2026-08-23
    paths:
      - .github/workflows/phase2-candidate-gate.yml
permissions:
  contents: write
jobs:
  focused-manual-request-recovery-transport:
    if: github.ref == 'refs/heads/candidate/phase2-search-reconstruction-2026-08-23'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/phase2-search-reconstruction-2026-08-23
          fetch-depth: 0
      - name: Apply exact Manual request recovery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('extension/src/service_worker.js')
          text = path.read_text(encoding='utf-8')
          old = '''async function recoverPersistedRuntime() {
            const runs = (await storageGet(KEYS.AUTO_RUNS))[KEYS.AUTO_RUNS] || {};
            const outbox = await getOutbox();
            for (const [key, rawRun] of Object.entries(runs)) {
              const run = rawRun && typeof rawRun === "object" ? rawRun : null;
              if (!run || run.status !== WordstatAutorunModel.RUN_STATUSES.REQUESTING) continue;
              if (!run.request_worker_session_id || run.request_worker_session_id === WORKER_SESSION_ID) continue;
              if (outbox[key]) continue;
              await stageAutorunError(key, run, run.tab_id, {
                code: "REQUEST_OUTCOME_UNKNOWN_NO_RETRY",
                message: "Worker перезапустился после начала внешнего запроса. Исход запроса неизвестен; автоматический повтор запрещён.",
                stage: "PROVIDER_RECOVERY",
                requestExecuted: "UNKNOWN",
                assistantTurnId: run.last_assistant_turn_id || "",
                fingerprint: run.last_command_fingerprint || null
              });
            }
          }'''.replace('          ', '')
          new = '''async function recoverPersistedRuntime() {
            const outbox = await getOutbox();
            const manualData = await storageGet(KEYS.MANUAL_OPERATIONS);
            const manualMap = { ...(manualData[KEYS.MANUAL_OPERATIONS] || {}) };
            let manualChanged = false;
            for (const [key, rawOperation] of Object.entries(manualMap)) {
              const operation = rawOperation && typeof rawOperation === "object" ? rawOperation : null;
              if (!operation || operation.status !== "requesting") continue;
              const existing = outbox[key] || null;
              if (existing) {
                if (existing.type === "manual" && existing.operation_id === operation.operation_id) {
                  manualMap[key] = {
                    ...operation,
                    status: "delivering",
                    delivery_id: existing.delivery_id,
                    request_executed: Number(existing.provider_executions || 0) > 0 ? true : (operation.request_executed ?? false),
                    report_ready_at: existing.updated_at || existing.created_at || nowIso(),
                    recovered_at: nowIso()
                  };
                  manualChanged = true;
                }
                continue;
              }
              const deliveryId = uid("delivery");
              const reportText = formatBridgeError({
                code: "REQUEST_OUTCOME_UNKNOWN_NO_RETRY",
                message: "Worker перезапустился после начала Manual provider request. Исход запроса неизвестен; автоматический повтор запрещён.",
                stage: "PROVIDER_RECOVERY",
                requestExecuted: "UNKNOWN",
                service: operation.active_service || null,
                channel: "manual",
                recoverable: false,
                runId: operation.run_id || null,
                operation: null,
                operationId: operation.operation_id || null,
                autorunContinues: false
              });
              outbox[key] = await putOutbox(key, {
                delivery_id: deliveryId,
                operation_id: operation.operation_id,
                type: "manual",
                tab_id: Number(operation.tab_id),
                report_text: reportText,
                phase: "claimed",
                provider_executions: null,
                report_prefix_applied: false,
                created_at: nowIso()
              });
              manualMap[key] = {
                ...operation,
                status: "delivering",
                delivery_id: deliveryId,
                request_executed: "UNKNOWN",
                report_ready_at: nowIso(),
                recovered_at: nowIso()
              };
              manualChanged = true;
            }
            if (manualChanged) await storageSet({ [KEYS.MANUAL_OPERATIONS]: manualMap });

            const runs = (await storageGet(KEYS.AUTO_RUNS))[KEYS.AUTO_RUNS] || {};
            for (const [key, rawRun] of Object.entries(runs)) {
              const run = rawRun && typeof rawRun === "object" ? rawRun : null;
              if (!run || run.status !== WordstatAutorunModel.RUN_STATUSES.REQUESTING) continue;
              if (!run.request_worker_session_id || run.request_worker_session_id === WORKER_SESSION_ID) continue;
              if (outbox[key]) continue;
              await stageAutorunError(key, run, run.tab_id, {
                code: "REQUEST_OUTCOME_UNKNOWN_NO_RETRY",
                message: "Worker перезапустился после начала внешнего запроса. Исход запроса неизвестен; автоматический повтор запрещён.",
                stage: "PROVIDER_RECOVERY",
                requestExecuted: "UNKNOWN",
                assistantTurnId: run.last_assistant_turn_id || "",
                fingerprint: run.last_command_fingerprint || null
              });
            }
          }'''.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit(f'expected one recoverPersistedRuntime block, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = "extension/src/service_worker.js"
      - name: Focused Stage 3 runtime regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            extension/tests/content_error_delivery_recovery.test.mjs \
            extension/tests/manual_paused_run_owner_fence_recovery.test.mjs \
            extension/tests/autorun_owner_controls_recovery.test.mjs \
            extension/tests/autorun_recovery.test.mjs \
            extension/tests/manual_mode_owner_control_recovery.test.mjs \
            extension/tests/manual_request_restart_recovery.test.mjs \
            extension/tests/service_context_owner_control_recovery.test.mjs \
            extension/tests/service_context_owner_lock_recovery.test.mjs \
            extension/tests/report_prefix_owner_control_recovery.test.mjs \
            extension/tests/start_prompt_and_prefix_recovery.test.mjs \
            extension/tests/auto_start_prompt_tab_control_recovery.test.mjs
      - name: Changed runtime syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check extension/src/service_worker.js
          node --check extension/src/popup.js
      - name: Commit verified production fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/src/service_worker.js
          git commit -m "fix: recover abandoned Manual requesting state"
          git push origin HEAD:candidate/phase2-search-reconstruction-2026-08-23
