name: phase2-focused-development
on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase2-candidate-gate.yml
      - extension/src/popup.js
      - extension/tests/popup_phase2_runtime.test.mjs
permissions:
  contents: read
jobs:
  focused-manual-service-alignment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Focused Manual service alignment regression
        shell: bash
        run: |
          set -euo pipefail
          node --test extension/tests/popup_phase2_runtime.test.mjs
      - name: Changed popup syntax
        shell: bash
        run: node --check extension/src/popup.js
