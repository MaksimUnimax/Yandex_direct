name: phase2-focused-development
on:
  push:
    branches:
      - candidate/phase2-search-reconstruction-2026-08-23
    paths:
      - .github/workflows/phase2-candidate-gate.yml
      - extension/src/service_worker.js
      - extension/tests/manual_mode_owner_control_recovery.test.mjs
permissions:
  contents: write
jobs:
  focused-stage3-owner-fences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/phase2-search-reconstruction-2026-08-23
      - name: Apply exact Manual operation owner fence
        shell: python
        run: |
          from pathlib import Path
          path = Path('extension/src/service_worker.js')
          text = path.read_text(encoding='utf-8')
          old = '''async function setManualModeFromTab(conversationKey, enabled, tabId) {
            const key = normalizeConversationKey(conversationKey);
            const tab = Number(tabId);
            if (!Number.isInteger(tab)) throw Object.assign(new Error("Не определена вкладка для изменения Manual mode."), { code: "OWNER_TAB_REQUIRED" });
            const run = await getAutoRun(key);
            if (run && !WordstatAutorunModel.isTerminalStatus(run.status)) {
              if (tab !== Number(run.tab_id)) throw Object.assign(new Error("Manual mode может изменять только вкладка-owner активного Autorun."), { code: "AUTO_NON_OWNER_TAB" });
              await assertTabConversation(tab, key, run.conversation_id);
              if (enabled === true && run.status !== WordstatAutorunModel.RUN_STATUSES.PAUSED) throw Object.assign(new Error("Для включения Manual активный Autorun должен быть поставлен на паузу."), { code: "AUTORUN_NOT_PAUSED" });
            } else {
              await assertTabConversation(tab, key);
            }
            return setManualMode(key, enabled === true);
          }'''.replace('          ', '')
          new = '''async function setManualModeFromTab(conversationKey, enabled, tabId) {
            const key = normalizeConversationKey(conversationKey);
            const tab = Number(tabId);
            if (!Number.isInteger(tab)) throw Object.assign(new Error("Не определена вкладка для изменения Manual mode."), { code: "OWNER_TAB_REQUIRED" });
            const operations = (await storageGet(KEYS.MANUAL_OPERATIONS))[KEYS.MANUAL_OPERATIONS] || {};
            const operation = operations[key] || null;
            if (operation && !TERMINAL_MANUAL_STATUSES.has(operation.status)) {
              if (tab !== Number(operation.tab_id)) throw Object.assign(new Error("Manual mode может изменять только вкладка-owner активной Manual operation."), { code: "AUTO_NON_OWNER_TAB" });
              await assertTabConversation(tab, key);
              throw Object.assign(new Error("Нельзя изменять Manual mode до завершения активной Manual operation."), { code: "MANUAL_OPERATION_ACTIVE" });
            }
            const run = await getAutoRun(key);
            if (run && !WordstatAutorunModel.isTerminalStatus(run.status)) {
              if (tab !== Number(run.tab_id)) throw Object.assign(new Error("Manual mode может изменять только вкладка-owner активного Autorun."), { code: "AUTO_NON_OWNER_TAB" });
              await assertTabConversation(tab, key, run.conversation_id);
              if (enabled === true && run.status !== WordstatAutorunModel.RUN_STATUSES.PAUSED) throw Object.assign(new Error("Для включения Manual активный Autorun должен быть поставлен на паузу."), { code: "AUTORUN_NOT_PAUSED" });
            } else {
              await assertTabConversation(tab, key);
            }
            return setManualMode(key, enabled === true);
          }'''.replace('          ', '')
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit('expected exactly one old setManualModeFromTab target')
              text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('neither old nor new setManualModeFromTab target found')
      - name: Verify patch scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          if [ -n "$changed" ] && [ "$changed" != "extension/src/service_worker.js" ]; then
            printf 'unexpected changed paths:\n%s\n' "$changed"
            exit 1
          fi
      - name: Focused Manual owner regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            extension/tests/manual_mode_owner_control_recovery.test.mjs \
            extension/tests/manual_paused_run_owner_fence_recovery.test.mjs \
            extension/tests/content_error_delivery_recovery.test.mjs \
            extension/tests/autorun_owner_controls_recovery.test.mjs \
            extension/tests/autorun_recovery.test.mjs
      - name: Changed runtime syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check extension/src/service_worker.js
          node --check extension/src/popup.js
      - name: Commit verified Manual operation owner fence
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- extension/src/service_worker.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/src/service_worker.js
          git commit -m "fix: lock Manual mode during active operation"
          git push origin HEAD:candidate/phase2-search-reconstruction-2026-08-23
