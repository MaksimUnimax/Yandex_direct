name: phase2-focused-development
on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase2-candidate-gate.yml
      - extension/src/service_worker.js
      - extension/tests/conversation_fences_recovery.test.mjs
      - extension/tests/autorun_recovery.test.mjs
      - extension/tests/search_manual_worker.test.mjs
      - extension/tests/manual_delivery_lifecycle_recovery.test.mjs
      - extension/tests/content_error_delivery_recovery.test.mjs
permissions:
  contents: write
jobs:
  focused-delivery-owner-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Update direct delivery harness callers with owner sender
        shell: python
        run: |
          from pathlib import Path
          replacements = {
              "extension/tests/autorun_recovery.test.mjs": [
                  ("await h.api.completeDelivery({conversation_key:CKEY,delivery_id:deliveryId,confirmation_basis:'microphone'});", "await h.api.completeDelivery({conversation_key:CKEY,delivery_id:deliveryId,confirmation_basis:'microphone'},{tab:{id:1}});"),
                  ("await h.api.completeDelivery({conversation_key:CKEY,delivery_id:'delivery-2',confirmation_basis:'microphone'});", "await h.api.completeDelivery({conversation_key:CKEY,delivery_id:'delivery-2',confirmation_basis:'microphone'},{tab:{id:1}});"),
                  ("await h.api.completeDelivery({conversation_key:CKEY,delivery_id:outbox.delivery_id,confirmation_basis:'microphone'});", "await h.api.completeDelivery({conversation_key:CKEY,delivery_id:outbox.delivery_id,confirmation_basis:'microphone'},{tab:{id:1}});"),
                  ("await h.api.completeDelivery({conversation_key:CKEY,delivery_id:delivery.delivery_id,confirmation_basis:'microphone'});", "await h.api.completeDelivery({conversation_key:CKEY,delivery_id:delivery.delivery_id,confirmation_basis:'microphone'},{tab:{id:1}});")
              ],
              "extension/tests/search_manual_worker.test.mjs": [
                  ("await h.api.completeDelivery({conversation_key:CKEY,delivery_id:r.delivery_id,confirmation_basis:'microphone'});", "await h.api.completeDelivery({conversation_key:CKEY,delivery_id:r.delivery_id,confirmation_basis:'microphone'},{tab:{id:1}});")
              ],
              "extension/tests/content_error_delivery_recovery.test.mjs": [
                  ("await h.api.completeDelivery({conversation_key:CKEY,delivery_id:'result-1',confirmation_basis:'microphone'});", "await h.api.completeDelivery({conversation_key:CKEY,delivery_id:'result-1',confirmation_basis:'microphone'},{tab:{id:1}});"),
                  ("await h.api.completeDelivery({conversation_key:CKEY,delivery_id:'busy'});", "await h.api.completeDelivery({conversation_key:CKEY,delivery_id:'busy'},{tab:{id:1}});")
              ]
          }
          changed = False
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old in text:
                      if text.count(old) != 1:
                          raise SystemExit(f"expected one delivery harness target in {filename}: {old}")
                      text = text.replace(old, new)
                      changed = True
                  elif new not in text:
                      raise SystemExit(f"delivery harness target missing in {filename}: {old}")
              path.write_text(text, encoding="utf-8")
      - name: Focused delivery and directly affected worker regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            extension/tests/conversation_fences_recovery.test.mjs \
            extension/tests/autorun_recovery.test.mjs \
            extension/tests/search_manual_worker.test.mjs \
            extension/tests/manual_delivery_lifecycle_recovery.test.mjs \
            extension/tests/content_error_delivery_recovery.test.mjs
      - name: Changed worker syntax
        shell: bash
        run: node --check extension/src/service_worker.js
      - name: Commit harness contract update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- extension/tests/autorun_recovery.test.mjs extension/tests/search_manual_worker.test.mjs extension/tests/content_error_delivery_recovery.test.mjs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/tests/autorun_recovery.test.mjs extension/tests/search_manual_worker.test.mjs extension/tests/content_error_delivery_recovery.test.mjs
          git commit -m "test: pass owner sender to delivery completion"
          git push origin HEAD:${{ github.head_ref }}
