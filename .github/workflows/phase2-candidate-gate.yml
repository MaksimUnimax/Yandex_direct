name: phase2-focused-development
on:
  push:
    branches:
      - candidate/phase2-search-reconstruction-2026-08-23
    paths:
      - .github/workflows/phase2-candidate-gate.yml
permissions:
  contents: write
jobs:
  focused-start-prompt-owner-transport:
    if: github.ref == 'refs/heads/candidate/phase2-search-reconstruction-2026-08-23'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/phase2-search-reconstruction-2026-08-23
          fetch-depth: 0
      - name: Apply exact start-prompt owner correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('extension/src/service_worker.js')
          text = path.read_text(encoding='utf-8')
          start = text.index('async function saveAutoStartPromptFromTab(')
          end = text.index('\n\nasync function publicSettingsState(', start)
          current = text[start:end]
          if not current.startswith('async function saveAutoStartPromptFromTab(conversationKey, text, { service = null } = {}, tabId = null) {'):
              raise SystemExit('unexpected current start-prompt helper')
          replacement = '''async function saveAutoStartPromptFromTab(conversationKey, text, { service = null, tabId = null } = {}) {
            const key = normalizeConversationKey(conversationKey);
            const resolved = service || (await getServiceContext(key)).active_service;
            const value = String(text || "").trim();
            if (!value) throw Object.assign(new Error("Стартовый текст пуст."), { code: "AUTO_START_PROMPT_EMPTY" });
            const current = await getAutoStartPrompt(key, { service: resolved });
            const isDefault = value === defaultAutoStartTextForService(resolved);
            if (current.text === value && current.service === resolved && current.is_default === isDefault) return current;
            const tab = Number(tabId);
            if (tabId == null || !Number.isInteger(tab) || tab <= 0) throw Object.assign(new Error("Не определена вкладка для изменения стартового текста."), { code: "OWNER_TAB_REQUIRED" });
            const operations = (await storageGet(KEYS.MANUAL_OPERATIONS))[KEYS.MANUAL_OPERATIONS] || {};
            const operation = operations[key] || null;
            if (operation && !TERMINAL_MANUAL_STATUSES.has(operation.status)) {
              if (tab !== Number(operation.tab_id)) throw Object.assign(new Error("Стартовый текст может изменять только вкладка-owner активной Manual operation."), { code: "AUTO_NON_OWNER_TAB" });
              await assertTabConversation(tab, key);
              return saveAutoStartPrompt(key, value, { service: resolved });
            }
            const run = await getAutoRun(key);
            if (run && !WordstatAutorunModel.isTerminalStatus(run.status)) {
              if (tab !== Number(run.tab_id)) throw Object.assign(new Error("Стартовый текст может изменять только вкладка-owner активного Autorun."), { code: "AUTO_NON_OWNER_TAB" });
              await assertTabConversation(tab, key, run.conversation_id);
              return saveAutoStartPrompt(key, value, { service: resolved });
            }
            await assertTabConversation(tab, key);
            return saveAutoStartPrompt(key, value, { service: resolved });
          }
          async function resetAutoStartPromptFromTab(conversationKey, { service = null, tabId = null } = {}) {
            const key = normalizeConversationKey(conversationKey);
            const resolved = service || (await getServiceContext(key)).active_service;
            return saveAutoStartPromptFromTab(key, defaultAutoStartTextForService(resolved), { service: resolved, tabId });
          }'''
          text = text[:start] + replacement + text[end:]

          old_save = 'case "WS_SAVE_AUTO_START_PROMPT": return { ok: true, auto_start_prompt: await saveAutoStartPromptFromTab(message.conversation_key, message.text, { service: message.active_service || null }, message.tab_id ?? sender?.tab?.id) };'
          new_save = 'case "WS_SAVE_AUTO_START_PROMPT": return { ok: true, auto_start_prompt: await saveAutoStartPromptFromTab(message.conversation_key, message.text, { service: message.active_service || null, tabId: message.tab_id ?? sender?.tab?.id }) };'
          if text.count(old_save) != 1:
              raise SystemExit(f'expected one current save route, got {text.count(old_save)}')
          text = text.replace(old_save, new_save, 1)

          old_reset = 'case "WS_RESET_AUTO_START_PROMPT": return { ok: true, auto_start_prompt: await resetAutoStartPromptFromTab(message.conversation_key, { service: message.active_service || null }, message.tab_id ?? sender?.tab?.id) };'
          new_reset = 'case "WS_RESET_AUTO_START_PROMPT": return { ok: true, auto_start_prompt: await resetAutoStartPromptFromTab(message.conversation_key, { service: message.active_service || null, tabId: message.tab_id ?? sender?.tab?.id }) };'
          if text.count(old_reset) != 1:
              raise SystemExit(f'expected one current reset route, got {text.count(old_reset)}')
          text = text.replace(old_reset, new_reset, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = "extension/src/service_worker.js"
      - name: Focused Stage 3 regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            extension/tests/content_error_delivery_recovery.test.mjs \
            extension/tests/manual_paused_run_owner_fence_recovery.test.mjs \
            extension/tests/autorun_owner_controls_recovery.test.mjs \
            extension/tests/autorun_recovery.test.mjs \
            extension/tests/manual_mode_owner_control_recovery.test.mjs \
            extension/tests/service_context_owner_control_recovery.test.mjs \
            extension/tests/service_context_owner_lock_recovery.test.mjs \
            extension/tests/report_prefix_owner_control_recovery.test.mjs \
            extension/tests/start_prompt_and_prefix_recovery.test.mjs \
            extension/tests/auto_start_prompt_owner_control_recovery.test.mjs
      - name: Changed runtime syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check extension/src/service_worker.js
          node --check extension/src/popup.js
      - name: Commit verified production correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/src/service_worker.js
          git commit -m "fix: fence start prompt to runtime owner"
          git push origin HEAD:candidate/phase2-search-reconstruction-2026-08-23
