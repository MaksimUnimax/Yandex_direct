name: phase2-focused-development
on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase2-candidate-gate.yml
      - extension/src/service_worker.js
      - extension/tests/search_manual_worker.test.mjs
permissions:
  contents: write
jobs:
  focused-manual-execution-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply exact Manual execution truth fix
        shell: python
        run: |
          from pathlib import Path
          path = Path("extension/src/service_worker.js")
          text = path.read_text(encoding="utf-8")
          replacements = [
              ('  let reportText = ""; let providerExecutions = 0;\n', '  let reportText = ""; let providerExecutions = 0; let requestExecutedSummary = false;\n'),
              ('providerExecutions += 1; reports.push(result.report_text); }', 'providerExecutions += 1; requestExecutedSummary = true; reports.push(result.report_text); }'),
              ('        const requestExecuted = error.request_executed ?? "UNKNOWN";\n        reports.push', '        const requestExecuted = error.request_executed ?? "UNKNOWN";\n        if (requestExecuted === "UNKNOWN") requestExecutedSummary = "UNKNOWN";\n        else if (requestExecuted === true && requestExecutedSummary !== "UNKNOWN") requestExecutedSummary = true;\n        reports.push'),
              ('map[key] = { ...operation, status: "delivering", delivery_id: deliveryId, request_executed: providerExecutions > 0, report_ready_at: nowIso() };', 'map[key] = { ...operation, status: "delivering", delivery_id: deliveryId, request_executed: requestExecutedSummary, report_ready_at: nowIso() };'),
              ('return { ok: true, accepted: true, operation_id: operation.operation_id, delivery_id: deliveryId, report_text: reportText, request_executed: providerExecutions > 0 };', 'return { ok: true, accepted: true, operation_id: operation.operation_id, delivery_id: deliveryId, report_text: reportText, request_executed: requestExecutedSummary };')
          ]
          changed = False
          for old, new in replacements:
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f"expected one replacement target: {old[:80]!r}")
                  text = text.replace(old, new)
                  changed = True
              elif new not in text:
                  raise SystemExit(f"Manual execution truth target not found: {old[:80]!r}")
          if changed:
              path.write_text(text, encoding="utf-8")
      - name: Focused Manual execution outcome regression
        shell: bash
        run: |
          set -euo pipefail
          node --test extension/tests/search_manual_worker.test.mjs
      - name: Changed worker syntax
        shell: bash
        run: node --check extension/src/service_worker.js
      - name: Commit exact worker fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- extension/src/service_worker.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/src/service_worker.js
          git commit -m "fix: preserve Manual unknown execution outcome"
          git push origin HEAD:${{ github.head_ref }}
