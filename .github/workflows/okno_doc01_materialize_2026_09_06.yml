name: OKNO document 01 transport preflight

on:
  push:
    branches:
      - roadmap/kwork-productization-2026-08-28
    paths:
      - extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/.doc01_payload/READY

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner and staged payload files
        shell: bash
        run: |
          set -euo pipefail
          JOB='extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK'
          test -d "$JOB/.doc01_payload"
          find "$JOB/.doc01_payload" -maxdepth 1 -type f -name 'chunk_*' | sort | wc -l
          echo PRELIGHT_PASS
