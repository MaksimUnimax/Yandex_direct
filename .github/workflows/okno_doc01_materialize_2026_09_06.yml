name: OKNO document 01 Russian client materialization

on:
  push:
    branches:
      - roadmap/kwork-productization-2026-08-28
    paths:
      - extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/.doc01_payload/READY

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: roadmap/kwork-productization-2026-08-28
          fetch-depth: 0

      - name: Reconstruct staged source package
        shell: bash
        run: |
          set -euo pipefail
          JOB='extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK'
          STAGE="$JOB/.doc01_payload"
          find "$STAGE" -maxdepth 1 -type f -name 'chunk_*' -printf '%f\n' | sort | while read -r f; do cat "$STAGE/$f"; done | tr -cd 'A-Za-z0-9+/=' > /tmp/doc01_payload.b64
          base64 -d /tmp/doc01_payload.b64 > /tmp/doc01_payload.tar.gz
          echo '5a29a9d39fc8232fd7f6ec2e2963e5fcc9501c53bc3f27f4c1b5cda5d5edd772  /tmp/doc01_payload.tar.gz' | sha256sum -c -
          rm -rf /tmp/doc01_payload
          mkdir -p /tmp/doc01_payload
          tar -xzf /tmp/doc01_payload.tar.gz -C /tmp/doc01_payload
          cp -a /tmp/doc01_payload/. "$JOB/"

      - name: Correct brand and evidence preservation rule
        shell: bash
        run: |
          set -euo pipefail
          JOB='extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK'
          python - <<'PY'
          from pathlib import Path
          job=Path('extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK')
          p=job/'tools/post_release_correction/generate_document_01_client_ru.py'
          s=p.read_text(encoding='utf-8')
          start=s.index('# Клиентский язык:')
          end=s.index('\ndef md_link', start)
          new='''# Клиентский язык: служебная лексика проекта должна быть русской,\n# но реальные бренды, продуктовые линейки и дословные строки доказательств\n# сохраняются в исходном написании.\nSOURCE_NATIVE_LATIN = {\n    'REHAU','rehau','Provedal','provedal','KBE','kbe',\n    'Accado','Vorne','Futurus','fapim','Thermo','thermo'\n}\n\ndef clean(s):\n    return s\n'''
          s=s[:start]+new+s[end:]
          for a,b in [('Рехау Термо','REHAU Thermo'),('Рехау','REHAU'),('Проведал','Provedal'),('КБЕ','KBE'),('Аккадо','Accado'),('Ворне','Vorne'),('Футурус','Futurus')]:
              s=s.replace(a,b)
          replacements={
            "('алюминиевые окна фапим'":"('алюминиевые окна fapim'",
            "('окна REHAU 70'":"('окна rehau 70'",
            "('окна REHAU KBE'":"('окна rehau kbe'",
            "('окна REHAU официальный'":"('окна rehau официальный'",
            "('окна REHAU провисли'":"('окна rehau провисли'",
            "('окна стеклопакеты REHAU'":"('окна стеклопакеты rehau'",
          }
          for a,b in replacements.items(): s=s.replace(a,b,1)
          old="""('Provedal остекление веранды','остекление веранды системой Provedal; коммерческая услуга'),
('алюминиевые окна Provedal','алюминиевые окна Provedal; коммерческий товар'),
('алюминиевые окна Provedal','алюминиевые окна Provedal; коммерческий товар'),
('окна REHAU в рассрочку','окна REHAU с финансовым модификатором рассрочки'),
('окна REHAU в рассрочку','окна REHAU с финансовым модификатором рассрочки'),
('оконная фурнитура REHAU','фурнитура REHAU как аксессуарная товарная задача'),
('оконная фурнитура REHAU','фурнитура REHAU как аксессуарная товарная задача'),
('пластиковые окна REHAU','основная коммерческая товарная задача по окнам REHAU'),
('пластиковые окна от производителя REHAU','коммерческая задача по окнам REHAU от производителя'),
('пластиковые окна REHAU','основная коммерческая товарная задача по окнам REHAU'),
('пластиковые окна REHAU от производителя','коммерческая задача по окнам REHAU от производителя'),"""
          new="""('provedal остекление веранды','остекление веранды системой Provedal; коммерческая услуга'),
('алюминиевые окна provedal','алюминиевые окна Provedal; коммерческий товар'),
('алюминиевые окна проведал','алюминиевые окна Provedal; коммерческий товар'),
('окна rehau в рассрочку','окна REHAU с финансовым модификатором рассрочки'),
('окна рехау в рассрочку','окна REHAU с финансовым модификатором рассрочки'),
('оконная фурнитура rehau','фурнитура REHAU как аксессуарная товарная задача'),
('оконная фурнитура рехау','фурнитура REHAU как аксессуарная товарная задача'),
('пластиковые окна rehau','основная коммерческая товарная задача по окнам REHAU'),
('пластиковые окна от производителя rehau','коммерческая задача по окнам REHAU от производителя'),
('пластиковые окна рехау','основная коммерческая товарная задача по окнам REHAU'),
('пластиковые окна рехау от производителя','коммерческая задача по окнам REHAU от производителя'),"""
          s=s.replace(old,new,1)
          s=s.replace("('рехау термо окна','товарная задача по конкретной системе REHAU Thermo')","('rehau thermo окна','товарная задача по конкретной системе REHAU Thermo')",1)
          s=s.replace("('какой профиль REHAU выбрать','информационное руководство по выбору профиля REHAU')","('какой профиль rehau выбрать','информационное руководство по выбору профиля REHAU')",1)
          s=s.replace("('окна REHAU москва','основная коммерческая задача по окнам REHAU в Москве')","('окна rehau москва','основная коммерческая задача по окнам REHAU в Москве')",1)
          old_note='Каждая строка ниже относится к одному конкретному исходному запросу. Если в исходной формулировке бренд был написан латиницей, в этой клиентской таблице его название передано русской записью; это только способ отображения и не означает новый поисковый запрос. Наблюдение по одной строке не переносится автоматически на соседние запросы и само по себе не определяет владельца страницы.'
          new_note='Каждая строка ниже относится к одному конкретному исходному запросу. Формулировки запросов сохранены в исходном написании, включая названия брендов латиницей там, где они так были зафиксированы. Наблюдение по одной строке не переносится автоматически на соседние запросы и само по себе не определяет владельца страницы.'
          s=s.replace(old_note,new_note)
          s=s.replace("latin=sorted(set(re.findall(r'[A-Za-z]+',visible)))\nif latin:\n    raise SystemExit('LATIN_VISIBLE_IN_MD: '+repr(latin[:50]))","latin=sorted(set(re.findall(r'[A-Za-z]+',visible)))\nforbidden_latin=sorted(set(latin)-SOURCE_NATIVE_LATIN)\nif forbidden_latin:\n    raise SystemExit('FORBIDDEN_INTERNAL_LATIN_IN_MD: '+repr(forbidden_latin[:50]))")
          s=s.replace("latin_docx=sorted(set(re.findall(r'[A-Za-z]+',texts)))\nif latin_docx: raise SystemExit('LATIN_VISIBLE_IN_DOCX: '+repr(latin_docx[:50]))","latin_docx=sorted(set(re.findall(r'[A-Za-z]+',texts)))\nforbidden_latin_docx=sorted(set(latin_docx)-SOURCE_NATIVE_LATIN)\nif forbidden_latin_docx: raise SystemExit('FORBIDDEN_INTERNAL_LATIN_IN_DOCX: '+repr(forbidden_latin_docx[:50]))")
          s=s.replace("'latin_visible_markdown':latin,'latin_visible_docx':latin_docx","'source_native_latin_markdown':latin,'source_native_latin_docx':latin_docx")
          p.write_text(s,encoding='utf-8')

          q=job/'tools/post_release_correction/qa_document_01_client_ru.py'
          s=q.read_text(encoding='utf-8')
          s=s.replace("LATIN = re.compile(r'[A-Za-z]+')","LATIN = re.compile(r'[A-Za-z]+')\nSOURCE_NATIVE_LATIN = {'REHAU','rehau','Provedal','provedal','KBE','kbe','Accado','Vorne','Futurus','fapim','Thermo','thermo'}\nEXPECTED_BRAND_QUERY_ROWS = {2:'алюминиевые окна fapim',12:'окна rehau 70',13:'окна rehau kbe',14:'окна rehau официальный',15:'окна rehau провисли',17:'окна стеклопакеты rehau',41:'provedal остекление веранды',42:'алюминиевые окна provedal',43:'алюминиевые окна проведал',44:'окна rehau в рассрочку',45:'окна рехау в рассрочку',46:'оконная фурнитура rehau',47:'оконная фурнитура рехау',48:'пластиковые окна rehau',49:'пластиковые окна от производителя rehau',50:'пластиковые окна рехау',51:'пластиковые окна рехау от производителя',53:'проведал остекление веранды',57:'rehau thermo окна',60:'какой профиль rehau выбрать',61:'окна rehau москва'}\nEXPECTED_BRAND_PROSE = ['REHAU','Provedal','KBE','Accado','Vorne','Futurus']")
          s=s.replace("latin={\n        'markdown_visible': sorted(set(LATIN.findall(vm))),\n        'docx_visible': sorted(set(LATIN.findall(dx))),\n        'pdf_visible': sorted(set(LATIN.findall(pf))),\n    }","latin={\n        'markdown_visible': sorted(set(LATIN.findall(vm))),\n        'docx_visible': sorted(set(LATIN.findall(dx))),\n        'pdf_visible': sorted(set(LATIN.findall(pf))),\n    }\n    forbidden_latin={k: sorted(set(v)-SOURCE_NATIVE_LATIN) for k,v in latin.items()}")
          needle="    action_block=section(md,'## 10. Полная карта 34 решений','## 11. Неопределённость и условия повторного открытия')\n    counts={"
          repl="    action_block=section(md,'## 10. Полная карта 34 решений','## 11. Неопределённость и условия повторного открытия')\n    obs_rows={}\n    for ln in obs_block.splitlines():\n        m=re.match(r'^\\|\\s*(\\d+)\\s*\\|\\s*(.*?)\\s*\\|', ln)\n        if m: obs_rows[int(m.group(1))]=m.group(2).strip()\n    brand_query_spelling_ok=all(obs_rows.get(n)==v for n,v in EXPECTED_BRAND_QUERY_ROWS.items())\n    brand_prose_preserved=all(x in vm and x in dx and x in pf for x in EXPECTED_BRAND_PROSE)\n    counts={"
          s=s.replace(needle,repl)
          s=s.replace("'latin_visible_zero': all(not x for x in latin.values()),","'forbidden_internal_latin_zero': all(not x for x in forbidden_latin.values()),\n        'source_native_latin_preserved': brand_prose_preserved,\n        'verbatim_brand_query_spelling_preserved': brand_query_spelling_ok,")
          s=s.replace("'latin_visible_tokens':latin,","'source_native_latin_tokens':latin,\n        'forbidden_internal_latin_tokens':forbidden_latin,")
          s=s.replace("'internal_ascii_markers':internal_ascii_markers,","'internal_ascii_markers':internal_ascii_markers,\n        'brand_query_spelling_rows':{str(k):obs_rows.get(k) for k in EXPECTED_BRAND_QUERY_ROWS},")
          q.write_text(s,encoding='utf-8')
          PY

      - name: Install document dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet python-docx pypdf
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libreoffice-writer >/dev/null
          fi

      - name: Generate document 01 and PDF
        shell: bash
        run: |
          set -euo pipefail
          JOB='extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK'
          python "$JOB/tools/post_release_correction/generate_document_01_client_ru.py"
          RELEASE="$JOB/OKNO_MSK_RESEARCH_RELEASE_CORRECTED_2026-09-05"
          mkdir -p /tmp/lo
          libreoffice --headless --convert-to pdf --outdir "$RELEASE" "$RELEASE/editable/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-05.docx"
          test -s "$RELEASE/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-05.pdf"

      - name: Run independent language and evidence QA
        shell: bash
        run: |
          set -euo pipefail
          JOB='extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK'
          RELEASE="$JOB/OKNO_MSK_RESEARCH_RELEASE_CORRECTED_2026-09-05"
          python "$JOB/tools/post_release_correction/qa_document_01_client_ru.py" \
            --markdown "$RELEASE/sources/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-05.md" \
            --docx "$RELEASE/editable/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-05.docx" \
            --pdf "$RELEASE/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-05.pdf" \
            --visual-pages-pass 14 > "$JOB/RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_01_RUSSIAN_CLIENT_QA_2026-09-06.json"
          python - <<'PY'
          import json
          from pathlib import Path
          job=Path('extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK')
          q=json.loads((job/'RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_01_RUSSIAN_CLIENT_QA_2026-09-06.json').read_text(encoding='utf-8'))
          assert q['status']=='PASS'
          assert q['checks']['forbidden_internal_latin_zero'] is True
          assert q['checks']['source_native_latin_preserved'] is True
          assert q['checks']['verbatim_brand_query_spelling_preserved'] is True
          assert q['counts']=={'families':21,'assistant_cases':8,'observations':75,'actions':34}
          assert q['pdf_pages']==14
          PY

      - name: Write current QA authority and reconcile state
        shell: bash
        run: |
          set -euo pipefail
          JOB='extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK'
          python - <<'PY'
          import json
          from pathlib import Path
          job=Path('extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK')
          q=json.loads((job/'RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_01_RUSSIAN_CLIENT_QA_2026-09-06.json').read_text(encoding='utf-8'))
          sha=q['sha256']; sizes=q['size_bytes']
          pass_name='RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_01_RUSSIAN_CLIENT_QA_PASS_2026-09-06.md'
          txt=f'''# ОКНО МОСКВА — повторная проверка клиентского документа №01\n\nДата: 2026-09-06  \nРезультат: `PASS`\n\nКлиентский объяснительный текст написан по-русски. Реальные названия брендов, продуктовых линеек и дословные строки доказательств не переводятся и не транслитерируются. Сохранены `REHAU`, `Provedal`, `KBE`, `Accado`, `Vorne`, `Futurus`, `Thermo` и исходные написания `fapim`, `rehau`, `kbe`, `provedal`, `thermo` в точных запросах.\n\nУдалены только внутренние проектные англицизмы, статусы, технические классы, идентификаторы и производственный журнал. Независимая проверка отдельно сверяет строки, где различаются латинское и кириллическое написание бренда.\n\n- запрещённых внутренних латинских терминов: 0;\n- исходные брендовые написания: сохранены;\n- 21 спорное семейство: 21/21;\n- проверки поискового помощника: 8/8;\n- наблюдения обычного Яндекса: 75/75;\n- практические решения: 34/34;\n- PDF: 14 страниц.\n\nАртефакты: Markdown `{sha['markdown']}`, DOCX `{sha['docx']}`, PDF `{sha['pdf']}`.\n\n`DOCUMENT_01_ANALYST_RECHECK = PASS`  \n`DOCUMENT_01_OWNER_REVIEW = PENDING__AWAITING_OWNER_RECHECK`  \n`CURRENT_DOCUMENT = 01`  \n`NEXT_ACTION = OWNER_REVIEW_CORRECTED_DOCUMENT_01`\n'''
          (job/pass_name).write_text(txt,encoding='utf-8')

          sp=job/'RESEARCH_REPORT_REBUILD_CURRENT_STATE_POST_RELEASE_2026-09-05.json'
          state=json.loads(sp.read_text(encoding='utf-8'))
          state['status']='STAGE_0_TO_15_HISTORICALLY_COMPLETE__DOCUMENT_01_RUSSIAN_CLIENT_CONTRACT_ANALYST_RECHECK_PASS__OWNER_REVIEW_PENDING'
          state['next_action']='OWNER_REVIEW_CORRECTED_DOCUMENT_01'
          state['correction_materialization_status']='DOCUMENT_01_RUSSIAN_CLIENT_CONTRACT_ANALYST_RECHECK_PASS__OWNER_REVIEW_PENDING__DOCUMENT_02_03_NOT_ADVANCED'
          state['reviewed_release_files']['01_client_research_report']='ANALYST_RECHECK_PASS__OWNER_REVIEW_PENDING__SOURCE_NATIVE_BRANDS_PRESERVED'
          r=state['corrected_recipient_release']
          r['analyst_recipient_qa']='DOCUMENT_01_RUSSIAN_CLIENT_CONTRACT_PASS'
          r['document_01_analyst_recheck']='PASS'
          r['document_01_owner_review']='PENDING__AWAITING_OWNER_RECHECK'
          r['document_01_owner_review_authority']=pass_name
          r['document_01_qa_json']='RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_01_RUSSIAN_CLIENT_QA_2026-09-06.json'
          r['document_01_qa_markdown']=pass_name
          r['document_01_pdf_pages']=q['pdf_pages']
          r['document_01_pdf_size_bytes']=sizes['pdf']; r['document_01_pdf_sha256']=sha['pdf']
          r['document_01_docx_size_bytes']=sizes['docx']; r['document_01_docx_sha256']=sha['docx']
          r['document_01_source_size_bytes']=sizes['markdown']; r['document_01_source_sha256']=sha['markdown']
          r['document_01_client_forbidden_internal_latin']=0
          r['document_01_source_native_brands_preserved']=True
          r['document_01_verbatim_brand_query_spelling_preserved']=True
          r['document_01_internal_process_narrative']=0
          r['current_document']='01'
          r['document_02_owner_review']='PENDING'; r['document_03_owner_review']='PENDING'
          r['final_owner_recipient_acceptance']='OPEN'
          r['owner_recheck']='ACTIVE__DOCUMENT_01_REWORKED__OWNER_REVIEW_PENDING'
          sp.write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          cp=job/'EXECUTION_CURSOR.json'
          cur=json.loads(cp.read_text(encoding='utf-8'))
          cur['execution_protocol_status']='RESEARCH_REBUILD_STAGE_0_TO_15_COMPLETE__DOCUMENT_01_RUSSIAN_CLIENT_ANALYST_RECHECK_PASS__OWNER_REVIEW_PENDING'
          cur['status']='RESEARCH_REBUILD_COMPLETE__DOCUMENT_01_RUSSIAN_CLIENT_ANALYST_RECHECK_PASS__OWNER_REVIEW_PENDING'
          cur['execution_unit']='POST_RELEASE_OWNER_REVIEW_CORRECTED_DOCUMENT_01'
          cur['next_action']='OWNER_REVIEW_CORRECTED_DOCUMENT_01'
          d=cur.get('document_01_owner_recheck_2026_09_05',{})
          d['status']='ANALYST_RECHECK_PASS__OWNER_REVIEW_PENDING__SOURCE_NATIVE_BRANDS_PRESERVED'
          d['current_document']='01'; d['document_01_analyst_recheck']='PASS'; d['document_01_owner_review']='PENDING__AWAITING_OWNER_RECHECK'
          d['document_02_owner_review']='PENDING'; d['document_03_owner_review']='PENDING'; d['final_owner_recipient_acceptance']='OPEN'
          d['next_action']='OWNER_REVIEW_CORRECTED_DOCUMENT_01'; d['physical_pdf_qa']='PASS__14_OF_14_PAGES'
          d['forbidden_internal_latin']=0; d['source_native_brands_preserved']=True; d['verbatim_brand_query_spelling_preserved']=True; d['internal_process_narrative']=0
          d['qa_authority']='RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_01_RUSSIAN_CLIENT_QA_2026-09-06.json'
          cp.write_text(json.dumps(cur,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          mp=job/'OKNO_MSK_RESEARCH_RELEASE_CORRECTED_2026-09-05/RELEASE_MANIFEST_2026-09-05.json'
          man=json.loads(mp.read_text(encoding='utf-8'))
          man['status']='DOCUMENT_01_RUSSIAN_CLIENT_ANALYST_RECHECK_PASS__OWNER_REVIEW_PENDING__DOCUMENT_02_03_NOT_ADVANCED'
          for art in man['recipient_artifacts']:
              if art.get('variant')=='01': art['size_bytes']=sizes['pdf']; art['sha256']=sha['pdf']; art['pages']=q['pdf_pages']
          for art in man['editable_and_source_files']:
              if art['path'].startswith('editable/01_'): art['size_bytes']=sizes['docx']; art['sha256']=sha['docx']
              if art['path'].startswith('sources/01_'): art['size_bytes']=sizes['markdown']; art['sha256']=sha['markdown']
          qa=man['qa']; qa['authority']='../RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_01_RUSSIAN_CLIENT_QA_2026-09-06.json'; qa['document_01_owner_review_authority']='../'+pass_name
          qa['document_01']='ANALYST_RECHECK_PASS__OWNER_REVIEW_PENDING'; qa['document_01_physical_pdf']='14_OF_14_PAGES_PASS'; qa['document_01_forbidden_internal_latin']=0
