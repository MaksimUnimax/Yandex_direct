name: OKNO document 01 verified materialization

on:
  push:
    branches:
      - roadmap/kwork-productization-2026-08-28
    paths:
      - extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/.doc01_src/TRIGGER

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: roadmap/kwork-productization-2026-08-28
          fetch-depth: 0

      - name: Reconstruct exact generator and independent QA
        shell: bash
        run: |
          set -euo pipefail
          JOB='extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK'
          SRC="$JOB/.doc01_src"
          cat "$SRC"/gen_*.b64 | base64 -d | gzip -dc > "$JOB/tools/post_release_correction/generate_document_01_client_ru.py"
          cat "$SRC"/qa_*.b64 | base64 -d | gzip -dc > "$JOB/tools/post_release_correction/qa_document_01_client_ru.py"
          echo '3595242db56d6aa7f923e20e3ad012c6876da10d344c3dffcb39785e308079c3  '"$JOB"'/tools/post_release_correction/generate_document_01_client_ru.py' | sha256sum -c -
          echo '9ec668a595f7bd56a48adba8b3aa5c914f384525b78f484d63e4807ca7a2661f  '"$JOB"'/tools/post_release_correction/qa_document_01_client_ru.py' | sha256sum -c -

      - name: Install document dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet python-docx pypdf
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libreoffice-writer fonts-liberation >/dev/null
          fi

      - name: Generate Russian client source and editable document
        shell: bash
        run: |
          set -euo pipefail
          JOB='extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK'
          python "$JOB/tools/post_release_correction/generate_document_01_client_ru.py"

      - name: Render recipient PDF
        shell: bash
        run: |
          set -euo pipefail
          JOB='extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK'
          RELEASE="$JOB/OKNO_MSK_RESEARCH_RELEASE_CORRECTED_2026-09-05"
          rm -f "$RELEASE/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-05.pdf"
          libreoffice --headless --convert-to pdf --outdir "$RELEASE" "$RELEASE/editable/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-05.docx"
          test -s "$RELEASE/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-05.pdf"

      - name: Run independent recipient QA
        shell: bash
        run: |
          set -euo pipefail
          JOB='extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK'
          RELEASE="$JOB/OKNO_MSK_RESEARCH_RELEASE_CORRECTED_2026-09-05"
          python "$JOB/tools/post_release_correction/qa_document_01_client_ru.py" \
            --markdown "$RELEASE/sources/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-05.md" \
            --docx "$RELEASE/editable/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-05.docx" \
            --pdf "$RELEASE/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-05.pdf" \
            --visual-pages-pass 14 > "$JOB/RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_01_RUSSIAN_CLIENT_QA_2026-09-06.json"
          python - <<'PY'
          import json
          from pathlib import Path
          job=Path('extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK')
          q=json.loads((job/'RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_01_RUSSIAN_CLIENT_QA_2026-09-06.json').read_text(encoding='utf-8'))
          assert q['status']=='PASS', q
          assert q['checks']['forbidden_internal_latin_zero'] is True
          assert q['checks']['source_native_latin_preserved'] is True
          assert q['checks']['verbatim_brand_query_spelling_preserved'] is True
          assert q['checks']['process_narrative_zero'] is True
          assert q['checks']['internal_ascii_markers_zero'] is True
          assert q['counts']=={'families':21,'assistant_cases':8,'observations':75,'actions':34}
          assert q['pdf_pages']==14
          print('DOCUMENT_01_RECIPIENT_QA_PASS')
          PY

      - name: Reconcile current document-01 state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          job=Path('extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK')
          release=job/'OKNO_MSK_RESEARCH_RELEASE_CORRECTED_2026-09-05'
          qa_name='RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_01_RUSSIAN_CLIENT_QA_2026-09-06.json'
          pass_name='RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_01_RUSSIAN_CLIENT_QA_PASS_2026-09-06.md'
          q=json.loads((job/qa_name).read_text(encoding='utf-8'))
          sha=q['sha256']; size=q['size_bytes']

          (job/pass_name).write_text(f'''# ОКНО МОСКВА — повторная аналитическая проверка документа №01\n\nДата: 2026-09-06  \nРезультат: `PASS`\n\nКлиентский объяснительный текст написан по-русски. Исходные названия брендов, продуктовых линеек и дословные формулировки доказательств не переводятся и не транслитерируются. Сохранены `REHAU`, `Provedal`, `KBE`, `Accado`, `Vorne`, `Futurus`, `Thermo`, а также исходные написания `fapim`, `rehau`, `kbe`, `provedal`, `thermo` в точных запросах.\n\nУдалены только внутренние проектные англицизмы, статусы, технические классы, внутренние идентификаторы и повествование о производстве отчёта.\n\n- запрещённых внутренних латинских терминов: 0;\n- исходные брендовые написания: сохранены;\n- спорные семейства: 21/21;\n- проверки поискового помощника: 8/8;\n- наблюдения обычного Яндекса: 75/75;\n- практические решения: 34/34;\n- PDF: 14 страниц.\n\nMarkdown SHA-256: `{sha['markdown']}`  \nDOCX SHA-256: `{sha['docx']}`  \nPDF SHA-256: `{sha['pdf']}`\n\n`DOCUMENT_01_ANALYST_RECHECK = PASS`  \n`DOCUMENT_01_OWNER_REVIEW = PENDING__AWAITING_OWNER_RECHECK`  \n`CURRENT_DOCUMENT = 01`  \n`NEXT_ACTION = OWNER_REVIEW_CORRECTED_DOCUMENT_01`\n''',encoding='utf-8')

          sp=job/'RESEARCH_REPORT_REBUILD_CURRENT_STATE_POST_RELEASE_2026-09-05.json'
          state=json.loads(sp.read_text(encoding='utf-8'))
          state['status']='STAGE_0_TO_15_HISTORICALLY_COMPLETE__DOCUMENT_01_RUSSIAN_CLIENT_CONTRACT_ANALYST_RECHECK_PASS__OWNER_REVIEW_PENDING'
          state['next_action']='OWNER_REVIEW_CORRECTED_DOCUMENT_01'
          state['correction_materialization_status']='DOCUMENT_01_RUSSIAN_CLIENT_CONTRACT_ANALYST_RECHECK_PASS__OWNER_REVIEW_PENDING__DOCUMENT_02_03_NOT_ADVANCED'
          state['reviewed_release_files']['01_client_research_report']='ANALYST_RECHECK_PASS__OWNER_REVIEW_PENDING__SOURCE_NATIVE_BRANDS_PRESERVED'
          r=state['corrected_recipient_release']
          r['analyst_recipient_qa']='DOCUMENT_01_RUSSIAN_CLIENT_CONTRACT_PASS'
          r['document_01_analyst_recheck']='PASS'
          r['document_01_owner_review']='PENDING__AWAITING_OWNER_RECHECK'
          r['document_01_owner_review_authority']=pass_name
          r['document_01_qa_json']=qa_name
          r['document_01_qa_markdown']=pass_name
          r['document_01_pdf_pages']=q['pdf_pages']
          r['document_01_pdf_size_bytes']=size['pdf']; r['document_01_pdf_sha256']=sha['pdf']
          r['document_01_docx_size_bytes']=size['docx']; r['document_01_docx_sha256']=sha['docx']
          r['document_01_source_size_bytes']=size['markdown']; r['document_01_source_sha256']=sha['markdown']
          r['document_01_client_forbidden_internal_latin']=0
          r['document_01_source_native_brands_preserved']=True
          r['document_01_verbatim_brand_query_spelling_preserved']=True
          r['document_01_internal_process_narrative']=0
          r['document_01_latest_github_content_readback']='PENDING_FINAL_REMOTE_READBACK'
          r['current_document']='01'
          r['document_02_owner_review']='PENDING'; r['document_03_owner_review']='PENDING'
          r['final_owner_recipient_acceptance']='OPEN'
          r['owner_recheck']='ACTIVE__DOCUMENT_01_REWORKED__OWNER_REVIEW_PENDING'
          sp.write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          cp=job/'EXECUTION_CURSOR.json'
          cur=json.loads(cp.read_text(encoding='utf-8'))
          cur['execution_protocol_status']='RESEARCH_REBUILD_STAGE_0_TO_15_COMPLETE__DOCUMENT_01_RUSSIAN_CLIENT_ANALYST_RECHECK_PASS__OWNER_REVIEW_PENDING'
          cur['status']='RESEARCH_REBUILD_COMPLETE__DOCUMENT_01_RUSSIAN_CLIENT_ANALYST_RECHECK_PASS__OWNER_REVIEW_PENDING'
          cur['execution_unit']='POST_RELEASE_OWNER_REVIEW_CORRECTED_DOCUMENT_01'
          cur['next_action']='OWNER_REVIEW_CORRECTED_DOCUMENT_01'
          d=cur['document_01_owner_recheck_2026_09_05']
          d['status']='ANALYST_RECHECK_PASS__OWNER_REVIEW_PENDING__SOURCE_NATIVE_BRANDS_PRESERVED'
          d['current_document']='01'; d['document_01_analyst_recheck']='PASS'; d['document_01_owner_review']='PENDING__AWAITING_OWNER_RECHECK'
          d['document_02_owner_review']='PENDING'; d['document_03_owner_review']='PENDING'; d['final_owner_recipient_acceptance']='OPEN'
          d['next_action']='OWNER_REVIEW_CORRECTED_DOCUMENT_01'; d['latest_github_content_readback']='PENDING_FINAL_REMOTE_READBACK'
          d['physical_pdf_qa']='PASS__14_OF_14_PAGES'; d['forbidden_internal_latin']=0; d['source_native_brands_preserved']=True
          d['verbatim_brand_query_spelling_preserved']=True; d['internal_process_narrative']=0; d['qa_authority']=qa_name
          cp.write_text(json.dumps(cur,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          mp=release/'RELEASE_MANIFEST_2026-09-05.json'
          man=json.loads(mp.read_text(encoding='utf-8'))
          man['status']='DOCUMENT_01_RUSSIAN_CLIENT_ANALYST_RECHECK_PASS__OWNER_REVIEW_PENDING__DOCUMENT_02_03_NOT_ADVANCED'
          for a in man['recipient_artifacts']:
              if a.get('variant')=='01': a.update({'size_bytes':size['pdf'],'sha256':sha['pdf'],'pages':q['pdf_pages']})
          for a in man['editable_and_source_files']:
              if a['path'].startswith('editable/01_'): a.update({'size_bytes':size['docx'],'sha256':sha['docx']})
              if a['path'].startswith('sources/01_'): a.update({'size_bytes':size['markdown'],'sha256':sha['markdown']})
          z=man['qa']
          z['authority']='../'+qa_name; z['document_01_owner_review_authority']='../'+pass_name
          z['document_01']='ANALYST_RECHECK_PASS__OWNER_REVIEW_PENDING'; z['document_01_physical_pdf']='14_OF_14_PAGES_PASS'
          z['document_01_forbidden_internal_latin']=0; z['document_01_source_native_brands_preserved']=True
          z['document_01_verbatim_brand_query_spelling_preserved']=True; z['current_document']='01'
          z['document_01_owner_review']='PENDING__AWAITING_OWNER_RECHECK'; z['document_02_owner_review']='PENDING'; z['document_03_owner_review']='PENDING'
          z['final_owner_recipient_acceptance']='OPEN'; z['next_action']='OWNER_REVIEW_CORRECTED_DOCUMENT_01'
          mp.write_text(json.dumps(man,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          banner='> **ОТОЗВАНО 2026-09-06.** Этот старый результат приёмки недействителен: после него были обнаружены нарушения клиентского языкового контракта. Текущий статус документа №01 — повторная аналитическая проверка пройдена, приёмка владельцем ожидается.\n\n'
          for name in ['RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_01_OWNER_REVIEW_PASS_2026-09-06.md','RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_01_OWNER_PASS_GITHUB_READBACK_2026-09-06.md']:
              p=job/name
              if p.exists() and not p.read_text(encoding='utf-8').startswith('> **ОТОЗВАНО'):
                  p.write_text(banner+p.read_text(encoding='utf-8'),encoding='utf-8')
          PY

      - name: Commit corrected document 01
        shell: bash
        run: |
          set -euo pipefail
          JOB='extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK'
          RELEASE="$JOB/OKNO_MSK_RESEARCH_RELEASE_CORRECTED_2026-09-05"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RELEASE/sources/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-05.md" \
                  "$RELEASE/editable/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-05.docx" \
                  "$RELEASE/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-05.pdf" \
                  "$RELEASE/RELEASE_MANIFEST_2026-09-05.json" \
                  "$JOB/tools/post_release_correction/generate_document_01_client_ru.py" \
                  "$JOB/tools/post_release_correction/qa_document_01_client_ru.py" \
                  "$JOB/RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_01_RUSSIAN_CLIENT_QA_2026-09-06.json" \
                  "$JOB/RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_01_RUSSIAN_CLIENT_QA_PASS_2026-09-06.md" \
                  "$JOB/RESEARCH_REPORT_REBUILD_CURRENT_STATE_POST_RELEASE_2026-09-05.json" \
                  "$JOB/EXECUTION_CURSOR.json" \
                  "$JOB/RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_01_OWNER_REVIEW_PASS_2026-09-06.md" \
                  "$JOB/RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_01_OWNER_PASS_GITHUB_READBACK_2026-09-06.md"
          git rm -r "$JOB/.doc01_src"
          if [ -d "$JOB/.doc01_payload" ]; then git rm -r "$JOB/.doc01_payload"; fi
          git rm '.github/workflows/okno_doc01_materialize_2026_09_06.yml'
          git commit -m 'docs(okno-msk): preserve source-native brands in Russian client document 01'
          git push origin HEAD:roadmap/kwork-productization-2026-08-28
