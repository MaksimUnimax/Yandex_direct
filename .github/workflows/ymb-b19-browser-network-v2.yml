name: YMB B19 real Chrome deferred network v6
on:
  push:
    branches: [wip/ymb-file-delivery-patch-a-2026-09-12]
    paths: [.github/workflows/ymb-b19-browser-network-v2.yml]
permissions:
  contents: read
  actions: read
env:
  PUPPETEER_SKIP_CHROME_HEADLESS_SHELL_DOWNLOAD: 'true'
  PUPPETEER_SKIP_FIREFOX_DOWNLOAD: 'true'
jobs:
  network:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 276058bd489f5cf9c70eeaec5ac8e4bd129105d8
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ymb-b17-pause-internal-evidence
          run-id: 34699125356
          github-token: ${{ github.token }}
          path: frozen-b17
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Prepare exact candidate and locked browser dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          H=lambda b:hashlib.sha256(b).hexdigest();r=Path('extension/src')
          ident=H(''.join(H(p.read_bytes())+'  '+p.relative_to(r).as_posix()+'\n' for p in sorted(r.rglob('*')) if p.is_file()).encode());assert ident=='b87246c1377cda57cb9135f92814ec6885a1b607a9539be3a27bbc2fb1918b86'
          assert len([p for p in r.rglob('*') if p.is_file()])==67
          m=json.loads((r/'manifest.json').read_text());assert m['version']=='0.1.6';assert m['host_permissions'].count('https://operation.api.cloud.yandex.net/*')==1
          d=Path(os.environ['RUNNER_TEMP'])/'deps';d.mkdir();lock=Path('frozen-b17/package-lock.json').read_bytes();(d/'package-lock.json').write_bytes(lock);j=json.loads(lock);(d/'package.json').write_text(json.dumps({'name':j['name'],'private':True,'dependencies':j['packages']['']['dependencies']}))
          e=Path(os.environ['RUNNER_TEMP'])/'network-evidence';e.mkdir()
          with open(os.environ['GITHUB_ENV'],'a') as x:x.write(f'YMB_BROWSER_CANDIDATE={r.resolve()}\nYMB_PPTR_HOME={d}\nYMB_BROWSER_EVIDENCE={e}\nYMB_CHATGPT_FIXTURE={Path("frozen-b17/tests/b15_fixture.html").resolve()}\n')
          PY
          node --check extension/tests/wip/YMB_ASYNC_PATCH_B_2026-09-12/qa/b19_network_browser.mjs
      - name: Install locked Puppeteer
        shell: bash
        run: npm ci --prefix "$YMB_PPTR_HOME" --no-audit --no-fund > "$YMB_BROWSER_EVIDENCE/npm.stdout" 2> "$YMB_BROWSER_EVIDENCE/npm.stderr"
      - name: Run real Chrome deferred Manual network contour
        shell: bash
        run: xvfb-run -a node extension/tests/wip/YMB_ASYNC_PATCH_B_2026-09-12/qa/b19_network_browser.mjs > "$YMB_BROWSER_EVIDENCE/run.stdout" 2> "$YMB_BROWSER_EVIDENCE/run.stderr"
      - name: Finalize evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/network-publish";mkdir -p "$O";cp "$YMB_BROWSER_EVIDENCE"/* "$O/" 2>/dev/null || true;cp extension/tests/wip/YMB_ASYNC_PATCH_B_2026-09-12/qa/b19_network_browser.mjs "$O/"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          o=Path(os.environ['RUNNER_TEMP'])/'network-publish';p=o/'browser.jsonl';rows=[json.loads(x) for x in p.read_text().splitlines()] if p.exists() else []
          failures=[{'case':r.get('case'),'status':r.get('status')} for r in rows if str(r.get('status','')).startswith('FAIL')]
          cleanup=next((r for r in rows if r.get('case')=='owned_browser_cleanup'),{})
          required={'exact_0_1_6_installed','manual_start_zero_network','manual_submit_exact_searchAsync_POST','manual_collect_exact_operation_GET_and_normalize','command_injection_cannot_override_provider_origin_or_credential','manual_disabled_blocks_before_network','unknown_submit_never_auto_retries','b19_network_campaign_identity','owned_browser_cleanup'}
          present={r.get('case') for r in rows}
          result={'schema_version':6,'product_tree':'b87246c1377cda57cb9135f92814ec6885a1b607a9539be3a27bbc2fb1918b86','version':'0.1.6','real_provider_calls':0,'controlled_provider_only':True,'cases':len(rows),'required_cases_present':sorted(required & present),'missing_required_cases':sorted(required-present),'failures':failures,'peak_owned_rss_kib':cleanup.get('peak_owned_rss_kib'),'remaining':cleanup.get('remaining'),'pass':required<=present and not failures and not(cleanup.get('remaining') or [])}
          (o/'RESULT.json').write_text(json.dumps(result,indent=2)+'\n');(o/'SHA256SUMS').write_text(''.join(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+f.name+'\n' for f in sorted(o.iterdir()) if f.is_file() and f.name!='SHA256SUMS'));print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ymb-b19-browser-network-v6-evidence
          path: ${{ runner.temp }}/network-publish/
          retention-days: 90
          if-no-files-found: error
