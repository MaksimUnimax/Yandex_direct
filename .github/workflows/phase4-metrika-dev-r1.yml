name: Phase 4 Metrika development r1

on:
  push:
    branches:
      - dev/phase4-metrika-first-slice-2026-08-26
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and manifest
        run: |
          set -euo pipefail
          node --check extension/src/shared/metrika_protocol.js
          node --check extension/src/shared/service_registry.js
          node --check extension/src/shared/credential_store_model.js
          node --check extension/src/shared/credential_registry.js
          node --check extension/src/shared/policy_model.js
          node --check extension/src/shared/settings_backup_v3_runtime.js
          node --check extension/src/shared/phase4_provider_runtime.js
          node --check extension/src/webmaster_worker_runtime.js
          node --check extension/src/content_script.js
          node --check extension/src/popup.js
          node --check extension/src/popup_context_bootstrap.js
          node --check extension/tests/metrika_phase4_contract_closure.test.mjs
          node --check extension/tests/metrika_autorun_isolation.test.mjs
          node --check extension/tests/metrika_content_autorun_route.test.mjs
          node --check extension/tests/qa_transport/phase4-metrika-dev/patch_accepted_phase3_additive_compat.mjs
          node -e "JSON.parse(require('fs').readFileSync('extension/src/manifest.json','utf8')); console.log('PHASE4_MANIFEST_JSON_PASS')"
      - name: Phase 4 focused gate matrix
        run: |
          set -euo pipefail
          node --test extension/tests/metrika_phase4_gate_matrix.test.mjs | tee /tmp/phase4-focused.tap
          grep -q '# tests 27' /tmp/phase4-focused.tap
          grep -q '# pass 27' /tmp/phase4-focused.tap
          grep -q '# fail 0' /tmp/phase4-focused.tap
          grep -q '# skipped 0' /tmp/phase4-focused.tap
          echo PHASE4_METRIKA_FOCUSED_27_OF_27_PASS
      - name: Phase 4 literal contract closure
        run: |
          set -euo pipefail
          node --test extension/tests/metrika_phase4_contract_closure.test.mjs | tee /tmp/phase4-closure.tap
          grep -q '# tests 5' /tmp/phase4-closure.tap
          grep -q '# pass 5' /tmp/phase4-closure.tap
          grep -q '# fail 0' /tmp/phase4-closure.tap
          grep -q '# skipped 0' /tmp/phase4-closure.tap
          echo PHASE4_METRIKA_CONTRACT_CLOSURE_5_OF_5_PASS
      - name: M13 service isolation and M17 common Autorun
        run: |
          set -euo pipefail
          node --test extension/tests/metrika_autorun_isolation.test.mjs | tee /tmp/phase4-m13-m17.tap
          grep -q '# tests 4' /tmp/phase4-m13-m17.tap
          grep -q '# pass 4' /tmp/phase4-m13-m17.tap
          grep -q '# fail 0' /tmp/phase4-m13-m17.tap
          grep -q '# skipped 0' /tmp/phase4-m13-m17.tap
          echo PHASE4_METRIKA_M13_M17_4_OF_4_PASS
      - name: M17 content Autorun route and duplicate scan fence
        run: |
          set -euo pipefail
          node --test extension/tests/metrika_content_autorun_route.test.mjs | tee /tmp/phase4-content-m17.tap
          grep -q '# tests 2' /tmp/phase4-content-m17.tap
          grep -q '# pass 2' /tmp/phase4-content-m17.tap
          grep -q '# fail 0' /tmp/phase4-content-m17.tap
          grep -q '# skipped 0' /tmp/phase4-content-m17.tap
          echo PHASE4_METRIKA_M17_CONTENT_2_OF_2_PASS
      - name: Accepted Phase 3 source regression against current Phase 4 bytes
        run: |
          set -euo pipefail
          find extension/src -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/phase4-product-before.sha256

          git fetch --no-tags --depth=1 origin a7d9f947759f4f6a4fc20b39c7df3f25d81ce3e5
          rm -rf /tmp/accepted-phase3
          mkdir -p /tmp/accepted-phase3
          git archive a7d9f947759f4f6a4fc20b39c7df3f25d81ce3e5 extension/tests | tar -x -C /tmp/accepted-phase3

          node extension/tests/qa_transport/phase4-metrika-dev/patch_accepted_phase3_additive_compat.mjs /tmp/accepted-phase3
          ln -s "$GITHUB_WORKSPACE/extension/src" /tmp/accepted-phase3/extension/src

          mapfile -d '' tests < <(find /tmp/accepted-phase3/extension/tests -maxdepth 1 -name '*.test.mjs' -print0 | sort -z)
          test "${#tests[@]}" -eq 49
          echo "ACCEPTED_PHASE3_TEST_FILES=${#tests[@]}"
          node --test "${tests[@]}" | tee /tmp/phase3-compat.tap
          grep -q '# tests 313' /tmp/phase3-compat.tap
          grep -q '# pass 313' /tmp/phase3-compat.tap
          grep -q '# fail 0' /tmp/phase3-compat.tap
          grep -q '# skipped 0' /tmp/phase3-compat.tap

          find extension/src -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/phase4-product-after.sha256
          cmp /tmp/phase4-product-before.sha256 /tmp/phase4-product-after.sha256
          echo PHASE4_ACCEPTED_PHASE3_ADDITIVE_COMPAT_313_OF_313_PASS
          echo PHASE4_PRODUCT_BYTES_POST_REGRESSION_IDENTICAL
      - name: Static safety locks
        run: |
          set -euo pipefail
          grep -q 'METRIKA_API_V1' extension/src/shared/service_registry.js
          grep -q 'MetrikaProtocol' extension/src/content_script.js
          grep -q 'https://api-metrika.yandex.net/\*' extension/src/manifest.json
          ! grep -R --line-number -E 'fake-metrika-oauth|webmaster-token|word-key|search-key' extension/src
          echo PHASE4_METRIKA_FOCUSED_DEV_GATE_PASS
