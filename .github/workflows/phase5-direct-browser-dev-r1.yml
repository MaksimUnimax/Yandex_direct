name: phase5-direct-browser-development-r1

on:
  push:
    branches:
      - dev/phase5-direct-first-slice-2026-08-26
    paths:
      - .github/workflows/phase5-direct-browser-dev-r1.yml
      - extension/src/**
      - extension/tests/qa_browser/direct_browser_runtime.mjs
      - extension/tests/qa_browser/direct_check_diagnostic.mjs
      - extension/tests/qa_browser/direct_check_click_diagnostic.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-installed-extension:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pre-browser syntax and product identity
        shell: bash
        run: |
          set -euo pipefail
          node --check extension/tests/qa_browser/direct_browser_runtime.mjs
          node --check extension/tests/qa_browser/direct_check_diagnostic.mjs
          node --check extension/tests/qa_browser/direct_check_click_diagnostic.mjs
          find extension/src -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/d5-product-before.sha256
          echo PHASE5_DIRECT_PRE_BROWSER_PRODUCT_IDENTITY_PASS
      - name: Install Puppeteer Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false puppeteer@24
          npx puppeteer browsers install chrome
          command -v xvfb-run
      - name: Diagnose Direct popup Check
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a node extension/tests/qa_browser/direct_check_diagnostic.mjs | tee /tmp/d5-direct-check-diagnostic.log
          grep -F 'PHASE5_DIRECT_CHECK_DIAGNOSTIC_COMPLETE' /tmp/d5-direct-check-diagnostic.log
          if grep -F 'diagnostic-secret' /tmp/d5-direct-check-diagnostic.log; then
            echo PHASE5_DIRECT_DIAGNOSTIC_SECRET_LOG_LEAK_FAIL
            exit 1
          fi
      - name: Diagnose Direct Check click after rerender
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a node extension/tests/qa_browser/direct_check_click_diagnostic.mjs | tee /tmp/d5-direct-click-diagnostic.log
          grep -F 'PHASE5_DIRECT_CHECK_CLICK_DIAGNOSTIC_PASS' /tmp/d5-direct-click-diagnostic.log
          if grep -F 'click-diagnostic-secret' /tmp/d5-direct-click-diagnostic.log; then
            echo PHASE5_DIRECT_CLICK_DIAGNOSTIC_SECRET_LOG_LEAK_FAIL
            exit 1
          fi
      - name: Run controlled installed extension Direct runtime
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a node extension/tests/qa_browser/direct_browser_runtime.mjs | tee /tmp/d5-browser.log
          for marker in \
            D15_POPUP_FIVE_SERVICE_UI_PASS \
            D05_D15_DIRECT_SECRET_RERENDER_REDACTION_PASS \
            D03_D15_DIRECT_CHECK_ONE_POST_PASS \
            D04_D06_CONTROLLED_DIRECT_PROVIDER_BOUNDARY_PASS \
            D14_BACKUP_V3_DIRECT_EXPORT_IMPORT_PASS \
            D15_POPUP_REOPEN_SECRET_BLANK_PASS \
            D20_CONTROLLED_REAL_YANDEX_REQUESTS=0 \
            PHASE5_DIRECT_BROWSER_RUNTIME_PASS; do
            grep -F "$marker" /tmp/d5-browser.log
          done
          if grep -E 'browser-(direct-secret|mutated-secret)' /tmp/d5-browser.log; then
            echo PHASE5_DIRECT_BROWSER_SECRET_LOG_LEAK_FAIL
            exit 1
          fi
          echo PHASE5_DIRECT_CONTROLLED_BROWSER_PASS
      - name: Post-browser product immutability
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find extension/src -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/d5-product-after.sha256
          cmp /tmp/d5-product-before.sha256 /tmp/d5-product-after.sha256
          echo PHASE5_DIRECT_POST_BROWSER_PRODUCT_IDENTICAL
