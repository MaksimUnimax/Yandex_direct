name: phase5-direct-browser-development-r1

on:
  push:
    branches:
      - dev/phase5-direct-first-slice-2026-08-26
    paths:
      - .github/workflows/phase5-direct-browser-dev-r1.yml
      - extension/src/**
      - extension/tests/qa_browser/direct_browser_runtime.mjs
      - extension/tests/qa_browser/direct_popup_d18.mjs
      - extension/tests/qa_browser/direct_manual_worker_lifecycle.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-installed-extension:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pre-browser syntax and product identity
        shell: bash
        run: |
          set -euo pipefail
          node --check extension/tests/qa_browser/direct_browser_runtime.mjs
          node --check extension/tests/qa_browser/direct_popup_d18.mjs
          node --check extension/tests/qa_browser/direct_manual_worker_lifecycle.mjs
          find extension/src -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/d5-product-before.sha256
          echo PHASE5_DIRECT_PRE_BROWSER_PRODUCT_IDENTITY_PASS
      - name: Install Puppeteer Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false puppeteer@24
          npx puppeteer browsers install chrome
          command -v xvfb-run
      - name: Run controlled installed extension Direct runtime
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a node extension/tests/qa_browser/direct_browser_runtime.mjs | tee /tmp/d5-browser.log
          for marker in \
            D15_POPUP_FIVE_SERVICE_UI_PASS \
            D05_D15_DIRECT_SECRET_RERENDER_REDACTION_PASS \
            D03_D15_DIRECT_CHECK_ONE_POST_PASS \
            D04_D06_CONTROLLED_DIRECT_PROVIDER_BOUNDARY_PASS \
            D14_BACKUP_V3_DIRECT_EXPORT_IMPORT_PASS \
            D15_POPUP_REOPEN_SECRET_BLANK_PASS \
            D20_CONTROLLED_REAL_YANDEX_REQUESTS=0 \
            PHASE5_DIRECT_BROWSER_RUNTIME_PASS; do
            grep -F "$marker" /tmp/d5-browser.log
          done
          if grep -E 'browser-(direct-secret|mutated-secret)' /tmp/d5-browser.log; then
            echo PHASE5_DIRECT_BROWSER_SECRET_LOG_LEAK_FAIL
            exit 1
          fi
          echo PHASE5_DIRECT_CONTROLLED_BROWSER_PASS
      - name: Run Direct popup D18
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a node extension/tests/qa_browser/direct_popup_d18.mjs | tee /tmp/d5-popup-d18.log
          for marker in \
            D18_POPUP_430X560_PASS \
            D18_TOP_BOTTOM_COMMON_SAVE_EQUIVALENT_PASS \
            PHASE5_DIRECT_POPUP_D18_PASS; do
            grep -F "$marker" /tmp/d5-popup-d18.log
          done
      - name: Run Direct manual worker lifecycle
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a node extension/tests/qa_browser/direct_manual_worker_lifecycle.mjs | tee /tmp/d5-lifecycle.log
          for marker in \
            D17_DIRECT_LIFECYCLE_SETTINGS_PASS \
            D17_DIRECT_MANUAL_LIST_AUTOSEND_FALSE_PASS \
            D17_DIRECT_MANUAL_REPORT_AUTOSEND_TRUE_PASS \
            D17_DIRECT_REMOUNT_NO_REPLAY_PASS \
            D17_DIRECT_NO_DUPLICATE_PROVIDER_PASS \
            D20_DIRECT_LIFECYCLE_REAL_YANDEX_REQUESTS=0 \
            PHASE5_DIRECT_MANUAL_LIFECYCLE_PASS; do
            grep -F "$marker" /tmp/d5-lifecycle.log
          done
          if grep -F 'worker-lifecycle-secret' /tmp/d5-lifecycle.log; then
            echo PHASE5_DIRECT_LIFECYCLE_SECRET_LOG_LEAK_FAIL
            exit 1
          fi
      - name: Post-browser product immutability
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find extension/src -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/d5-product-after.sha256
          cmp /tmp/d5-product-before.sha256 /tmp/d5-product-after.sha256
          echo PHASE5_DIRECT_POST_BROWSER_PRODUCT_IDENTICAL
