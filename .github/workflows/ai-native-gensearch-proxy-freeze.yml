name: ai-native-gensearch-proxy-freeze

on:
  push:
    branches:
      - candidate/ai-native-gensearch-proxy-validation-r2-2026-08-28
    paths:
      - .github/workflows/ai-native-gensearch-proxy-freeze.yml

permissions:
  contents: read

jobs:
  freeze-exact-validation-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact CI-green GenSearch source authority
        uses: actions/checkout@v4
        with:
          ref: 8e9915dd168e7e3c60910c94909a6c18178460fe
          fetch-depth: 0
      - name: Assert pinned source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "8e9915dd168e7e3c60910c94909a6c18178460fe"
          git diff --exit-code
          echo 'GEN_SEARCH_SOURCE_AUTHORITY_PASS'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Source syntax and complete Node suite
        shell: bash
        run: |
          set -euo pipefail
          node --check extension/src/shared/search_protocol.js
          node --check extension/src/shared/policy_model.js
          node --check extension/tests/gensearch_search_protocol.test.mjs
          node --test extension/tests/gensearch_search_protocol.test.mjs
          node --test extension/tests/*.test.mjs
          echo 'GEN_SEARCH_SOURCE_SUITE_PASS'
      - name: Freeze exact candidate and verify extraction identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gensearch-freeze-output
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import shutil
          import zipfile

          SOURCE_COMMIT = '8e9915dd168e7e3c60910c94909a6c18178460fe'
          SOURCE_REF = 'ai-native/gensearch-proxy-validation-2026-08-27'
          root = Path('extension/src')
          out_dir = Path('gensearch-freeze-output')
          archive = out_dir / 'yandex-marketing-bridge-0.1.1-gensearch-proxy-validation-r2-candidate.zip'
          rebuilt = out_dir / 'rebuilt.zip'
          manifest_path = out_dir / 'EXACT_GENSEARCH_PROXY_R2_CANDIDATE_MANIFEST_2026-08-28.json'
          extract_dir = out_dir / 'extract-a'

          files = sorted(p for p in root.rglob('*') if p.is_file())
          entries = [p.relative_to(root).as_posix() for p in files]
          if not files or 'manifest.json' not in entries:
              raise SystemExit('candidate source tree is incomplete')

          def build(target):
              with zipfile.ZipFile(target, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
                  for path, rel in zip(files, entries):
                      info = zipfile.ZipInfo(rel, date_time=(1980, 1, 1, 0, 0, 0))
                      info.compress_type = zipfile.ZIP_DEFLATED
                      info.create_system = 3
                      info.external_attr = (0o100644 & 0xFFFF) << 16
                      info.flag_bits |= 0x800
                      zf.writestr(info, path.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
              with zipfile.ZipFile(target, 'r') as zf:
                  if zf.testzip() is not None:
                      raise SystemExit('zip integrity test failed')
                  if zf.namelist() != entries:
                      raise SystemExit('zip entry ordering/identity mismatch')

          build(archive)
          build(rebuilt)
          if archive.read_bytes() != rebuilt.read_bytes():
              raise SystemExit('deterministic rebuild mismatch')

          if extract_dir.exists():
              shutil.rmtree(extract_dir)
          extract_dir.mkdir(parents=True)
          with zipfile.ZipFile(archive, 'r') as zf:
              zf.extractall(extract_dir)

          extracted = sorted(p for p in extract_dir.rglob('*') if p.is_file())
          extracted_entries = [p.relative_to(extract_dir).as_posix() for p in extracted]
          if extracted_entries != entries:
              raise SystemExit('extracted entry set mismatch')
          for original, rel in zip(files, entries):
              if original.read_bytes() != (extract_dir / rel).read_bytes():
                  raise SystemExit(f'extracted byte mismatch: {rel}')

          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          manifest = {
              'source_commit': SOURCE_COMMIT,
              'source_ref': SOURCE_REF,
              'sha256': digest,
              'bytes': archive.stat().st_size,
              'files': len(entries),
              'entries': entries,
              'zip_test': 'PASS',
              'deterministic_rebuild': 'PASS',
              'source_extract_byte_identity': 'PASS'
          }
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('source_commit=' + SOURCE_COMMIT)
          print('sha256=' + digest)
          print('bytes=' + str(archive.stat().st_size))
          print('files=' + str(len(entries)))
          print('GEN_SEARCH_FREEZE_BYTE_IDENTITY_PASS')
          PY
      - name: Packaged syntax and complete Node suite
        shell: bash
        run: |
          set -euo pipefail
          find gensearch-freeze-output/extract-a -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          rm -rf gensearch-freeze-output/packaged-suite-work
          mkdir -p gensearch-freeze-output/packaged-suite-work/extension
          cp -a gensearch-freeze-output/extract-a gensearch-freeze-output/packaged-suite-work/extension/src
          cp -a extension/tests gensearch-freeze-output/packaged-suite-work/extension/tests
          node --test gensearch-freeze-output/packaged-suite-work/extension/tests/*.test.mjs
          echo 'GEN_SEARCH_PACKAGED_SUITE_PASS'
          rm -rf gensearch-freeze-output/packaged-suite-work gensearch-freeze-output/extract-a gensearch-freeze-output/rebuilt.zip
      - name: Verify final frozen metadata
        shell: bash
        run: |
          set -euo pipefail
          sha256sum gensearch-freeze-output/yandex-marketing-bridge-0.1.1-gensearch-proxy-validation-r2-candidate.zip
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('gensearch-freeze-output/EXACT_GENSEARCH_PROXY_R2_CANDIDATE_MANIFEST_2026-08-28.json')
          m = json.loads(p.read_text(encoding='utf-8'))
          assert m['source_commit'] == '8e9915dd168e7e3c60910c94909a6c18178460fe'
          assert m['zip_test'] == 'PASS'
          assert m['deterministic_rebuild'] == 'PASS'
          assert m['source_extract_byte_identity'] == 'PASS'
          print('source_commit=' + m['source_commit'])
          print('sha256=' + m['sha256'])
          print('bytes=' + str(m['bytes']))
          print('files=' + str(m['files']))
          print('GEN_SEARCH_DETERMINISTIC_FREEZE_PASS')
          PY
      - name: Upload exact GenSearch validation candidate
        uses: actions/upload-artifact@v4
        with:
          name: ai-native-gensearch-proxy-r2-candidate-8e9915d
          path: |
            gensearch-freeze-output/yandex-marketing-bridge-0.1.1-gensearch-proxy-validation-r2-candidate.zip
            gensearch-freeze-output/EXACT_GENSEARCH_PROXY_R2_CANDIDATE_MANIFEST_2026-08-28.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
