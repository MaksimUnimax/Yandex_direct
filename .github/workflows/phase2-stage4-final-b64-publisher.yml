name: phase2-stage4-final-b64-publisher
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase2-stage4-final-b64-publisher.yml
permissions:
  contents: write
  actions: read
jobs:
  publish-final-exact-b64-transport:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publisher authority
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download exact refrozen candidate
        uses: actions/download-artifact@v4
        with:
          name: phase2-stage4-frozen-candidate-0ee1d38
          path: /tmp/phase2-final
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: MaksimUnimax/Yandex_direct
          run-id: 32714268931
      - name: Verify exact refrozen input
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          root = Path('/tmp/phase2-final')
          zips = list(root.rglob('yandex-marketing-bridge-0.1.1-phase2-search-reconstruction-candidate.zip'))
          mans = list(root.rglob('EXACT_CANDIDATE_MANIFEST_2026-08-24.json'))
          if len(zips) != 1 or len(mans) != 1:
              raise SystemExit(f'FROZEN_INPUT_PATH_FAIL zip={zips} manifests={mans}')
          z, m = zips[0], mans[0]
          data, mb = z.read_bytes(), m.read_bytes()
          if len(data) != 170734 or hashlib.sha256(data).hexdigest() != 'd58b5bd20921e9492a90b687ae3910c7049ddff17741da44ba832369eb1c0f16':
              raise SystemExit('FROZEN_ZIP_IDENTITY_FAIL')
          if len(mb) != 11421 or hashlib.sha256(mb).hexdigest() != '0edfcecdfb1025e7292d2d81f36b8fb6e5edb6f3332ef884d7f31e604ebdf7de':
              raise SystemExit('FROZEN_MANIFEST_IDENTITY_FAIL')
          manifest = json.loads(mb)
          if manifest['source_commit'] != '0ee1d38f8d28cfccceb5a07f9606fa715261bc27':
              raise SystemExit('FROZEN_SOURCE_AUTHORITY_FAIL')
          with zipfile.ZipFile(z) as arc:
              if arc.testzip() is not None or len(arc.infolist()) != 68 or sum(not i.is_dir() for i in arc.infolist()) != 65:
                  raise SystemExit('FROZEN_ZIP_INTEGRITY_FAIL')
          print('FINAL_FROZEN_EXACT_INPUT_PASS')
          PY
      - name: Create one clean text-safe transport commit
        shell: bash
        env:
          BRANCH: qa/phase2-stage4-final-b64-transport-0ee1d38-2026-08-24
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "$BRANCH" HEAD^
          rm -rf extension/tests/qa_transport/phase2-stage4-final-b64
          mkdir -p extension/tests/qa_transport/phase2-stage4-final-b64
          python - <<'PY'
          import base64, hashlib, json, shutil, textwrap, tempfile, zipfile
          from pathlib import Path
          frozen = Path('/tmp/phase2-final')
          z = next(frozen.rglob('yandex-marketing-bridge-0.1.1-phase2-search-reconstruction-candidate.zip'))
          m = next(frozen.rglob('EXACT_CANDIDATE_MANIFEST_2026-08-24.json'))
          out = Path('extension/tests/qa_transport/phase2-stage4-final-b64')
          data = z.read_bytes()
          b64 = base64.b64encode(data).decode('ascii')
          chunks = [b64[i:i+14228] for i in range(0, len(b64), 14228)]
          if len(b64) != 227648 or len(chunks) != 16 or any(len(x) != 14228 for x in chunks):
              raise SystemExit('B64_SPLIT_FAIL')
          rows=[]
          for i, chunk in enumerate(chunks):
              name=f'chunk-{i:02d}.b64'
              (out/name).write_text(chunk, encoding='ascii')
              rows.append({'path':name,'bytes':len(chunk),'sha256':hashlib.sha256(chunk.encode('ascii')).hexdigest()})
          shutil.copyfile(m, out/'EXACT_CANDIDATE_MANIFEST_2026-08-24.json')
          transport={
              'format':'YMB_PHASE2_STAGE4_FINAL_EXACT_B64_TRANSPORT_V1',
              'frozen_source_commit':'0ee1d38f8d28cfccceb5a07f9606fa715261bc27',
              'source_actions_run':32714268931,
              'source_actions_artifact_id':9515289771,
              'artifact_filename':'yandex-marketing-bridge-0.1.1-phase2-search-reconstruction-candidate.zip',
              'artifact_sha256':'d58b5bd20921e9492a90b687ae3910c7049ddff17741da44ba832369eb1c0f16',
              'artifact_bytes':170734,
              'files':65,
              'zip_entries':68,
              'base64_length':227648,
              'chunk_count':16,
              'chunks':rows,
              'payload_manifest_sha256':'0edfcecdfb1025e7292d2d81f36b8fb6e5edb6f3332ef884d7f31e604ebdf7de',
              'payload_manifest_bytes':11421,
              'real_yandex_requests_during_freeze':0,
          }
          (out/'TRANSPORT_MANIFEST_2026-08-24.json').write_text(json.dumps(transport, indent=2)+'\n', encoding='utf-8')
          verifier=r'''#!/usr/bin/env python3
          import base64, hashlib, json, tempfile, zipfile
          from pathlib import Path
          BASE=Path(__file__).resolve().parent
          T=json.loads((BASE/'TRANSPORT_MANIFEST_2026-08-24.json').read_text(encoding='utf-8'))
          MB=(BASE/'EXACT_CANDIDATE_MANIFEST_2026-08-24.json').read_bytes()
          if len(MB)!=T['payload_manifest_bytes'] or hashlib.sha256(MB).hexdigest()!=T['payload_manifest_sha256']:
              raise SystemExit('PAYLOAD_MANIFEST_IDENTITY_FAIL')
          M=json.loads(MB)
          if M['source_commit']!=T['frozen_source_commit'] or M['sha256']!=T['artifact_sha256'] or M['bytes']!=T['artifact_bytes']:
              raise SystemExit('FROZEN_AUTHORITY_MANIFEST_FAIL')
          parts=[]
          for row in T['chunks']:
              raw=(BASE/row['path']).read_bytes()
              if len(raw)!=row['bytes'] or hashlib.sha256(raw).hexdigest()!=row['sha256']:
                  raise SystemExit('CHUNK_IDENTITY_FAIL '+row['path'])
              parts.append(raw.decode('ascii'))
          text=''.join(parts)
          if len(text)!=T['base64_length']: raise SystemExit('B64_LENGTH_FAIL')
          data=base64.b64decode(text, validate=True)
          if len(data)!=T['artifact_bytes'] or hashlib.sha256(data).hexdigest()!=T['artifact_sha256']:
              raise SystemExit('EXACT_ZIP_IDENTITY_FAIL')
          with tempfile.TemporaryDirectory() as td:
              zp=Path(td)/T['artifact_filename']; zp.write_bytes(data)
              with zipfile.ZipFile(zp) as z:
                  if z.testzip() is not None: raise SystemExit('ZIP_INTEGRITY_FAIL')
                  infos=z.infolist(); files=[i for i in infos if not i.is_dir()]
                  if len(files)!=T['files'] or len(infos)!=T['zip_entries']: raise SystemExit('ZIP_COUNT_FAIL')
                  root=M['root_name'].rstrip('/')+'/'
                  actual={}
                  for info in files:
                      if not info.filename.startswith(root): raise SystemExit('ZIP_ROOT_FAIL')
                      rel=info.filename[len(root):]; payload=z.read(info)
                      actual[rel]={'path':rel,'bytes':len(payload),'sha256':hashlib.sha256(payload).hexdigest()}
          expected={r['path']:r for r in M['payload']}
          if actual!=expected: raise SystemExit('ROUNDTRIP_PAYLOAD_MANIFEST_FAIL')
          print('B64_REASSEMBLY_PASS')
          print('EXACT_ZIP_IDENTITY_PASS')
          print('ROUNDTRIP_PAYLOAD_MANIFEST_PASS')
          print('ROUNDTRIP_ZIP_INTEGRITY_PASS')
          print('FROZEN_AUTHORITY_MATCH_PASS')
          print('REAL_YANDEX_REQUESTS=0')
          '''
          (out/'verify_exact_b64_transport.py').write_text(textwrap.dedent(verifier), encoding='utf-8')
          (out/'README.md').write_text('# Final exact Phase 2 Stage 4 B64 transport\n\nQA-only text-safe mirror of the refrozen candidate `d58b5bd20921e9492a90b687ae3910c7049ddff17741da44ba832369eb1c0f16`. Run `python verify_exact_b64_transport.py` after a fresh checkout.\n', encoding='utf-8')
          PY
          python extension/tests/qa_transport/phase2-stage4-final-b64/verify_exact_b64_transport.py
          git add extension/tests/qa_transport/phase2-stage4-final-b64
          git commit -m "qa: publish final exact Phase 2 Stage 4 B64 transport"
          git push origin "$BRANCH"
