name: YMB async popup Stage B final qualification
on:
  push:
    branches: [qa/ymb-async-popup-stage-b-qualification-2026-09-13]
    paths:
      - .github/workflows/ymb-async-popup-stage-b-final-qualification.yml
permissions:
  contents: read
  actions: read
env:
  PRODUCT_SHA: 404dd03874e5df80a95bc6cec1e6967bb71de405
  PRODUCT_TREE_SHA256: bec51a30456cce132d2bc028b42b495097989fb6eecd8cd3d1ea6003b3d2b5ed
  PRODUCT_ZIP_SHA256: 51491db92e1ea7c8e3c9555e95ba236cada5a4890b66e6c6134779550856c036
  PRODUCT_ZIP_BYTES: '232591'
  STAGE_A_SHA: 341c847089e1207dd23bf876f5ba3ac537b65a10
  PUPPETEER_SKIP_CHROME_HEADLESS_SHELL_DOWNLOAD: 'true'
  PUPPETEER_SKIP_FIREFOX_DOWNLOAD: 'true'

jobs:
  node-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ymb-b19-node-classification
          run-id: 34734894636
          github-token: ${{ github.token }}
          path: classification
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Verify product identity and prepare current-tree B19 runner
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet "$PRODUCT_SHA" -- extension/src
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,os,shutil
          H=lambda b:hashlib.sha256(b).hexdigest(); root=Path('extension/src')
          files=[p for p in root.rglob('*') if p.is_file()]; js=sum(1 for p in files if p.suffix=='.js')
          tree=H(''.join(H(p.read_bytes())+'  '+p.relative_to(root).as_posix()+'\n' for p in sorted(files)).encode())
          assert len(files)==68 and tree==os.environ['PRODUCT_TREE_SHA256'],(len(files),tree)
          candidate=Path('classification/qa_workspace/qa/candidate/full');assert candidate.exists(),candidate
          shutil.rmtree(candidate);shutil.copytree(root,candidate)
          q=Path(os.environ['RUNNER_TEMP'])/'node-runner';q.mkdir()
          src=Path('extension/tests/wip/YMB_ASYNC_PATCH_B_2026-09-12/qa')
          base=(src/'b19_final_node_campaign.py').read_text();wrap=(src/'b19_final_node_campaign_v2.py').read_text()
          old='b87246c1377cda57cb9135f92814ec6885a1b607a9539be3a27bbc2fb1918b86';assert base.count(old)>=1;base=base.replace(old,tree)
          base=base.replace('!=67',f'!={len(files)}').replace('len(syntax)==61',f'len(syntax)=={js}').replace("'files':67",f"'files':{len(files)}")
          assert old not in base
          (q/'b19_final_node_campaign.py').write_text(base);(q/'b19_final_node_campaign_v2.py').write_text(wrap)
          print('PRODUCT_TREE',tree,'FILES',len(files),'JS',js)
          PY
      - name: Run canonical B19 Node campaign on Stage B tree
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/node-runner/b19_final_node_campaign_v2.py" "$PWD" "$PWD/classification" "$RUNNER_TEMP/stage-b-node"
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          p=Path(os.environ['RUNNER_TEMP'])/'stage-b-node'/'RESULT.json';r=json.loads(p.read_text())
          assert r.get('status')=='PASS_AVAILABLE_NODE_SCOPE',r
          assert r.get('real_provider_calls')==0,r
          print(json.dumps(r,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ymb-stage-b-node-regression-final
          path: ${{ runner.temp }}/stage-b-node/
          retention-days: 90
          if-no-files-found: warn

  final-package-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ymb-b17-pause-internal-evidence
          run-id: 34699125356
          github-token: ${{ github.token }}
          path: frozen-b17
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Build exact Stage B package and current-confirmation fixtures
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet "$PRODUCT_SHA" -- extension/src
          python3 - <<'PY'
          from pathlib import Path,PurePosixPath
          import hashlib,json,os,subprocess,zipfile
          H=lambda b:hashlib.sha256(b).hexdigest();root=Path('extension/src');target=os.environ['PRODUCT_TREE_SHA256'];expected_zip=os.environ['PRODUCT_ZIP_SHA256'];expected_bytes=int(os.environ['PRODUCT_ZIP_BYTES'])
          files={p.relative_to(root).as_posix():p.read_bytes() for p in sorted(root.rglob('*')) if p.is_file()};assert len(files)==68
          tree=H(''.join(H(v)+'  '+k+'\n' for k,v in sorted(files.items())).encode());assert tree==target,(tree,target)
          out=Path(os.environ['RUNNER_TEMP'])/'package';out.mkdir();prefix='Yandex-Marketing-Bridge-0.1.6/'
          def build(p):
            with zipfile.ZipFile(p,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9,strict_timestamps=True) as z:
              for name,b in sorted(files.items()):
                zi=zipfile.ZipInfo(prefix+name,date_time=(1980,1,1,0,0,0));zi.compress_type=zipfile.ZIP_DEFLATED;zi.create_system=3;zi.external_attr=(0o100644<<16);zi.flag_bits=0x800;z.writestr(zi,b,compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          a=out/'A.zip';b=out/'B.zip';build(a);build(b);assert a.read_bytes()==b.read_bytes();final=out/'Yandex-Marketing-Bridge-0.1.6-stage-b.zip';final.write_bytes(a.read_bytes());a.unlink();b.unlink();assert H(final.read_bytes())==expected_zip and final.stat().st_size==expected_bytes
          ex=Path(os.environ['RUNNER_TEMP'])/'fresh-extracted';ex.mkdir();extracted={}
          with zipfile.ZipFile(final) as z:
            assert z.testzip() is None
            for e in z.infolist():
              if e.is_dir():continue
              p=PurePosixPath(e.filename);assert not p.is_absolute() and '..' not in p.parts and p.parts[0]=='Yandex-Marketing-Bridge-0.1.6';rel='/'.join(p.parts[1:]);assert rel not in extracted;d=z.read(e);extracted[rel]=d;q=ex/rel;q.parent.mkdir(parents=True,exist_ok=True);q.write_bytes(d)
          assert set(extracted)==set(files) and all(extracted[k]==files[k] for k in files);assert H(''.join(H(v)+'  '+k+'\n' for k,v in sorted(extracted.items())).encode())==target
          deps=Path(os.environ['RUNNER_TEMP'])/'deps';deps.mkdir();lock=Path('frozen-b17/package-lock.json');(deps/'package-lock.json').write_bytes(lock.read_bytes());j=json.loads(lock.read_text());(deps/'package.json').write_text(json.dumps({'name':j['name'],'private':True,'dependencies':j['packages']['']['dependencies']}))
          tests=Path(os.environ['RUNNER_TEMP'])/'tests';tests.mkdir()
          resource=Path('frozen-b17/tests/b15_browser_qualification.mjs').read_text();old_resource='b20b74351d95becd67f32994e3e00899e9208b8c32c778a306f73f6703bfe508';assert resource.count(old_resource)==1;(tests/'resource.mjs').write_text(resource.replace(old_resource,target))
          network=Path('extension/tests/wip/YMB_ASYNC_PATCH_B_2026-09-12/qa/b19_network_browser.mjs').read_text();old_network='b87246c1377cda57cb9135f92814ec6885a1b607a9539be3a27bbc2fb1918b86';assert network.count(old_network)==1;(tests/'network.mjs').write_text(network.replace(old_network,target))
          fixture=Path('extension/tests/wip/YMB_ASYNC_PATCH_B_2026-09-12/qa/b15_fixture.html').read_text();old="send.addEventListener('click',()=>{Q.sends.push({text:composer.value,files:Q.files.map(f=>({...f}))});composer.value='';";new="send.addEventListener('click',()=>{const sentText=composer.value;const sentFiles=Q.files.map(f=>({...f}));Q.sends.push({text:sentText,files:sentFiles});const turn=document.createElement('div');turn.dataset.messageAuthorRole='user';turn.dataset.messageId='fixture-user-'+Q.sends.length;turn.textContent=[sentText,...sentFiles.map(f=>f.name)].join(' ');document.getElementById('conversation-root').append(turn);composer.value='';";assert fixture.count(old)==1;fixture=fixture.replace(old,new);(tests/'fixture.html').write_text(fixture);(tests/'b15_fixture.html').write_text(fixture)
          # Preserve the exact accepted TEST-15 v7 behavior, changing identity metadata only.
          hist=subprocess.check_output(['git','show','e77f327d8c4e0da695dc6bc20ba9056c663d133c:extension/tests/wip/YMB_ASYNC_PATCH_B_2026-09-12/qa/test15_targeted_real_chrome_v7.mjs'],text=True)
          hist=hist.replace("source_commit:'64c1016c179de52b6e950830877f0d42a446e5e8'",f"source_commit:'{os.environ['PRODUCT_SHA']}'").replace("zip_sha256:'3e23a70d09fab91f84cf3c9998499ce078f1467b46540dbac7fa07ac60a6765e'",f"zip_sha256:'{expected_zip}'")
          (tests/'test15.mjs').write_text(hist)
          # Reuse the accepted Stage-A real-Chrome popup harness, retargeted to the fresh extraction.
          wf=Path('.github/workflows/ymb-async-popup-monitor-stage-a.yml').read_text();needle='          cat > "$RUNNER_TEMP/popup-monitor-stage-a.mjs" <<\'NODE\'\n';start=wf.index(needle)+len(needle);end=wf.index('\n          NODE',start);popup='\n'.join(line[10:] if line.startswith('          ') else line for line in wf[start:end].splitlines())+'\n';popup=popup.replace("fs.realpathSync('extension/src')","fs.realpathSync(process.env.YMB_BROWSER_CANDIDATE)");(tests/'popup.mjs').write_text(popup)
          evidence=Path(os.environ['RUNNER_TEMP'])/'final-evidence';evidence.mkdir();result={'schema_version':1,'product_sha':os.environ['PRODUCT_SHA'],'product_tree_sha256':tree,'files':68,'zip_sha256':expected_zip,'zip_bytes':expected_bytes,'dual_build_byte_identity':True,'fresh_extraction_identity':True,'pass':True};(out/'PACKAGE_RESULT.json').write_text(json.dumps(result,indent=2)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write(f'YMB_FINAL_PACKAGE={final}\nYMB_BROWSER_CANDIDATE={ex}\nYMB_PRODUCT_TREE={tree}\nYMB_PPTR_HOME={deps}\nYMB_PACKAGE_TESTS={tests}\nYMB_PACKAGE_EVIDENCE={evidence}\nYMB_CHATGPT_FIXTURE={(tests/"fixture.html").resolve()}\n')
          print(json.dumps(result,indent=2))
          PY
      - name: Fresh-extracted syntax and locked browser dependency
        shell: bash
        run: |
          set -euo pipefail
          test "$(find "$YMB_BROWSER_CANDIDATE" -type f | wc -l)" -eq 68
          find "$YMB_BROWSER_CANDIDATE" -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          for f in "$YMB_PACKAGE_TESTS"/*.mjs; do node --check "$f"; done
          npm ci --prefix "$YMB_PPTR_HOME" --no-audit --no-fund > "$YMB_PACKAGE_EVIDENCE/npm.stdout" 2> "$YMB_PACKAGE_EVIDENCE/npm.stderr"
      - name: Targeted TEST-15 exactly-once regression on exact Stage B ZIP
        shell: bash
        env:
          YMB_BROWSER_EVIDENCE: ${{ runner.temp }}/final-evidence/test15
        run: |
          set -euo pipefail;mkdir -p "$YMB_BROWSER_EVIDENCE";xvfb-run -a node "$YMB_PACKAGE_TESTS/test15.mjs" > "$YMB_BROWSER_EVIDENCE/run.stdout" 2> "$YMB_BROWSER_EVIDENCE/run.stderr"
      - name: Real Chrome popup qualification on fresh-extracted Stage B ZIP
        shell: bash
        env:
          YMB_EVIDENCE: ${{ runner.temp }}/final-evidence/popup
        run: |
          set -euo pipefail;mkdir -p "$YMB_EVIDENCE";xvfb-run -a node "$YMB_PACKAGE_TESTS/popup.mjs" > "$YMB_EVIDENCE/run.stdout" 2> "$YMB_EVIDENCE/run.stderr"
      - name: B19 resource matrix on exact Stage B ZIP
        shell: bash
        env:
          YMB_BROWSER_EVIDENCE: ${{ runner.temp }}/final-evidence/resource
        run: |
          set -euo pipefail;mkdir -p "$YMB_BROWSER_EVIDENCE";xvfb-run -a node "$YMB_PACKAGE_TESTS/resource.mjs" > "$YMB_BROWSER_EVIDENCE/run.stdout" 2> "$YMB_BROWSER_EVIDENCE/run.stderr"
      - name: B19 deferred-network matrix on exact Stage B ZIP
        shell: bash
        env:
          YMB_BROWSER_EVIDENCE: ${{ runner.temp }}/final-evidence/network
        run: |
          set -euo pipefail;mkdir -p "$YMB_BROWSER_EVIDENCE";xvfb-run -a node "$YMB_PACKAGE_TESTS/network.mjs" > "$YMB_BROWSER_EVIDENCE/run.stdout" 2> "$YMB_BROWSER_EVIDENCE/run.stderr"
      - name: Finalize Stage B qualification evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/stage-b-final";mkdir -p "$O";cp "$YMB_FINAL_PACKAGE" "$O/" 2>/dev/null || true;cp "$RUNNER_TEMP/package/PACKAGE_RESULT.json" "$O/" 2>/dev/null || true;cp -a "$YMB_PACKAGE_EVIDENCE" "$O/evidence" 2>/dev/null || true
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          o=Path(os.environ['RUNNER_TEMP'])/'stage-b-final';pkg=json.loads((o/'PACKAGE_RESULT.json').read_text());ev=o/'evidence';fail=[];remaining=[];peak=0;groups={}
          for name,expected in [('resource',16),('network',9)]:
            p=ev/name/'browser.jsonl';rows=[json.loads(x) for x in p.read_text().splitlines()] if p.exists() else [];bad=[r.get('case') for r in rows if str(r.get('status','')).startswith('FAIL')];clean=next((r for r in rows if r.get('case')=='owned_browser_cleanup'),{});groups[name]={'cases':len(rows),'expected':expected,'failures':bad,'remaining':clean.get('remaining') or [],'peak_owned_rss_kib':clean.get('peak_owned_rss_kib')};fail+=bad;remaining+=clean.get('remaining') or [];peak=max(peak,int(clean.get('peak_owned_rss_kib') or 0))
          t=ev/'test15'/'TARGETED_RESULT.json';targeted=json.loads(t.read_text()) if t.exists() else {'pass':False,'rows':[],'provider_calls':None};required={'test15_blank_composer_auto_send_exactly_once','occupied_user_draft_is_preserved','same_delivery_inline_report_auto_sends_exactly_once','different_bridge_inline_text_is_preserved'};trows={r.get('case'):r for r in targeted.get('rows',[])};targeted_ok=targeted.get('pass') is True and targeted.get('provider_calls')==0 and all(trows.get(c,{}).get('status')=='PASS' for c in required)
          p=ev/'popup'/'STAGE_A_RESULT.json';popup=json.loads(p.read_text()) if p.exists() else {'pass':False};popup_ok=popup.get('pass') is True and popup.get('provider_fetch_calls')==0 and popup.get('source_files')==68
          counts_ok=groups.get('resource',{}).get('cases')==16 and groups.get('network',{}).get('cases')==9
          result={**pkg,'targeted_test15_pass':targeted_ok,'popup_chrome_pass':popup_ok,'browser_groups':groups,'browser_failures':fail,'remaining_processes':remaining,'peak_owned_rss_kib':peak,'emergency_limit_kib':2097152,'real_provider_calls':0,'exact_case_counts':counts_ok,'pass':pkg.get('pass') is True and targeted_ok and popup_ok and counts_ok and not fail and not remaining and peak<2097152}
          (o/'FINAL_STAGE_B_GATE.json').write_text(json.dumps(result,indent=2)+'\n');(o/'SHA256SUMS').write_text(''.join(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+f.relative_to(o).as_posix()+'\n' for f in sorted(o.rglob('*')) if f.is_file() and f.name!='SHA256SUMS'));print(json.dumps(result,indent=2));raise SystemExit(0 if result['pass'] else 1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ymb-stage-b-final-qualified-candidate
          path: ${{ runner.temp }}/stage-b-final/
          retention-days: 90
          if-no-files-found: error
