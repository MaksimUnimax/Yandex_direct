name: Step10 Fresh R1 Pass3 Decision Samples

on:
  push:
    branches:
      - roadmap/kwork-productization-2026-08-28
    paths:
      - '.github/workflows/step10-fresh-r1-pass3-decision-samples.yml'
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_FRESH_R1_PASS3_DECISION_SAMPLES.py'
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_FRESH_R1_PASS3_FULL_REVIEW.tsv'
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_FRESH_R1_PASS3_QA.json'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: roadmap/kwork-productization-2026-08-28
          fetch-depth: 0

      - name: Generate rule, cluster, count, and contradiction samples
        run: |
          python extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_FRESH_R1_PASS3_DECISION_SAMPLES.py

      - name: Verify decision-sample source accounting
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          root = Path('extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK')
          qa = json.loads((root / 'STEP_10_FRESH_R1_PASS3_QA.json').read_text(encoding='utf-8'))
          assert qa['rule_version'] == 'PASS3_R1_INDEPENDENT_SEMANTIC_AUDIT_V3'
          assert qa['pass3_rows_reviewed'] == 2332
          for name in [
              'STEP_10_FRESH_R1_PASS3_RULE_SAMPLES.tsv',
              'STEP_10_FRESH_R1_PASS3_CLUSTER_SAMPLES.tsv',
              'STEP_10_FRESH_R1_PASS3_DECISION_COUNTS.tsv',
              'STEP_10_FRESH_R1_PASS3_CONTRADICTION_FLAGS.tsv',
          ]:
              p = root / name
              with p.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.DictReader(f, delimiter='\t'))
              assert rows, name
              print(name + '=' + str(len(rows)))
          PY

      - name: Commit generated decision samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_FRESH_R1_PASS3_RULE_SAMPLES.tsv \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_FRESH_R1_PASS3_CLUSTER_SAMPLES.tsv \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_FRESH_R1_PASS3_DECISION_COUNTS.tsv \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_FRESH_R1_PASS3_CONTRADICTION_FLAGS.tsv
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "step10: generate fresh R1 Pass3 decision samples"
            git push origin HEAD:roadmap/kwork-productization-2026-08-28
          fi
