name: phase8-search-batch-close

on:
  push:
    branches:
      - candidate/phase8-search-batch-2026-08-28
    paths:
      - .github/workflows/phase8-search-batch-close.yml

permissions:
  contents: write

jobs:
  close-phase8:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout closure control
        uses: actions/checkout@v4

      - name: Checkout exact accepted main
        uses: actions/checkout@v4
        with:
          ref: ebd697e5733a7d40d13401d4c02b82a75711231c
          fetch-depth: 0
          path: _main

      - name: Guard accepted main and product source
        shell: bash
        run: |
          set -euo pipefail
          cd _main
          git fetch origin main
          test "$(git rev-parse origin/main)" = "ebd697e5733a7d40d13401d4c02b82a75711231c"
          test "$(git rev-parse HEAD)" = "ebd697e5733a7d40d13401d4c02b82a75711231c"
          test "$(git rev-parse HEAD:extension/src)" = "bdad1e87a2537d8646e480ca23f8068c3dced17e"
          echo PHASE8_CLOSE_BASE_IDENTITY_PASS

      - name: Synchronize canonical Phase 8 closure docs
        shell: bash
        run: |
          set -euo pipefail
          cd _main
          python ../.github/scripts/phase8_close.py
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          expected=(
            extension/docs/CURRENT_STATE.md
            extension/docs/PHASE_8_BULK_SERP_TOP_RANK_REQUIREMENTS_AND_PLAN.md
            extension/docs/ROADMAP.md
            extension/tests/PHASE8_SEARCH_BATCH_FINAL_ACCEPTANCE_2026-08-28.md
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq 4
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          test -z "$(git diff --name-only -- extension/src)"
          echo PHASE8_CLOSE_DOCS_ONLY_PASS

      - name: Commit and push closure
        shell: bash
        run: |
          set -euo pipefail
          cd _main
          git fetch origin main
          test "$(git rev-parse origin/main)" = "ebd697e5733a7d40d13401d4c02b82a75711231c"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/docs/CURRENT_STATE.md extension/docs/ROADMAP.md extension/docs/PHASE_8_BULK_SERP_TOP_RANK_REQUIREMENTS_AND_PLAN.md extension/tests/PHASE8_SEARCH_BATCH_FINAL_ACCEPTANCE_2026-08-28.md
          git commit -m 'docs(phase8): close accepted Search batch phase'
          test "$(git rev-parse HEAD:extension/src)" = "bdad1e87a2537d8646e480ca23f8068c3dced17e"
          git push origin HEAD:main
          echo PHASE8_CLOSE_MAIN_PUSH_PASS
