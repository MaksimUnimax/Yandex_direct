name: phase2-manual-sequence-fix
on:
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/phase2-recovery-work-2026-08-20
      - name: Stop Manual block after unknown provider outcome
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('extension/src/service_worker.js')
          s=p.read_text(encoding='utf-8')
          old='''      catch (error) { reports.push(formatBridgeError({ code: error.code || "PROVIDER_ERROR", message: error.message || String(error), stage: "PROVIDER", requestExecuted: error.request_executed ?? "UNKNOWN", service: item.service, runId: operation.run_id, operationId: operation.operation_id })); }'''
          new='''      catch (error) {\n        const requestExecuted = error.request_executed ?? "UNKNOWN";\n        reports.push(formatBridgeError({ code: error.code || "PROVIDER_ERROR", message: error.message || String(error), stage: "PROVIDER", requestExecuted, service: item.service, runId: operation.run_id, operationId: operation.operation_id }));\n        if (requestExecuted === "UNKNOWN") break;\n      }'''
          if new not in s:
              assert old in s, 'expected Manual provider catch not found'
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
          node --test extension/tests/manual_block_sequence_recovery.test.mjs
          node --test \
            extension/tests/search_protocol.test.mjs \
            extension/tests/search_registry.test.mjs \
            extension/tests/search_xml.test.mjs \
            extension/tests/search_worker_stage2.test.mjs \
            extension/tests/search_manual_worker.test.mjs \
            extension/tests/manual_block_sequence_recovery.test.mjs \
            extension/tests/content_phase2_runtime.test.mjs \
            extension/tests/popup_phase2_runtime.test.mjs \
            extension/tests/autorun_recovery.test.mjs \
            extension/tests/conversation_fences_recovery.test.mjs \
            extension/tests/start_prompt_and_prefix_recovery.test.mjs \
            extension/tests/wordstat_core_recovery.test.mjs \
            extension/tests/settings_security_recovery.test.mjs \
            extension/tests/popup_error_boundary_recovery.test.mjs \
            extension/tests/permission_scope_recovery.test.mjs \
            extension/tests/legacy_profiles_recovery.test.mjs \
            extension/tests/diagnostics_popup_recovery.test.mjs \
            extension/tests/button_picker_recovery.test.mjs \
            extension/tests/binding_recovery.test.mjs \
            extension/tests/manual_off_safety_recovery.test.mjs
          node --check extension/src/service_worker.js
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/src/service_worker.js
          git commit -m 'fix: stop Manual sequence after unknown request outcome'
          git push origin HEAD:dev/phase2-recovery-work-2026-08-20
