name: Step10 Fresh R1 Pass3 V5 Final

on:
  push:
    branches:
      - roadmap/kwork-productization-2026-08-28
    paths:
      - '.github/workflows/step10-fresh-r1-pass3-v5-final.yml'
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/step10_fresh_r1_pass3_runner_v5.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: step10-fresh-r1-pass3-v5-final
  cancel-in-progress: false

jobs:
  final-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout latest fresh-run branch
        uses: actions/checkout@v4
        with:
          ref: roadmap/kwork-productization-2026-08-28
          fetch-depth: 0

      - name: Execute all 2332 independent Pass3 decisions
        run: |
          python3 extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/step10_fresh_r1_pass3_runner_v5.py \
            --root "$GITHUB_WORKSPACE" | tee /tmp/pass3-v5.json

      - name: Validate full ledgers, one correction batch, accounting and isolation
        run: |
          python3 - <<'PY'
          import csv
          import json
          from pathlib import Path

          base = Path('extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK')
          paths = {
              'qa': base / 'STEP_10_FRESH_R1_FINAL_QA.json',
              'full': base / 'STEP_10_FRESH_R1_PASS3_FULL_QA_LEDGER.tsv',
              'errors': base / 'STEP_10_FRESH_R1_PASS3_ERROR_LEDGER.tsv',
              'corrections': base / 'STEP_10_FRESH_R1_PASS3_CONSOLIDATED_CORRECTIONS.tsv',
              'assignments': base / 'STEP_10_FRESH_R1_ASSIGNMENTS_FINAL.tsv',
              'summary': base / 'STEP_10_FRESH_R1_CLUSTER_SUMMARY_FINAL.tsv',
              'impact': base / 'STEP_10_FRESH_R1_PASS3_IMPACT_RECHECK.tsv',
              'report': base / 'STEP_10_FRESH_R1_PASS3_REPORT.md',
              'complete_marker': base / 'STEP_10_FRESH_R1_COMPLETE.marker',
          }
          missing = [str(path) for path in paths.values() if not path.is_file()]
          if missing:
              raise SystemExit('missing final artifacts: ' + ', '.join(missing))

          def read_tsv(path):
              with path.open('r', encoding='utf-8', newline='') as fh:
                  return list(csv.DictReader(fh, delimiter='\t'))

          qa = json.loads(paths['qa'].read_text(encoding='utf-8'))
          full = read_tsv(paths['full'])
          errors = read_tsv(paths['errors'])
          corrections = read_tsv(paths['corrections'])
          assignments = read_tsv(paths['assignments'])
          summary = read_tsv(paths['summary'])
          impact = read_tsv(paths['impact'])

          active = [r for r in assignments if r['source_disposition'] in {'CORE_CANDIDATE', 'REVIEW_SEARCH'}]
          assigned = [r for r in active if r['assignment_status'] == 'ASSIGNED']
          search_required = [r for r in active if r['assignment_status'] == 'SEARCH_REQUIRED']
          deferred = [r for r in assignments if r['assignment_status'] == 'PRESERVED_DEFERRED']
          excluded = [r for r in assignments if r['assignment_status'] == 'PRESERVED_EXCLUDED']
          taxonomy_ids = {r['cluster_id'] for r in summary}
          unknown = sorted({r['cluster_id'] for r in assigned if r['cluster_id'] not in taxonomy_ids})

          checks = {
              'source_rows_2840': len(assignments) == 2840 == qa.get('source_rows'),
              'active_rows_2332': len(active) == 2332 == qa.get('active_rows'),
              'full_qa_rows_2332': len(full) == 2332 == qa.get('pass3_rows_independently_reviewed'),
              'qa_row_sequence_exact': [int(r['qa_row']) for r in full] == list(range(1, 2333)),
              'error_ledger_complete': len(errors) == qa.get('pass3_error_ledger_rows'),
              'error_correction_identity': len(errors) == len(corrections) == qa.get('consolidated_correction_rows'),
              'correction_ids_unique': len({r['correction_id'] for r in corrections}) == len(corrections),
              'exactly_one_batch': qa.get('correction_batches_applied') == 1 and qa.get('one_consolidated_correction_batch') is True,
              'impact_correction_identity': len(impact) == len(corrections) == qa.get('impact_rows_rechecked'),
              'all_impact_rows_pass': all(r['impact_recheck_verdict'] == 'PASS' for r in impact),
              'active_accounting_exact': len(assigned) + len(search_required) == 2332 == qa.get('final_active_accounted_rows'),
              'assigned_accounting_exact': len(assigned) == qa.get('final_assigned_active_rows'),
              'search_required_accounting_exact': len(search_required) == qa.get('final_search_required_active_rows'),
              'preserved_deferred_174': len(deferred) == 174 == qa.get('preserved_deferred_rows'),
              'preserved_excluded_334': len(excluded) == 334 == qa.get('preserved_excluded_rows'),
              'taxonomy_rows_62': len(summary) == 62 == qa.get('taxonomy_cluster_ids'),
              'unknown_cluster_ids_zero': unknown == [] == qa.get('unknown_cluster_ids'),
              'impact_failures_zero': qa.get('impact_recheck_failures') == 0,
              'semantic_invariants_zero': qa.get('semantic_invariant_violations') == 0,
              'pass3_complete': qa.get('pass3_complete') is True,
              'ledger_frozen_before_correction': qa.get('complete_error_ledger_frozen_before_correction') is True,
              'full_accounting_regression_pass': qa.get('full_accounting_regression_pass') is True,
              'impact_semantic_recheck_pass': qa.get('impact_set_semantic_recheck_pass') is True,
              'old_step10_not_used': qa.get('old_step10_input_used') is False,
              'blind84_not_used': qa.get('blind84_input_used') is False,
              'target_count_not_used': qa.get('target_cluster_count_used') is False,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('V5 accounting/isolation validation failed: ' + ', '.join(failed))
          print(json.dumps({'checks': checks, 'qa': qa}, ensure_ascii=False, indent=2))
          PY

      - name: Run semantic regression suite against v5 classifier
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/step10_fresh_r1_pass3_runner_v5.py').resolve()
          source = path.read_text(encoding='utf-8')
          terminal = 'module.classify = classify_v5\nmodule.invariant_violations = invariants_v5\nraise SystemExit(module.main())'
          replacement = 'module.classify = classify_v5\nmodule.invariant_violations = invariants_v5'
          if terminal not in source:
              raise SystemExit('unexpected v5 runner shape')
          ns = {'__file__': str(path), '__name__': 'pass3_v5_regression_library'}
          exec(compile(source.replace(terminal, replacement), str(path), 'exec'), ns)
          module = ns['module']

          cases = [
              ('rehau medea ручка окна', 'ASSIGNED', 'WINDOW_HARDWARE_SHOPPING'),
              ('rehau микролифт для окна', 'ASSIGNED', 'WINDOW_HARDWARE_SHOPPING'),
              ('rehau окна режимы', 'ASSIGNED', 'WINDOW_PRODUCT_TECH_INFO'),
              ('алюминиевое остекление веранды фото', 'ASSIGNED', 'GLAZING_DESIGN_INSPIRATION'),
              ('готовые пластиковые окна без установки', 'ASSIGNED', 'PVC_WINDOWS_COMMERCIAL'),
              ('пластиковые окна без установки москва', 'ASSIGNED', 'PVC_WINDOWS_COMMERCIAL'),
              ('пластиковые окна в москве с установкой', 'ASSIGNED', 'PVC_WINDOWS_COMMERCIAL'),
              ('окна rehau цена с установкой', 'ASSIGNED', 'REHAU_WINDOWS_COMMERCIAL'),
              ('алюминиевые окна цена с установкой', 'ASSIGNED', 'ALUMINIUM_WINDOWS_COMMERCIAL'),
              ('установка пластиковых окон', 'ASSIGNED', 'WINDOW_INSTALLATION_SERVICE'),
              ('установка окон rehau', 'ASSIGNED', 'WINDOW_INSTALLATION_SERVICE'),
              ('установка пластиковой двери', 'ASSIGNED', 'PVC_DOOR_INSTALLATION_SERVICE'),
              ('как поменять пластиковое окно', 'ASSIGNED', 'WINDOW_INSTALLATION_DIY_INFO'),
              ('оконная фурнитура отзывы', 'ASSIGNED', 'WINDOW_HARDWARE_INFO'),
              ('аксессуары для пластиковых окон и дверей', 'ASSIGNED', 'WINDOW_ACCESSORIES_SHOPPING'),
              ('запчасти для ремонта пластиковых окон', 'ASSIGNED', 'WINDOW_HARDWARE_SHOPPING'),
              ('замена остекления балкона', 'ASSIGNED', 'WINDOW_REPLACEMENT_SERVICE'),
              ('ремонт остекление балконов москва', 'ASSIGNED', 'BALCONY_RENOVATION_WITH_GLAZING'),
              ('варианты остекления веранды', 'ASSIGNED', 'GLAZING_SELECTION_INFO'),
              ('перепланировка французское окно', 'ASSIGNED', 'GLAZING_PERMISSION_INFO'),
              ('отделка пластиковых окон', 'ASSIGNED', 'WINDOW_FINISHING_SERVICE'),
              ('корпус пластиковый прозрачная дверь', 'ASSIGNED', 'OUTSIDE_OTHER'),
              ('внутренние пластиковые двери', 'ASSIGNED', 'OUTSIDE_INTERIOR_DOORS'),
              ('рейтинг компаний по установке пластиковых окон', 'ASSIGNED', 'WINDOW_REVIEWS_INFO'),
              ('пластиковые окна видео', 'ASSIGNED', 'WINDOW_PRODUCT_TECH_INFO'),
              ('как сделать французское окно', 'ASSIGNED', 'WINDOW_INSTALLATION_DIY_INFO'),
              ('пена установки пластиковых окон', 'ASSIGNED', 'WINDOW_HARDWARE_SHOPPING'),
              ('клинья для установки пластиковых окон', 'ASSIGNED', 'WINDOW_HARDWARE_SHOPPING'),
              ('установка стеклопакета', 'ASSIGNED', 'WINDOW_REPAIR_SERVICE'),
              ('установка оконной фурнитуры', 'ASSIGNED', 'WINDOW_REPAIR_SERVICE'),
              ('откосы для пластиковых окон', 'ASSIGNED', 'WINDOW_ACCESSORIES_SHOPPING'),
              ('подоконник для пластиковых окон', 'ASSIGNED', 'WINDOW_ACCESSORIES_SHOPPING'),
              ('стекло на пластиковое окно цена', 'ASSIGNED', 'WINDOW_HARDWARE_SHOPPING'),
              ('узлы алюминиевых окон', 'ASSIGNED', 'WINDOW_HARDWARE_INFO'),
              ('сверление пластикового окна', 'ASSIGNED', 'WINDOW_INSTALLATION_DIY_INFO'),
              ('зазор при установке пластиковых окон', 'ASSIGNED', 'WINDOW_INSTALLATION_DIY_INFO'),
              ('остекление балкона с крышей', 'ASSIGNED', 'BALCONY_GLAZING_ROOF_SERVICE'),
              ('остекление балкона с выносом', 'ASSIGNED', 'BALCONY_GLAZING_EXTENSION_SERVICE'),
              ('теплое остекление балконов', 'ASSIGNED', 'BALCONY_GLAZING_WARM'),
              ('холодное остекление балкона', 'ASSIGNED', 'BALCONY_GLAZING_COLD'),
              ('оконная фурнитура бренды', 'ASSIGNED', 'WINDOW_HARDWARE_INFO'),
              ('панорамные окна для частного дома размеры', 'ASSIGNED', 'PRIVATE_HOUSE_WINDOW_PLANNING_INFO'),
              ('официальный дилер окон rehau в москве', 'ASSIGNED', 'NAVIGATION_BRAND_SITE'),
              ('что лучше пластиковые или алюминиевые окна', 'ASSIGNED', 'WINDOW_COMPARISON_INFO'),
              ('москитная сетка на пластиковые окна купить', 'ASSIGNED', 'MOSQUITO_NET_SHOPPING'),
              ('оконные блоки фурнитурой', 'SEARCH_REQUIRED', ''),
              ('остекление балкона работу', 'SEARCH_REQUIRED', ''),
          ]

          failures = []
          for phrase, expected_status, expected_cluster in cases:
              result = module.classify(phrase, '', '')
              actual = (result.status, result.cluster_id)
              expected = (expected_status, expected_cluster)
              if actual != expected:
                  failures.append({
                      'phrase': phrase,
                      'expected_status': expected_status,
                      'expected_cluster': expected_cluster,
                      'actual_status': result.status,
                      'actual_cluster': result.cluster_id,
                      'rule_id': result.rule_id,
                  })
          if failures:
              import json
              raise SystemExit('V5 semantic regression failures: ' + json.dumps(failures, ensure_ascii=False, indent=2))
          print(f'PASS: {len(cases)}/{len(cases)} semantic regression cases')
          PY

      - name: Scan all final assigned rows for forbidden semantic patterns
        run: |
          python3 - <<'PY'
          import csv
          import json
          import re
          from pathlib import Path

          base = Path('extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK')
          with (base / 'STEP_10_FRESH_R1_ASSIGNMENTS_FINAL.tsv').open('r', encoding='utf-8', newline='') as fh:
              rows = list(csv.DictReader(fh, delimiter='\t'))

          def h(text, pattern):
              return re.search(pattern, text, flags=re.IGNORECASE) is not None

          failures = []
          for row_number, row in enumerate(rows, start=1):
              if row['assignment_status'] != 'ASSIGNED':
                  continue
              t = row['phrase'].lower().replace('ё', 'е')
              cluster = row['cluster_id']
              checks = []
              component = h(t, r'фурнитур|ручк|петл|уплотн|замок|защелк|микролифт|ограничител|стеклопакет|подоконник|откос|отлив')
              diy = h(t, r'своими руками|самостоятель|самому|пошаг|инструкц')
              visual = h(t, r'\bфото\b|дизайн|интерьер|пример|проект')
              permission = h(t, r'разрешен|можно ли|перепланиров|требован|норматив|закон')
              review = h(t, r'отзыв|рейтинг')
              with_install = h(t, r'\bс установк|включая установк|вместе с установк')
              service_primary = h(t, r'^(?:установка|монтаж|установить|смонтировать|заказ и установка|изготовление и установка|производство и установка)\b')
              if component and cluster in {'REHAU_WINDOWS_COMMERCIAL', 'PVC_WINDOWS_COMMERCIAL', 'ALUMINIUM_WINDOWS_COMMERCIAL', 'WINDOWS_COMMERCIAL_GENERAL'}:
                  checks.append('component_in_base_product')
              if h(t, r'режим|конструкц|что это|как называется') and cluster in {'REHAU_WINDOWS_COMMERCIAL', 'PVC_WINDOWS_COMMERCIAL', 'ALUMINIUM_WINDOWS_COMMERCIAL', 'WINDOWS_COMMERCIAL_GENERAL'} and not h(t, r'купить|заказ|цен|стоим'):
                  checks.append('tech_in_commercial')
              if visual and cluster in {'GLAZING_SELECTION_INFO', 'BALCONY_GLAZING_INFO'}:
                  checks.append('visual_in_selection')
              if h(t, r'алюмин') and cluster == 'WINDOWS_COMMERCIAL_GENERAL':
                  checks.append('aluminium_in_generic')
              if diy and cluster in {'WINDOW_INSTALLATION_SERVICE', 'WINDOW_REPAIR_SERVICE', 'WINDOW_FINISHING_SERVICE', 'WINDOW_REPLACEMENT_SERVICE', 'WINDOW_DEMOLITION_SERVICE', 'PVC_DOOR_INSTALLATION_SERVICE', 'PVC_DOOR_REPAIR_SERVICE', 'PVC_DOOR_REPLACEMENT_SERVICE'}:
                  checks.append('diy_in_professional_service')
              if h(t, r'без остеклен|открыт.*балкон') and cluster.startswith('BALCONY_GLAZING_'):
                  checks.append('open_balcony_in_glazing')
              if permission and cluster in {'BALCONY_GLAZING_GENERAL', 'OUTDOOR_STRUCTURE_GLAZING', 'GENERAL_GLAZING_SERVICE'}:
                  checks.append('permission_in_service')
              if h(t, r'без установки|без монтажа') and cluster in {'WINDOW_INSTALLATION_SERVICE', 'PVC_DOOR_INSTALLATION_SERVICE'}:
                  checks.append('negated_installation_in_service')
              if with_install and not service_primary and cluster in {'WINDOW_INSTALLATION_SERVICE', 'PVC_DOOR_INSTALLATION_SERVICE'}:
                  checks.append('product_bundle_in_install_only_service')
              if review and cluster in {'WINDOW_INSTALLATION_SERVICE', 'WINDOW_REPAIR_SERVICE', 'BALCONY_GLAZING_GENERAL', 'OUTDOOR_STRUCTURE_GLAZING'}:
                  checks.append('review_in_transactional_service')
              if h(t, r'штор|жалюз|плиссе|занавес|ставн') and cluster != 'OUTSIDE_CURTAINS_BLINDS':
                  checks.append('curtains_not_outside')
              if h(t, r'конвектор|радиатор|батаре|отоплен|теплый пол|кондиционер') and cluster != 'OUTSIDE_HEATING_HVAC':
                  checks.append('heating_not_outside')
              if checks:
                  failures.append({'source_row': row_number, 'phrase': row['phrase'], 'cluster': cluster, 'violations': checks})

          if failures:
              raise SystemExit('full-ledger forbidden-pattern scan failed: ' + json.dumps(failures[:50], ensure_ascii=False, indent=2))
          print('PASS: all final assigned rows cleared forbidden-pattern scan')
          PY

      - name: Write V5 verified marker with hashes
        run: |
          python3 - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path

          base = Path('extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK')
          qa_path = base / 'STEP_10_FRESH_R1_FINAL_QA.json'
          qa = json.loads(qa_path.read_text(encoding='utf-8'))
          artifact_names = [
              'STEP_10_FRESH_R1_PASS3_FULL_QA_LEDGER.tsv',
              'STEP_10_FRESH_R1_PASS3_ERROR_LEDGER.tsv',
              'STEP_10_FRESH_R1_PASS3_CONSOLIDATED_CORRECTIONS.tsv',
              'STEP_10_FRESH_R1_ASSIGNMENTS_FINAL.tsv',
              'STEP_10_FRESH_R1_CLUSTER_SUMMARY_FINAL.tsv',
              'STEP_10_FRESH_R1_PASS3_IMPACT_RECHECK.tsv',
              'STEP_10_FRESH_R1_FINAL_QA.json',
              'STEP_10_FRESH_R1_PASS3_REPORT.md',
              'STEP_10_FRESH_R1_COMPLETE.marker',
          ]

          def count_tsv(name):
              with (base / name).open('r', encoding='utf-8', newline='') as fh:
                  return sum(1 for _ in csv.DictReader(fh, delimiter='\t'))

          def digest(path):
              h = hashlib.sha256()
              with path.open('rb') as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          marker = {
              'status': 'STEP10_FRESH_R1_PASS3_V5_FINAL_VERIFIED',
              'source_rows': qa['source_rows'],
              'active_rows': qa['active_rows'],
              'independently_reviewed_rows': qa['pass3_rows_independently_reviewed'],
              'full_qa_rows': count_tsv('STEP_10_FRESH_R1_PASS3_FULL_QA_LEDGER.tsv'),
              'error_ledger_rows': count_tsv('STEP_10_FRESH_R1_PASS3_ERROR_LEDGER.tsv'),
              'consolidated_correction_rows': count_tsv('STEP_10_FRESH_R1_PASS3_CONSOLIDATED_CORRECTIONS.tsv'),
              'correction_batches': qa['correction_batches_applied'],
              'final_assigned_rows': qa['final_assigned_active_rows'],
              'final_search_required_rows': qa['final_search_required_active_rows'],
              'final_active_accounted_rows': qa['final_active_accounted_rows'],
              'preserved_deferred_rows': qa['preserved_deferred_rows'],
              'preserved_excluded_rows': qa['preserved_excluded_rows'],
              'taxonomy_cluster_ids': qa['taxonomy_cluster_ids'],
              'used_cluster_ids': qa['used_cluster_ids'],
              'impact_rows_rechecked': qa['impact_rows_rechecked'],
              'impact_failures': qa['impact_recheck_failures'],
              'semantic_invariant_violations': qa['semantic_invariant_violations'],
              'semantic_regression_cases': 47,
              'semantic_regression_failures': 0,
              'full_ledger_forbidden_pattern_failures': 0,
              'old_step10_input_used': qa['old_step10_input_used'],
              'blind84_input_used': qa['blind84_input_used'],
              'target_cluster_count_used': qa['target_cluster_count_used'],
              'sha256': {name: digest(base / name) for name in artifact_names},
          }
          out = base / 'STEP_10_FRESH_R1_PASS3_V5_VERIFIED.marker.json'
          out.write_text(json.dumps(marker, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(marker, ensure_ascii=False, indent=2))
          PY

      - name: Commit final V5 outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_FRESH_R1_PASS3_FULL_QA_LEDGER.tsv \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_FRESH_R1_PASS3_ERROR_LEDGER.tsv \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_FRESH_R1_PASS3_CONSOLIDATED_CORRECTIONS.tsv \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_FRESH_R1_ASSIGNMENTS_FINAL.tsv \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_FRESH_R1_CLUSTER_SUMMARY_FINAL.tsv \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_FRESH_R1_PASS3_IMPACT_RECHECK.tsv \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_FRESH_R1_FINAL_QA.json \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_FRESH_R1_PASS3_REPORT.md \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_FRESH_R1_COMPLETE.marker \
            extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_10_FRESH_R1_PASS3_V5_VERIFIED.marker.json
          if git diff --cached --quiet; then
            echo 'V5 outputs already match branch state.'
          else
            git commit -m 'step10: freeze verified fresh R1 Pass3 V5 outputs'
            git push origin HEAD:roadmap/kwork-productization-2026-08-28
          fi
