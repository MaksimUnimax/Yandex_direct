name: phase2-settings-backup-integrity-fix
on:
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/phase2-recovery-work-2026-08-20
      - name: Restore versioned checksummed settings backup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          worker = Path('extension/src/service_worker.js')
          s = worker.read_text(encoding='utf-8')
          old = 'const SETTINGS_SCHEMA_VERSION = 2;\nconst KEYS = Object.freeze({'
          new = 'const SETTINGS_SCHEMA_VERSION = 2;\nconst SETTINGS_BACKUP_FORMAT = "YMB_SETTINGS_BACKUP";\nconst SETTINGS_BACKUP_VERSION = 2;\nconst KEYS = Object.freeze({'
          if new not in s:
              assert old in s, 'settings constants anchor not found'
              s = s.replace(old, new, 1)

          start = s.index('function exportedSettingsKeys()')
          end = s.index('\nfunction discoverManualBlockItems', start)
          replacement = r'''function canonicalBackupJson(value) {
            if (value === null || typeof value !== "object") return JSON.stringify(value);
            if (Array.isArray(value)) return `[${value.map((item) => canonicalBackupJson(item === undefined ? null : item)).join(",")}]`;
            const parts = [];
            for (const key of Object.keys(value).sort()) {
              if (value[key] === undefined) continue;
              parts.push(`${JSON.stringify(key)}:${canonicalBackupJson(value[key])}`);
            }
            return `{${parts.join(",")}}`;
          }
          async function sha256HexUtf8(text) {
            const bytes = new TextEncoder().encode(String(text));
            const digest = await crypto.subtle.digest("SHA-256", bytes);
            return [...new Uint8Array(digest)].map((byte) => byte.toString(16).padStart(2, "0")).join("");
          }
          async function settingsPayloadSha256(settings) { return sha256HexUtf8(canonicalBackupJson(settings)); }
          async function validateSettingsBackupEnvelope(backup) {
            if (!backup || typeof backup !== "object" || Array.isArray(backup)) throw Object.assign(new Error("Некорректный backup."), { code: "INVALID_BACKUP" });
            if (backup.format !== SETTINGS_BACKUP_FORMAT) throw Object.assign(new Error("Неподдерживаемый формат backup."), { code: "UNSUPPORTED_BACKUP_FORMAT" });
            if (Number(backup.backup_version) !== SETTINGS_BACKUP_VERSION) throw Object.assign(new Error("Неподдерживаемая версия backup."), { code: "UNSUPPORTED_BACKUP_VERSION" });
            if (Number(backup.settings_schema_version) !== SETTINGS_SCHEMA_VERSION) throw Object.assign(new Error("Неподдерживаемая схема настроек backup."), { code: "UNSUPPORTED_SETTINGS_SCHEMA" });
            if (backup.contains_secrets !== true) throw Object.assign(new Error("Backup не помечен как содержащий секреты."), { code: "INVALID_BACKUP_SECRET_MARKER" });
            const incoming = backup.settings;
            if (!incoming || typeof incoming !== "object" || Array.isArray(incoming)) throw Object.assign(new Error("Некорректный backup settings payload."), { code: "INVALID_BACKUP_SETTINGS" });
            const supplied = String(backup.settings_sha256 || "").trim().toLowerCase();
            if (!/^[0-9a-f]{64}$/.test(supplied)) throw Object.assign(new Error("В backup отсутствует корректная контрольная сумма настроек."), { code: "BACKUP_CHECKSUM_MISSING" });
            const expected = await settingsPayloadSha256(incoming);
            if (supplied !== expected) throw Object.assign(new Error("Backup изменён или повреждён: контрольная сумма не совпадает."), { code: "BACKUP_CHECKSUM_MISMATCH" });
            return incoming;
          }
          function exportedSettingsKeys() { return [KEYS.API_KEY, KEYS.FOLDER_ID, KEYS.AUTO_SEND, KEYS.CONVERSATION_BINDINGS, KEYS.MANUAL_MODES, KEYS.REPORT_PREFIXES, KEYS.AUTO_START_PROMPTS, KEYS.SEND_BUTTON_PROFILE, KEYS.COPY_BUTTON_PROFILES, KEYS.SERVICE_CONTEXTS, KEYS.WORDSTAT_POLICY, KEYS.SEARCH_POLICY, KEYS.DEBUG_MODE]; }
          async function exportSettingsBackup() {
            const data = await storageGet(exportedSettingsKeys()); const settings = await getSettings();
            const payload = { wordstat: { api_key: settings.apiKey, folder_id: settings.folderId }, auto_send: data[KEYS.AUTO_SEND] !== false, send_button_profile: safeButtonProfile(data[KEYS.SEND_BUTTON_PROFILE]), copy_button_profiles: copyProfileCollection(data[KEYS.COPY_BUTTON_PROFILES]), conversation_bindings: data[KEYS.CONVERSATION_BINDINGS] || {}, manual_modes: data[KEYS.MANUAL_MODES] || {}, report_prefixes: data[KEYS.REPORT_PREFIXES] || {}, auto_start_prompts: data[KEYS.AUTO_START_PROMPTS] || {}, service_contexts: data[KEYS.SERVICE_CONTEXTS] || {}, wordstat_policy: publicPolicy(data[KEYS.WORDSTAT_POLICY] || {}, "wordstat"), search_policy: publicPolicy(data[KEYS.SEARCH_POLICY] || {}, "search"), debug_mode: data[KEYS.DEBUG_MODE] === true };
            return {
              format: SETTINGS_BACKUP_FORMAT,
              backup_version: SETTINGS_BACKUP_VERSION,
              settings_schema_version: SETTINGS_SCHEMA_VERSION,
              exported_at: nowIso(),
              extension_version: VERSION,
              extension_id: String(chrome.runtime?.id || ""),
              contains_secrets: true,
              settings_sha256: await settingsPayloadSha256(payload),
              settings: payload,
              schema: "YMB_SETTINGS_BACKUP_V2",
              version: VERSION
            };
          }
          async function importSettingsBackup(backup) {
            const incoming = await validateSettingsBackupEnvelope(backup);
            const runs = (await storageGet(KEYS.AUTO_RUNS))[KEYS.AUTO_RUNS] || {}; if (Object.values(runs).some((r) => r && !WordstatAutorunModel.isTerminalStatus(r.status))) throw Object.assign(new Error("Нельзя импортировать настройки во время активного Autorun."), { code: "IMPORT_ACTIVE_RUN" });
            const ops = (await storageGet(KEYS.MANUAL_OPERATIONS))[KEYS.MANUAL_OPERATIONS] || {}; if (Object.values(ops).some((op) => op && !TERMINAL_MANUAL_STATUSES.has(op.status))) throw Object.assign(new Error("Нельзя импортировать настройки во время активной Manual-операции."), { code: "IMPORT_ACTIVE_MANUAL" });
            const wordstat = incoming.wordstat || {}; const apiKey = normalizeApiKey(wordstat.api_key, { required: false }); const folderId = normalizeFolderId(wordstat.folder_id || DEFAULT_FOLDER_ID, { required: false }) || DEFAULT_FOLDER_ID;
            await storageSet({ [KEYS.API_KEY]: apiKey, [KEYS.FOLDER_ID]: folderId, [KEYS.AUTO_SEND]: incoming.auto_send !== false, [KEYS.SEND_BUTTON_PROFILE]: safeButtonProfile(incoming.send_button_profile), [KEYS.COPY_BUTTON_PROFILES]: copyProfileCollection(incoming.copy_button_profiles), [KEYS.CONVERSATION_BINDINGS]: clone(incoming.conversation_bindings || {}), [KEYS.MANUAL_MODES]: clone(incoming.manual_modes || {}), [KEYS.REPORT_PREFIXES]: clone(incoming.report_prefixes || {}), [KEYS.AUTO_START_PROMPTS]: clone(incoming.auto_start_prompts || {}), [KEYS.SERVICE_CONTEXTS]: clone(incoming.service_contexts || {}), [KEYS.WORDSTAT_POLICY]: YMBPolicyModel.normalizeWordstatPolicy(incoming.wordstat_policy || {}), [KEYS.SEARCH_POLICY]: YMBPolicyModel.normalizeSearchPolicy(incoming.search_policy || {}), [KEYS.DEBUG_MODE]: incoming.debug_mode === true, [KEYS.SETTINGS_SCHEMA]: SETTINGS_SCHEMA_VERSION });
            return { imported: true, backup_version: SETTINGS_BACKUP_VERSION, settings_sha256: String(backup.settings_sha256).toLowerCase() };
          }
          '''
          s = s[:start] + replacement + s[end:]
          worker.write_text(s, encoding='utf-8')

          legacy = Path('extension/tests/legacy_profiles_recovery.test.mjs')
          t = legacy.read_text(encoding='utf-8')
          old = '''test('settings import restores legacy Send/Copy profiles together with current settings', async () => {\n  const h = harness({ wsmb_api_key: 'old-key' });\n  const backup = await h.api.exportSettingsBackup();\n  backup.settings.wordstat.api_key = 'new-key';\n  backup.settings.send_button_profile = sendProfile;\n  backup.settings.copy_button_profiles = copyProfiles;\n  await h.api.importSettingsBackup(backup);\n  assert.equal(h.store.wsmb_api_key, 'new-key');\n  assert.deepEqual(h.store.wsmb_send_button_profile, sendProfile);\n  assert.deepEqual(h.store.wsmb_copy_button_profiles, copyProfiles);\n});'''
          new = '''test('settings import restores legacy Send/Copy profiles together with current settings', async () => {\n  const source = harness({ wsmb_api_key: 'new-key', wsmb_send_button_profile: sendProfile, wsmb_copy_button_profiles: copyProfiles });\n  const backup = await source.api.exportSettingsBackup();\n  const h = harness({ wsmb_api_key: 'old-key' });\n  await h.api.importSettingsBackup(backup);\n  assert.equal(h.store.wsmb_api_key, 'new-key');\n  assert.deepEqual(h.store.wsmb_send_button_profile, sendProfile);\n  assert.deepEqual(h.store.wsmb_copy_button_profiles, copyProfiles);\n});'''
          assert old in t, 'legacy import test anchor not found'
          t = t.replace(old, new, 1)
          old = '''test('old export/import message names remain compatible with restored worker', async () => {\n  const h = harness({ wsmb_send_button_profile: sendProfile, wsmb_copy_button_profiles: copyProfiles });\n  const exported = await h.api.handleMessage({ type: 'WS_EXPORT_SETTINGS' }, {});\n  assert.equal(exported.ok, true);\n  assert.deepEqual(plain(exported.backup.settings.send_button_profile), sendProfile);\n  exported.backup.settings.copy_button_profiles = { restored: [{ selector: '#copy' }] };\n  const imported = await h.api.handleMessage({ type: 'WS_IMPORT_SETTINGS', backup: exported.backup }, {});\n  assert.equal(imported.ok, true);\n  assert.deepEqual(h.store.wsmb_copy_button_profiles, { restored: [{ selector: '#copy' }] });\n});'''
          new = '''test('old export/import message names remain compatible with restored worker', async () => {\n  const restoredCopies = { restored: [{ selector: '#copy' }] };\n  const source = harness({ wsmb_send_button_profile: sendProfile, wsmb_copy_button_profiles: restoredCopies });\n  const exported = await source.api.handleMessage({ type: 'WS_EXPORT_SETTINGS' }, {});\n  assert.equal(exported.ok, true);\n  assert.deepEqual(plain(exported.backup.settings.send_button_profile), sendProfile);\n  const h = harness({ wsmb_copy_button_profiles: copyProfiles });\n  const imported = await h.api.handleMessage({ type: 'WS_IMPORT_SETTINGS', backup: exported.backup }, {});\n  assert.equal(imported.ok, true);\n  assert.deepEqual(h.store.wsmb_copy_button_profiles, restoredCopies);\n});'''
          assert old in t, 'legacy message compatibility test anchor not found'
          t = t.replace(old, new, 1)
          legacy.write_text(t, encoding='utf-8')
          PY

          cat > extension/tests/settings_backup_integrity_recovery.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import vm from 'node:vm';
          import { webcrypto } from 'node:crypto';
          import { performance } from 'node:perf_hooks';
          import { fileURLToPath } from 'node:url';

          const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '../src');
          const workerSource = fs.readFileSync(path.join(root, 'service_worker.js'), 'utf8');
          const FN_NAMES = [...workerSource.matchAll(/^(?:async )?function\s+([A-Za-z0-9_]+)/gm)].map((m) => m[1]);
          function clone(value) { return value === undefined ? undefined : structuredClone(value); }
          function canonical(value) {
            if (value === null || typeof value !== 'object') return JSON.stringify(value);
            if (Array.isArray(value)) return `[${value.map((item) => canonical(item === undefined ? null : item)).join(',')}]`;
            return `{${Object.keys(value).sort().filter((key) => value[key] !== undefined).map((key) => `${JSON.stringify(key)}:${canonical(value[key])}`).join(',')}}`;
          }
          async function sha256(value) {
            const digest = await webcrypto.subtle.digest('SHA-256', new TextEncoder().encode(canonical(value)));
            return Buffer.from(digest).toString('hex');
          }
          function harness(initial = {}, runtimeId = 'test-extension') {
            const store = clone(initial);
            const storage = {
              async get(keys) {
                if (keys == null) return clone(store);
                if (typeof keys === 'string') return Object.hasOwn(store, keys) ? { [keys]: clone(store[keys]) } : {};
                if (Array.isArray(keys)) { const out = {}; for (const key of keys) if (Object.hasOwn(store, key)) out[key] = clone(store[key]); return out; }
                const out = clone(keys || {}); for (const key of Object.keys(keys || {})) if (Object.hasOwn(store, key)) out[key] = clone(store[key]); return out;
              },
              async set(values) { Object.assign(store, clone(values)); },
              async remove(keys) { for (const key of (Array.isArray(keys) ? keys : [keys])) delete store[key]; }
            };
            let listener = null;
            const chrome = {
              storage: { local: storage },
              runtime: { id: runtimeId, lastError: null, onMessage: { addListener(fn) { listener = fn; } } },
              tabs: { sendMessage(_id, _message, cb) { cb({ ok: true }); } }
            };
            const ctx = vm.createContext({
              console, chrome, crypto: webcrypto, TextEncoder, TextDecoder, AbortController, performance,
              setTimeout, clearTimeout, URL, structuredClone, Response, Request, Headers, ReadableStream, Buffer,
              fetch: async () => new Response('{}', { status: 200 }), importScripts: () => {}
            });
            ctx.globalThis = ctx;
            for (const file of [
              'shared/product.js','shared/conversation_identity.js','shared/manual_controls.js','shared/service_registry.js',
              'shared/block_command_discovery.js','shared/run_context_model.js','shared/credential_registry.js','shared/policy_model.js',
              'shared/cost_ledger_model.js','shared/wordstat_protocol.js','shared/search_xml.js','shared/search_protocol.js','shared/autorun_model.js'
            ]) vm.runInContext(fs.readFileSync(path.join(root, file), 'utf8'), ctx, { filename: file });
            vm.runInContext(workerSource, ctx, { filename: 'service_worker.js' });
            assert.equal(typeof listener, 'function');
            vm.runInContext(`globalThis.__BACKUP_API=Object.freeze({${FN_NAMES.join(',')}});`, ctx);
            return { api: ctx.__BACKUP_API, store };
          }

          test('settings export is versioned, secret-marked and carries canonical SHA-256 over settings payload', async () => {
            const h = harness({ wsmb_api_key: 'SECRET-KEY-A', wsmb_folder_id: 'folder-a', wsmb_auto_send: false, ymb_debug_mode: true }, 'source-extension');
            const backup = await h.api.exportSettingsBackup();
            assert.equal(backup.format, 'YMB_SETTINGS_BACKUP');
            assert.equal(backup.backup_version, 2);
            assert.equal(backup.settings_schema_version, 2);
            assert.equal(backup.extension_id, 'source-extension');
            assert.equal(backup.contains_secrets, true);
            assert.equal(backup.settings.wordstat.api_key, 'SECRET-KEY-A');
            assert.match(backup.settings_sha256, /^[0-9a-f]{64}$/);
            assert.equal(backup.settings_sha256, await sha256(backup.settings));
          });

          test('tampered settings backup is rejected before any settings mutation', async () => {
            const source = harness({ wsmb_api_key: 'new-key', wsmb_folder_id: 'new-folder' }, 'source-extension');
            const backup = await source.api.exportSettingsBackup();
            const tampered = clone(backup);
            tampered.settings.wordstat.api_key = 'attacker-key';
            const target = harness({ wsmb_api_key: 'old-key', wsmb_folder_id: 'old-folder' }, 'target-extension');
            await assert.rejects(() => target.api.importSettingsBackup(tampered), (error) => error?.code === 'BACKUP_CHECKSUM_MISMATCH');
            assert.equal(target.store.wsmb_api_key, 'old-key');
            assert.equal(target.store.wsmb_folder_id, 'old-folder');
            assert.equal(Object.hasOwn(target.store, 'ymb_settings_schema_version'), false);
          });

          test('missing checksum and unsupported backup version are rejected without mutation', async () => {
            const source = harness({ wsmb_api_key: 'new-key' });
            const backup = await source.api.exportSettingsBackup();
            const target = harness({ wsmb_api_key: 'old-key' });
            const missing = clone(backup);
            delete missing.settings_sha256;
            await assert.rejects(() => target.api.importSettingsBackup(missing), (error) => error?.code === 'BACKUP_CHECKSUM_MISSING');
            const unsupported = clone(backup);
            unsupported.backup_version = 999;
            await assert.rejects(() => target.api.importSettingsBackup(unsupported), (error) => error?.code === 'UNSUPPORTED_BACKUP_VERSION');
            assert.equal(target.store.wsmb_api_key, 'old-key');
          });

          test('intact checksummed backup restores settings across different extension identities', async () => {
            const copies = { restored: [{ selector: '#copy' }] };
            const source = harness({
              wsmb_api_key: 'cross-key', wsmb_folder_id: 'cross-folder', wsmb_auto_send: false,
              ymb_debug_mode: true, wsmb_copy_button_profiles: copies,
              ymb_service_contexts: { 'https://chatgpt.com|abc': { active_service: 'search', updated_at: '2026-08-20T00:00:00.000Z' } }
            }, 'source-extension');
            const backup = await source.api.exportSettingsBackup();
            const target = harness({ wsmb_api_key: 'old-key', wsmb_folder_id: 'old-folder' }, 'target-extension');
            const result = await target.api.importSettingsBackup(backup);
            assert.equal(result.imported, true);
            assert.equal(target.store.wsmb_api_key, 'cross-key');
            assert.equal(target.store.wsmb_folder_id, 'cross-folder');
            assert.equal(target.store.wsmb_auto_send, false);
            assert.equal(target.store.ymb_debug_mode, true);
            assert.deepEqual(target.store.wsmb_copy_button_profiles, copies);
            assert.equal(target.store.ymb_service_contexts['https://chatgpt.com|abc'].active_service, 'search');
          });
          EOF

          node --test extension/tests/settings_backup_integrity_recovery.test.mjs extension/tests/legacy_profiles_recovery.test.mjs
          node --test \
            extension/tests/search_protocol.test.mjs \
            extension/tests/search_registry.test.mjs \
            extension/tests/search_xml.test.mjs \
            extension/tests/search_worker_stage2.test.mjs \
            extension/tests/search_manual_worker.test.mjs \
            extension/tests/manual_block_sequence_recovery.test.mjs \
            extension/tests/manual_delivery_lifecycle_recovery.test.mjs \
            extension/tests/content_phase2_runtime.test.mjs \
            extension/tests/popup_phase2_runtime.test.mjs \
            extension/tests/autorun_recovery.test.mjs \
            extension/tests/autorun_transport_retry_recovery.test.mjs \
            extension/tests/conversation_fences_recovery.test.mjs \
            extension/tests/start_prompt_and_prefix_recovery.test.mjs \
            extension/tests/wordstat_core_recovery.test.mjs \
            extension/tests/settings_security_recovery.test.mjs \
            extension/tests/settings_backup_integrity_recovery.test.mjs \
            extension/tests/popup_error_boundary_recovery.test.mjs \
            extension/tests/permission_scope_recovery.test.mjs \
            extension/tests/legacy_profiles_recovery.test.mjs \
            extension/tests/diagnostics_popup_recovery.test.mjs \
            extension/tests/button_picker_recovery.test.mjs \
            extension/tests/binding_recovery.test.mjs \
            extension/tests/manual_off_safety_recovery.test.mjs
          node --check extension/src/service_worker.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/src/service_worker.js extension/tests/legacy_profiles_recovery.test.mjs extension/tests/settings_backup_integrity_recovery.test.mjs
          git commit -m 'fix: restore checksummed settings backup integrity'
          git push origin HEAD:dev/phase2-recovery-work-2026-08-20
