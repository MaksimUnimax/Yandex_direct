name: ai-native-gensearch-proxy-development

on:
  push:
    branches:
      - ai-native/gensearch-proxy-validation-2026-08-27
    paths:
      - .github/workflows/ai-native-gensearch-proxy-dev.yml
      - extension/src/**
      - extension/tests/**

permissions:
  contents: read

jobs:
  protocol-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: GenSearch changed syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check extension/src/shared/search_protocol.js
          node --check extension/src/shared/policy_model.js
          node --check extension/tests/gensearch_search_protocol.test.mjs
      - name: Ordinary Search compatibility contract
        if: always()
        shell: bash
        run: node --test --test-name-pattern='ordinary' extension/tests/gensearch_search_protocol.test.mjs
      - name: GenSearch command and request contract
        if: always()
        shell: bash
        run: node --test --test-name-pattern='genSearch' extension/tests/gensearch_search_protocol.test.mjs
      - name: GenSearch response provenance contract
        if: always()
        shell: bash
        run: node --test --test-name-pattern='GenSearch response' extension/tests/gensearch_search_protocol.test.mjs
      - name: GenSearch policy contract
        if: always()
        shell: bash
        run: node --test --test-name-pattern='Search policy' extension/tests/gensearch_search_protocol.test.mjs
      - name: Five-service registry contract
        if: always()
        shell: bash
        run: node --test --test-name-pattern='sixth service' extension/tests/gensearch_search_protocol.test.mjs
      - name: Focused GenSearch protocol gate
        if: always()
        shell: bash
        run: node --test extension/tests/gensearch_search_protocol.test.mjs
      - name: Existing Node regression suite
        if: always()
        shell: bash
        run: node --test extension/tests/*.test.mjs
