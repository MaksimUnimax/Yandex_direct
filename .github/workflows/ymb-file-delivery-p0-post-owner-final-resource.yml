name: YMB P0 Post-Owner Final Chrome Resource Gate

on:
  push:
    branches: [hotfix/ymb-file-delivery-p0-2026-09-14]
    paths:
      - .github/workflows/ymb-file-delivery-p0-post-owner-final-resource.yml
      - extension/tests/wip/YMB_ASYNC_PATCH_B_2026-09-12/qa/p0_owner_live_harness_adapt.py
      - extension/tests/wip/YMB_ASYNC_PATCH_B_2026-09-12/P0_FILE_DELIVERY_REAL_CHROME_V2_2026-09-14.mjs
      - extension/src/file_delivery_content.js
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PUPPETEER_SKIP_CHROME_HEADLESS_SHELL_DOWNLOAD: 'true'
  PUPPETEER_SKIP_FIREFOX_DOWNLOAD: 'true'
  EXPECTED_PRODUCT_TREE: e89530bfd1b6f91deada50e216d6ce0b127cffb38865402a0af4848b51c9eafa

jobs:
  resource:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: ymb-b17-pause-internal-evidence
          run-id: 34699125356
          github-token: ${{ github.token }}
          path: frozen-b17

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Prepare exact patched source and semantically current Chrome harnesses
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,subprocess,sys
          H=lambda b:hashlib.sha256(b).hexdigest();r=Path('extension/src')
          files=sorted(p for p in r.rglob('*') if p.is_file());tree=H(''.join(H(p.read_bytes())+'  '+p.relative_to(r).as_posix()+'\n' for p in files).encode());count=len(files)
          assert tree==os.environ['EXPECTED_PRODUCT_TREE'],(tree,os.environ['EXPECTED_PRODUCT_TREE']);assert count==68
          m=json.loads((r/'manifest.json').read_text());assert m['version']=='0.1.6'
          q=Path(os.environ['RUNNER_TEMP'])/'p0-final-resource-tests';q.mkdir()
          old_b17='b20b74351d95becd67f32994e3e00899e9208b8c32c778a306f73f6703bfe508';old_b19='b87246c1377cda57cb9135f92814ec6885a1b607a9539be3a27bbc2fb1918b86';guard='assert.equal(rows.length,67);'
          for name in ['b15_browser_qualification.mjs','b15_browser_faults.mjs']:
            s=Path('frozen-b17/tests',name).read_text();assert s.count(old_b17)==1;assert s.count(guard)==1;(q/name).write_text(s.replace(old_b17,tree).replace(guard,f'assert.equal(rows.length,{count});'))
          b17=q/'b17_browser_b19.mjs'
          subprocess.run([sys.executable,'extension/tests/wip/YMB_ASYNC_PATCH_B_2026-09-12/qa/b19_resource_browser_adapt.py','frozen-b17/tests/b17_browser.mjs',str(b17)],check=True,stdout=open(Path(os.environ['RUNNER_TEMP'])/'B17_BASE_ADAPT.json','w'))
          s=b17.read_text();assert s.count(old_b19)==1;assert s.count(guard)==1;assert s.count('__YMB_FILE_DELIVERY_CONTENT_V2__')>=1
          b17.write_text(s.replace(old_b19,tree).replace(guard,f'assert.equal(rows.length,{count});').replace('__YMB_FILE_DELIVERY_CONTENT_V2__','__YMB_FILE_DELIVERY_CONTENT_V4__'))
          fx=Path('frozen-b17/tests/b15_fixture.html').read_text();old="Q.sends.push({text:composer.value,files:Q.files.map(f=>({...f}))});composer.value='';";new="const sent={text:composer.value,files:Q.files.map(f=>({...f}))};Q.sends.push(sent);const turn=document.createElement('article');turn.setAttribute('data-testid','conversation-turn-'+Q.sends.length);turn.setAttribute('data-message-id','fixture-user-'+Q.sends.length);const user=document.createElement('div');user.setAttribute('data-message-author-role','user');user.textContent=sent.text+' '+sent.files.map(f=>f.name).join(' ');turn.append(user);document.getElementById('conversation-root').append(turn);composer.value='';";assert fx.count(old)==1;(q/'b15_fixture.html').write_text(fx.replace(old,new))
          subprocess.run([sys.executable,'extension/tests/wip/YMB_ASYNC_PATCH_B_2026-09-12/qa/p0_owner_live_harness_adapt.py',str(q/'b15_browser_qualification.mjs'),str(b17)],check=True,stdout=open(Path(os.environ['RUNNER_TEMP'])/'P0_OWNER_SEMANTIC_ADAPT.json','w'))
          d=Path(os.environ['RUNNER_TEMP'])/'p0-final-puppeteer';d.mkdir();lock=Path('frozen-b17/package-lock.json').read_bytes();(d/'package-lock.json').write_bytes(lock);j=json.loads(lock);(d/'package.json').write_text(json.dumps({'name':j['name'],'private':True,'dependencies':j['packages']['']['dependencies']}))
          e=Path(os.environ['RUNNER_TEMP'])/'p0-final-resource-evidence';e.mkdir();(e/'IDENTITY.json').write_text(json.dumps({'head':os.environ['GITHUB_SHA'],'tree':tree,'files':count,'version':m['version'],'product_change_from_qa_adaptation':False,'semantic_contract':'preexisting draft durable-pauses; clearing does not resume; explicit Resume required'},indent=2)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as env:env.write(f'YMB_BROWSER_CANDIDATE={r.resolve()}\nYMB_PPTR_HOME={d}\nYMB_RESOURCE_TESTS={q}\nYMB_RESOURCE_EVIDENCE={e}\nYMB_CHATGPT_FIXTURE={(q/"b15_fixture.html").resolve()}\n')
          print(tree,count)
          PY

      - name: Syntax and locked browser dependency
        shell: bash
        run: |
          set -euo pipefail
          for f in "$YMB_RESOURCE_TESTS"/*.mjs extension/tests/wip/YMB_ASYNC_PATCH_B_2026-09-12/P0_FILE_DELIVERY_REAL_CHROME_V2_2026-09-14.mjs; do node --check "$f"; done
          npm ci --prefix "$YMB_PPTR_HOME" --no-audit --no-fund > "$YMB_RESOURCE_EVIDENCE/npm.stdout" 2> "$YMB_RESOURCE_EVIDENCE/npm.stderr"

      - name: Full resource contour
        continue-on-error: true
        env:
          YMB_BROWSER_EVIDENCE: ${{ runner.temp }}/p0-final-resource-evidence/qualification
        run: mkdir -p "$YMB_BROWSER_EVIDENCE" && xvfb-run -a node "$YMB_RESOURCE_TESTS/b15_browser_qualification.mjs" > "$YMB_BROWSER_EVIDENCE/run.stdout" 2> "$YMB_BROWSER_EVIDENCE/run.stderr"

      - name: Fault contour
        continue-on-error: true
        env:
          YMB_BROWSER_EVIDENCE: ${{ runner.temp }}/p0-final-resource-evidence/faults
        run: mkdir -p "$YMB_BROWSER_EVIDENCE" && xvfb-run -a node "$YMB_RESOURCE_TESTS/b15_browser_faults.mjs" > "$YMB_BROWSER_EVIDENCE/run.stdout" 2> "$YMB_BROWSER_EVIDENCE/run.stderr"

      - name: Pause lifecycle contour
        continue-on-error: true
        env:
          YMB_BROWSER_EVIDENCE: ${{ runner.temp }}/p0-final-resource-evidence/pause
        run: mkdir -p "$YMB_BROWSER_EVIDENCE" && xvfb-run -a node "$YMB_RESOURCE_TESTS/b17_browser_b19.mjs" > "$YMB_BROWSER_EVIDENCE/run.stdout" 2> "$YMB_BROWSER_EVIDENCE/run.stderr"

      - name: Exact owner failure reproduction contour
        continue-on-error: true
        env:
          YMB_BROWSER_EVIDENCE: ${{ runner.temp }}/p0-final-resource-evidence/p0_owner
        run: mkdir -p "$YMB_BROWSER_EVIDENCE" && xvfb-run -a node extension/tests/wip/YMB_ASYNC_PATCH_B_2026-09-12/P0_FILE_DELIVERY_REAL_CHROME_V2_2026-09-14.mjs > "$YMB_BROWSER_EVIDENCE/run.stdout" 2> "$YMB_BROWSER_EVIDENCE/run.stderr"

      - name: Enforce final post-owner resource gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/p0-final-resource-publish";mkdir -p "$O";cp -a "$YMB_RESOURCE_EVIDENCE"/. "$O/" || true;cp "$YMB_RESOURCE_TESTS"/*.mjs "$O/" || true;cp "$RUNNER_TEMP/P0_OWNER_SEMANTIC_ADAPT.json" "$O/" || true
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          o=Path(os.environ['RUNNER_TEMP'])/'p0-final-resource-publish';groups={};fail=[];remaining=[];peak=0
          required_owner={'internal_protocol_never_enters_real_chrome_composer','preexisting_user_draft_before_claim_durably_pauses_without_resurrection','user_draft_conflict_after_attachment_ready_durably_pauses_without_reinsert','p0_real_chrome_candidate_identity','owned_browser_cleanup'}
          for name in ['qualification','faults','pause','p0_owner']:
            p=o/name/'browser.jsonl';rows=[json.loads(x) for x in p.read_text().splitlines()] if p.exists() else [];bad=[{'case':r.get('case'),'status':r.get('status'),'error':r.get('error')} for r in rows if str(r.get('status','')).startswith('FAIL')];clean=next((r for r in rows if r.get('case')=='owned_browser_cleanup'),{});groups[name]={'cases':len(rows),'failures':bad,'present':sorted({r.get('case') for r in rows if r.get('case')}),'remaining':clean.get('remaining') or [],'peak_owned_rss_kib':clean.get('peak_owned_rss_kib')};fail += [{'group':name,**x} for x in bad];remaining += clean.get('remaining') or [];peak=max(peak,int(clean.get('peak_owned_rss_kib') or 0))
          present=set(groups['p0_owner']['present']);result={'schema_version':1,'head':os.environ['GITHUB_SHA'],'product_tree':os.environ['EXPECTED_PRODUCT_TREE'],'product_files':68,'version':'0.1.6','real_provider_calls':0,'semantic_contract':'preexisting draft durable-pauses; clear stays paused; explicit Resume required','groups':groups,'failures':fail,'missing_owner_cases':sorted(required_owner-present),'remaining_processes':remaining,'peak_owned_rss_kib':peak,'emergency_limit_kib':2097152}
          result['pass']=all(g['cases']>0 and not g['failures'] and not g['remaining'] for g in groups.values()) and not result['missing_owner_cases'] and peak<2097152
          (o/'RESULT.json').write_text(json.dumps(result,indent=2)+'\n');(o/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.relative_to(o).as_posix()+'\n' for p in sorted(o.rglob('*')) if p.is_file() and p.name!='SHA256SUMS'));print(json.dumps(result,indent=2));assert result['pass']
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ymb-p0-post-owner-final-resource
          path: ${{ runner.temp }}/p0-final-resource-publish/
          retention-days: 90
          if-no-files-found: error
