name: Reconcile runbook Manual ON order

on:
  push:
    branches:
      - automation/runbook-manual-on-order-reconcile-2026-08-26

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile exact stale block
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach a8c2fd94847669857ae6d120001cacdcf72e1779
          python - <<'PY'
          from pathlib import Path
          p=Path('extension/docs/CODEX_QA_ARTIFACT_TRANSPORT_AND_GATE_RUNBOOK.md')
          s=p.read_text()
          old='''real popup Manual ON\n→ WS_SET_MANUAL_MODE(true) committed to worker first\n→ WS_APPLY_MANUAL_MODE(true) to content second\n→ worker remains ON\n→ content remains ON\n→ exactly one external Yandex action exists and is enabled\n→ ordinary resync/mutation does not revert it OFF\n→ popup close/reopen still ON\n→ real popup OFF removes action\n→ second real popup ON remains armed after resync'''
          new='''real popup Manual ON\n→ WS_APPLY_MANUAL_MODE(true) content acknowledgement first\n→ WS_SET_MANUAL_MODE(true) worker hard-gate authorization second\n→ worker remains ON\n→ content remains ON\n→ exactly one external Yandex action exists and is enabled\n→ ordinary resync/mutation does not revert it OFF\n→ popup close/reopen still ON\n→ real popup OFF commits worker OFF before content cleanup removes the action\n→ second real popup ON remains armed after resync'''
          if s.count(old)!=1:
              raise SystemExit(f'expected exactly one stale transaction block, found {s.count(old)}')
          s=s.replace(old,new)
          s=s.replace('- bypassing popup→worker→content ordering.','- bypassing the governed popup Manual transaction ordering.')
          p.write_text(s)
          PY
          git diff --check
          git diff --exit-code -- . ':!extension/docs/CODEX_QA_ARTIFACT_TRANSPORT_AND_GATE_RUNBOOK.md' || { echo unexpected files; exit 1; }
          grep -F 'WS_APPLY_MANUAL_MODE(true) content acknowledgement first' extension/docs/CODEX_QA_ARTIFACT_TRANSPORT_AND_GATE_RUNBOOK.md
          ! grep -F 'WS_SET_MANUAL_MODE(true) committed to worker first' extension/docs/CODEX_QA_ARTIFACT_TRANSPORT_AND_GATE_RUNBOOK.md
      - name: Commit to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT governance automation"
          git config user.email "actions@users.noreply.github.com"
          git add extension/docs/CODEX_QA_ARTIFACT_TRANSPORT_AND_GATE_RUNBOOK.md
          git commit -m "docs: reconcile runbook Manual ON transaction order"
          test "$(git rev-parse HEAD^)" = "a8c2fd94847669857ae6d120001cacdcf72e1779"
          git push origin HEAD:refs/heads/main
