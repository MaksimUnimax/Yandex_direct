name: MK02 Phase 7 materialize exact client binaries

on:
  push:
    paths:
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/MINI_KWORKS_PRODUCTIZATION/MK02_SEMANTIC_CORE_ARCHITECTURE_DEV_TZ/tests/OKNO_MSK/_phase7_transport/READY'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode and verify exact artifacts
        shell: bash
        run: |
          set -euo pipefail
          BASE='extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/MINI_KWORKS_PRODUCTIZATION/MK02_SEMANTIC_CORE_ARCHITECTURE_DEV_TZ/tests/OKNO_MSK'
          T="$BASE/_phase7_transport"
          OUT="$BASE/CLIENT_DELIVERY_PHASE_7"
          mkdir -p "$OUT"
          cat "$T"/analytic.part* | base64 -d > "$OUT/RESEARCH_AND_ARCHITECTURE_REPORT_OKNO_MSK_2026-09-10.pdf"
          cat "$T"/tz.part* | base64 -d > "$OUT/SITE_IMPROVEMENT_TZ_OKNO_MSK_2026-09-10.pdf"
          cp "$BASE/OKNO_MSK_MK02_CLIENT_CANDIDATE_2026-09-10.xlsx" "$OUT/SEMANTIC_CORE_AND_SEO_STRUCTURE_OKNO_MSK_2026-09-10.xlsx"
          test "$(git hash-object "$OUT/RESEARCH_AND_ARCHITECTURE_REPORT_OKNO_MSK_2026-09-10.pdf")" = '49a1d4d9112cc76e57ea6ab63db72fa322f4ec33'
          test "$(git hash-object "$OUT/SITE_IMPROVEMENT_TZ_OKNO_MSK_2026-09-10.pdf")" = '7aedd3d74cae8bed3ac2fe43aab5e716536d3d9d'
          test "$(git hash-object "$OUT/SEMANTIC_CORE_AND_SEO_STRUCTURE_OKNO_MSK_2026-09-10.xlsx")" = 'd74432730f33ed56bb0809e90028d1db5fbe36b7'
      - name: Commit exact client files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/MINI_KWORKS_PRODUCTIZATION/MK02_SEMANTIC_CORE_ARCHITECTURE_DEV_TZ/tests/OKNO_MSK/CLIENT_DELIVERY_PHASE_7
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs(mk02): materialize phase 7 client package binaries'
          git push
