name: TEMP KW001 Step10 Blind Package

on:
  push:
    paths:
      - '.github/workflows/_tmp_kw001_step10_blind_package.yml'
      - '.github/scripts/_tmp_build_kw001_step10_blind_package.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify blind package
        run: python .github/scripts/_tmp_build_kw001_step10_blind_package.py
      - name: Upload blind package
        uses: actions/upload-artifact@v4
        with:
          name: STEP10_BLIND_INDEPENDENT_INPUT_2026-08-30
          path: STEP10_BLIND_INDEPENDENT_INPUT_2026-08-30.zip
          retention-days: 1
          if-no-files-found: error
