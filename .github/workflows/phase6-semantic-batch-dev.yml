name: phase6-semantic-batch-development

on:
  push:
    branches:
      - phase6/semantic-core-batch-orchestration-2026-08-27
    paths:
      - .github/workflows/phase6-semantic-batch-dev.yml
      - extension/src/**
      - extension/tests/**

permissions:
  contents: read

jobs:
  batch-model-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Phase 6 changed syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check extension/src/shared/provider_batch_job_model.js
          node --check extension/src/shared/wordstat_batch_protocol.js
          node --check extension/src/shared/wordstat_batch_runtime.js
          node --check extension/src/shared/wordstat_batch_transport.js
          node --check extension/src/shared/wordstat_batch_content_bridge.js
          node --check extension/src/wordstat_batch_worker_transport.js
          node --check extension/tests/provider_batch_job_model.test.mjs
          node --check extension/tests/wordstat_batch_protocol.test.mjs
          node --check extension/tests/wordstat_batch_runtime.test.mjs
          node --check extension/tests/wordstat_batch_policy_guard.test.mjs
          node --check extension/tests/wordstat_batch_transport.test.mjs
      - name: Phase 6 pure batch model contract
        shell: bash
        run: |
          set -euo pipefail
          node --test extension/tests/provider_batch_job_model.test.mjs
      - name: Existing Node regression suite
        shell: bash
        run: |
          set -euo pipefail
          node --test extension/tests/*.test.mjs
