name: phase2-focused-search
on:
  push:
    branches:
      - dev/phase2-recovery-work-2026-08-20
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  focused-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore browser source from verified transport
        shell: bash
        run: |
          set -euo pipefail
          root='extension/tests/.recovery'
          cat "$root"/content_script.part00.b64 \
              "$root"/content_script.part01.b64 \
              "$root"/content_script.part02.b64 \
              "$root"/content_script.part03.b64 \
              "$root"/content_script.part04.b64 \
              "$root"/content_script.part05.b64 > /tmp/content_script.b64
          base64 -d /tmp/content_script.b64 > extension/src/content_script.js
          test "$(wc -c < extension/src/content_script.js)" = '22055'
          test "$(sha256sum extension/src/content_script.js | awk '{print $1}')" = 'efd2a7bd359d9bc9ad75c34e4eb3d191a940c8b1a0454f98e86bdafb1f2604e7'
          echo BROWSER_SOURCE_IDENTITY_PASS
          if [ "${{ github.event_name }}" = 'push' ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add extension/src/content_script.js
            git rm "$root"/content_script.part*.b64
            git commit -m "dev: restore browser Search integration"
            git push origin HEAD:dev/phase2-recovery-work-2026-08-20
          fi
      - name: Search focused tests
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            extension/tests/search_protocol.test.mjs \
            extension/tests/search_registry.test.mjs \
            extension/tests/search_xml.test.mjs \
            extension/tests/search_worker_stage2.test.mjs \
            extension/tests/search_manual_worker.test.mjs \
            extension/tests/content_phase2_runtime.test.mjs
      - name: Syntax and JSON checks for restored source
        shell: bash
        run: |
          set -euo pipefail
          node --check extension/src/service_worker.js
          node --check extension/src/content_script.js
          node --check extension/src/shared/conversation_identity.js
          node --check extension/src/shared/manual_controls.js
          node --check extension/src/shared/block_command_discovery.js
          node --check extension/src/shared/run_context_model.js
          node --check extension/src/shared/composer_send.js
          node --check extension/src/shared/proven_writing_block_capture.js
          node --check extension/src/shared/search_protocol.js
          node --check extension/src/shared/search_xml.js
          node -e "JSON.parse(require('fs').readFileSync('extension/src/manifest.json','utf8')); JSON.parse(require('fs').readFileSync('extension/src/package.json','utf8'));"
