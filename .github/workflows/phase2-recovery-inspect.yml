name: phase2-recovery-inspect
on:
  push:
    branches:
      - dev/phase2-recovery-work-2026-08-20
  pull_request:
    branches:
      - main
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode patch and locate old/new blobs
        shell: bash
        run: |
          set -euo pipefail
          root='extension/tests/qa_transport/phase2-search-sync-v1'
          cat "$root"/patch.gz.b64.part00 "$root"/patch.gz.b64.part01 "$root"/patch.gz.b64.part02 "$root"/patch.gz.b64.part03 "$root"/patch.gz.b64.part04 > /tmp/combined.b64
          base64 -d /tmp/combined.b64 > /tmp/combined.patch.gz
          gzip -t /tmp/combined.patch.gz
          gzip -dc /tmp/combined.patch.gz > /tmp/combined.patch
          echo 'RAW:'
          sha256sum /tmp/combined.patch
          wc -c /tmp/combined.patch
          git fetch --all --tags --prune
          git cat-file --batch-all-objects --batch-check='%(objectname) %(objecttype) %(objectsize)' > /tmp/all-objects.txt
          echo 'PATCH BLOB PREFIX AVAILABILITY:'
          grep '^index ' /tmp/combined.patch | awk '{print $2}' | tr '.' '\n' | grep -E '^[0-9a-f]{7,40}$' | sort -u > /tmp/prefixes.txt
          while read -r p; do
            [ "$p" = "0000000" ] && continue
            matches=$(grep -E "^${p}[0-9a-f]* blob " /tmp/all-objects.txt || true)
            if [ -n "$matches" ]; then
              echo "FOUND $p $matches"
            else
              echo "MISSING $p"
            fi
          done < /tmp/prefixes.txt
          echo 'TOUCHED PATHS WITH INDEX:'
          awk '/^diff --git / {path=$3; sub(/^a\//,"",path)} /^index / {print path, $0}' /tmp/combined.patch
          cp /tmp/combined.patch "$root/decoded-combined.patch"
          cp /tmp/combined.patch.gz "$root/decoded-combined.patch.gz"
      - name: Upload inspection files
        uses: actions/upload-artifact@v4
        with:
          name: phase2-decoded-combined-patch
          path: |
            extension/tests/qa_transport/phase2-search-sync-v1/decoded-combined.patch
            extension/tests/qa_transport/phase2-search-sync-v1/decoded-combined.patch.gz
