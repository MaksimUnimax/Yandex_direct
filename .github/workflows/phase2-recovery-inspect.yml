name: phase2-recovery-inspect
on:
  push:
    branches:
      - dev/phase2-recovery-work-2026-08-20
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/e13a-exact-reconstruction-v3
          fetch-depth: 1
      - name: Export preserved Phase 1 tree
        uses: actions/upload-artifact@v4
        with:
          name: phase1-preserved-inputs
          path: |
            extension/src
            extension/tests
          compression-level: 0
