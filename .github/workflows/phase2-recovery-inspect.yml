name: phase2-recovery-inspect
on:
  push:
    branches:
      - dev/phase2-recovery-work-2026-08-20
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/phase2-search-foundation-2026-08-19
          fetch-depth: 1
      - name: Export development inputs
        uses: actions/upload-artifact@v4
        with:
          name: phase2-development-inputs
          path: |
            extension/src
            extension/tests
            extension/docs
          compression-level: 0
