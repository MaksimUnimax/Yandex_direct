name: phase2-focused-search
on:
  push:
    branches:
      - dev/phase2-recovery-work-2026-08-20
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  focused-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore focused assertions from preserved Search contract
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cat > extension/tests/search_protocol.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import vm from 'node:vm';
          import { fileURLToPath } from 'node:url';
          const root=path.resolve(path.dirname(fileURLToPath(import.meta.url)),'../src');
          const c={console,TextDecoder,Uint8Array,Buffer}; c.globalThis=c; vm.createContext(c);
          for(const f of ['product.js','search_xml.js','search_protocol.js']) vm.runInContext(fs.readFileSync(path.join(root,'shared',f),'utf8'),c);
          const P=c.SearchProtocol;
          test('SEARCH_API_V1 defaults and request mapping',()=>{
            const cmd=P.parseCommand('SEARCH_API_V1\n{"queryText":"оберег в машину"}');
            assert.equal(cmd.method,'search'); assert.equal(cmd.searchType,'SEARCH_TYPE_RU'); assert.equal(cmd.region,'225'); assert.equal(cmd.page,0); assert.equal(cmd.groupsOnPage,10); assert.equal(cmd.docsInGroup,1); assert.equal(cmd.maxPassages,4); assert.equal(cmd.l10n,'LOCALIZATION_RU');
            const req=P.buildRequest(cmd,'folder');
            assert.equal(req.url,'https://searchapi.api.cloud.yandex.net/v2/web/search');
            assert.equal(req.body.folderId,'folder'); assert.equal(req.body.responseFormat,'FORMAT_XML'); assert.equal(req.body.query.queryText,'оберег в машину'); assert.equal(req.body.groupSpec.groupsOnPage,'10');
          });
          test('Search validation boundaries',()=>{
            assert.equal(P.normalizeCommand({queryText:'x'.repeat(400)}).queryText.length,400);
            assert.throws(()=>P.normalizeCommand({queryText:'x'.repeat(401)}),e=>e.code==='FIELD_TOO_LONG');
            assert.equal(P.normalizeCommand({queryText:Array(40).fill('x').join(' ')}).queryText.split(/\s+/).length,40);
            assert.throws(()=>P.normalizeCommand({queryText:Array(41).fill('x').join(' ')}),e=>e.code==='QUERY_TOO_MANY_WORDS');
            for(const [field,value] of [['groupsOnPage',101],['docsInGroup',4],['maxPassages',6],['page',-1]]) assert.throws(()=>P.normalizeCommand({queryText:'x',[field]:value}),e=>e.code==='INVALID_FIELD');
            assert.throws(()=>P.normalizeCommand({queryText:'x',unknown:1}),e=>e.code==='UNSUPPORTED_FIELD');
            assert.throws(()=>P.normalizeCommand({queryText:'x',searchType:'SEARCH_TYPE_COM',region:'225'}),e=>e.code==='REGION_NOT_SUPPORTED');
            assert.throws(()=>P.normalizeCommand({queryText:'x',searchType:'SEARCH_TYPE_TR',l10n:'LOCALIZATION_RU'}),e=>e.code==='LOCALIZATION_NOT_SUPPORTED');
          });
          test('Search result envelope truth fields',()=>{
            const cmd=P.normalizeCommand({queryText:'x'});
            const env=P.buildResultEnvelope({requestId:'r1',command:cmd,httpStatus:200,result:{results:[],result_count:0,response_format:'FORMAT_XML'},elapsedMs:3,metadata:{request_executed:true,automatic_retry:false}});
            assert.equal(env.service,'search'); assert.equal(env.status,'OK'); assert.equal(env.request_executed,true); assert.equal(env.automatic_retry,false); assert.match(P.formatResultEnvelope(env),/^SEARCH_RESULT_V1\n/);
          });
          EOF
          cat > extension/tests/search_xml.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import vm from 'node:vm';
          import { fileURLToPath } from 'node:url';
          const root=path.resolve(path.dirname(fileURLToPath(import.meta.url)),'../src');
          const c={console,TextDecoder,Uint8Array,Buffer,atob:s=>Buffer.from(s,'base64').toString('binary')}; c.globalThis=c; vm.createContext(c); vm.runInContext(fs.readFileSync(path.join(root,'shared/search_xml.js'),'utf8'),c);
          const X=c.YMBSearchXml;
          test('Search XML normalization handles entities highlights passages and optional fields',()=>{
            const xml=`<?xml version="1.0"?><yandexsearch><response><results><grouping><group><doc><url>https://example.test/a?x=1&amp;y=2</url><domain>example.test</domain><title>Лучший <hlword>оберег</hlword></title><modtime>20260819T120000</modtime><passages><passage>Первый &amp; важный</passage><passage>Второй <hlword>фрагмент</hlword></passage></passages></doc><doc><url>https://example.test/b</url></doc></group></grouping></results></response></yandexsearch>`;
            const out=X.normalizeXml(xml); assert.equal(out.result_count,2); assert.equal(out.results[0].rank,1); assert.equal(out.results[0].url,'https://example.test/a?x=1&y=2'); assert.equal(out.results[0].title,'Лучший оберег'); assert.equal(out.results[0].snippet,'Первый & важный … Второй фрагмент'); assert.equal(out.results[1].title,null); assert.equal(out.results[1].snippet,null);
          });
          test('Base64 UTF-8 decode and malformed input fail closed',()=>{
            const xml='<response><doc><url>https://пример.рф/</url></doc></response>'; const b64=Buffer.from(xml,'utf8').toString('base64'); assert.equal(X.normalizeBase64RawData(b64).results[0].url,'https://пример.рф/');
            assert.throws(()=>X.decodeBase64Utf8('%%%'),e=>e.code==='INVALID_SEARCH_BASE64');
            assert.throws(()=>X.normalizeXml('<response><doc></response>'),e=>e.code==='INVALID_SEARCH_XML');
          });
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path('extension/tests/search_worker_stage2.test.mjs')
          s=p.read_text(encoding='utf-8')
          old="result.report_envelope.result.documents[0].url"
          new="result.report_envelope.result.results[0].url"
          if old not in s:
              raise SystemExit('expected stale worker assertion not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          if ! git diff --quiet -- extension/tests/search_protocol.test.mjs extension/tests/search_xml.test.mjs extension/tests/search_worker_stage2.test.mjs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add extension/tests/search_protocol.test.mjs extension/tests/search_xml.test.mjs extension/tests/search_worker_stage2.test.mjs
            git commit -m "test: align Search checks with preserved contract"
            git push origin HEAD:dev/phase2-recovery-work-2026-08-20
          fi
      - name: Search focused tests
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            extension/tests/search_protocol.test.mjs \
            extension/tests/search_registry.test.mjs \
            extension/tests/search_xml.test.mjs \
            extension/tests/search_worker_stage2.test.mjs
      - name: Syntax and JSON checks for restored source
        shell: bash
        run: |
          set -euo pipefail
          node --check extension/src/service_worker.js
          node --check extension/src/shared/conversation_identity.js
          node --check extension/src/shared/manual_controls.js
          node --check extension/src/shared/block_command_discovery.js
          node --check extension/src/shared/run_context_model.js
          node --check extension/src/shared/composer_send.js
          node --check extension/src/shared/proven_writing_block_capture.js
          node --check extension/src/shared/search_protocol.js
          node --check extension/src/shared/search_xml.js
          node -e "JSON.parse(require('fs').readFileSync('extension/src/manifest.json','utf8')); JSON.parse(require('fs').readFileSync('extension/src/package.json','utf8'));"
