name: phase2-recovery-inspect
on:
  push:
    branches:
      - dev/phase2-recovery-work-2026-08-20
  pull_request:
    branches:
      - main
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Decode preserved combined patch
        shell: bash
        run: |
          set -euo pipefail
          root='extension/tests/qa_transport/phase2-search-sync-v1'
          cat "$root"/patch.gz.b64.part00 "$root"/patch.gz.b64.part01 "$root"/patch.gz.b64.part02 "$root"/patch.gz.b64.part03 "$root"/patch.gz.b64.part04 > /tmp/combined.b64
          base64 -d /tmp/combined.b64 > /tmp/combined.patch.gz
          gzip -t /tmp/combined.patch.gz
          gzip -dc /tmp/combined.patch.gz > /tmp/combined.patch
          echo 'B64:'
          sha256sum /tmp/combined.b64
          wc -c /tmp/combined.b64
          echo 'GZIP:'
          sha256sum /tmp/combined.patch.gz
          wc -c /tmp/combined.patch.gz
          echo 'RAW:'
          sha256sum /tmp/combined.patch
          wc -c /tmp/combined.patch
          echo 'PATCH HEAD:'
          head -n 40 /tmp/combined.patch
          echo 'TOUCHED PATHS:'
          grep '^diff --git ' /tmp/combined.patch || true
          cp /tmp/combined.patch extension/tests/qa_transport/phase2-search-sync-v1/decoded-combined.patch
          cp /tmp/combined.patch.gz extension/tests/qa_transport/phase2-search-sync-v1/decoded-combined.patch.gz
      - name: Upload decoded patch
        uses: actions/upload-artifact@v4
        with:
          name: phase2-decoded-combined-patch
          path: |
            extension/tests/qa_transport/phase2-search-sync-v1/decoded-combined.patch
            extension/tests/qa_transport/phase2-search-sync-v1/decoded-combined.patch.gz
