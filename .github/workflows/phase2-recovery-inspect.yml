name: phase2-recovery-inspect
on:
  push:
    branches:
      - dev/phase2-recovery-work-2026-08-20
  pull_request:
    branches:
      - main
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Search full repository history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --tags --prune
          echo 'COMMITS MENTIONING E13A OR EXACT ZIP:'
          git log --all --oneline --decorate --grep='e13a\|exact.*zip\|zip.*exact\|artifact transport' -i || true
          echo 'HISTORICAL PATHS MATCHING ZIP/B64/CANDIDATE:'
          git log --all --name-only --pretty=format: | sort -u | grep -Ei '(zip|candidate|artifact|transport).*(b64|base64|zip)|\.(zip|b64)$' || true
          echo 'ALL HISTORICAL QA TRANSPORT PATHS:'
          git log --all --name-only --pretty=format: | sort -u | grep -E 'qa_transport|snapshot-base64' || true
          echo 'DELETED/MODIFIED TRANSPORT FILE HISTORY:'
          git log --all --name-status --pretty='format:COMMIT %H %s' -- 'extension/tests/qa_transport/**' | head -n 1200 || true
          root='extension/tests/qa_transport/phase2-search-sync-v1'
          cat "$root"/patch.gz.b64.part00 "$root"/patch.gz.b64.part01 "$root"/patch.gz.b64.part02 "$root"/patch.gz.b64.part03 "$root"/patch.gz.b64.part04 > /tmp/combined.b64
          base64 -d /tmp/combined.b64 > /tmp/combined.patch.gz
          gzip -dc /tmp/combined.patch.gz > /tmp/combined.patch
          sha256sum /tmp/combined.patch
          wc -c /tmp/combined.patch
          cp /tmp/combined.patch "$root/decoded-combined.patch"
      - name: Upload decoded patch
        uses: actions/upload-artifact@v4
        with:
          name: phase2-decoded-combined-patch
          path: extension/tests/qa_transport/phase2-search-sync-v1/decoded-combined.patch
