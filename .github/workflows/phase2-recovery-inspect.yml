name: phase2-focused-search
on:
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  focused-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/phase2-recovery-work-2026-08-20
      - name: Apply durable content error recovery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/phase2-content-error-delivery-fix.yml').read_text(encoding='utf-8').splitlines()
          marker = next(i for i, line in enumerate(source) if line.strip() == 'run: |')
          body = [line[10:] if line.startswith('          ') else line for line in source[marker + 1:]]
          assertion = next(i for i, line in enumerate(body) if "auto commit anchor not found" in line)
          block_start = max(i for i in range(assertion) if body[i].startswith("old = '''"))
          block_end = assertion + 1
          assert body[block_end].strip() == 't = t.replace(old, new, 1)'
          replacement = [
              "old = '''        setStatus(STATUS_KEYS.OPERATION, \"Яндекс: не удалось зафиксировать отправку; повтор заблокирован.\", \"error\", 9000);\\n        return;'''",
              "new = '''        setStatus(STATUS_KEYS.OPERATION, \"Яндекс: не удалось зафиксировать отправку; повтор заблокирован.\", \"error\", 9000);\\n        queueContentError({ code: \"DELIVERY_COMMIT_REJECTED\", message: \"Worker не подтвердил фиксацию Send перед автоотправкой.\", stage: \"DELIVERY_COMMIT\", channel: contentErrorChannel(entry), service: activeService, runId: entry.run_id || null, requestExecuted: false, recoverable: true, autorunContinues: entry.type === \"autorun\" });\\n        return;'''",
              "assert old in t, 'auto commit status anchor not found'",
              "t = t.replace(old, new, 1)"
          ]
          body[block_start:block_end + 1] = replacement
          Path('/tmp/content-error-repair.sh').write_text('\n'.join(body) + '\n', encoding='utf-8')
          PY
          bash /tmp/content-error-repair.sh
      - name: Search integration focused tests
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            extension/tests/search_protocol.test.mjs \
            extension/tests/search_registry.test.mjs \
            extension/tests/search_xml.test.mjs \
            extension/tests/search_worker_stage2.test.mjs \
            extension/tests/search_manual_worker.test.mjs \
            extension/tests/manual_block_sequence_recovery.test.mjs \
            extension/tests/manual_delivery_lifecycle_recovery.test.mjs \
            extension/tests/content_phase2_runtime.test.mjs \
            extension/tests/content_error_delivery_recovery.test.mjs \
            extension/tests/popup_phase2_runtime.test.mjs \
            extension/tests/autorun_recovery.test.mjs \
            extension/tests/autorun_transport_retry_recovery.test.mjs \
            extension/tests/conversation_fences_recovery.test.mjs \
            extension/tests/start_prompt_and_prefix_recovery.test.mjs \
            extension/tests/wordstat_core_recovery.test.mjs \
            extension/tests/settings_security_recovery.test.mjs \
            extension/tests/settings_backup_integrity_recovery.test.mjs \
            extension/tests/popup_error_boundary_recovery.test.mjs \
            extension/tests/permission_scope_recovery.test.mjs \
            extension/tests/legacy_profiles_recovery.test.mjs \
            extension/tests/diagnostics_popup_recovery.test.mjs \
            extension/tests/button_picker_recovery.test.mjs \
            extension/tests/binding_recovery.test.mjs \
            extension/tests/manual_off_safety_recovery.test.mjs
      - name: Syntax and JSON checks
        shell: bash
        run: |
          set -euo pipefail
          for f in extension/src/*.js extension/src/shared/*.js; do node --check "$f"; done
          node -e "for (const f of ['extension/src/manifest.json','extension/src/package.json']) JSON.parse(require('fs').readFileSync(f,'utf8'));"
