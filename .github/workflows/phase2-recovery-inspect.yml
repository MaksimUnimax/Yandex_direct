name: phase2-popup-recovery-bootstrap
on:
  push:
    branches:
      - dev/phase2-recovery-work-2026-08-20
permissions:
  contents: write
jobs:
  restore-popup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified popup recovery and test before commit
        shell: bash
        run: |
          set -euo pipefail
          transport='extension/tests/.recovery/popup-recovery.patch.gz.b64'
          test -f "$transport"
          test "$(sha256sum "$transport" | awk '{print $1}')" = '9f9b3bc8120df0ef04446762db138fbffe8d08334c85679aec22eb98dabe4074'
          base64 -d "$transport" > /tmp/popup-recovery.patch.gz
          test "$(sha256sum /tmp/popup-recovery.patch.gz | awk '{print $1}')" = 'db62432d19021885fa747e6df50ac16a85995d3711d7b32cc7c77ed67ed64424'
          gzip -t /tmp/popup-recovery.patch.gz
          gzip -dc /tmp/popup-recovery.patch.gz > /tmp/popup-recovery.patch
          test "$(sha256sum /tmp/popup-recovery.patch | awk '{print $1}')" = '214c475681e79dfeeb760868c52ba1692e79ce684969275aa79fb8595193011a'
          git apply --check --exclude='.github/workflows/phase2-recovery-inspect.yml' /tmp/popup-recovery.patch
          git apply --exclude='.github/workflows/phase2-recovery-inspect.yml' /tmp/popup-recovery.patch
          node --test \
            extension/tests/search_protocol.test.mjs \
            extension/tests/search_registry.test.mjs \
            extension/tests/search_xml.test.mjs \
            extension/tests/search_worker_stage2.test.mjs \
            extension/tests/search_manual_worker.test.mjs \
            extension/tests/content_phase2_runtime.test.mjs \
            extension/tests/popup_phase2_runtime.test.mjs
          for f in extension/src/*.js extension/src/shared/*.js; do node --check "$f"; done
          node -e "for (const f of ['extension/src/manifest.json','extension/src/package.json']) JSON.parse(require('fs').readFileSync(f,'utf8'));"
          cat > .github/workflows/phase2-recovery-inspect.yml <<'YML'
          name: phase2-focused-search
          on:
            push:
              branches:
                - dev/phase2-recovery-work-2026-08-20
            pull_request:
              branches:
                - main
          permissions:
            contents: read
          jobs:
            focused-search:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Search, browser and popup focused tests
                  shell: bash
                  run: |
                    set -euo pipefail
                    node --test \
                      extension/tests/search_protocol.test.mjs \
                      extension/tests/search_registry.test.mjs \
                      extension/tests/search_xml.test.mjs \
                      extension/tests/search_worker_stage2.test.mjs \
                      extension/tests/search_manual_worker.test.mjs \
                      extension/tests/content_phase2_runtime.test.mjs \
                      extension/tests/popup_phase2_runtime.test.mjs
                - name: Syntax and JSON checks for restored source
                  shell: bash
                  run: |
                    set -euo pipefail
                    for f in extension/src/*.js extension/src/shared/*.js; do node --check "$f"; done
                    node -e "for (const f of ['extension/src/manifest.json','extension/src/package.json']) JSON.parse(require('fs').readFileSync(f,'utf8'));"
                - name: Export exact saved development tree
                  uses: actions/upload-artifact@v4
                  with:
                    name: phase2-saved-development-tree
                    path: |
                      extension/src
                      extension/tests/search_protocol.test.mjs
                      extension/tests/search_registry.test.mjs
                      extension/tests/search_xml.test.mjs
                      extension/tests/search_worker_stage2.test.mjs
                      extension/tests/search_manual_worker.test.mjs
                      extension/tests/content_phase2_runtime.test.mjs
                      extension/tests/popup_phase2_runtime.test.mjs
                    compression-level: 0
                    if-no-files-found: error
          YML
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/src/service_worker.js extension/src/popup.html extension/src/popup.css extension/src/popup.js extension/tests/search_manual_worker.test.mjs extension/tests/popup_phase2_runtime.test.mjs .github/workflows/phase2-recovery-inspect.yml
          git rm "$transport"
          git commit -m 'dev: restore popup and result-prefix integration'
          git push origin HEAD:dev/phase2-recovery-work-2026-08-20
