name: phase2-focused-search
on:
  push:
    branches:
      - dev/phase2-recovery-work-2026-08-20
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  focused-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Search focused tests
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            extension/tests/search_protocol.test.mjs \
            extension/tests/search_registry.test.mjs \
            extension/tests/search_xml.test.mjs \
            extension/tests/search_worker_stage2.test.mjs
      - name: Syntax and JSON checks for restored source
        shell: bash
        run: |
          set -euo pipefail
          node --check extension/src/service_worker.js
          node --check extension/src/shared/conversation_identity.js
          node --check extension/src/shared/manual_controls.js
          node --check extension/src/shared/block_command_discovery.js
          node --check extension/src/shared/run_context_model.js
          node --check extension/src/shared/composer_send.js
          node --check extension/src/shared/proven_writing_block_capture.js
          node --check extension/src/shared/search_protocol.js
          node --check extension/src/shared/search_xml.js
          node -e "JSON.parse(require('fs').readFileSync('extension/src/manifest.json','utf8')); JSON.parse(require('fs').readFileSync('extension/src/package.json','utf8'));"
