name: phase2-50pass-checkpoint-bootstrap
on:
  push:
    branches:
      - dev/phase2-recovery-work-2026-08-20
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize exact 50-pass checkpoint and verify
        shell: bash
        run: |
          set -euo pipefail
          transport='extension/tests/.recovery/phase2-50pass-checkpoint.tar.gz.b64'
          if [ ! -f "$transport" ]; then
            echo 'checkpoint transport not published yet'
            exit 0
          fi
          test "$(sha256sum "$transport" | awk '{print $1}')" = '164cff1fd0598e3e6cfb2e4b9fe7d1101d346c0df0214236b0e798072b62c8aa'
          base64 -d "$transport" > /tmp/phase2-50pass-checkpoint.tar.gz
          test "$(sha256sum /tmp/phase2-50pass-checkpoint.tar.gz | awk '{print $1}')" = '00f5a85699a1f342a6a7face1dd1920ee221e1725f7eff9458d1332948e91793'
          tar -xzf /tmp/phase2-50pass-checkpoint.tar.gz
          node --test \
            extension/tests/search_protocol.test.mjs \
            extension/tests/search_registry.test.mjs \
            extension/tests/search_xml.test.mjs \
            extension/tests/search_worker_stage2.test.mjs \
            extension/tests/search_manual_worker.test.mjs \
            extension/tests/content_phase2_runtime.test.mjs \
            extension/tests/popup_phase2_runtime.test.mjs \
            extension/tests/autorun_recovery.test.mjs
          for f in extension/src/*.js extension/src/shared/*.js; do node --check "$f"; done
          node -e "for (const f of ['extension/src/manifest.json','extension/src/package.json']) JSON.parse(require('fs').readFileSync(f,'utf8'));"
          if [ "$GITHUB_EVENT_NAME" != 'push' ]; then
            exit 0
          fi
          cat > .github/workflows/phase2-recovery-inspect.yml <<'YML'
          name: phase2-focused-search
          on:
            push:
              branches:
                - dev/phase2-recovery-work-2026-08-20
            pull_request:
              branches:
                - main
          permissions:
            contents: read
          jobs:
            focused-search:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Search integration focused tests
                  shell: bash
                  run: |
                    set -euo pipefail
                    node --test \
                      extension/tests/search_protocol.test.mjs \
                      extension/tests/search_registry.test.mjs \
                      extension/tests/search_xml.test.mjs \
                      extension/tests/search_worker_stage2.test.mjs \
                      extension/tests/search_manual_worker.test.mjs \
                      extension/tests/content_phase2_runtime.test.mjs \
                      extension/tests/popup_phase2_runtime.test.mjs \
                      extension/tests/autorun_recovery.test.mjs
                - name: Syntax and JSON checks
                  shell: bash
                  run: |
                    set -euo pipefail
                    for f in extension/src/*.js extension/src/shared/*.js; do node --check "$f"; done
                    node -e "for (const f of ['extension/src/manifest.json','extension/src/package.json']) JSON.parse(require('fs').readFileSync(f,'utf8'));"
          YML
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/src/service_worker.js extension/src/content_script.js extension/src/popup.html extension/src/popup.css extension/src/popup.js extension/tests/search_manual_worker.test.mjs extension/tests/popup_phase2_runtime.test.mjs extension/tests/autorun_recovery.test.mjs .github/workflows/phase2-recovery-inspect.yml
          git rm "$transport"
          if [ -f extension/tests/.recovery/popup-recovery.patch.gz.b64 ]; then git rm extension/tests/.recovery/popup-recovery.patch.gz.b64; fi
          git commit -m 'dev: preserve 50-pass Search integration checkpoint'
          git push origin HEAD:dev/phase2-recovery-work-2026-08-20
