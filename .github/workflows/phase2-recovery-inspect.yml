name: phase2-recovery-inspect
on:
  push:
    branches:
      - dev/phase2-recovery-work-2026-08-20
  pull_request:
    branches:
      - main
permissions:
  contents: read
  actions: read
jobs:
  inspect-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enumerate all surviving repository artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" > /tmp/artifact-pages.json
          python3 - /tmp/artifact-pages.json <<'PY'
          import json, sys
          raw=open(sys.argv[1],encoding='utf-8').read()
          dec=json.JSONDecoder(); i=0; arts=[]
          while i < len(raw):
              while i < len(raw) and raw[i].isspace(): i += 1
              if i >= len(raw): break
              obj,j=dec.raw_decode(raw,i); i=j
              arts.extend(obj.get('artifacts',[]))
          print('SURVIVING_ARTIFACTS', len(arts))
          for a in sorted(arts,key=lambda x:x.get('created_at','')):
              print(a['id'], a['name'], 'expired='+str(a.get('expired')), 'size='+str(a.get('size_in_bytes')), 'created='+str(a.get('created_at')), 'run='+str((a.get('workflow_run') or {}).get('id')))
          PY
