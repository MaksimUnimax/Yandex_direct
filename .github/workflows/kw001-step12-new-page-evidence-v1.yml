name: KW001 Step12 New Page Evidence V1

on:
  push:
    branches:
      - roadmap/kwork-productization-2026-08-28
    paths:
      - 'extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/step12_build_new_page_evidence_v1.py'
      - '.github/workflows/kw001-step12-new-page-evidence-v1.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: roadmap/kwork-productization-2026-08-28
          fetch-depth: 0
      - name: Build evidence matrix
        run: python extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/step12_build_new_page_evidence_v1.py
      - name: Candidate integrity QA
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK')
          q=json.loads((root/'STEP_12_NEW_PAGE_EVIDENCE_QA.json').read_text(encoding='utf-8'))
          assert q['status']=='CANDIDATE_NEW_PAGE_EVIDENCE_MATRIX_READY_FOR_MANUAL_REVIEW'
          assert q['candidate_pages']==5
          assert q['direct_wordstat_only_for_demand'] is True
          assert q['association_not_counted_as_direct_demand'] is True
          assert q['phrase_counts_not_summed_as_total_unique_demand'] is True
          assert q['step09_direct_query_only_no_transfer'] is True
          assert q['wordstat_raw_vs_step08_mismatch_rows']==0
          assert q['new_bridge_requests']==0
          assert q['defects_closed_by_script_alone']==[]
          print('STEP12_NEW_PAGE_EVIDENCE_CANDIDATE_QA_PASS')
          PY
      - name: Persist evidence immediately
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_NEW_PAGE_EVIDENCE.tsv \
                  extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_NEW_PAGE_DEMAND_PHRASE_EVIDENCE.tsv \
                  extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_NEW_PAGE_EVIDENCE_QA.json
          git commit -m "step12: persist corrected new-page evidence candidate [skip ci]"
          git push origin HEAD:roadmap/kwork-productization-2026-08-28
      - name: Remote readback
        run: |
          git fetch origin roadmap/kwork-productization-2026-08-28
          remote=origin/roadmap/kwork-productization-2026-08-28
          git show $remote:extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_NEW_PAGE_EVIDENCE_QA.json | grep -q 'CANDIDATE_NEW_PAGE_EVIDENCE_MATRIX_READY_FOR_MANUAL_REVIEW'
          git show $remote:extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/STEP_12_NEW_PAGE_EVIDENCE.tsv | grep -q 'PANORAMIC_WINDOWS_COMMERCIAL'
          echo STEP12_NEW_PAGE_EVIDENCE_READBACK_PASS
