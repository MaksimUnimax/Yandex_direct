name: OKNO document 01 Yandex GenSearch owner report rebuild v3

on:
  push:
    branches:
      - roadmap/kwork-productization-2026-08-28
    paths:
      - extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/.doc01_gensearch_owner_rebuild/TRIGGER_V3

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: roadmap/kwork-productization-2026-08-28
          fetch-depth: 0

      - name: Reconstruct exact report tools
        shell: bash
        run: |
          set -euo pipefail
          JOB='extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK'
          STAGE="$JOB/.doc01_gensearch_owner_rebuild"
          TOOLS="$JOB/tools/post_release_correction"
          mkdir -p "$TOOLS"
          cat "$STAGE"/genpart_* > "$TOOLS/rebuild_document_01_owner_report_md.py"
          cp "$STAGE/build_document_01_owner_report.py" "$TOOLS/build_document_01_owner_report.py"
          cp "$STAGE/qa_document_01_owner_report.py" "$TOOLS/qa_document_01_owner_report.py"
          python - <<'PY'
          from pathlib import Path
          tools=Path('extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK/tools/post_release_correction')
          p=tools/'build_document_01_owner_report.py'
          s=p.read_text(encoding='utf-8')
          s=s.replace('Pt(10.2)','Pt(10.0)')
          s=s.replace("r.bold=True; r.font.name='Liberation Sans'; r.font.size=Pt(8.2)","r.bold=True; r.font.name='Liberation Sans'; r.font.size=Pt(8.0)")
          s=s.replace("r.font.name='Liberation Sans'; r.font.size=Pt(8.0)","r.font.name='Liberation Sans'; r.font.size=Pt(7.8)")
          p.write_text(s,encoding='utf-8')
          q=tools/'qa_document_01_owner_report.py'
          s=q.read_text(encoding='utf-8')
          s=s.replace('pdf_text="\\n".join((p.extract_text() or "") for p in reader.pages)\nchecks={','pdf_text="\\n".join((p.extract_text() or "") for p in reader.pages)\npdf_norm=re.sub(r"\\s+", " ", pdf_text)\nchecks={')
          s=s.replace('"pdf_core_content_present":"Что показали обычный и генеративный поиск Яндекса" in pdf_text and "Сводная карта результатов исследования" in pdf_text','"pdf_core_content_present":"Что показали обычный и генеративный поиск Яндекса" in pdf_norm and "Сводная карта результатов исследования" in pdf_norm')
          q.write_text(s,encoding='utf-8')
          PY
          echo '9164dc7e4116f93d780b9181b4856572f651c86671e8f894ee5a68c607ea89d7  '"$TOOLS"'/rebuild_document_01_owner_report_md.py' | sha256sum -c -
          echo 'd2a7c562720dfa03afd25e42b7889dd2872e78beb1e158b8975f65f0e03169bc  '"$TOOLS"'/build_document_01_owner_report.py' | sha256sum -c -
          echo 'd4e544a98cec0bba6584484ac13afe3d894c7cbb1bb21df31a3d65d63bcf61c5  '"$TOOLS"'/qa_document_01_owner_report.py' | sha256sum -c -
          python -m py_compile "$TOOLS/rebuild_document_01_owner_report_md.py" "$TOOLS/build_document_01_owner_report.py" "$TOOLS/qa_document_01_owner_report.py"

      - name: Install document dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet python-docx pypdf
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libreoffice-writer fonts-liberation >/dev/null
          fi

      - name: Rebuild and verify document 01
        shell: bash
        run: |
          set -euo pipefail
          JOB='extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK'
          RELEASE="$JOB/OKNO_MSK_RESEARCH_RELEASE_CORRECTED_2026-09-05"
          TOOLS="$JOB/tools/post_release_correction"
          MD="$RELEASE/sources/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-05.md"
          DOCX="$RELEASE/editable/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-05.docx"
          PDF="$RELEASE/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-05.pdf"
          QA="$JOB/RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_01_OWNER_REPORT_QA_2026-09-06.json"
          TMP="$RUNNER_TEMP/doc01.new.md"
          python "$TOOLS/rebuild_document_01_owner_report_md.py" "$MD" "$TMP"
          mv "$TMP" "$MD"
          python "$TOOLS/build_document_01_owner_report.py" "$MD" "$DOCX"
          rm -f "$PDF"
          libreoffice --headless --convert-to pdf --outdir "$RELEASE" "$DOCX"
          test -s "$PDF"
          python "$TOOLS/qa_document_01_owner_report.py" "$MD" "$DOCX" "$PDF" "$QA"
          python - <<'PY'
          from pathlib import Path
          import json
          job=Path('extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK')
          q=json.loads((job/'RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_01_OWNER_REPORT_QA_2026-09-06.json').read_text(encoding='utf-8'))
          assert q['status']=='PASS',q
          assert q['counts']=={'generative_comparison_cases':8,'priority_recommendations':7,'company_fact_requests':2,'demand_groups':21,'ordinary_yandex_observations':75,'research_result_rows':34,'pdf_pages':12},q['counts']
          assert q['sha256']['md']=='6aa0366727c094d48fda0baee7b8ee68dde337e2cfb4cb09fc4d2bb728a9e040',q['sha256']
          assert all(q['checks'].values()),q['checks']
          print(json.dumps(q,ensure_ascii=False,indent=2))
          PY

      - name: Commit exact recipient artifacts
        shell: bash
        run: |
          set -euo pipefail
          JOB='extension/docs/kwork/KW001_AI_NATIVE_YANDEX_ALICE/tests/OKNO_MSK'
          RELEASE="$JOB/OKNO_MSK_RESEARCH_RELEASE_CORRECTED_2026-09-05"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RELEASE/sources/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-05.md" \
                  "$RELEASE/editable/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-05.docx" \
                  "$RELEASE/01_OKNO_MSK_CLIENT_RESEARCH_REPORT_RU_2026-09-05.pdf" \
                  "$JOB/RESEARCH_REBUILD_POST_RELEASE_DOCUMENT_01_OWNER_REPORT_QA_2026-09-06.json" \
                  "$JOB/tools/post_release_correction/rebuild_document_01_owner_report_md.py" \
                  "$JOB/tools/post_release_correction/build_document_01_owner_report.py" \
                  "$JOB/tools/post_release_correction/qa_document_01_owner_report.py"
          git commit -m 'docs(okno-msk): rebuild document 01 around Yandex and Alice AI value'
          git push origin HEAD:roadmap/kwork-productization-2026-08-28
