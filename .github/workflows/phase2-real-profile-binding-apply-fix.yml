name: phase2-real-profile-binding-apply-fix
on:
  push:
    branches:
      - fix/phase2-real-profile-binding-repair-2026-08-25
    paths:
      - .github/workflows/phase2-real-profile-binding-apply-fix.yml
permissions:
  contents: write
jobs:
  apply-proven-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact anchored repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
              print('PATCH_PASS', label)

          content = 'extension/src/content_script.js'
          replace_once(
              content,
              '  let identity = BB2ConversationIdentity.identityFromUrl(location.href);\n',
              '''  function canonicalConversationUrl() {\n    const node = document.querySelector('link[rel="canonical"]');\n    return String(node?.href || node?.getAttribute?.("href") || "").trim();\n  }\n\n  function resolvePageIdentity() {\n    return BB2ConversationIdentity.identityFromCandidates([location.href, canonicalConversationUrl()]);\n  }\n\n  let identity = resolvePageIdentity();\n''',
              'content_initial_identity'
          )
          replace_once(
              content,
              '''  function refreshIdentity() {\n    if (location.href !== lastLocationHref) {\n      lastLocationHref = location.href;\n      identity = BB2ConversationIdentity.identityFromUrl(location.href);\n      actionByBlock.clear();\n      autorunSeen.clear();\n    } else {\n      identity = BB2ConversationIdentity.identityFromUrl(location.href);\n    }\n    return identity;\n  }\n''',
              '''  function refreshIdentity() {\n    if (location.href !== lastLocationHref) {\n      lastLocationHref = location.href;\n      actionByBlock.clear();\n      autorunSeen.clear();\n    }\n    identity = resolvePageIdentity();\n    return identity;\n  }\n''',
              'content_refresh_identity'
          )

          popup = 'extension/src/popup.js'
          replace_once(
              popup,
              '  let context = { available: false, tab_id: null, conversation_key: "", identity: null };\n',
              '  let context = { page_available: false, available: false, tab_id: null, conversation_key: "", identity: null, error: "" };\n',
              'popup_context_shape'
          )
          replace_once(
              popup,
              '''  async function resolveContext() {\n    context = { available: false, tab_id: null, conversation_key: "", identity: null };\n    const tab = await queryActiveTab();\n    if (!tab || !Number.isInteger(Number(tab.id))) return context;\n    let host = "";\n    try { host = new URL(tab.url || "").hostname; } catch { return context; }\n    if (!CHATGPT_HOSTS.has(host)) return context;\n    try {\n      const page = await tabSend(Number(tab.id), { type: "WS_GET_IDENTITY" });\n      const key = String(page?.conversation_key || page?.identity?.conversation_key || "");\n      if (!page?.ok || !key) return context;\n      context = { available: true, tab_id: Number(tab.id), conversation_key: key, identity: page.identity || null };\n    } catch { /* content script may be restarting */ }\n    return context;\n  }\n''',
              '''  async function resolveContext() {\n    context = { page_available: false, available: false, tab_id: null, conversation_key: "", identity: null, error: "" };\n    const tab = await queryActiveTab();\n    if (!tab || !Number.isInteger(Number(tab.id))) return context;\n    let host = "";\n    try { host = new URL(tab.url || "").hostname; } catch { return context; }\n    if (!CHATGPT_HOSTS.has(host)) return context;\n    context = { ...context, page_available: true, tab_id: Number(tab.id) };\n    try {\n      const page = await tabSend(Number(tab.id), { type: "WS_GET_IDENTITY" });\n      const key = String(page?.conversation_key || page?.identity?.conversation_key || "").trim();\n      if (!page?.ok || !key) {\n        context = { ...context, error: "Не удалось подтвердить текущий ChatGPT-диалог." };\n        return context;\n      }\n      context = { page_available: true, available: true, tab_id: Number(tab.id), conversation_key: key, identity: page.identity || null, error: "" };\n    } catch (error) {\n      context = { ...context, error: `Нет связи с текущей страницей ChatGPT: ${error?.message || error}` };\n    }\n    return context;\n  }\n''',
              'popup_resolve_context'
          )
          replace_once(
              popup,
              '      $("bindConversation").disabled = !context.available;\n',
              '      $("bindConversation").disabled = !context.page_available;\n',
              'popup_bind_page_availability'
          )
          replace_once(
              popup,
              '''  $("bindConversation").addEventListener("click", () => withButton($("bindConversation"), async () => {\n    await resolveContext();\n    if (!context.available) throw new Error("Откройте конкретный диалог ChatGPT.");\n    const response = await runtimeSend({ type: "WS_BIND_CONVERSATION", tab_id: context.tab_id });\n    if (!response?.ok) throw new Error(response?.error || response?.code || "Не удалось привязать диалог.");\n    await refresh();\n    showStatus("Диалог привязан.", "ok");\n  }));\n''',
              '''  $("bindConversation").addEventListener("click", () => withButton($("bindConversation"), async () => {\n    await resolveContext();\n    if (!context.page_available || !Number.isInteger(Number(context.tab_id))) throw new Error("Откройте конкретный диалог ChatGPT.");\n    const response = await runtimeSend({ type: "WS_BIND_CONVERSATION", tab_id: context.tab_id });\n    if (!response?.ok) throw new Error(response?.error || response?.code || "Не удалось привязать диалог.");\n    await refresh();\n    showStatus("Диалог привязан.", "ok");\n  }));\n''',
              'popup_bind_live_tab'
          )
          replace_once(
              popup,
              '''  $("manualMode").addEventListener("change", async () => {\n    if (rendering) return;\n    const enabled = $("manualMode").checked;\n    const previous = !enabled;\n    let workerCommitted = false;\n    try {\n      await resolveContext();\n      if (!context.available) throw new Error("Откройте конкретный диалог ChatGPT.");\n      const committedService = lastState?.service_context?.active_service === "search" ? "search" : "wordstat";\n      if (enabled && $("activeService").value !== committedService) throw new Error("Сначала сохраните выбранный активный сервис.");\n      const committed = await runtimeSend({ type: "WS_SET_MANUAL_MODE", conversation_key: context.conversation_key, enabled, tab_id: context.tab_id });\n      if (!committed?.ok) throw new Error(committed?.error || committed?.code || "Worker не сохранил ручной режим.");\n      workerCommitted = true;\n      const applied = await tabSend(context.tab_id, { type: "WS_APPLY_MANUAL_MODE", conversation_key: context.conversation_key, enabled, active_service: committedService });\n      if (!applied?.ok || applied.applied !== true) {\n        if (enabled) {\n          const rollback = await runtimeSend({ type: "WS_SET_MANUAL_MODE", conversation_key: context.conversation_key, enabled: false, tab_id: context.tab_id });\n          if (rollback?.ok) {\n            try { await tabSend(context.tab_id, { type: "WS_APPLY_MANUAL_MODE", conversation_key: context.conversation_key, enabled: false, active_service: committedService }); } catch {}\n          }\n        }\n        throw new Error(applied?.error || applied?.code || "Страница не подтвердила ручной режим.");\n      }\n      await refresh();\n      showStatus(enabled ? "Ручной режим включён." : "Ручной режим выключен.", "ok");\n    } catch (error) {\n      if (enabled) $("manualMode").checked = false;\n      else $("manualMode").checked = workerCommitted ? false : previous;\n      showStatus(error.message || String(error), "error");\n    }\n  });\n''',
              '''  $("manualMode").addEventListener("change", async () => {\n    if (rendering) return;\n    const enabled = $("manualMode").checked;\n    const previous = !enabled;\n    let workerCommitted = false;\n    try {\n      await resolveContext();\n      if (!context.available) throw new Error("Откройте конкретный диалог ChatGPT.");\n      const committedService = lastState?.service_context?.active_service === "search" ? "search" : "wordstat";\n      if (enabled && $("activeService").value !== committedService) throw new Error("Сначала сохраните выбранный активный сервис.");\n\n      if (enabled) {\n        // Proven Phase-1 transaction: content must acknowledge ON before the\n        // worker hard gate is authorized. Never authorize a stale/unarmed page.\n        const applied = await tabSend(context.tab_id, { type: "WS_APPLY_MANUAL_MODE", conversation_key: context.conversation_key, enabled: true, active_service: committedService });\n        if (!applied?.ok || applied.applied !== true) throw new Error(applied?.error || applied?.code || "Страница не подтвердила ручной режим.");\n        try {\n          const committed = await runtimeSend({ type: "WS_SET_MANUAL_MODE", conversation_key: context.conversation_key, enabled: true, tab_id: context.tab_id });\n          if (!committed?.ok) throw new Error(committed?.error || committed?.code || "Worker не сохранил ручной режим.");\n          workerCommitted = true;\n        } catch (error) {\n          try { await tabSend(context.tab_id, { type: "WS_APPLY_MANUAL_MODE", conversation_key: context.conversation_key, enabled: false, active_service: committedService }); } catch {}\n          throw error;\n        }\n      } else {\n        // OFF remains safety-first: close the worker hard gate before cleaning\n        // the page decoration/listeners. If cleanup fails, worker stays OFF.\n        const committed = await runtimeSend({ type: "WS_SET_MANUAL_MODE", conversation_key: context.conversation_key, enabled: false, tab_id: context.tab_id });\n        if (!committed?.ok) throw new Error(committed?.error || committed?.code || "Worker не выключил ручной режим.");\n        workerCommitted = true;\n        const applied = await tabSend(context.tab_id, { type: "WS_APPLY_MANUAL_MODE", conversation_key: context.conversation_key, enabled: false, active_service: committedService });\n        if (!applied?.ok || applied.applied !== true) throw new Error(applied?.error || applied?.code || "Worker выключен, но страница не подтвердила очистку ручного режима.");\n      }\n\n      await refresh();\n      showStatus(enabled ? "Ручной режим включён." : "Ручной режим выключен.", "ok");\n    } catch (error) {\n      if (enabled) $("manualMode").checked = false;\n      else $("manualMode").checked = workerCommitted ? false : previous;\n      showStatus(error.message || String(error), "error");\n    }\n  });\n''',
              'popup_manual_transaction'
          )
          replace_once(
              popup,
              '  refresh().then(() => showStatus("Готово.")).catch((error) => showStatus(error.message || String(error), "error"));\n',
              '''  refresh().then(() => {\n    const bootstrapError = String(globalThis.__YMB_POPUP_CONTEXT_BOOTSTRAP_ERROR__ || "").trim();\n    if (bootstrapError) return showStatus(bootstrapError, "error");\n    if (context.available) return showStatus("Готово.");\n    if (context.page_available) return showStatus(context.error || "Не удалось подтвердить текущий ChatGPT-диалог.", "error");\n    return showStatus("Откройте конкретный диалог ChatGPT.", "error");\n  }).catch((error) => showStatus(error.message || String(error), "error"));\n''',
              'popup_truthful_startup_status'
          )

          tests = 'extension/tests/popup_phase2_runtime.test.mjs'
          replace_once(
              tests,
              '''test('Manual ON commits worker state before applying page mode and sends active Search service', async()=>{\n  const h=popupHarness(); await h.settle(); h.calls.length=0;\n  h.elements.manualMode.checked=true;\n  await h.elements.manualMode.dispatch('change'); await h.settle();\n  const workerIndex=h.calls.findIndex(c=>c.message?.type==='WS_SET_MANUAL_MODE');\n  const pageIndex=h.calls.findIndex(c=>c.message?.type==='WS_APPLY_MANUAL_MODE');\n  assert.ok(workerIndex>=0 && pageIndex>workerIndex,`order ${workerIndex}/${pageIndex}`);\n  assert.equal(h.calls[pageIndex].message.active_service,'search');\n});\n\ntest('failed page Manual apply rolls worker state back', async()=>{\n  const h=popupHarness(baseState(),{applyManualOk:false}); await h.settle(); h.calls.length=0;\n  h.elements.manualMode.checked=true;\n  await h.elements.manualMode.dispatch('change'); await h.settle();\n  const manualCalls=h.calls.filter(c=>c.message?.type==='WS_SET_MANUAL_MODE');\n  assert.equal(manualCalls.length,2);\n  assert.equal(manualCalls[0].message.enabled,true);\n  assert.equal(manualCalls[1].message.enabled,false);\n  assert.equal(h.elements.manualMode.checked,false);\n});\n''',
              '''test('Manual ON applies page mode before committing worker state and sends active Search service', async()=>{\n  const h=popupHarness(); await h.settle(); h.calls.length=0;\n  h.elements.manualMode.checked=true;\n  await h.elements.manualMode.dispatch('change'); await h.settle();\n  const workerIndex=h.calls.findIndex(c=>c.message?.type==='WS_SET_MANUAL_MODE');\n  const pageIndex=h.calls.findIndex(c=>c.message?.type==='WS_APPLY_MANUAL_MODE');\n  assert.ok(pageIndex>=0 && workerIndex>pageIndex,`order ${pageIndex}/${workerIndex}`);\n  assert.equal(h.calls[pageIndex].message.enabled,true);\n  assert.equal(h.calls[pageIndex].message.active_service,'search');\n  assert.equal(h.calls[workerIndex].message.enabled,true);\n});\n\ntest('failed page Manual ON acknowledgement never authorizes worker Manual mode', async()=>{\n  const h=popupHarness(baseState(),{applyManualOk:false}); await h.settle(); h.calls.length=0;\n  h.elements.manualMode.checked=true;\n  await h.elements.manualMode.dispatch('change'); await h.settle();\n  const manualCalls=h.calls.filter(c=>c.message?.type==='WS_SET_MANUAL_MODE');\n  const applyCalls=h.calls.filter(c=>c.message?.type==='WS_APPLY_MANUAL_MODE');\n  assert.equal(applyCalls.length,1);\n  assert.equal(applyCalls[0].message.enabled,true);\n  assert.equal(manualCalls.length,0);\n  assert.equal(h.elements.manualMode.checked,false);\n});\n''',
              'popup_runtime_manual_order_tests'
          )
          PY

          git diff -- extension/src/shared/conversation_identity.js extension/src/content_script.js extension/src/popup_context_bootstrap.js extension/src/popup.js extension/tests/real_profile_binding_regression.test.mjs extension/tests/popup_phase2_runtime.test.mjs

      - name: Focused repair verification before commit
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            extension/tests/real_profile_binding_regression.test.mjs \
            extension/tests/conversation_identity_project_routes_recovery.test.mjs \
            extension/tests/popup_context_bootstrap.test.mjs \
            extension/tests/popup_phase2_runtime.test.mjs \
            extension/tests/manual_mode_owner_control_recovery.test.mjs \
            extension/tests/binding_recovery.test.mjs
          node --check extension/src/shared/conversation_identity.js
          node --check extension/src/content_script.js
          node --check extension/src/popup_context_bootstrap.js
          node --check extension/src/popup.js
          echo REAL_YANDEX_REQUESTS=0

      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MaksimUnimax"
          git config user.email "36834459+MaksimUnimax@users.noreply.github.com"
          git add extension/src/content_script.js extension/src/popup.js extension/tests/popup_phase2_runtime.test.mjs
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix: restore real-profile binding and Manual transaction"
          git push origin HEAD:fix/phase2-real-profile-binding-repair-2026-08-25
