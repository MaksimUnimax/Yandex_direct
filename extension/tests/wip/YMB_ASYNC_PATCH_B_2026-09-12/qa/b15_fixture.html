<!doctype html><html><head><meta charset="utf-8"><title>YMB controlled file-delivery fixture — no live ChatGPT</title><style>
body{font:14px system-ui;margin:24px}pre{padding:20px;background:#eee;width:65%;white-space:pre-wrap}.composer{position:fixed;bottom:16px;left:20px;right:20px;background:white;padding:12px;border:1px solid #aaa}#prompt-textarea{width:70%;height:64px}button{padding:8px}#previews{max-height:90px;overflow:auto}
</style></head><body><main id="conversation-root"></main><form class="composer" onsubmit="return false"><textarea id="prompt-textarea"></textarea><input id="upload-files" type="file" multiple><div id="previews"></div><span id="controls"></span></form><script>
const Q=window.__fixture={sends:[],files:[],inputs:0,changes:0,copy:0,errors:[],previewDelay:0};
const composer=document.getElementById('prompt-textarea'),input=document.getElementById('upload-files'),previews=document.getElementById('previews'),controls=document.getElementById('controls');
Q.arm=()=>{controls.replaceChildren();const send=document.createElement('button');send.type='button';send.id='composer-submit-button';send.dataset.testid='send-button';send.setAttribute('aria-label','Send');send.textContent='Send';send.addEventListener('click',()=>{Q.sends.push({text:composer.value,files:Q.files.map(f=>({...f}))});composer.value='';composer.dispatchEvent(new Event('input',{bubbles:true}));input.value='';previews.replaceChildren();controls.replaceChildren();const mic=document.createElement('button');mic.type='button';mic.id='voice';mic.setAttribute('aria-label','Microphone');mic.textContent='Microphone';controls.append(mic);});controls.append(send);};
Q.append=(text)=>{const turn=document.createElement('div');turn.dataset.messageAuthorRole='assistant';turn.dataset.messageId='fixture-turn-'+document.querySelectorAll('pre').length;const pre=document.createElement('pre');pre.dataset.testid='code-block';const code=document.createElement('code');code.textContent=text;pre.append(code);turn.append(pre);const copy=document.createElement('button');copy.type='button';copy.setAttribute('aria-label','Copy');copy.textContent='Copy';copy.addEventListener('click',()=>Q.copy++);turn.append(copy);document.getElementById('conversation-root').append(turn);};
input.addEventListener('input',()=>Q.inputs++);
input.addEventListener('change',async()=>{Q.changes++;Q.files=[];previews.replaceChildren();for(const file of input.files){const preview=document.createElement('div');preview.setAttribute('role','group');preview.setAttribute('aria-label',file.name);preview.setAttribute('aria-busy','true');preview.textContent=file.name;previews.append(preview);try{let bytes=0,allX=true,head='';const reader=file.stream().getReader();for(;;){const r=await reader.read();if(r.done)break;bytes+=r.value.length;if(head.length<120)head+=new TextDecoder().decode(r.value.subarray(0,120-head.length));for(let i=0;i<r.value.length;i++)if(r.value[i]!==120){allX=false;break;}}reader.releaseLock();Q.files.push({name:file.name,size:file.size,type:file.type,bytes,allX,head});if(Q.previewDelay)await new Promise(r=>setTimeout(r,Q.previewDelay));preview.removeAttribute('aria-busy');}catch(e){Q.errors.push(String(e));}}});
Q.arm();
</script></body></html>
